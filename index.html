действующие на периферические a1- и a2-адренорецепторы (фентоламин) Селективные a1-блокаторы (празозин, доксазозин, теразозин). Имеются уроселективные a1aадреноблокаторы - альфузозин, тамсулозин.","Механизм действия: α-Адреноблокаторы блокируют активацию циркулирующими и нейрональновысвобождаемыми катехоламинами постсинаптических α1-адренорецепторов. Это приводит к дилатации резистивных сосудов и снижению периферического сопротивления. Значимого изменения сердечного выброса не происходит, за счёт сопутствующего расширения вен (снижение венозного возврата) и одновременной незначительной рефлекторной активации симпатической нервной системы вазодилатацией.","Основные фармакологические эффекты:","1) уменьшение Общего периферического сопротивление сосудов и понижение АД, уменьшение постнагрузки на сердце","2) расширение периферических вен, уменьшение преднагрузки на сердце","3) улучшение системной и внутрисердечной гемодинамики у больных с хронической сердечной недостаточностью","4) снижение давления в малом круге кровообращения","5) улучшение липидного профиля крови (снижение общего холестерина за счет ЛПНП и повышение уровня ЛПВП)","6) повышение чувствительности тканей к инсулину","Показания: артериальная гипертензия, хроническая сердечная недостаточность (в составе комбинированной терапии)","Противопоказания: артериальная гипотензия, хроническая сердечная недостаточность на фоне констриктивного перикардита, тампонады сердца, пороков сердца со сниженным давлением наполнения левого желудочка, беременность, лактация, детский возраст до 12 лет, повышенная чувствительность к празозину."]},"1-9":{"t":"9.β-АДРЕНОБЛОКАТОРЫ.","p":["Классификация препаратов Неселективные. Они действуют в одинаковой степени на β-адренорецепторы обоих типов (пропранолол).","Селективные. Они действуют в большей степени на β1-адренорецепторы (метопролол, атенолол и др.).","Механизм действия: заключается в предотвращении кардиотоксического эффекта катехоламинов, снижении ЧСС, сократимости миокарда и АД, что приводит к уменьшению потребности миокарда в кислороде. Улучшение перфузии ишемизированных отделов миокарда при применении β-адреноблокаторов также обусловлено за счёт удлинения диастолы и «обратного коронарного обкрадывания» вследствие увеличения сосудистого сопротивления в неишемизированных областях миокарда.","Фармакологические эффекты β1-адреноблокаторов","1) снижение автоматизма синусового узла, уменьшение ЧСС, замедление AV проводимости, снижение сократимости и возбудимости миокарда, уменьшение МОК, снижение потребность миокарда в кислороде","2) подавление стимулирующего влияния катехоламинов на сердце при физической и психоэмоциональной нагрузке.","3) гипотензивный эффект","4) нормализация сердечного ритма при наджелудочковой тахикардии и мерцании предсердий","5) ограничение зоны ишемии миокарда при инфаркте β1, β2 –адреноблокаторов","1) уменьшают ЧСС, сократимость миокарда, снижают АД","2) уменьшают потребность миокарда в кислороде (за счет снижения сократимости), стабилизируют лизосомальные мембраны и повышают устойчивость кардиомиоцитов к ишемии","3) снижают активность эктопических очагов возбуждения в сердце","4) уменьшают продукцию ренина в почках","5) вначале использования – повышение тонуса сосудов, затем – снижение до или ниже нормы.","6) угнетают агрегацию тромбоцитов, способствуют лучшей отдаче кислорода эритроцитам","7) усиливают ритмическую и сократительную активность миометрия","8) повышают тонус ГМК бронхов, нижнего сфинктера пищевода, усиливают моторику ЖКТ","9) расслабляют детрузор мочевого пузыря","10) некоторые адреноблокаторы тормозят образование активных форм тиреоидных гормонов на уровне периферических тканей.","Показания и противопоказания к применению. β1-адреноблокаторов.","Показания: артериальная гипертензия, профилактика приступов стенокардии, нарушения ритма сердца (наджелудочковая тахикардия, экстрасистолия), вторичная профилактика после перенесенного инфаркта миокарда, гиперкинетический кардиальный синдром (в т.ч. при гипертиреозе), профилактика приступов мигрени","Противопоказания: AV блокада II и III степени, синоатриальная блокада, брадикардия (ЧСС менее 50 ударов/мин), СССУ, артериальная гипотензия, хроническая сердечная недостаточность II Б-III стадии, острая сердечная недостаточность, кардиогенный шок, метаболический ацидоз, выраженные нарушения периферического кровообращения, повышенная чувствительность к препаратам β1, β2-адреноблокаторов.","Показания: артериальная гипертензия, стенокардия напряжения, нестабильная стенокардия, синусовая тахикардия (в т.ч. при гипертиреозе), наджелудочковая тахикардия, тахисистолическая форма мерцания предсердий, наджелудочковая и желудочковая экстрасистолия, эссенциальный тремор, профилактика мигрени, симптоматическая терапия при тиреотоксикозе, синдроме страха, в качестве вспомогательного средства при феохромоцитоме","Противопоказания: AV блокада II и III степени, синоатриальная блокада, брадикардия (ЧСС менее 55 ударов/мин), СССУ, артериальная гипотензия, хроническая сердечная недостаточность II Б-III стадии, острая сердечная недостаточность, бронхиальная астма и другие обструктивные заболевания дыхательных путей, вазомоторный ринит Побочные эффекты.","1) ССС: возможны брадикардия, артериальная гипотензия, нарушения AV проводимости, появление симптомов сердечной недостаточности","2) Пищеварительная система: сухость во рту, тошнота, рвота, диарея, запор; в отдельных случаях - нарушения функции печени","3) ЦНС и периферическая нервная система: слабость, утомляемость, головокружение, головная боль, мышечные судороги, ощущение холода и парестезии в конечностях, депрессия, нарушения сна, кошмарные сновидения","4) Глаз: гиполакримация, конъюнктивит","5) Система кроветворения: тромбоцитопения","6) Эндокринная система: гипогликемические состояния у больных с сахарным диабетом","7) Дыхательная система: у предрасположенных пациентов возможно появление симптомов бронхиальной обструкции","8) Аллергические реакции: кожная сыпь, зуд"]},"2-1":{"t":"1.МЕСТНЫЕ АНЕСТЕТИКИ.","p":["Механизм анестезирующего действия.","Механизм выражается в блокировке нервного проведения.. Они уменьшают проницаемость клеточной мембраны для Na+ приводит к деполяризации мембраны. Вытесняют Ca2+ из рецепторов, расположенных на внутренней поверхности мембраны. Изменяя потенциал действия в мембранах нервных клеток, местные анестетики не приводят к выраженному изменению потенциала покоя.Мелкие нервные волокна более чувствительны к действию анестетиков, чем крупные. При этом немиелиновые волокна легче блокируются, чем миелиновые.","Применение препаратов для разных видов анестезии. 1.Для поверхностной анестезии: кокаин , дикаин, лидокаин . 2.Для инфильтрационной анестезии: новокаин, тримекаин, лидокаин 4.Для проводниковой анестез: новокаин ,тримекаин ,лидокаин 5.Для спинномозговой анестезии: тримекаин Факторы, пролонгирующие анестезирующий эффект.","Для снижения системного действия, токсического эффекта и пролонгирования эффекта местных анестетиков их используют в комбинации с вазоконстрикторами (адреналин).замедляют всасывание местного анестетика. Добавляют 1 мл адреналина на 100 мл раствора анестетика. Кроме адреналина, используют 0,02% раствор норадреналина в соотношении.","Сравнительная характеристика препаратов с новокаином.","Лидокаин обладает более выраженной интенсивностью и продолжительностью действия(35ч), не оказывает токсического действия на функцию дыхания. Анестезирующий эффект в 4 раза больше, чем у новокаина, токсичность в 2 раза выше Дикаин- анестезирующий эффект в 15 раз выше, чем у новокаина, но препарат в 10 раз токсичнее Совкаин- анестезирующий эффект в 20 раз больше новокаина, токсичность больше в 30 раз.","Тримекаин- Анестезирующая эффективность и длительность действия препарата в три раза выше новокаина, но он в 1,5 раза токсичнее.","Причины идиосинкразии к новокаину.","В основе идиосинкразии лежит врождённая повышенная реактивность и чувствительность к определённым раздражителям или реакция, возникающая в организме в результате повторных слабых воздействий некоторых вещес"]},"2-10":{"t":"10.НООТРОПНЫЕ СРЕДСТВА. 2) Влияние препаратов на функции","p":["мозга (память, ассоциативные процессы, метаболизм и энергообеспечение в ЦНС и др.).","Пирацетам- повышает синтез фосфолипидов и белка, активирует аденилатциклазу, повышает уровень АТФ, усиливает утилизацию глюкозы в мозге, увеличивает микроциркуляцию.","Пирацетам проявляет антигипоксические свойства, оказывает умеренное противосудорожное действие.Улучшает мнестические функции.","Аминалон-в мозге: активируются энергетические процессы, улучшается утилизация глюкозы, повышается дыхательная активность тканей, улучшается кровоснабжение, нормализует динамикк нервных процессов. Повышает продуктивность мышления, улучшает память.","Мексидол- Вызывает усиление компенсаторной активации аэробного гликолиза, улучшает метаболизм и кровоснабжение головного мозга, микроциркуляцию и реологические свойства крови, уменьшает агрегацию тромбоцитов. Обладает гиполипидемическим действием, уменьшает содержание общего холестерина и ЛПНП. нормализует процессы обучения и памяти, снижает дистрофические и морфологические изменения в головном мозге. 3.Показания к применению.","Пирацетам: при атеросклерозе, сосудистом паркинсонизме, нарушениях памяти, внимания, при изменениях мозгового кровообращения, коматозных и субкоматозных состояниях в результате травм мозга и интоксикаций, при нарушенияхэмоционально-волевой сфер,при шизофрении","Аминалон: состояния после нарушений мозгового кровообращения, черепно-мозговых травм; атеросклероз церебральных артерий, гипертоническая болезнь, алкогольные энцефалопатия и полиневриты;","Мексидол: последствия острых нарушений мозгового кровообращения, черепно-мозговая травма, энцефалопатии, синдром вегетативной дистонии;когнитивные расстройства, ИБС, купирование абстинентного синдрома при алкоголизме. состояния после острой интоксикации антипсихотическими средствами; 4.Препараты, улучшающие мозговое кровоснабжение.","Кавинтон- расширяет сосуды мозга, усиливает кровоток, улучшает снабжение мозга кислородом, способствует утилизации глюкозы. Ингибирует фосфодиэстеразу, в тканях накапливается цАМФ. Сосудорасширяющее действие,способствует усилению метаболизма норадреналина и серотонина в тканях мозга, уменьшает патологически повышенную вязкость крови, способствует увеличению пластичности) эритроцитов.","Винкамин- Оказывает спазмолитическое , сосудорасширяющее, гипотензивное действие.","Нитроглицерин- тонус мозговых и периферических сосудов. Уменьшает цереброваскулярное сопротивление и увеличивает мозговой кровоток. Активизует обмен веществ в головном мозге."]},"2-11":{"t":"11.АДАПТОГЕНЫ (ОБЩЕТОНИЗИРУЮЩИЕ СРЕДСТВА). Препараты","p":["животного и растительного происхождения, относящиеся к этой группе. 1) растительного происхождения: родиола розовая, женьшень, элеутерококк, аралия, астрагал, золототысячник, лимонник, облепиха, имбирь и др.; 2) животного происхождения : цыгапан, пантокрин, продукты жизнедеятельности пчёл (апилак);","Растительные препараты обладают незначительным психостимулирующим действием Основными эффекты:- стимуляция иммунитета (специфического и неспецифического) и повышение резистентности организма к инфекции. улучшение переносимости организмом неблагоприятных факторов внешней среды (высокая и низкая температура внешней среды, интоксикация, излучение и т.д.).","Актопротекторы. Актопротекторы - класс стимуляторов физической работоспособности, воздействующих на многие органы и системы организма и препятствующих развитию утомления. Препятствуют развитию отрицательных последствий гипоксии, нарастающей при интенсивных физических нагрузках, при недостаточном содержании кислорода во вдыхаемом воздухе и адаптации к новым условиям внешней среды. Актовегин-способствует улучшению энергетических процессов на уровне клетки, за счет увеличения поступления и накопления глюкозы и кислорода. Танакан. -улучшение энергетического обмена, защита структурной и функциональной целостности клеточной мембраны, сосудорегулирующее и улучшающее реологические свойства крови, ускорение прохождения нервных импульсов.","Биогенные стимуляторы. Влияние на обмен веществ, иммунную систему, процессы адаптации. Биогенные стимуляторы — вещества, образующиеся в изолированных тканях животного и растительного происхождения в процессе приспособления их к неблагоприятным условиям среды и обладающие биологической активностью. Усиливают процессы обмена и регенерацию, оказывают общетонизирующее и противовоспалительное действие.","Способствуют рассасыванию воспалительных инфильтратов, уменьшают болевой синдром; повышают детоксицирующую функцию печени и обладают иммуностимулирующими свойствами ; стабилизируют клеточные мембраны, улучшают метаболические процессы при нарушении мозгового и периферического кровообращения; регулируют функции эндокринной системы Показания: хронические воспалительные, дегенеративные и атрофические процессы,кератиты, блефариты, конъюнктивиты, язвенной болезни желудка и двенадцатиперстной кишки, бронхиальной астме, трофических язвах кожи, радикулитах, артритах и др. Противопоказания: Злокачественные опухоли любой локализации (могут ускорить рост опухоли); Сердечная недостаточность в стадии декомпенсации; Аллергия на препарат и его составляющие;Острое воспаление; Цирроз печени; Почечная недостаточность;Гипертонический криз"]},"2-12":{"t":"12.АНАЛЕПТИКИ (СТИМУЛЯТОРЫ ДЫХАНИЯ). 2.Фармакологические","p":["эффекты препаратов разных групп.","Бемегрид- Непосредственно возбуждает дыхательный центр, увеличивает частоту и амплитуду дыхательных движений. Оказывает стимулирующее влияние на кровообращение: повышает ОПСС и АД.Антагонист барбитуратов (снотворных, наркозных). Уменьшает токсичность барбитуратов.","Кордиамин- облегчает процесс передачи нервных импульсов между нейронами, повышает возбудимость и чувствительность дыхательного центра к естественным раздражителям,угнетает процессы торможения в головном мозге,усиливается периферическое сопротивление сосудов- повышение АД . Способствует учащению дыхательных движений.Антагонист веществ проявляющих наркотическое действие, наркозных и снотворных лекарственных средств.","Цититон- Вызывает рефлекторное возбуждение дыхания, стимулирует сосудодвигательный центр, симпатические узлы и надпочечники, что приводит к повышению артериального давления. 3.Показания к применению.","Бемегрид- Острое отравление барбитуратами, остановка дыхания при передозировке барбитуратов, средств для наркоза (эфир, фторотан); прекращение наркоза барбитуратами и ускорение выхода из него, тяжелая гипоксия.","Кордиамин - Коллапс. Асфиксия, отравления снотворными, наркотическими препаратами, барбитуратами ,дДыхательная недостаточность.","Обморок.","Цититон- Асфиксия, в том числе у новорожденных, шок, коллапс, остановка дыхания во время операции, травмы, наркоз, интоксикации, отравления. 4.Принципы терапии отека легких (механизмы воздействия и целесообразность назначения препаратов разных групп).","Применение наркотических анальгетиков (морфин, фентанил, таламонал). Они вызывают расширение периферических артерий и вен и соответственно уменьшают венозный возврат к сердцу. Происходит перераспределение крови, что приводит к снижению давления крови в малом круге кровообращения. В итоге – положительный эффект при остром отеке легких.","Для понижения АД применяют ганглиоблокаторы (гигроний, пентамин, бензогексоний), сосудорасширяющие средства миотропного действия (натрия нитропруссид). Благодаря снижению АД нормализуется общая гемодинамика.","Уменьшить отек легких можно за счет снижения ОЦК с помощью мочегонных средств (фуросемид, кислота этакриновая), обладающих гипотензивной активностью.","Использование пеногасителей (спирт этиловый) при ингаляционном введении понижает поверхностное натяжение пузырьков пены и переводит ее в жидкость.","В комплексном подходе для устранения отека легких применяют глюкокортикостероиды, обладающие противовоспалительным и иммунодепрессивным действием."]},"2-13":{"t":"13.ПРОТИВОКАШЛЕВЫЕ СРЕДСТВА. 2)Особенности отдельных","p":["препаратов.","Кодеин — алкалоид опия, прямое угнетение нейронов кашлевого центра. Слабое анальгетическое действие - связывают с превращением в организме в морфин.","В терапевтических дозах практически не угнетает дыхательный центр. При длительном использовании - привыкание и лекарственная зависимость.","Этилморфина гидрохлорид - оказывает выраженное угнетающее влияние на кашлевой центр.","Применяют для успокоения мучительного непродуктивного кашля при заболеваниях легких, бронхитах, трахеитах.","Глауцин - избирательно угнетает активность нейронов кашлевого центра. Не угнетает дыхательный центр. Не вызывает привыкание, лекарственную зависимость.","Либекин- блокирует периферические звенья кашлевого рефлекса за счет: местного анестезирующего действия, уменьшает раздражимость периферических кашлевых рецепторов дыхательных путей; бронхорасширяющего действия-подавление рецепторов растяжения, принимающих участие в кашлевом рефлексе; незначительного снижения активности дыхательного центра (без угнетения дыхания). 3)Отхаркивающие средства прямого и рефлекторного типа действия.","а) рефлекторного действия Оказывают умеренное раздражающее действие на рецепторы слизистой оболочки желудка и рефлекторно повышают активность мерцательного эпителия дыхательных путей, стимулируют перистальтические сокращения бронхиол, способствуя продвижению мокроты из нижних в верхние отделы дыхательных путей и ее выведению. Этот эффект обычно сочетается с усилением секреции бронхиальных желез и некоторым уменьшением вязкости мокроты, что также облегчает ее отделение.Некоторые препараты частично оказывают прямое действие - эфирные масла выделяются через дыхательные пути и вызывают усиление секреции и разжижение мокроты. Применяют: настои и экстракты травы термопсиса, отвар корня истода, препараты корня солодки, алтейного корня, 6) отхаркивающие средства прямого действия К ним относят натрия йодид, калия йодид, аммония хлорид, натрия гидрокарбонат. Препараты выделяются слизистой оболочкой дыхательных путей, стимулируют секрецию бронхиальных желез и вызывают разжижение (гидратацию) мокроты; уменьшают ее вязкость, они также несколько повышают двигательную активность мерцательного эпителия дыхательных путей. 4)Муколитические препараты, механизм отхаркивающего действия этих средств.","Механизм направлен на стимуляцию серозных клеток желез слизистой оболочки бронхови активацию гидролазы. Действие может быть опосредовано разжижающим эффектом на слизистые, облегчают удале¬ние вязких секретов и экссудатов при воспалительных заболеваниях дыхатель¬ных путей.Применяют ацетилцистеин (АЦЦ, Мукосольвин, Мукобене), карбоцис-теин (Мукодин, Мукосол), бромгексин (Солвин, Бизолвон), амброксол (Амбробене, Амброгексал, Лазолван)."]},"2-14":{"t":"14.БРОНХОЛИТИЧЕСКИЕ СРЕДСТВА. 2.Возможное использование","p":["при бронхоаллергозах антигистаминных средств.","Антигистаминные препараты способны подавлять такие реакции на выброс гистамина, как отек, бронхоспазм, расширение сосудов, патологическая секреция слизи. Существуют препараты 1 и 2 поколений, необходимо тщательно подбирать препарат. При обострении бронхиальной астмы применение антигистаминных препаратов 1 -го поколения противопоказано из-за наличия седативного эффекта и их способности вызывать сухость слизистых, что препятствует отхождению мокроты, а этот процесс и так затруднен при приступе астмы.Препараты 2-го поколения - высокая специфичность к гистаминовым рецепторам, быстрое начало и выраженная длительность действия. Седативное действие менее выражено.","Антигистаминные могут использоваться в качестве вспомогательных средств в тех ситуациях, когда обострение астмы связано с воздействием конкретного аллергена или с профилактической целью, если воздействие аллергена ожидается.","Возможно использование: Зиртек- оказывает мощное антигистаминное действие, и подавляет аллергическое воспаление, Гисмантал- Единственный неседативный препарат, разрешенный для лечения детей любого возраста 3.Глюкокортикостероиды в терапии бронхиальной астмы.","Глюкокортикоиды (внутрь или в/в) назначают при приступах, не поддающихся интенсивному лечению бронходилататорами , а также в качестве поддерживающего лечения, если другие препараты не снижают частоту и тяжесть обострений.","Глюкокортикостероиды воздействуют на течение бронхиальной астмы:","- блокируют синтез бронхоконстрикторных и провоспалительных веществ;","- усиливают бронхорасширяющее действие адреномиметиков, увеличивая экспрессию 2адренорецепторов дыхательных путей;","- способствуют подавлению нейрогенного воспаления;","- повышают синтез вазокортина, способствуя уменьшению проницаемости сосудов на уровне посткапиллярных венул;","- препятствуют проникновению в очаг воспаления некоторых клеток, особенно эозинофилов, и способствуют их апоптозу;","- способствуют снижению продукции IgE","Применяют: Будесонид, флунизолид, беклометазона дипропионат"]},"2-15":{"t":"15.СРЕДСТВА, ВЛИЯЮЩИЕ НА АППЕТИТ. Препараты разного","p":["механизма действия, стимулирующие аппетит (сущность их действия).","Для стимуляции аппетита использыют препараты горечи(корневища аира, корень одуванчика, настойка полыни горькой) и средства, содержащие эфирные масла). Механизм действия горечей: усиление секреции пищеварительных желез развивается при раздражении горечами вкусовых рецепторов слизистой оболочки полости рта. Вещества, содержащиеся в горечи, возбуждают рецепторы оболочки полости рта и рефлекторно повышают возбудимость центра голода.","Анорексигенные средства (классификация по химической структуре, механизмы снижения аппетита, побочные эффекты, противопоказания к применению).","1. Стимултры адренергической системы: амфепрамон, фенилпропаноламин","2. Стимуляторы серонинергических структур: флоксетин","3. Стимуляторы адрргических и серотонинергичских систем: сибутрамин","4. Ингибиторы кишечной липазы: орлисат Они стимулируют центр насыщения в гипоталамической области, что сопровождается реципрокным угнетением центра голода .Большинство (дезопимон, мазиндол, фепранон) обладают способностью стимулировать передачу нервных импульсов в адренергических и дофаминергических синапсах, в связи с чем наряду с анорексигенным действием такие препараты оказывают общее возбуждающее влияние на ЦНС, что может проявляться раздражительностью, бессонницей. Они обладают также слабыми периферическими адреномиметическими свойствами и вследствие этого могут повышать АД.","Побоные эффекты: беспокойство, бессонницу, тахикардию, повышение АД, развитие лекарственной зависимости, головная боль, стимуляция ЦНС, нарушение сна, тремор, психомто возбуждение, запор, диарея, тошнота, анорекся, сухость во рту, кожный зуд, склонность к появлению синяков, холодный пот","Противопоказания: беременность, тяжелые формы гипертонической болезни, нарушения мозгового и коронарного кровообращения, тиреотоксикоз, глаукома, опухоли гипофиза и надпочечников, сахарный диабет, заболевания ц.н.с., сопровождающиеся повышением ее возбудимости и судорогами, в т. ч. психозы и эпилепсия. Не рекомендуется принимать во второй половине дня."]},"2-16":{"t":"16.СРЕДСТВА, ВЛИЯЮЩИЕ НА СЕКРЕТОРНЫЕ ЖЕЛЕЗЫ ЖЕЛУДКА. 1)","p":["Характер препаратов, назначаемых при снижении желудочной секреции.","Гастрин- связывается со специфическими гастриновыми рецепторами в желудке, усиление аденилатциклазной активности в париетальных клетках желудка - увеличение секреции желудочного сока, в особенности соляной кислоты. Увеличивает секрецию пепсина главными клетками желудка, увеличивает секрецию слизи в желудке, обеспечивая защиту слизистой оболочки.","Гистамин- стимулирует секрецию желез желудка за счет взаимодействия с Н2-рецепторами.","Для исключения побочных эффектов, связанных с возбуждением Н1-рецепторов, применяют вместе с Н1-блокаторами (димедрол, дипразин). 2)Препараты разных групп, снижающие желудочную секрецию.","Блокаторы гистамыновых Н2-рецепторов Циметидин, ранитидин, фамотидин, Блокаторы Н+К+-АТФазы Омепразол (Омез, Лосек), лансопразол М-холиноблокаторы а) неселективные М-холиноблокаторы Атропин, метацин, платифиллин б) селективные М-холиноблокаторы Пирензепин (Гастроцепин) 3)Характеристика антацидных средств (быстрота наступления эффекта, длительность действия, эффективность).","Антациды нейтрализуют соляную кислоту, оказывают кратковременный эффект (30—60 мин), применяются для купирования боли и изжоги в период обострения язвенной болезни. Скорость наступления антацидного эффекта определяется скоростью растворения препаратов.","Антацидный препарат, принятый через час после еды, дольше задерживается в желудке и оказывает наиболее продолжительный эффект.","Скорость наступления Продолжительность Препарат эффекта действия Натрия гидрокарбонат Высокая Кратковременная Кальция карбонат Высокая Средняя Магния гидроксид Высокая Средняя Магния трисиликат Низкая Длительная Алюминия гидроксид Низкая Длительная 4)Показания к применению средств, влияющих на секрецию желудка.","Антисекреторные: - Язвенная болезнь желудка и двенадцатиперстной кишки (в том числе обусловленная приемом НПВС), гиперацидность желудочного сока (рефлюкс-эзофагит, гастрит, дуоденит), панкреатит, опухоль секретирующих клеток желудка (синдром Золлингера-Эллисона)- язвенная болезнь желудка и двенадцатиперстной кишки; рефлюксэзофагит; эрозивно-язвенные поражения желудка и двенадцатиперстной кишки, связанные с приемом НПВС; стрессовые язвы; синдром Золлингера-Эллисона."]},"2-17":{"t":"17.СРЕДСТВА, РЕГУЛИРУЮЩИЕ ДЕЯТЕЛЬНОСТЬ ПОДЖЕЛУДОЧНОЙ ЖЕЛЕЗЫ.","p":["Средства, регулирующие функцию поджелудочной железы 1.Диагностические средства - секретин, холецистокинин.","2. Средства, усиливающие секрецию - кислота хлористоводородная разведенная.","3. Средства заместительной терапии - панкреатин, панзинорм, фестал.","4. Средства, угнетающие секрецию - М-холиноблокаторы, антацидные средства.","5. Ингибиторы протеолитических ферментов - апротинин.","При снижении секреторной функции назначают панкреатин(порошок из высушенные поджелудочных желез убойного скота), является ферментным препаратом, содержащим трипсин и амилазу, применяют при хроническом панкреатите, энтероколите. Иногда применяют м-холиноблокаторы(при остром панкреатите).","Ингибиторы протеолиза(пантрипин, ингитрал, контрикал,) ингибируют активность трипсина, химотрипсина, каллекриина и снижают фибринолитическую активность крови. Спазмолитики (папаверин, но-шпа) понижают тонус и сократительную активность гладких мышц внутренних органов и сосудов."]},"2-18":{"t":"18.РВОТНЫЕ И ПРОТИВОРВОТНЫЕ СРЕДСТВА.","p":["К веществам, возбуждающим рвотный центр рефлекторно, относятся препараты термопсиса и ипекакуаны, однако для вызывания рвоты их не применяют.При энтеральном введении они стимулируют рецепторы желудка и в больших дозах рефлекторно вызывают рвоту. При всасывании действующих веществ этих препаратов (термопсина, эметина) они оказывают и непосредственное возбуждающее влияние на хеморецепторы пусковой зоны. Только периферическим действием обладают меди сульфат и цинка сульфат, раздражающие слизистую оболочку желудка. Рвота при их энтеральном введении имеет рефлекторный характер и не устраняется при разрушении пусковой зоны. Рвотные средства имеют очень ограниченное применение. Иногда при острых отравлениях, если промывание желудка по каким-либо причинам трудно осуществимо, назначают апоморфин (вводят его под кожу).","Кроме того, апоморфин находит применение при лечении алкоголизма для выработки отрицательного условного рефлекса на этиловый спирт.","В зависимости от происхождения рвоты следует назначать те или иные противорвотные средства. Так, при морской и воздушной болезни рвота связана с чрезмерным возбуждением вестибулярного аппарата, откуда импульсы при участии мозжечка. Лицам с повышенной возбудимостью вестибулярного аппарата рекомендуется профилактический прием лекарственных средств, содержащих скополамин. Одним из наиболее распространенных средств против \"укачивания\" являются таблетки \"Аэрон \". Активным противорвотным средством, угнетающим пусковую зону, является производное бензамида метоклопрамид. Его центральные эффекты, включая противорвотный, связаны с тем, что он блокирует дофаминовые D2-рецепторы, а в больших дозах и серотониновые 5-НТз-рецепторы.","Метоклопрамид значительно активнее аминазина и действует более избирательно."]},"2-19":{"t":"19.ЖЕЛЧЕГОННЫЕ СРЕДСТВА.","p":["Хронические воспалительные заболевания печени и желчевыводящих путей, в т.ч. хронический холецистит и холангит, применяют их при дискинезии желчевыводящих путей, при лечении запоров, хроническом гепатите.","Все желчегонные препараты вне зависимости от формы выпуска необходимо принимать за 20","– 30 минут до еды. Причем общую суточную дозировку разбивают поровну на 3 – 5 приемов, в зависимости от того, сколько раз в день человек кушает. Рекомендуется принимать желчегонные препараты перед каждой едой. Препараты необходимо запивать достаточным количеством воды и обязательно через полчаса после приема съедать что-либо. Если человек не съест что-либо после приема желчегонного препарата, то у него возникнет тошнота, понос и ухудшится общее самочувствие.","Холеспазмолитики (средства, улучшающие отток желчи за счет расслабления мышц желчного пузыря и желчевыводящих путей): Холинолитики(М-холиноблокаторы-атропин, платифилин) Спазмолитики миотропного действия-папаверин, но-шпа, дротаверин, бендазол.","Вещества этой группы повышают устойчивость печени к воздействию повреждающих факторов, способствуют восстановлению ее функций, повышают ее детоксикационные возможности. Гепатопротекторный эффект может быть обусловлен нормализацией метаболических процессов в гепатоцитах, повышением активности микросомальных ферментов, восстановлением функций клеточных мембран. Гепатопротекторы применяют при остром и хроническом гепатите, дистрофии и циррозе печени, токсических поражениях печени, в том числе связанных с алкоголизмом, внутрипеченочных холестазах. Легалол, Силбинина дигидросукцината натриевая соль, адеметионин, кислота липоевая, эссенциале."]},"2-2":{"t":"2.ПРЕПАРАТЫ, ОТНОСЯЩИЕСЯ К ГРУППЕ ОБВОЛАКИВАЮЩИХ СРЕДСТВ.","p":["Магнезия белая (магния карбонат основной);","Алюминия гидроокись; Викаир; Ликвиритон; Сукралфат; Фосфалюгель; Алмагель. 1.Механизм действия, показания к применению.","Механизм действия: Выстилают слизистые оболочки густой коллоидной пленкой, предохраняя чувствительные рецепторы от раздражения.","Показания: острые воспалительные заболевания желудочно-кишечного тракта (гастриты, энтериты, энтероколиты, колиты); острые отравления алкалоидами, тяжелыми металлами (для связывания и осаждения этих ядов используется танин); язвенная болезнь, хронические гастриты и дуодениты; химические ожоги слизистой 2.Адсорбирующие средства, сущность их действия, показания к применению.","Нерастворимые индифферентные порошки с большой адсорбционной способностью, связывающие на своей поверхности различные вещества, уменьшая всасываниеих, механически защищая слизистую оболочку и находящиеся в ней окончания чувствительных нервов. В качестве адсорбирующих средств наиболее часто используют, уголь активированный, глину белую. При метеоризме (для поглощения газов), заболеваниях желудочно-кишечного тракта и при острых отравлениях внутрь назначают уголь активированный. При заболеваниях кожи и слизистых оболочек наружно применяют тальк, глину белую, магния окись, цинка окись и т.д. 3.Современные энтеросорбенты.","Активированный уголь- обладает большой поверхностной активностью и высокой сорбционной способностью. Уменьшает всасывание из ЖКТ токсических веществ, солей тяжелых металлов, алкалоидов и гликозидов, лекарственных веществ, способствуя их выведению из организма. Адсорбирует на своей поверхности газы. Показания: Диспепсия, интоксикация при дизентерии, сальмонеллезе, пищевой токсикоинфекции, метеоризм, отравления лекарственными препаратами.","Энтеросгель- детоксикационное действие при приеме внутрь, обладает сорбционными и детоксикационными свойствами. В просвете ЖКТ препарат связывает и выводит из организма эндогенные и экзогенные токсические вещества различной природы. Показания: острые и хронические интоксикации, отравления ядами и сильнодействющими веществами, кишечные инфекции, пищевая и лекарственная аллергия.","Смекта- стабилизирует слизистый барьер, увеличивает количество слизи, улучшает ее гастропротекторные свойства. Показания: острая и хроническая диарея, нфекционная диарея, симптоматическое лечение изжоги, вздутия, диспепсии."]},"2-20":{"t":"20.СЛАБИТЕЛЬНЫЕ СРЕДСТВА.","p":["Солевые слабительные магния сульфат и натрия сульфат в желудочно-кишечном тракте диссоциируют с образованием ионов, которые плохо всасываются (Mg2+, SO42-). Происходит повышение осмотического давления в просвете кишечника, что препятствует абсорбции жидкой части химуса и пищеварительных соков. Объем содержимого кишечника увеличивается, что приводит к возбуждению механорецепторов. При этом перистальтика кишечника усиливается. Действуют солевые слабительные на протяжении всего кишечника.","Применяют солевые слабительные при остро наступающем запоре, а также при отравлениях химическими веществами.","Объем кишечника увеличивают также полимерные препараты полиэтиленгликоля (форлакс).","Эти соединения, с высокой молекулярной массой, не абсорбируются. Они способны набухать и удерживать значительные количества воды. Содержимое кишечника при этом увеличивается что приводит к усилению перистальтики и послабляющему действию.","На протяжении всего кишечника действует и масло касторовое. В двенадцатиперстной кишке под влиянием липазы из масла касторового образуется рициноловая кислота. Последняя раздражает рецепторы кишечника и, по-видимому, нарушает транспорт ионов, задерживает всасывание воды. Это ведет к повышению моторики кишечника и ускоряет его опорожнение.","Применяют масло касторовое при остро возникающем запоре.","Стимулируя рецепторные образования толстой кишки, а также задерживая всасывание электролитов и воды, производные антрацена усиливают его перистальтику. Фенолфталеин всасывается в тонкой кишке и затем выделяется в толстой, где оказывает раздражающее действие на рецепторные образования и, по-видимому, задерживает абсорбцию электролитов и воды. Эти препараты действуют в толстом кишечнике и применяются при хроническом запоре.","При спастических состояниях кишечника для понижения его тонуса и двигательной активности применяют холиноблокирующие вещества - м-холиноблокаторы (группа атропина) и ганглиоблокаторы (пирилен, бензогексоний), а также спазмолитики миотропного действия (папаверина гидрохлорид, но-шпа). Угнетение моторики кишечника наблюдается также при введении адреномиметиков. Принцип действия лоперамида заключается в том, что, воздействуя на опиоидные μ-рецепторы кишечника, он угнетает его перистальтику.","Аналогичным угнетающим эффектом на моторику кишечника обладают препараты опия. Как известно, моторика кишечника усиливается при повышении тонуса холинергических нервов.","В связи с этим при гипотонии и атонии кишечника рекомендуют препараты с холиномиметической активностью (ацеклидин, бетанехол, прозерин). Кроме того, эффективны агонисты серотониновых 5-НТ4-рецепторов (цизаприд), агонисты мотилиновых рецепторов (эритромицин, олеандомицин), а также миотропные препараты (вазопрессин).","М-холиноблокаторы блокируют периферические м-холинорецепторы мембран эффекторных клеток, устраняют стимулирующее влияние холинергических нервов на гладкомышечные органы."]},"2-21":{"t":"21.МАТОЧНЫЕ СРЕДСТВА.","p":["-Гормоны и препараты задней доли гипофиза (Окситоцин, Питуитрин)","-Препараты простагландинов (Динопрост и Динопростон) Под влиянием окситоцина амплитуда и частота сокращений миометрия увеличиваются.","Одновременно возрастает и тонус миометрия, особенно при назначении окситоцина в больших дозах. Динопрост обладает выраженным стимулирующим влиянием на миометрий. Он вызывает ритмические сокращения и повышение тонуса беременной и небеременной матки наряду с расширением шейки матки. Динопростон также вызывает выраженное повышение ритмических сокращений миометрия беременной матки и нарастание ее тонуса.","Ослабляющие сократительную активность (токолитические средства)","-Вещества, стимулирующие преимущественно β2 –адренорецепторы(Фенотерол, Сальбутамол","-Средства для наркоза (Натрия оксибутират)","- Разные средства( Магния сульфат) Их назначают главным образом для задержки преждевременно наступающих родов. Для ослабления чрезмерно сильных родовых схваток иногда применяют отдельные средства для наркоза, например натрия оксибутират.","Для обезболивания и при спазме-атропина сульфат, динопрост, динопростон, Промедол, Фентанил, Трамадол, Буторфанол, Налбуфин, Кетамин.","Средства, повышающие преимущественно тонус миометрия:","-Препараты растительного происхождения (алкалоиды и препараты спорыньи) Эргометрина малеат , Экстракт спорыньи густой, Эрготамина гидротартрат, Эрготал","-Синтетические средства ( Котарнина хлорид) Средства, повышающие преимущественно тонус миометрия, используют главным образом для остановки маточных кровотечений. Принцип их действия заключается в стойком повышении тонуса миометрия и вследствие этого механическом сжатии мелких сосудов.","Побочные эффекты: тошноту, рвоту, диарею, головную боль.","Противопоказаниями к применению спорыньи являются стенокардия и сужение периферических сосудов, глаукома, нарушения функции печени и почек, септические состояния, поздние стадии атеросклероза и гипертонической болезни, язвенная болезнь желудочно-кишечного тракта."]},"2-22":{"t":"22.АНТИКОАГУЛЯНТЫ.","p":["1. Антикоагулянты прямого действия (вещества, влияющие на факторы свертывания непосредственно в крови) Гепарин, Фраксипарин, Эноксапарин , Лепирудин","2. Антикоагулянты непрямого действия (вещества, угнетающие синтез факторов свертывания крови - протромбина и др. - в печени) Неодикумарин, Синкумар, Варфарин, Фенилин Гепарин расценивается как кофактор антитромбина III. В плазме крови он активирует последний (и, очевидно, антитромбин II), ускоряя его противосвертывающее действие. При этом нейтрализуется ряд факторов, активирующих свертывание крови. Нарушается переход протромбина в тромбин. Кроме того, ингибируется тромбин (IIа). Поскольку гепарин относится к антикоагулянтам прямого действия, он активен не только в условиях целостного организма, но и in vitro. В больших дозах гепарин тормозит агрегацию тромбоцитов. Помимо основного противосвертывающего действия, у гепарина отмечена способность понижать содержание в крови липидов. Дозируют гепарин в единицах действия - ЕД (1 мг = 130 ЕД). Об эффективности препарата судят по свертываемости крови.","В отличие от гепарина его низкомолекулярные аналоги не оказывают ингибирующего влияния на тромбин. В связи с тем, что эти препараты мало связываются с белками плазмы, их биодоступность выше, чем у гепарина. Выводятся они из организма медленно. Действуют более продолжительно, чем гепарин. Действие гирудина короче, чем гепарина."]},"2-23":{"t":"23.АНТИКОАГУЛЯНТЫ НЕПРЯМОГО ДЕЙСТВИЯ, МЕХАНИЗМ, ПОКАЗАНИЯ К ПРИМЕНЕНИЮ, КОНТРОЛЬ ЗА ИХ ДЕЙСТВИЕМ. АНТАГОНИСТЫ ПРЯМЫХ И НЕПРЯМЫХ АНТИКОАГУЛЯНТОВ.","p":["Антикоагулянты непрямого действия (вещества, угнетающие синтез факторов свертывания крови - протромбина и др. - в печени) Неодикумарин, Синкумар, Варфарин, Фенилин.","Принцип их действия заключается в том, что они ингибируют редуктазу эпоксида витамина К и препятствуют восстановлению К1-эпоксида в активную форму витамина К, что блокирует синтез факторов II, VII, IX, X . Таким образом, они угнетают в печени зависимый от витамина К синтез протромбина, а также проконвертина и ряда других факторов (содержание этих факторов в крови понижается).","Применяют антикоагулянты для профилактики и лечения тромбозов и эмболий (при тромбофлебите, тромбоэмболии, инфаркте миокарда, стенокардии, ревматических пороках сердца). Если нужно быстро понизить свертываемость крови, вводят гепарины.","Эффективность непрямых антикоагулянтов контролируется по протромбиновому времени(время свертывания крови, в норме 10-13 сек). Кроме того, проводятся анализы мочи; появление гематурии является одним из признаков передозировки препаратов.","Антагонистом антикоагулянтов непрямого действия является витамин К1. Антагонистом гепарина и низкомолекулярных является протамина сульфат."]},"2-24":{"t":"24.АНТИАГРЕГАНТЫ И СРЕДСТВА, ВЛИЯЮЩИЕ НА ФИБРИНОЛИЗ.","p":["Наиболее распространенным в практике антиагрегантом является кислота ацетилсалициловая (аспирин). Она является ингибитором циклооксигеназы, вследствие чего нарушается синтез циклических эндопероксидов и их метаболитов тромбоксана и простациклина. В последние годы большое внимание привлекли вещества, действующие на гликопротеиновые рецепторы (GP IIb/IIIa) тромбоцитов . Эти рецепторы играют важнейшую роль в агрегации тромбоцитов.","Препараты, которые влияют на их активность, подразделяются на 2 группы. Первая - это конкурентные или неконкурентные блокаторы гликопротеиновых рецепторов (абциксимаб, тирофибан и др.). Вторая группа представлена препаратами, которые препятствуют активирующему действию АДФ на тромбоциты и экспрессии их гликопротеиновых рецепторов (тиклопидин, клопидогрел). В обоих случаях не происходит или уменьшается связывание с гликопротеиновыми рецепторами фибриногена и ряда других факторов, что и лежит в основе антиагрегантного действия указанных веществ. Дипиридамол (курантил) обладает некоторой антиагрегантной активностью, угнетает фосфодиэстеразу и значительно повышает содержание в тромбоцитах цАМФ, он потенцирует действие аденозина, который тормозит агрегацию тромбоцитов и обладает сосудорасширяющим эффектом.","Показаниями к применению АСК являются ИБС, наличие нескольких факторов риска ИБС, безболевая ишемия миокарда, нестабильная стенокардия, инфаркт миокарда, клапанные митральные пороки сердца и мерцательная аритмия, пролапс митрального клапана (профилактика тромбоэмболии), рецидивирующие тромбоэмболии легочной артерии, инфаркт легкого, острый тромбофлебит. Препараты вляющие на гликопротеиновые рецепторы тромбоцитов применяют при хирургических вмешательствах на коронарных сосудах при стенокардии, инфаркте миокарда. 1.К первой группе относят вещества, непосредственно влияющие на плазму крови, сгусток нитей фибрина. Представителем препаратов первой группы является фибринолизин, урокиназа 2.Во второй группе находятся активаторы фибринолиза. при введении в организм активируют эндогенную фибринолитическую систему крови-стрептокиназа Стрептокиназа взаимодействует с профибринолизином; образующийся комплекс приобретает протеолитическую активность и стимулирует переход профибринолизина (плазминогена) в фибринолизин (плазмин) как в тромбе, так и в плазме кров. Фибринолизин растворяет фибрин.","Эффективна при свежих тромбозах. В результате превращения циркулирующего в крови профибринолизина в фибринолизин урокиназа, может вызвать системный фибринолиз.","Последний обусловлен тем, что фибринолизин является неизбирательно действующей протеазой, способной метаболизировать многие белковые соединения, находящиеся в плазме крови. Это приводит к снижению в плазме уровня фибриногена, а2-антифибринолизина, ряда факторов свертывания крови (V, VIII).","Применяются обычно для растворения тромбов в коронарных сосудах при инфаркте миокарда, эмболии легочной артерии, тромбозе глубоких вен, остро возникающих тромбах в артериях разной локализации."]},"2-25":{"t":"25.СРЕДСТВА, ПОВЫШАЮЩИЕ ПРОЦЕСС СВЕРТЫВАНИЯ КРОВИ","p":["Классификация средств, повышающих свертывание крови (гемостатиков). 1.Коагулянты.","-Прямые: фибриноген, тромбин.","-Непрямые: кальция хлорид, викасол.","2. Антагонисты гепарина: протамина сульфат. 3.Ингибиторы фибринолиза: кислота аминокапроновая, контрикал. 4.Стимуляторы агрегации тромбоцитов: этамзилат (дицинон). 5.Растительные средства: лист крапивы, трава тысячелистника, трава водяного перца, кора калины.","Механизм действия протамица сульфата — конкурентный специфический антагонизм с гепарином. Кислота аминокапроновая блокирует активаторы плазминогена (частично угнетает и действие плаз- мина), ингибирует биогенные полипептиды, образующиеся в организме из альфа-глобулинов под влиянием калликреина (кенина) и угнетает таким образом фибринолитические свойства крови. Гемостатический эффект фибриногена состоит в том, что он под влиянием тромбина переходит в фибрин, который и обеспечивает конечную стадию процесса свертывания крови — образование сгустка. Механизм действия викасола связан с тем, что он является синтетическим, аналогом витамина К и способствует синтезу протромбина в печени. Гемостатический эффект кальция хлорида зависит от его участия в трех фазах прокоагуляции. Гемостатическое действие у препаратов для местного применения проявляется за счет входящих в их состав (препараты получены из тканей животных) естественных физиологических компонентов (тромбин, протромбин, коллаген, тромбопластин и др.), вызывающих свертывание крови и образование сгустка в месте использования. Препараты растительного происхождения повышают свертываемость крови, имея в своем составе гликозиды, сапонины, дубильные вещества, соли органических кислот, эфирные масла и др., а также оказывают умеренное снижение проницаемости сосудистой стенки.","Местного действия: тромбин, губка гемостатическая, пленка фибринная.","Резорбтивного действия: витамины К1, К3 и викасол, фибриноген Применяют при гипопротромбинемии, местные при различных травмах, альвеолярных, капиллярных кровотечениях. Викасол применяется при стоматите, гингивите, геморрагиях различной этиологии, а также для профилактики кровотечения перед травматичными оперативными вмешательствами."]},"2-26":{"t":"26.СРЕДСТВА ТЕРАПИИ АНЕМИЙ.","p":["Применяют препараты железа при железодефицитной гипохромной анемии (например, при хронических кровотечениях, нарушениях всасывания железа, при беременности). Внутрь назначают железа закисного сульфат (FeSO47H2O). Применяют также комбинированные препараты железа, например драже «Ферроплекс» (содержит железа закисного сульфат и кислоту аскорбиновую), ферамид (комплексное соединение железа с никотинамидом). Создан также препарат пролонгированного действия ферро-градумет (таблетки, покрытые оболочкой и содержащие железа закисного сульфат в полимерной губкообразной массе - градумете; последняя обеспечивает постепенное всасывание железа). Если всасывание железа из пищеварительного тракта нарушено, используют препараты для парентерального введения, например ферковен (содержит железа сахарат, кобальта глюконат и раствор углеводов), феррум Лек (комплекс железа с мальтозой для внутримышечного введения и железа сахарат для внутривенного введения). Из желудочно-кишечного тракта всасывается только ионизированное железо, причем лучше всего в виде двухвалентного иона . В связи с этим наличие хлористоводородной кислоты (переводит молекулярное железо в ионизированную форму) и аскорбиновой кислоты (восстанавливает трехвалентное железо в двухвалентное) способствует всасыванию железа из пищеварительного тракта. Всасывание происходит главным образом в тонкой кишке (особенно в двенадцатиперстной кишке) за счет активного транспорта и, возможно, путем диффузии. Содержащийся в слизистой оболочке кишечника белок апоферритин связывает часть всасывающегося железа, образуя с ним комплекс ферритин. После прохождения кишечного барьера железо в сыворотке крови вступает в связь с β1-глобулином - трансферрином. В виде комплекса с трансферрином железо поступает к различным тканям, где вновь высвобождается. В костном мозге оно включается в построение гемоглобина. При мегалобластической анемии применяют цианокобаламин и кислоту фолиевую , участвующие в синтезе нуклеиновых кислот. Возникновение пернициозной анемии связано с нарушением всасывания цианокобаламина, поскольку у таких больных отсутствует внутренний фактор Касла (по химической структуре -гликопротеин). В обычных условиях он вырабатывается слизистой оболочкой желудка и обеспечивает всасывание цианокобаламина в тонкой кишке. Кислоту фолиевую назначают при макроцитарной анемии. В организме кислота фолиевая превращается в фолиниевую, которая и обладает физиологической активностью. Кислоту фолиевую используют при алиментарной и медикаментозной макроцитарной анемии. Для лечения злокачественной анемии кислоту фолиевую отдельно не назначают, так как она не только не устраняет патологические изменения со стороны нервной системы, но даже усиливает их. Нормализуется лишь картина крови. В связи с этим при злокачественной анемии кислота фолиевая комбинируется с цианокобаламином."]},"2-27":{"t":"27. ГОРМОНАЛЬНЫЕ ПРЕПАРАТЫ. КЛАССИФИКАЦИЯ ПО ХИМИЧЕСКОЙ СТРУКТУРЕ (ПРИМЕРЫ).","p":["* Заместительная терапия — введение извне препарата гормона при недостаточной его продукции в организме (инсулинотерапия при сахарном диабете). * Стимуляция функции периферических желез — применение препаратов тропных гормонов передней доли гипофиза (кортикотропин при атрофии коры надпочечников); применение блокаторов специфических рецепторов гипоталамо-гипофизарной системы, что приводит к активации выделения рилизинг-гормонов гипоталамусом и тропных гормонов передней долей гипофиза (кломифен при ановуляторном бесплодии). * Подавление функции периферических желез — угнетение синтеза гормона в самой железе (тиамазол при гипертиреозе); стимуляция специфических рецепторов гипоталамогипофизарной системы, что приводит к угнетению выделения рилизинг-гормонов гипоталамусом и тропных гормонов передней долей гипофиза (комбинированные противозачаточные средства для приема внутрь, даназол).","Кортикотропин, козинтропин, соматотропин, лактин, тиротропин, менотропины, пролан.","АКТГ взаимодействует в коре надпочечников со специфическими рецепторами на внешней поверхности клеточной мембраны, стимулирует связанную с ними аденилатциклазу и повышает содержание в клетках цАМФ. В итоге это способствует превращению холестерина в кортикостероиды. АКТГ стимулирует продукцию главным образом глюкокортикоидов.","Гормон роста стимулирует рост скелета и всего организма в целом. Основное показание к применению - карликовый рост.","Гормоны задней доли гипофиза окситоцин и вазопрессин (антидиуретический гормон) являются пептидами. Получены синтетическим путем. Основной эффект окситоцина - его стимулирующее влияние на миометрий; особенно чувствителен миометрий к окситоцину в последний период беременности и в течение нескольких дней после родов. Инактивируется в организме окситоциназой (аминопептидазой). Применяют лекарственный препарат окситоцин для стимуляции родов и остановки послеродовых кровотечений, а также для стимуляции лактации. Синтетическим производным окситоцина является дезаминоокситоцин (сандопарт, демокситоцин). В отличие от окситоцина он устойчив к действию ферментов и оказывает более длительный эффект.","Вазопрессин (антидиуретический гормон) взаимодействует со специфическими Vрецепторами. Они подразделяются на 2 основных подтипа: V1 и V2. ν2-рецепторы сопряжены с аденилатциклазой, V1-рецепторы - с фосфати- дилинозитольным циклом. Вазопрессин обладает двумя основными свойствами: 1) регулирует реабсорбцию воды в дистальной части нефрона; 2) оказывает стимулирующее влияние на гладкую мускулатуру. Основное показание к применению - несахарный диабет. Лекарственный препарат вазопрессин действует кратковременно (30 мин-2 ч)."]},"2-28":{"t":"28. ГОРМОНАЛЬНЫЕ ПРЕПАРАТЫ. СРЕДСТВА ТЕРАПИИ ГИПОТИРЕОЗА.","p":["В медицинской практике применяют следующие препараты гормонов щитовидной железы: тироксин, тиреоидин.","Щитовидная железа продуцирует гормоны L-тироксин (Lтетрайодтиронин) и L-трийодтиронин. В их синтезе принимает участие йод, поступающий с пищей. Йодиды, циркулирующие в крови, поглощаются щитовидной железой, где окисляются до йода, который взаимодействует с аминокислотой тирозином. При этом образуются монотирозин и дийодтирозин, являющиеся предшественниками тиреоидных гормонов.","Синтезируемые из них тироксин и трийодтиронин депонируются в фолликулах щитовидной железы в составе белка тиреоглобулина. Из железы в кровь гормоны поступают при участии протеолитических ферментов, которые отщепляют их от тиреоглобулина.","Йод используют в виде молекулярного йода или йодидов. Угнетает продукцию тиролиберина, а затем тиреотропного гормона гипофиза. Соответственно снижается продукция тиреоидных гормонов. Вызывает уменьшение объема щитовидной железы.","Мерказолил нарушает синтез тироксина и трийодтиронина непосредственно в щитовидной железе.","Лечение проводят под контролем состава крови. Лейкопения и агранулоцитоз являются показанием к отмене препарата.","При некоторых формах гипертиреоза применяют радиоактивный йод - 131I (период полураспада 8 дней) или 132I (период полураспада 2-3 ч). Деструкция клеток щитовидной железы происходит главным образом под влиянием β-лучей (90% излучения), в меньшей степени - γ-лучей. Эффект развивается очень постепенно (через 1-3 мес и позже). У ряда больных в связи с передозировкой возникают явления микседемы. Назначают препарат внутрь в виде натриевой соли, дозируют в милликюри (мКи)."]},"2-29":{"t":"29.ГОРМОНАЛЬНЫЕ ПРЕПАРАТЫ. ЗНАЧЕНИЕ РАБОТ Л.З.СОБОЛЕВА, БАНТИГА И БЕСТА В ПОЛУЧЕНИИ ИНСУЛИНА.","p":["В 1900-1901 гг. Соболев сформулировал принципы получения инсулина. В 1921 году канадские исследователи Бантинг и Бест выделели инсулин.","Инсулин активирует транспорт глюкозы через клеточные мембраны1 и ее утилизацию мышцами, жировой тканью. Возрастает гликогеногенез (инсулин активирует фермент гликогенсинтазу). В печени и скелетных мышцах он снижает гликогенолиз. Угнетает превращение аминокислот в глюкозу. Стимулирует синтез белков. Способствует депонированию триглицеридов в жировой ткани. Применение инсулина при сахарном диабете приводит к снижению уровня сахара в крови и накоплению в тканях гликогена. Следствием нормализации углеводного обмена является нормализация белкового обмена (уменьшается концентрация в моче азотистых соединений) и жирового обмена (в крови и моче перестают определяться кетоновые тела - ацетон, ацетоуксусная кислота, β-оксимасляная кислота).","Прекращаются исхудание и чрезмерно выраженное ощущение голода (булимия3), связанные с распадом жиров и интенсивным превращением белков в глюкозу. Инсулин эффективен при сахарном диабете любой степени тяжести.","В настоящее время основным препаратом является рекомбинантный инсулин человека. Однако достаточно широко применяются и препараты, получаемые из тканей животных, главным образом свиной инсулин. Последний выпускается в виде очищенных (монопиковых - МП; имеется в виду хроматографическая очистка сырья) и высокоочищенных (монокомпонентных","- МК) препаратов. Создан также аналог инсулина человека хумалог (инсулин лиспро). Он обладает более быстрым и менее продолжительным эффектом, чем обычные препараты челове- ческого инсулина короткого действия.","1. Препараты с быстрым развитием максимального эффекта (через 1-4 ч) и кратковременным действием (4-8 ч). Инсулин С, Инсулин СПП, Инсулин Рапид","2. Препараты со средней скоростью развития максимального эффекта (через 6- 12 ч) и средней продолжительностью действия (18-24 ч). Инсулин Базал, Хумулин Л","3. Препараты с медленным развитием максимального эффекта (через 12-18 ч) и длительным действием (24-40 ч). Хумулин У-Л, Ультратард НМ . Вводят препараты инсулина парентерально: обычно - подкожно и внутримышечно, реже - внутривенно (при приеме внутрь инсулин разрушается пищеварительными ферментами)1. Препараты инсулина короткого действия начинают действовать быстро, особенно при внутривенной инъекции. Последний путь введения наиболее показан при лечении прекоматозного и коматозного состояний. В этих случаях и при инсулинзависимом сахарном диабете инсулин является незаменимым препаратом.","В редких случаях наблюдаются локальные аллергические реакции в области введения инсулина- покраснение, боль, зуд, крапивница, отек или воспаление. начимые Иизменения регуляции содержания глюкозы в крови могут вызвать временные нарушения зрения вследствие изменения тургора тканей и показателя преломления хрусталика глаза из-за снижения рефракции глаз (повышение гидратации хрусталика) при впервые начатой инсулинотерапии. Редко инсулин может вызывать задержку выведения натрия и образование отеков, гипогликемии."]},"2-3":{"t":"3.ВЯЖУЩИЕ СРЕДСТВА.","p":["Механизм вяжущего действия и эффекты препаратов (влияние на сосуды, болевую чувствительность, секрецию желез, проницаемость клеточных мембран, воспалительную реакцию).","Механизм действия: на месте нанесения вяжущих средств возникает:","1) уплотнение коллоидов («частичная коагуляция» белков) внеклеточной жидкости, экссудата, клеточных мембран, слизи, образование пленки, предохраняющей окончания чувствительных нервов от раздражения, ослабление чувства боли.","2) местное сужение сосудов, уменьшение их проницаемости, экссудации, ингибирование ферментов, противовоспалительное действие.","Танин - образуют с белками нерастворимые альбуминаты=>действие на поверхностный слой белков.","Висмута нитрат- образуют с белками альбунаты, способные диссоциировать=>коагуляция новых слоев белковПоказания к применению вяжущих средств разных групп.","• острые воспалительные заболевания желудочно-кишечного тракта (назначают вяжущие средства растительного происхождения, которые в случае инфекционной природы заболевания сочетают с антибактериальными препаратами);","• язвенная болезнь желудка и двенадцатиперстной кишки, хронические гастриты, дуодениты — применяют препараты растительного происхождения, а также висмута нитрат основной (входит в состав комплексных таблеток «Викаир» и «Викалин»);","• острые и хронические воспалительные заболевания полости рта, горла (назначают препараты растительного происхождения)."]},"2-30":{"t":"30.ГОРМОНАЛЬНЫЕ ПРЕПАРАТЫ. КЛАССИФИКАЦИЯ СИНТЕТИЧЕСКИХ ГИПОГЛИКЕМИЧЕСКИХ СРЕДСТВ ПО ХИМИЧЕСКОЙ СТРУКТУРЕ.","p":["Механизм гипогликемического действия производных сульфонилмочевины связан с их способностью блокировать АТФ-зависимые К+-каналы (схема 20.2). Это приводит к открыванию потенциалзависимых Са2+-каналов, увеличению внутриклеточного содержания ионов кальция и повышению высвобождения из В-клеток инсулина. Установлено, что при этом повышается чувствительность В-клеток к глюкозе и аминокислотам, которые стимулируют продукцию инсулина. Побочные эффекты (диспепсические расстройства, аллергические реакции, редко - лейкопения, тромбоцитопения, угнетение функции печени). Возможно привыкание к бутамиду.","Для энтерального введения предложен новый препарат натеглинид (старликс), являющийся производным D-фенилаланина. Он блокирует АТФ-зависимые К+-каналы преимущественно в B-клетках поджелудочной железы. Возникающая при этом деполяризация мембраны приводит к открыванию Са2+-каналов и увеличению секреции инсулина. Применяется при 2 типе сахарного диабета для стимуляции первой фазы секреции инсулина после приема пищи.","Из группы бигуанидов в медицинской практике применяется метформин (сиофор). Основным считается способность метформина подавлять глюконеогенез в печени. Полагают также, что он способствует поглощению глюкозы мышцами, но это не приводит к образованию гликогена.","В мышцах накапливается молочная кислота (очевидно, за счет стимуляции анаэробного гликолиза). Поглощение глюкозы усиливается также клетками жировой ткани. Имеются данные, что в небольшой степени метформин задерживает всасывание углеводов в кишечнике.","Побочные эффекты часто возникают со стороны желудочно-кишечного тракта (тошнота, рвота, диспепсия, металлический привкус во рту, диарея ). Метформин применяется при сахарном диабете 2-го типа.","Основное осложнение, типичное для большинства противодиабетических средств, - это гипогликемия. Она возникает при передозировке препаратов или при нарушении пищевого режима. В тяжелых случаях может развиться гипогликемический шок. Гипогликемию легкой степени можно компенсировать приемом сахара или пищи, богатой углеводами. При необходимости парентерально вводят глюкозу. Гипергликемическим эффектом обладают также адреналин и глюкагон."]},"2-31":{"t":"31.ГОРМОНАЛЬНЫЕ ПРЕПАРАТЫ. ПРИНЦИПЫ ТЕРАПИИ ГЛЮКОКОРТИКОСТЕРОИДАМИ.","p":["Основной принцип глюкокортикостероидной терапии — достижение максимального эффекта при минимальных дозах. Очень важно, чтобы в каждом случае доза глюкокортикостероидных препаратов была оптимальной. Выбор дозы, превышающей оптимальную, быстро приводит к развитию побочных эффектов. Если доза выбрана ниже оптимальной, увеличиваются сроки лечения, а патологический процесс не купируется. Выбор оптимальной дозы глюкокортикостероидных гормонов в каждой клинической ситуации — есть врачебное искусство, которым можно овладеть в процессе работы с больными и научной литературой.","Учитывая возможность развития тяжелых осложнений фармакотерапии, глюкокортикоиды назначают только по строгим показаниям. Выбор наиболее адекватного препарата производится с учетом индивидуальной реакции, если больной принимал препарат ранее, и сопутствующих заболеваний. Критериями для установления минимальной эффективной, или оптимальной дозы глюкокортикостероидов и длительности лечения являются характер и динамика патологического процесса у конкретного больного. Они включают гидрокортизон, преднизолон, дексаметазон.","Противовоспалительный эффект глюкокортикоидов связан с их влиянием на образование медиаторов воспаления, на сосудистый компонент, а также на клетки, участвующие в воспалении. Под влиянием глюкокортикоидов суживаются мелкие сосуды и уменьшается экссудация жидкости. Сокращается накопление в зоне воспаления лейкоцитов, снижается активность макрофагов и фибробластов. Иммунодепрессивный эффект глюкокортикоидов связан с подавлением активности Т- и В-лимфоцитов, уменьшением продукции ряда интерлейкинов и других цитокинов, а также содержания комплемента в плазме крови, снижением уровня циркулирующих лимфоцитов и макрофагов, а также с угнетающим влиянием на фактор, ингибирующий миграцию (МИФ). Глюкокортикоиды (гидрокортизон и др.) оказывают выраженное и многообразное влияние на обмен веществ. Со стороны углеводного обмена это проявляется повышением содержания глюкозы в крови, что связано с более интенсивным гликонеогенезом в печени. Возможна глюкозурия. Влияние на жировой обмен проявляется перераспределением жира. При систематическом применении глюкокортикоидов значительные количества жира накапливаются на лице (лунообразное лицо), дорсальной части шеи, плечах. При применении препаратов глюкокортикоидов изменяется кроветворение. Характерно уменьшение в крови количества эозинофилов и лимфоцитов. Одновременно возрастает содержание эритроцитов, ретикулоцитов и нейтрофилов.","Прямым показанием к применению препаратов глюкокортикоидов является острая и хроническая недостаточность надпочечников. Однако наиболее широко их используют в качестве противовоспалительных и противоаллергических средств. Благодаря этим свойствам глюкокортикоиды с успехом применяют при коллагенозах, ревматизме, воспалительных заболеваниях кожи (экзема и др.), аллергических состояниях (например, при бронхиальной астме, сенной лихорадке), некоторых заболеваниях глаз (ириты, кератиты). Их назначают также при лечении острых лейкозов. Нередко в медицинской практике глюкокортикоиды используют при шоке. Иммунодепрессивное действие может быть полезным для подавления иммунных реакций при пересадке органов и тканей.","Глюкокортикостероиды могут быть причиной задержки в тканях избыточных количеств воды, развития отеков, повышения артериального давления. Возможны значительное увеличение содержания сахара в крови, нарушение распределения жира. Замедляется процесс регенерации, возможны изъязвление слизистой оболочки желудочно-кишечного тракта, остеопороз.","Снижается сопротивляемость к инфекциям. Отмечены психические расстройства, нарушения менструального цикла."]},"2-32":{"t":"32.ГОРМОНАЛЬНЫЕ ПРЕПАРАТЫ. МИНЕРАЛОКОРТИКОСТЕРОИДНЫЕ СРЕДСТВА.","p":["Дезоксикортикостерона ацетат, дезоксикортикостерона триметилацетат.","Главным проявлением физиологической актив- ности минералокортикоидов является влияние на водно-солевой обмен. Воздействуя на дистальные отделы нефрона, минералокортикоиды повышают обратное всасывание ионов натрия и изоосмотических количеств воды.","Одновременно повышается секреция ионов калия.","Применяют минералокортикоиды при хронической недостаточности коры надпочечников (в том числе при болезни Аддисона). Кроме того, их используют при миастении, адинамии, так как они повышают тонус и работоспособность мышц.","Побочные эффекты связаны с чрезмерной задержкой в организме ионов натрия и воды.","Появляются отеки, пастозность тканей, асцит1. Повышается артериальное давление. В тяжелых случаях может развиваться левожелудочковая недостаточность с отеком легких.","Существуют антагонисты минералокортикоидов. Некоторые нарушают их синтез (например, метирапон), однако действуют неизбирательно и одновременно угнетают синтез глюкокортикоидов. Вместе с тем имеются антагонисты, блокирующие специфические рецепторы и избирательно устраняющие эффекты минералокортикоидов на почечные канальцы. К таким антагонистам относится спиронолактон, используемый в качестве диуретика."]},"2-33":{"t":"33.ГОРМОНАЛЬНЫЕ ПРЕПАРАТЫ. ПРЕПАРАТЫ ЭСТРОГЕННОГО ДЕЙСТВИЯ.","p":["Эстрон, эстрадиола дипропионат, этинилэстрадиол.","Применяют эстрогены при недостаточной функции яичников (при нарушении менструального цикла - аменорее, дисменорее, при посткастрационных расстройствах), для подавления лактации в послеродовом периоде. Эстрогены (например, синэстрол) используют в комплексной терапии больных раком предстательной железы (см. главу 34), а также раком молочной железы (у женщин старше 60 лет). Эстрогены входят в состав комбинированных контрацептивных средств.","В качестве лекарственных препаратов используют прогестерон или его синтетические производные - оксипрогестерона капронат, медроксипрогестерона ацетат и прегнин. Кроме того, синтезированы препараты с гестагенной активностью, являющиеся производными тестостерона, - норгестрел, норэтиндрон, норэтистерон, диметистерон. Прогестерон влияет на эндометрий, подготавливая его к имплантации яйцеклетки (пролиферативная фаза переходит в секреторную). Он подавляет возбудимость миометрия, предупреждает овуляцию, способствует разрастанию железистой ткани молочных желез. Применяют гестагены при недостаточности функции желтого тела для профилактики выкидыша (в первой половине беременности), при нарушениях менструального цикла. Широко используются в качестве контрацептивных средств.","Комбинированные контрацептивы. Из эстрогенных препаратов обычно используют этинилэстрадиол. Набор гестагенов довольно разнообразен. Большинство из них относятся к производным тестостерона (норэтиндрон, норгестрел, левоноргестрел и др.). Выделяют монофазные препараты, в которых дозы эстрогенов и гестагенов постоянны (микрогинон, минизистон, фемоден, диане-35, жанин, логест, регулон, новинет и др.), а также двух- и трехфазные препараты. Механизм действия препаратов связывают с тем, что они подавляют овуляцию. Происходит это в результате угнетения продукции фолликулостимулирующего и лютеинизирующего гормонов гипофиза и гипоталамического гормона, стимулирующего их биосинтез и высвобождение. Наиболее типичны следующие побочные эффекты: повышение свертываемости крови (риск тромбоза вен и тромбоэмболии), нарушение функций печени, снижение устойчивости к глюкозе, головная боль, головокружение, уплотнение («нагрубание») грудных желез, изменение либидо, тошнота, рвота, кровянистые выделения в межменструальном периоде, увеличение массы тела и др."]},"2-34":{"t":"34.ГОРМОНАЛЬНЫЕ ПРЕПАРАТЫ. ПРЕПАРАТЫ АНДРОГЕННОГО ТИПА ДЕЙСТВИЯ.","p":["В медицинской практике широко применяют эфиры тестостерона: тестостерона пропионат и тестэнат, получаемые синтетическим путем . Оба препарата обладают выраженной андрогенной и анаболической активностью. Под влиянием тестостерона развиваются половые органы и вторичные половые признаки, контролируется сперматогенез. Тестостерон оказывает также выраженное влияние на белковый обмен, способствуя синтезу белка (так называемое анаболическое действие), увеличивает реабсорбцию в почечных канальцах воды, ионов кальция, натрия, хлора и др. Применяют препараты с андрогенной активностью при недостаточной функции мужских половых желез (при половом недоразвитии, импотенции и других нарушениях), а также у женщин при раке молочной железы и яичников (у женщин до 60 лет), при дисменорее, климактерических расстройствах.","В медицинской практике используют ряд анаболических стероидов. К активным длительно действующим препаратам относятся феноболин (нандролона фенилпропионат, дураболин, нероболил) и ретаболил (нандролона деканоат, декадураболин). Анаболические стероиды способствуют синтезу белков. При их применении улучшается аппетит, увеличивается масса тела. При остеопорозе ускоряется кальцификация костей. Благоприятное влияние оказывают эти вещества на процессы регенерации. Используют анаболические стероиды при кахексии, астении, длительном применении глюкокортикоидов, после лучевой терапии, при остеопорозе, для стимуляции регенераторных процессов (например, при костных переломах).","При применении указанных препаратов возможны побочные эффекты, связанные с их гормональной активностью. Маскулинизирующее влияние у женщин обычно выражено в небольшой степени. Могут отмечаться тошнота, отеки, избыточное отложение кальция в костной ткани, иногда нарушение функции печени. Противопоказаны анаболические стероиды во время беременности, в период лактации, при раке предстательной железы, заболеваниях печени."]},"2-35":{"t":"35.ВИТАМИННЫЕ ПРЕПАРАТЫ. КЛАССИФИКАЦИЯ ПО ФАРМАКОТЕРАПЕВТИЧЕСКОМУ ПРИМЕНЕНИЮ.","p":["-антиоксиданты (витамины А, С, Е, каротиноиды);","-прогормоны (витамин А и Д);","-коферменты (витамины В6, В1, В2, РР, В5, В9, В12, витамин К,).","Жирорастворимые препараты. Эта группа витаминов объединяет витамины A, D, E, K.","Основная направленность действия витамина А - играет важную роль в окислительновосстановительных процессах (за счет большого количества ненасыщенных связей). Имеются данные о том, что витамин А участвует в синтезе мукополисахаридов, белков, липидов.","Большое значение имеет витамин А для фоторецепции. Применяют препараты витамина А и каротины для лечения и профилактики А-витаминной недостаточности, при некоторых кожных заболеваниях (при нарушении процесса ороговения), ряде патологических состояний роговицы и сетчатки, для лечения ожогов, обморожений, при инфекционных заболеваниях, некоторых патологических состояниях желудочно-кишечного тракта.","К группе витамина D относят эргокальциферол (витамин D2) и холекальциферол (витамин D3).","Наиболее активным метаболитом холекальциферола является кальцитриол (рокальтрол), который по своим свойствам является гормоном. Он взаимодействует со специфическими внутриклеточными рецепторами1 и регулирует обмен кальция во многих тканях.","Кальцифедиол - основной циркулирующий метаболит холекальциферола. Влияние веществ группы витамина D на обмен веществ однотипно и проявляется в основном в отношении метаболизма кальция (Са2+) и фосфата (НРО42-). Один из важных эффектов витамина D (имеются в виду все активные соединения этой группы) заключается в том, что он повышает проницаемость эпителия кишечника для кальция и фосфатов. При этом обеспечиваются необходимые их концентрации в крови. Кроме того, витамин D регулирует минерализацию костной ткани. В медицинской практике применяют эргокальциферол, кальцитриол, альфакальцидол, холекальциферол2, кальцифедиол. D-витаминной активностью обладает также рыбий жир. Эти препараты назначают главным образом для лечения и профилактики рахита. Кроме того, их используют при некоторых заболеваниях костной системы (остеодистрофиях), в хирургии - для ускорения образования костной мозоли, при недостаточности паращитовидных желез, при волчанке кожи и слизистых оболочек.","Кальципотриол (псоркутан) применяют местно в виде мазей при псориазе.","Витамин Е (токоферол3) объединяет ряд соединений со сходными биологическими свойствами, относящихся к группе токоферолов. Витамин Е участвует в регуляции окислительных процессов. Одну из основных его функций относят к антиоксидантному действию. В частности, полагают, что он тормозит окисление ненасыщенных жирных кислот, препятствует образованию их перекисей. Последние имеют значение в развитии атеросклероза, так как они ингибируют простациклинсинтетазу. Кроме того, витамин Е, по-видимому, влияет на клеточное дыхание. В медицинской практике витамин Е (раствор токоферола ацетата в масле, концентрат витамина Е) применяют при самопроизвольных абортах, мышечной дистрофии, стенокардии, поражении периферических сосудов, ревматоидном артрите, климаксе.","Витамины группы К, обладающие антигеморрагическими свойствами (повышают свертываемость крови). К ним относятся природные витамин К1 (филлохинон) и менее активный витамин К2 (менахинон). Сходными свойствами обладает синтетический водорастворимый препарат викасол. Витамин К обладает стимулирующим влиянием на синтез в печени протромбина, проконвертина и ряда других факторов свертывания крови. Кроме того, он благоприятствует синтезу АТФ, креатинфосфата, ряда ферментов. Применяют препараты группы витамина К в качестве гемостатиков при кровоточивости и геморрагическом диатезе, связанных с гипопротромбинемией. Их назначают при геморрагической болезни новорожденных, гепатитах, циррозе печени, хронической диарее, язвенной болезни желудка и двенадцатиперстной кишки, по определенным показаниям во время подготовки к операции и в послеоперационном периоде, при маточных кровотечениях."]},"2-36":{"t":"36.ВИТАМИННЫЕ ПРЕПАРАТЫ. ВОДОРАСТВОРИМЫЕ ВИТАМИННЫЕ.","p":["Тиамин (витамин B1) всасываясь из кишечника, фосфорилируется и превращается в тиаминпирофосфат (см. структуры). В этой форме он является коферментом декарбоксилаз, участвующих в окислительном декарбоксилировании кетокислот (пировиноградной, акетоглутаровой), а также транскетолазы, участвующей в пентозофосфатном пути распада глюкозы. Применяют тиамин при его недостаточности, при неврите, невралгиях, парезах, радикулите, при ряде кожных заболеваний, а также при патологических состояниях желудочно-кишечного тракта, сердечно-сосудистой системы. Для практического применения выпускают тиамина бромид и тиамина хлорид (назначают внутрь и парентерально).","Рибофлавин (витамин В2) при участии АТФ фосфорилируется и превращается в следующие коферментные формы: ФМН и ФАД. Оба кофермента принимают участие в окислительновосстановительных процессах в составе дегидрогеназ и оксидаз. Применяют рибофлавин при его недостаточности, а также при кератите, конъюнктивите, ирите, при ряде кожных и инфекционных заболеваний, лучевой болезни. Парентерально используют рибофлавина мононуклеотид.","Кислота пантотеновая (витамин B5) В организме он участвует в образовании кофермента А.","Значение последнего в обменных процессах очень велико: он принимает участие в окислении и биосинтезе жирных кислот, в окислительном декарбоксилировании кетокислот (например, пировиноградной, α-кетоглутаровой), в синтезе лимонной кислоты (включаясь в цикл трикарбоновых кислот), кортикостероидов, ацетилхолина. Основная функция кофермента А заключается в том, что он является акцептором и переносчиком кислотных (ацильных) остатков. В медицинской практике применяют кальция пантотенат (внутрь, местно и парентерально). Препарат назначают при неврите, невралгиях, некоторых аллергических реакциях, при заболеваниях органов дыхания, язвах, ожогах, при послеоперационной атонии кишечника, для устранения токсических эффектов препаратов стрептомицина, соединений мышьяка.","Витамин В6. Основной коферментной формой, в которую превращаются пиридоксин, пиридоксаль и пиридоксамин, является пиридоксальфосфат (кроме того, образуется пиридоксаминфосфат). Пиридоксальфосфат участвует в очень многих процессах азотистого обмена: трансаминировании, дезаминировании и декарбоксилировании аминокислот, метаболизме триптофана, аминокислот, содержащих серу, оксиаминокислот и др. Для медицинской практики выпускают пиридоксина гидрохлорид. Его применяют при недостаточности витамина В6 на фоне приема гидразидов изоникотиновой кислоты, антибиотиков, при большой физической нагрузке, при токсикозе беременных. Используют препарат также при лечении паркинсонизма, неврита, радикулита, лучевой болезни, гепатита легкой и средней тяжести.","Кислота фолиевая в печени превращается в активную коферментную форму - 5,6,7,8тетрагидрофолиевую кислоту. Основная функция последней заключается в присоединении и переносе одноуглеродных групп (формильной3, метильной, оксиметильной и метиленовой).","Тетрагидрофолиевая кислота участвует в синтезе пуринов, опосредовано - в синтезе пиримидинов, превращениях ряда аминокислот, обмене гистидина, синтезе метионина, т.е. в метаболизме нуклеиновых кислот и белков. Применяют кислоту фолиевую при макроцитарной анемии, мегалобластических анемиях у детей и беременных, при спру.","Витамин В12. Основная функция активных коферментных форм витамина В12 (кофермента В12 и метилкобаламина) - перенос подвижных метильных групп (процесс трансметилирования) и водорода. Благодаря этим процессам осуществляется влияние на обмен белков и нуклеиновых кислот (посредством участия в синтезе метионина, ацетата, дезоксирибонуклеотидов и др.). Витамин В12 необходим для процесса кроветворения, образования эпителиальных клеток, функционирования нервной системы (участвует в образовании миелина), роста и процессов регенерации. Применяют при мегалобластической анемии (пернициозная, или злокачественная, анемия; анемия Аддисона-Бирмера).","Витамин В15. Участие в биохимических процессах связано с тем, что он является донатором метильных групп. Применяют при заболеваниях печени (циррозе, гепатитах), атеросклерозе, лечении алкоголизма. Кислоту пангамовую назначают также при дистрофических поражениях миокарда, при стенокардии. В качестве препарата кислота пангамовая выпускается в виде кальциевой соли (кальция пангамат)."]},"2-37":{"t":"37.ВИТАМИННЫЕ ПРЕПАРАТЫ. УЧАСТИЕ В БИОХИМИЧЕСКИХ ПРОЦЕССАХ ОРГАНИЗМА ВИТАМИНОВ С, U, K, P, H, ФАРМАКОЛОГИЧЕСКИЕ ЭФФЕКТЫ, ПОКАЗАНИЯ К ПРИМЕНЕНИЮ. ПРИЧИНЫ ГИПОВИТАМИНОЗОВ, ПОЛИВИТАМИННЫЕ КОМПЛЕКСЫ","p":["Витаминные препараты лекарственные препараты, содержащие витамины. Их применяют для предупреждения или лечения болезненных состояний, вызванных витаминной недостаточностью, а также при лечении некоторых других заболеваний.","Витамин С.","Б/х функции: перенос электронов и протонов в окислительно - восстановленных реакциях тканевого дыхания, препятствует окислению гемоглобина в эритроцитах.","Фармакологические эффекты: повышение активности металлоэнзимов, функционирующих при наличии восстановленных металлов, способствует: а) превращению кальцидиола в кальцитриол; б) гидроксилированию пролина и лизина в процессе синтеза коллагена, структурного компонента хрящевой, костной и других вариантов соединительной ткани;","Показания к применению: 1. Ликвидация повышенной проницаемости сосудов, особенно при наличии геморрагий. 2. Интенсивная транссудация жидкой части плазмы, приводящая к отечности нижних конечностей и пр. 3. Холестаз. 4. Ишемия миокарда и постишемические состояния (препараты применяют в качестве антиоксидантов).","Витамин U. S-метилметионин, называемый также противоязвенным фактором, нормализует двигательную активность желудочно-кишечного тракта, выработку пищеварительных соков желудком и тонким кишечником, желчеотделение, препятствует накоплению жира в печени.","Б/х: данное вещество является одним из участников синтеза многих других биологически активных веществ, к примеру, холина (витамина В4).","Показания: Витамин U назначают при заболеваниях ЖКТ. В дерматологии витамин U применяется при трофических язвах голени, хронической язвенной серпигинирующей пиодермии и различных дерматозах, сопровождающихся нарушениями функций желудочнокишечного тракта.","Витамин К.","Б/х функции: 1. Участвует в окислительном декарбоксилировании микробных и растительных клеток. 2. На генетическом уровне участвует в биосинтезе факторов крови. 3. Является коферментом фермента, участвующего в декарбоксилировании факторов свертывания крови прокоагулянтов (F II,VII, IX, X).","Витамин К называют противогеморрагическим, или коагуляционным витамином, так как он принимает участие в образовании протромбина и способствует нормальному свертыванию крови. Показания к применению: для с
