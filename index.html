сульфаниламидами. Механизм, спектр и характер противомикробного действия. Показания и противопоказания к применению, побочные эффекты.","r":["1-37"],"g":null},{"n":37,"q":"Антисептические и дезинфицирующие средства. Понятие об антисептическом и дезинфицирующем действии, факторы, влияющие на антисептическую активность препаратов. Классификация антисептиков по химической структуре, механизмы антисептического действия препаратов разных групп. Показания к применению в различных областях медицины.","r":["2-42"],"g":null},{"n":38,"q":"Плазмозамещающие растворы и средства для парентерального питания. Классификация плазмозамещающих растворов по химической природе, сущность действия, показания к применению. Препараты, применяемые для коррекции кислотно-щелочного равновесия, применение. Основные средства для парентерального питания, сущность действия, применение.","r":["2-43"],"g":null},{"n":39,"q":"Препараты, влияющие на иммуногенез. Классификация иммуностимуляторов по химической структуре. Механизмы иммуностимулирующего эффекта и показания к применению отдельных препаратов. Иммунодепрессанты разных групп, механизмы этого эффекта, показания к применению отдельных препаратов. Характеристика иммуномодуляторов.","r":["1-47"],"g":null}],"3":[{"n":1,"q":"Содержание фармакологии и ее положение в системе медицинского образования. Значение фармакологии для врачебного образования. Характеристика основных этапов развития фармакологии. Роль Гиппократа, Галена, Авиценны, Парацельса в развитии лекарствоведения.","r":["3-1"],"g":null},{"n":2,"q":"Краткая характеристика развития отечественной фармакологии (А.А.Соколовский, А.А.Иовский, А.П.Нелюбин, В.Н.Дыбковский и др.). Заслуги И.П.Павлова и Н.П.Кравкова в развитии отечественной фармакологии. Вклад русских физиологов и клиницистов в развитие фармакологии (Н.И.Пирогов, И.М.Сеченов, Е.В.Пеликан, Л.В.Соболев и др.) Работы З.В.Ермольевой, С.В.Аничкова, В.В.Закусова и др.","r":["3-2"],"g":null},{"n":3,"q":"Современные направления развития фармакологии - фармакокинетика, фармакогенетика, молекулярная фармакология, хронофармакология.","r":["3-3"],"g":null},{"n":4,"q":"Особенности всасывания и действия лекарственных средств при энтеральном введении (сублингвально, в желудок, ректально). Время развития эффекта, влияние рН среды желудка на всасывание лекарств-кислот и лекарств-оснований.","r":["3-4"],"g":null},{"n":5,"q":"Особенности действия лекарственных средств при парентеральном введении (инъекционные пути, ингаляционное, перкутанное введение). Время развития эффекта, длительность эффекта и время сохранения в крови активной концентрации. Физико-химические свойства лекарств, исключающие возможность внутривенного, внутримышечного, подкожного введения.","r":["3-5"],"g":null},{"n":6,"q":"Пути выведения лекарственных веществ (примеры). Изменение элиминации лекарств в зависимости от дозы, возраста, растворимости, полярности, ионизированности и связи с белками, заболеваний печени, почек, ССС.","r":["3-6"],"g":null},{"n":7,"q":"Основные механизмы всасывания.  Влияние физико-химических свойств лекарственных средств на транспорт лекарств (ионизированность, молекулярная масса, растворимость в липидах и др.).","r":["3-7"],"g":null},{"n":8,"q":"Распределение лекарственных средств в организме; зависимость от массы тела, проницаемости тканей, состояния гемодинамики, связывания с белками плазмы крови. Депонирование лекарственных веществ (примеры).","r":["3-8"],"g":null},{"n":9,"q":"Понятие о биодоступности лекарственных средств. Влияние лекарственной формы на биодоступность. Период полуэлиминации и его зависимость от связи препарата с белками плазмы крови.","r":["3-9"],"g":null},{"n":10,"q":"Понятие о дозе. Классификация доз по эффекту и периодичности назначения. Широта терапевтического действия препаратов (примеры), значение.","r":["3-10"],"g":null},{"n":11,"q":"Физиологические особенности организма, определяющие необходимость индивидуального дозирования лекарств. Вредные привычки (курение, злоупотребление алкоголем), меняющие характер действия препаратов.","r":["3-11"],"g":null},{"n":12,"q":"Особенности детского организма. Всасывание лекарств в ЖКТ у новорожденных и грудных детей с учетом значения  рН желудочного сока, размера пор между клетками кишечного эпителия, темпа процессов пассивной диффузии и интенсивности активного транспорта лекарств. Принципы дозирования лекарств для детей, варианты расчета доз.","r":["3-12"],"g":null},{"n":13,"q":"Превращение лекарственных веществ в организме. Этапы и виды биотрансформации. Индукторы и ингибиторы микросомального аппарата печени, влияние их на биотрансформацию лекарств (примеры).","r":["3-13"],"g":null},{"n":14,"q":"Классификация лекарственных форм с указанием разновидностей. Фармакологическая характеристика микрокапсулированных лекарственных форм, разновидностей таблеток и терапевтических систем.","r":["3-14"],"g":null},{"n":15,"q":"Основные виды лекарственной терапии (примеры). Принципы химиотерапии.","r":["3-15"],"g":null},{"n":16,"q":"Виды действия лекарственных веществ в зависимости от эффекта изменения функции (примеры). Механизмы действия лекарственных веществ на разных уровнях (субклеточный, клеточный, органный, системный).","r":["3-16"],"g":null},{"n":17,"q":"Основные разновидности резорбтивного действия лекарств (примеры).","r":["3-17"],"g":null},{"n":18,"q":"Определение понятий: «побочное действие», «эмбриотоксичность», «тератогенность», «фетотоксичность», «канцерогенность», «сенсибилизация», «идиосинкразия». Примеры.","r":["3-18"],"g":null},{"n":19,"q":"Понятие о кумуляции, виды (примеры). Привыкание и тахифилаксия (примеры); возможные причины этих проявлений и принципы преодоления.","r":["3-19"],"g":null},{"n":20,"q":"Понятие о лекарственной зависимости, ее разновидности; препараты, вызывающие лекарственную зависимость. Профилактика ятрогенной лекарственной зависимости. Понятие о токсикомании.","r":["3-20"],"g":null},{"n":21,"q":"Явления, наблюдаемые при фармакокинетическом взаимодействии лекарств (на этапах всасывания, транспорта, распределения, превращений и выведения).","r":["3-22"],"g":null},{"n":22,"q":"Явления, наблюдаемые при фармакодинамическом взаимодействии лекарств (усиление эффекта, разновидности антагонизма), примеры. Проблемы комбинированной фармакотерапии.","r":["3-21"],"g":null},{"n":23,"q":"Основные принципы распознания и терапии отравлений. Антидоты при отравлении тяжелыми металлами; морфином; метиловым спиртом; барбитуратами; бензодиазепинами, мускарином.","r":["3-25"],"g":null},{"n":24,"q":"Основные принципы распознания и терапии отравлений. Антидоты при отравлении атропином, сердечными гликозидами, ФОС, деполяризующими и антидеполяризующими миорелаксантами, непрямыми антикоагулянтами.","r":["3-25","1-3","1-21"],"g":"Pour l’atropine et les glycosides cardiaques, voir aussi les réponses des M-cholinobloquants et des glycosides."},{"n":25,"q":"Понятие о нежелательных лекарственных реакциях (НЛР) лекарственных веществ. Классификация основных разновидностей НЛР.","r":["3-27"],"g":null},{"n":26,"q":"Понятие о биологической стандартизации лекарственных веществ. Препараты, дозы которых определяются методами биостандартизации (примеры).","r":["3-28"],"g":null},{"n":27,"q":"Принципы классификации лекарственных средств. Различные виды классификации препаратов на примере антибиотиков (по источникам получения, механизму и спектру действия, химической структуре и др.).","r":["3-29"],"g":null},{"n":28,"q":"Сущность метода экспериментальной терапии и его роль в фармакологических исследованиях. Современные принципы поиска новых лекарственных веществ. Схемы исследования новых лекарственных средств (первичный скрининг, методы плацебо, слепые, двойные. тройные слепые исследования, рандомизация, ретроспективный анализ).","r":["3-32"],"g":null}]},"livret":{"1-1":{"t":"1.М-ХОЛИНОМИМЕТИКИ.","p":["Локализация М-холинорецепторов- М-холинорецепторы расположены в постсинаптической мембране клеток эффекторных органов у окончаний постганглионарных холинергических (парасимпатических) волокон. Кроме того, они имеются на нейронах вегетативных ганглиев (локализуются вне синапсов) и в ЦНС (в коре головного мозга, ретикулярной формации).","Выделяют м1-холинорецепторы (в вегетативных ганглиях и в ЦНС), м2-холинорецепторы (основной подтип м- холинорецепторов в сердце) и м3-холинорецепторы (в гладких мышцах, большинстве экзокринных желез), м4-холинорецепторы (в сердце, стенке легочных альвеол, ЦНС) и м5-холинорецепторы (в ЦНС, в слюнных железах, радужной оболочке, в мононуклеарных клетках крови).","Препараты их возбуждающие - Пилокарпина гидрохлорид, Ацеклидин Механизм действия- прямое стимулирующее влияние на м-холинорецепторы.","Фармакологические эффекты:","1. Глаз: сокращение m.constrictorpupillae, сужение зрачка (миоз), открытие угла передней камеры глаза, улучшение оттока жидкости в Шлеммов канал, сокращение цилиарной мышцы и улучшение оттока внутриглазной жидкости через трабекулярную сеть, увеличение кривизны хрусталика (ближний фокус)","2. Действие на ССС: уменьшение ЧСС, уменьшение атриовентрикулярной проводимости, уменьшение силы сердечных сокращений, периферическая вазодилатация (опосредуется через внесинаптические М-Хр и высвобождение NO)","3. ЖКТ: увеличение тонуса и амплитуды сокращения кишечника","4. Мочевой пузырь: сокращение детрузора, уменьшение емкости мочевого пузыря.","5. Матка: у человека не чувствительна к М-агонистам.","6. Дыхательная система: сокращение мышц бронхиального дерева, повышение секреции бронхиальных желез","7. ЦНС: паркинсоноподобные эффекты.","Показания к применениюПилокарпин широко применяется в офтальмологической практике для понижения внутриглазного давления при глаукоме, а также для улучшения трофики глаза при тромбозе центральной вены сетчатки, острой непроходимости артерии сетчатки, при атрофии зрительного нерва, при кровоизлияниях в стекловидное тело.","Ацеклидин средство, предупреждающее и устраняющее атонию мочевого пузыря, особенно при увеличении количества мочи, связанном с нейрогенными расстройствами мочевого пузыря, при атонии мускулатуры желудочно-кишечного тракта, а также при пониженном тонусе и субинволюции матки, для остановки кровотечения в послеродовом периоде.","Применяют растворы ацеклидина для сужения зрачка и снижения внутриглазного давления при глаукоме.","Противопоказания к применению отдельных препаратов – ПИЛОКАРПИН Гиперчувствительность, ирит, циклит, иридоциклит, кератит, состояние после офтальмологических операций и др. заболевания глаз, при которых сужения зрачка нежелательно АЦЕКЛИДИН при бронхиальной астме, тяжелых заболеваниях сердца, стенокардии, кровотечениях из желудочно-кишечного тракта, эпилепсии, гиперкинезах, при беременности (если препарат не назначают для повышения тонуса мускулатуры матки), а также при воспалительных процессах в брюшной полости до оперативного вмешательства.","Симптомы отравления мускарином- обильное слюноотделение, профузный пот, покраснение лица, тошнота, рвота, боль в животе, понос. Зрачки сужены, зрение неясное из-за спазма аккомодации. При прогрессировании отравления могут наблюдаться: расстройства ритма сердца, значительное снижение артериального давления вплоть до коллапса. Вследствие спазма бронхов и усиленной секреции брон­хиальных желез дыхание затруднено, поверхностно, наблюдаются цианоз, судороги. Смерть наступает из-за асфиксии.","Меры помощи- Средством антидотной терапии является атропина сульфат, который вводят под кожу в виде 1 мл 0,1% раствора повторно (с интервалами 10 мин), до 3 раз (при наличии показаний). В тяжелых случаях препарат может быть введен внутривенно медленно. При попадании яда внутрь промывают желудок взвесью активированного угля, 0,1% раствором перманганата калия с последующим введением взвеси активированного угля, солевого слабительного. Назначают высокую клизму. При асфиксии — искусственная вентиляция легких, реанимационные мероприятия. В случае расстройства кровообращения под кожу вводят камфору, кордиамин, кофеин-бензоат натрия."]},"1-10":{"t":"10.СИМПАТОЛИТИЧЕСКИЕ СРЕДСТВА.","p":["Механизмы действия: угнетает передачу возбуждения с адренергических нейронов, избирательно накапливаясь в гранулах симпатических постганглионарных нервных окончаний и вытесняя из них НА. В результате истощения запасов НА ослабляется или прекращается передача нервного возбуждения.","Фармакологические эффекты отдельных препаратов:","Основным эффектом октадина является постепенно развивающееся (в течение нескольких дней) стойкое снижение артериального давления. Обусловлено это уменьшением сердечного выброса, возникновением брадикардии, угнетением прессорных рефлексов. При длительном применении октадина снижается и общее периферическое сопротивление сосудов. Октадин оказывает влияние на глаз, которое проявляется небольшим сужением зрачка и снижением внутриглазного давления.","Резерпин - практическое значение имеет гипотензивный эффект, обусловленный его периферическим (симпатолическим) действием. Артериальное давление при введении резерпина снижается постепенно (максимальный эффект наблюдается через несколько дней).","Показания к применению: артериальная гипертензия, первичная открытоугольная глаукома Побочные эффекты:","1) ССС: брадикардия, ортостатическая гипотензия, ортостатический коллапс,","2) Пищеварительная система: тошнота, рвота, диарея, боли в животе","3) ЦНС: сонливость, утомляемость, депрессивные состояния, слабость","4) Кожа и слизистые: отечность и сухость слизистых оболочек, герпес, кожный зуд","5) Кровь: анемия, тромбоцитопения, лейкопения","6) Миалгия, мышечный тремор, парестезии, выпадение волос","7) Обострение бронхиальной астмы и пептической язвы.","Противопоказания: Феохромоцитома, артериальная гипотензия, выраженные нарушения функции почек, сердечная недостаточность (не связанная с гипертензией), брадикардия, острая глаукома, закрытоугольная глаукома, узкий угол передней камеры глаза, депрессия, язвенная болезнь желудка и двенадцатиперстной кишки в фазе обострения, язвенный колит, бронхиальная астма, атеросклероз церебральных сосудов, нефросклероз.","Стимуляторы центральных α2-адренорецепторов, агонисты имидазолиновых рецепторов:","Фармакологические эффекты: значительное снижение активности симпатической нервной системы (снижение АД, уменьшение ЧСС и снижение концентрации катехоламинов в крови); уменьшение ОПСС и сердечного выброса; поддержание почечного кровотока, несмотря на снижение системного АД;","Применение: для лечения артериальной гипертензии, купирования гипертонических кризов.","Клонидин можно применять при мигрени (особенно провоцируемой употреблением шоколада, сыра, цитрусовых), в психиатрической практике для лечения абстиненции при отмене опиатов, этанола (алкоголя), никотина, а также при шизофрении. Иногда клонидин может быть использован для обезболивания в послеоперационном периоде и у онкологических больных. В виде глазных капель клонидин применяют для снижения внутриглазного давления при первичной открытоугольной глаукоме.","Побочные эффекты. при длительном применении - регрессирование гипертрофии левого желудочка у больных с артериальной гипертензией; задержка жидкости в организме; отсутствие влияния на метаболизм глюкозы и липидов; вызывают сухость во рту, седативный эффект (сонливость), депрессию, заложенность носа, ортостатическую гипотензию, задержку жидкости и нарушение половой функции."]},"1-11":{"t":"11.НАРКОЗНЫЕ СРЕДСТВА.","p":["Препараты для ингаляционного наркоза.","а) жидкие ЛС для ингаляционного наркоза: галотан (фторотан), энфлуран, изофлуран, диэтиловый эфир (негаллоидированное наркозное средство)","б) газовые наркозные средства: закись азота.","Роль отечественных ученых (Н.И. Пирогов, Н.П.Кравков) в изучении и применении наркозных средств.","В 1847 г. его впервые применили в Москве. Большое значение имеют исследования и разработки Н.И. Пирогова, который изучил методы наркоза, создал наркозный аппарат для эфирного наркоза. Он первый в России применил наркоз при родах, разработал методы прямокишечного, внутрисосудистого, внутритрахеального эфира.","В лаборатории Н.П. Кравкова изучали действие наркоза и снотворных средств различных химических групп. Под руководством ученого изучено комбинированное действие ЛВ и возможность изменения чувствительности к ним, позже положенные в основу метода комбинированного наркоза. Разработанные Н.П. Кравковым внутривенный и базисный наркоз нашли широкое применение в медицинской практике во всех странах мира. Именно в трудах этого выдающегося ученого положено начало современным методам базис-наркоза, парентерального и внутривенного наркоза. Во всём мире внутривенный гедоналовый наркоз известен как «русский метод» обезболивания.","Клиническая характеристика стадий эфирного наркоза.","1. Стадия анальгезии– с момента введения анестетика до потери сознания.","2. Стадия возбуждения– с момента потери сознания до начала движения глазных яблок.","3. Стадия хирургического наркоза – 4 уровня в зависимости от глубины наркоза.","I. Поверхностный хирургический наркоз(уровень движения глазных яблок).","II. Легкий хирургический наркоз(уровень исчезновения глоточного рефлекса).","III. Глубокий хирургический наркоз(уровень исчезновения роговичного рефлекса).","IV. Сверхглубокий хирургический наркоз(уровень угнетения зрачкового рефлекса).","4. Стадия пробуждения(при прекращении введения анестетика) илиагональная стадия (при продолжении введения анестетика).","Сравнительная характеристика с эфиром фторированных углеводородов и азота закиси.","Эфирный наркоз довольно легкоуправляем, но не настолько хорошо, как наркоз, вызываемый газообразными средствами для наркоза или фторотаном и аналогами.","Препарат Активно Скорост Миоре Влияние Органотропность Влияние Раздражаю Опаснос сть ь лакна на сердеч- щее ть в индукци сация действие нодействие на пожарно ии ансосудисту слизистую м выхода тидеполяр ю систему оболочку отношен из и-зующих и дыхание дыхательны ии наркоза2 миорех путей лаксаитов Фторотан Высокая Средняя Хорош Усиливает Угнетение миокарда; сенГипотензи (0,75) (2,4) ая сибилизация адренорецеп- я; браторов миокарда к действию дикардия; катехоламинов; возможно угнетение нарушение функции печени дыхания Азота Низкая Очень Не Не влияет « « Не закись (100,0) высокая вызыва горит, но (0,47) ет горение поддержива ет Эфир Средняя Низкая Хорош Усиливает Преходящее угнетение Небольша + + + + для (1,9) (12,0) ая функции почек я гипонаркоза тензия; угнетение дыхания"]},"1-12":{"t":"12.НАРКОЗНЫЕ СРЕДСТВА НЕИНГАЛЯЦИОННОГО ТИПА.","p":["Классификация по длительности действия.","1) кратковременного действия (продолжительность наркоза при внутривенном введении до 15 мин) - пропанидид, пропофол, кетамин;","2) средней продолжительности действия (продолжительность наркоза 20- 30 мин) - тиопенталнатрий, гексенал;","3) длительного действия (продолжительность наркоза 60 мин и более) - натрия оксибутират.","Достоинства наркоза: быстрое наступление наркоза без стадии возбуждения, продолжительный наркоз (20-30 мин), выраженное миорелаксирующее действие, быстро разрушается в печени и выводится из организма Недостатки наркоза: слабая анальгезия с сохранением вегетативных рефлексов на хирургические манипуляции, не вызывает миорелаксации, способен несколько повышать тонус мышц, вызывать их судороги, судорожные подергивания мышц, ларингоспазм, обильная секреция бронхиальных желез, угнетающее действие на дыхательный, сосудодвигательный центры, миокард (при быстром нарастании концентрации) вплоть до апноэ и коллапса, местное раздражающее действие (асептический флебит при быстром внутривенном введении), в высоких дозах тиопентал вызывает гипотензию, снижает сократительную активность миокарда, длительный посленаркозный сон (около 8-10 часов) в результате повторного выхода тиопентала в кровоток из жирового и мышечного депо, появление чесночного привкуса во рту Показания к применению.","Для вводного и кратковременного наркоза; при небольших хирургических вмешательствах, болезненных перевязках, диагностических исследованиях. Для нейролептанальгезии (метод обезболивания, основанный на сочетанном применении нейролептических средств и наркотических анальгетиков). Для премедикации (подготовки к наркозу или местной анестезии). Для обезболивания родов, при гипоксическом отеке мозга, в качестве противошокового средства, с целью получения успокаивающего и снотворного эффектов.","Меры помощи при передозировке. бемегрид – антидот производных барбитуровой кислоты.","После введения этого препарата сознание восстанавливается, и уменьшаются явления интоксикации подача кислорода, ИВЛ, кордиамин (внутривенно, внутримышечно 3-5 мл с интервалом 5-10 минут медленно 2-3 раза), норадреналин, кофеин (внутривенно из расчета 250 мг/кг), при этом повышается активность дыхательного центра.","Современные теории механизма действия наркозных средств.","Влияние анестетиков происходит прежде всего на уровне образования и распространения потенциала действия в самих нейронах и особенно в межнейронных контактах. Первая мысль о том, что анестетики действуют на уровне синапсов, принадлежит Ч. Шеррингтону (1906).","Одни учёные считают, что, фиксируясь на мембране клетки, анестетики препятствуют процессу деполяризации, другие - что анестетики закрывают натриевые и калиевые каналы в клетках. При изучении синаптической передачи отмечается возможность действия анестетиков на различные её звенья (торможение потенциала действия на пресинаптической мембране, угнетение образования медиатора, снижение чувствительности к нему рецепторов постсинаптической мембраны).","При всей ценности сведений о тонких механизмах взаимодействия анестетиков с клеточными структурами наркоз представляется как своеобразное функциональное состояние ЦНС. В соответствии с теорией парабиоза (Н.Е. Введенский), анестетики действуют на нервную систему как сильные раздражители, вызывая впоследствии снижение физиологической лабильности отдельных нейронов и нервной системы в целом. В последнее время некоторые специалисты поддерживают ретикулярную теорию наркоза, согласно которой тормозящее действие анестетиков в большей степени сказывается на ретикулярной формации мозга, что приводит к снижению её восходящего активирующего действия на вышележащие отделы."]},"1-13":{"t":"13.СНОТВОРНЫЕ СРЕДСТВА.","p":["Классификация препаратов по химической структуре","1. ПРОИЗВОДНЫЕ БЕНЗОДИАЗЕПИНА: нитразепам, флунитразепам, мидазолам, альпразолам, триазолам","2. ПРОИЗВОДНЫЕ БАРБИТУРОВОЙ КИСЛОТЫ: фенобарбитал, этаминал-натрий","3. ПРЕПАРАТЫ РАЗНЫХ ГРУПП: натрия оксибутират, бромизовал, метаквалон, геминейрин, доксиламин, золпидем, зопиклон, ноксирон, хлоралгидрат Механизмы снотворного эффекта, влияние на структуру сна: под влиянием снотворных средств изменяется взаимодействие этих двух систем в пользу гипногенной. Например, барбитураты, оказывают угнетающее влияние на активирующую ретикулярную формацию ствола мозга, что должно благоприятствовать развитию сна.","Анксиолитики бензодиазепинового ряда, способствующие развитию сна, в отличие от барбитуратов действуют преимущественно на лимбическую систему и ее связи с другими отделами головного мозга, обеспечивающими циклическую смену бодрствования и сна.","Фармакологические эффекты и сравнительная характеристика препаратов разных групп.","Производных бензодиазепина- Седативный эффект, Противотревожное (анксиолитическое) действие, Снотворный эффект, Наркозное действие, Противосудорожное действие, Центральный миорелаксирующий эффект. На СС и дыхательную систему в терапевтических дозах не влияют Производных барбитуровой кислотыСедативный эффект, Противотревожное (анксиолитическое) действие, Снотворный эффект, Наркозное действие, Противосудорожное действие, Индукция микросомальных ферментов печени, Угнетение дыхания, Развитие толерантности, Возникновение лекарственной (психической и физической) лекарственной зависимости Показания к применению.","Фенобарбитал (Phenobarbitalum) оказывает успокаивающее, снотворное и выраженное противосудорожное действие.","Применение: нарушение сна, эпилепсия, хорея, повышенная возбудимость нервной системы.","Нитрозепам Применение: нарушения сна различной этиологии, неврозы, психопатии с преобладанием тревоги и беспокойства.","Выбор снотворных при различных бессонницах:","Ранняя бессонница: Имован, Ивадал, Димедрол, Золпидем Средняя бессонница: Нитразепам, Золпидем, Золпикрон Поздняя бессонница: Бензодиазепины, Золпидем, Нитразепам во время пробуждения, если он не пошел, то Фенобарбитал.","Симптомы отравления барбитуратами, бензодиазепинами и меры помощи.","ОСТРОЕ ОТРАВЛЕНИЕ БЕНЗОДИАЗЕПИНАМИ","Симптомы: Галлюцинации, Нарушения артикуляции, Нистагм, Атаксия. Гипотония мышц, Сон, Кома, Коллапс (угнетение дыхания и сердечной деятельности).","Меры помощи: Специфический антидот – ФЛУМАЗЕНИЛ (в/в медленно) ОСТРОЕ ОТРАВЛЕНИЕ БАРБИТУРАТАМИ СИМПТОМЫ: сон, кома, гипотермия, сужение зрачков, угнетение всех (в т.ч. сухожильных) рефлексов, угнетение дыхания, бронхорея, гипоксия, ацидоз угнетение сердечной деятельности, коллапс, анурия, бронхопневмонии, отек мозга, почечная недостаточность, некротизирующий дерматомиозит ПОМОЩЬ ПРИ ОТРАВЛЕНИИ БАРБИТУРАТАМИ: Промывание желудка (NaHCO3 и активированный уголь), Форсированный диурез, Гемодиализ, Перитонеальный диализ, Гемосорбция, Препараты калия и гидрокарбонат натрия в/в, Кардиотонические средства, ИВЛ"]},"1-14":{"t":"14.НАРКОТИЧЕСКИЕ АНАЛЬГЕТИКИ (ПРЕПАРАТЫ).","p":["Механизмы анальгезирующего эффекта.","а) активация антиноцицептивной системы и повышение ее тормозных влияний на ноцицептивную систему","б) повышение активности аденилатциклазы → образование цАМФ → активация цАМФзависимых протеинкиназ →","1. в пресинаптических окончаниях: инактивация кальциевых каналов → нарушение поступления кальция в пресинаптические окончания → нарушение выделения нейромедиатора → затруднение передачи импульсов в ноцицептивной системе","2. на постсинаптической мембране: инактивация кальциевых каналов и открытие калиевых каналов с выходом калия из нейронов → гиперполяризация мембраны, снижение возбудимости нейрона → затруднение восприятия болевого сигнала в ноцицептивной системе","в) активация опиатных рецепторов лимбических структур мозга → изменение эмоционального восприятия боли (боль воспринимается малозначительной) Фармакологические эффекты морфина и других препаратов группы в сравнении с ним. 1) Анальгезия. 2) Эйфория. 3) Седативное действие. 4) Миоз. 5) Брадикардия 6) Угнетение дыхания. 7) Противокашлевое действие. 8) Тошнота, рвота.","9) Снижение моторики желудочно-кишечного тракта. 10) Влияние на мочевыводящие пути.","Морфин повышает тонус мочеточников (может провоцировать приступ почечной колики) и сфинктеров мочевого пузыря и уретры (может вызывать задержку мочеиспускания). 11) Гистаминогенное действие.","12) Влияние на продукцию гормонов.","Кодеин —в терапевтических дозах по анальгетическому действию примерно в 10 раз менее эффективен, чем морфин (увеличение дозы невозможно в связи с рвотным действием, констипацией, угнетением жизненно важных центров). Значительно чаще кодеин используют как противокашлевое средство. Кодеин может быть эффективен при острой неинфекционной диарее.","Фентанил в 100 раз активнее морфина. Вместе с тем фентанил эффективнее морфина.","Фентанил сильнее, чем морфин, угнетает центр дыхания.","Показания к применению морфина и других препаратов группы: острая боль при травмах, ожогах, операциях, хронические сильные боли, не связанные с неопластическими заболеваниями (т.е. с опухолями), боли при злокачественных новообразованиях, острый период инфаркта миокарда, одышка (диспноэ) и острый отек легких, обезболивание родов, премедикация в преданестетическом периоде, обезболивание в послеоперационном периоде, почечная и печеночная колика Противопоказания. состояния, сопровождающиеся угнетением дыхательного центра, бронхиальная астма, травма головы и головного мозга, сопровождающихся повышением внутричерепного давления, беременность, роды (т.к. снижается тонус матки и удлиняются роды, может быть угнетение дыхание у новорожденного), дети до двух лет (из-за высокой чувствительности дыхательного центра к опиоидам),с осторожностью людям старческого возраста (из-за замедленного метаболизма морфина) Симптомы острого отравления морфином,","1. Первые признаки отравления – через 20-30 мин после приема внутрь токсических доз опиоидов: головокружение, слабость, рвота, сонливость, эйфория, переходящая в ступор, резкое симметричное сужение зрачков, олигурия, гипотермия","2. Быстро наступает полная анальгезия, сон, затем – полная потеря сознания (кома)","3. Дыхание редкое (иногда 2-4 вдоха в минуту), аритмичное, часто дыхание Чейна-Стокса, сопровождается цианозом, иногда присоединяется отек легких вследствие гипоксии, коллапс.","4. Резкое падение АД, у детей возможны судороги Меры помощи.","1. Меры восстановления и поддержания дыхания: перевод больного на искусственное дыхание (ИВЛ) Проведение антидотной детоксикации – введение налоксона внутривенно. Повторные промывания желудка с использованием зонда и взвеси активированного угля, слабого раствора KMnO4(т.к. опиоды подвергаются гастроэнтеропеченочной циркуляции)","2. Симптоматическое лечение: восстановление сердечно-сосудистой деятельности и т.д.","Морфинизм (симптоматика, терапия, профилактика).","Резкое прекращение введения препарата, вызвавшего лекарственную зависимость, приводит к явлениям лишения (абстиненции). Появляются страх, тревога, тоска, бессонница. Возможны двигательное беспокойство, агрессивность и другие симптомы. Нарушаются многие физиологические функции. Иногда возникает коллапс. В тяжелых случаях абстиненция может быть причиной смертельного исхода. Введение опиоидного анальгетика снимает явления лишения.","Средства помощи при морфинной абстиненции.","1. β-адреноблокаторы (надолол, соталол)","2. нейолептики (дроперидол)","3. М-холинолитики (атропина сульфат, дицикловерин, гиосцин бутилбромид)","4. препараты, способствующие детоксикации организма (гемодез, витамины группы В, натрия сульфат) Однако радикальное излечение наблюдается в относительно небольшом проценте случаев. У большинства пациентов возникают рецидивы. В связи с этим очень важны профилактические мероприятия: строгий контроль за хранением, назначением и выдачей опиоидных анальгетиков."]},"1-15":{"t":"15. Частичные агонисты, агонисты-антагонисты и полные","p":["антагонисты опиодных рецепторов. Сравнительная характеристика с морфина гидрохлоридом, показания к применению. Центральные анальгетики без наркотического компонента и средства смешанного механизма действия.","Классификация наркотических анальгетиков и их антагонистов","I. Агонисты (морфина гидрохлорид, кодеина фосфат, промедол, фентанил).","II. Агонисты-антагонисты (пентазоцин, налорфина гидрохлорид).","III. Антагонисты (налоксон, налтрексон).","Пентазоцин – агонист к-рецепторов. Уступает морфину по анальгетической активности и длительности действия. Пентазоцин привлек внимание в связи с тем, что при его применении относительно невелик риск возникновения лекарственной зависимости (не вызывает эйфорию). Он несколько меньше, чем морфин, угнетает дыхание, при его применении реже развивается запор. Пентазоцин вызывает повышение давления в легочной артерии; возрастает центральное венозное давление, что приводит к увеличению преднагрузки на сердце.","Повышает работу сердца. Из ЖКТ всасывается хорошо. Пентазоцин является также антагонистом опиоидных анальгетиков (агонистов), однако это его действие выражено слабо (уступает налорфину в десятки раз). Проявляется антагонизм в том, что при введении пентазоцина лицам с лекарственной зависимостью к опиоидным анальгетикам у них развивается абстинентный синдром.","К агонистам-антагонистам относятся также буторфанол и налбуфин.","Буторфанол по фармакологическим свойствам сходен с пентазоцином. Является агонистом крецепторов и слабым антагонистом м-рецепторов. Активнее морфина в 3 раза. Аналогично пентазоцину повышает давление в ле¬гочной артерии и увеличивает работу сердца, в связи с чем его не рекомендуется применять при инфаркте миокарда. Дыхание угнетает в меньшей степени, чем морфин. Лекарственную зависимость вызывает реже морфина. Вводят в/в или в/м.","Налбуфин является агонистом к-рецепторов и слабым антагонистом м-рецепторов. По активности примерно соответствует морфину. Фармакокинетика сходна с таковой морфина.","На гемодинамику практически не влияет. Лекарственную зависимость вызывает редко (примерно с такой же частотой, как пентазоцин). Вводят парентерально через 3-6 ч.","Бупренорфин является частичным агонистом м-рецепторов. По анальгетической активности превосходит морфин в 40 раз и действует более продолжительно. Эффект развивается медленнее, чем у морфина. Меньше, чем морфин, влияет на ЖКТ. Не повышает давление в желчном пузыре и протоке поджелудочной железы. Из ЖКТ всасывается относительно хорошо. Около 96% связывается с белками плазмы крови. Основная часть неизмененного препарата выделяется кишечником, метаболиты - почками. Вводят парентерально и сублингвально.","Налтрексон - универсальный антагонист опиоидных анальгетиков. Он в 2 раза активнее налоксона и действует значительно более продолжительно (24-48 ч). Из побочных эффектов может вызывать бессонницу, тошноту, спастические боли в области живота, суставные боли.","Предназначен только для энтерального применения. Используется в основном в комплексе лечения опиоидных наркоманий.","1. Ненаркотические анальгетики центрального действия – это неопиоидные препараты, которые в основном применяют в качестве болеутоляющих веществ.","- парацетамол (ингибитор ЦОГ преим. центрального действия)","- азота закись (средство для наркоза)","- карбамазепин (блокатор Na+-каналов)","- амитриптилин (ингибитор нейронального захвата серотонина и НА)","-клофелин","-кетамин","2. Разнообразные лекарственные средства, у которых наряду с основным эффектом (психотропным, гипотензивным, противоаллергическим) имеется и достаточно выраженная анальгетическая активность."]},"1-16":{"t":"16.НЕНАРКОТИЧЕСКИЕ АНАЛЬГЕТИКИ.","p":["Классификация по химической структуре.","Производные салициловой кислоты (салицилаты) :ацетилсалициловая кислота, метилсалицилат, салицилат натрия, салициламид Производные индолуксусной кислоты: индометацин, сулиндак, этодолак Производные гетероарилуксусной кислоты: толметин Производные фенилуксусной кислоты: ацеклофенак, диклофенак Производные пропионовой кислоты: ибупрофен, индобуфен, кетопрофен, напроксен Производные антраниловой кислоты (фенаматы): мефенамовая кислота, меклофенамовая кислота, морнифлумат, нифлумовая кислота Производные пиразолона: азапропазон, клофезон, метамизол, феназон, фенилбутазон","Оксикамы: лорноксикам, пироксикам, теноксикам Производные хиназолона: проквазон Производные анилина: парацетамол Производные пирролизинкарбоксиловой кислоты: кеторолак Производные других химических соединений: набуметон, нимесулид Фармакологические эффекты препаратов 1. Противовоспалительный эффект. 2.","Анальгезирующий эффект. 3. Жаропонижающий эффект. 4. Антиагрегационный эффект.","Механизм действия.","Ингибирование циклооксигеназы ЦОГ-2 → угнетение синтеза медиаторов лихорадки (главным образом, PGE1) → уменьшение пирогенного влияния медиаторов лихорадки на центр терморегуляции гипоталамуса → жаропонижающее действие Показания к применению препаратов: головная и зубная боль, послеоперационные боли, ревматические заболевания, артралгии, миалгии, неревматические заболевания опорнодвигательного аппарата, травмы, неврологические заболевания (невралгия, радикулит), дисменорея (альгоменорея) NB! Ненаркотические анальгетики не эффективны при висцеральных болях (инфаркт миокарда, почечная колика) и не устраняет эмоциональный компонент боли (страх, беспокойство, возбуждение) в отличие от наркотических анальгетиков.","Побочные эффекты. диспепсические расстройства (боли в животе, тошнота, рвота); эрозии и язвы желудка и двенадцатиперстной кишки, кровотечения и перфорации (в результате системного ингибирования ЦОГ-1); отрицательное влияние на функции почек (прямое действие, сужение сосудов и снижение почечного кровотока → ишемия почек, нарушение функции почек, гипернатриемия, гиперкалиемия, повышение АД, интерстициальный нефрит); гематотоксичность (апластическая анемия, агранулоцитоз); гепатотоксичность (изменение активности трансаминаз, желтуха, иногда лекарственный гепатит); реакция гиперчувствительности (отек Квинке, анафилактический шок, бронхоспазм); нейротоксичность (головная боль, головокружение, нарушение рефлекторных реакций); синдром Рея: энцефалопатия, отек мозга, поражение печени (у детей с вирусными инфекциями при назначении им аспирина)"]},"1-18":{"t":"18.НЕЙРОЛЕПТИКИ.","p":["Классификация по химической структуре.","А. «Типичные» антипсихотические средства Производные фенотиазина - Аминазин Трифтазин Фторфеназин Производные тиоксантена - Хлорпротиксен Производные бутирофенона - Галоперидол Б. «Атипичные» антипсихотические средства Бензамиды - Сульпирид Производные бензодиазепина- Клозапин Фармакологические эффекты антипсихотический эффект – за счет блокады D2-рецепторов ЦНС седативный (успокаивающий) эффект – за счет блокады адренорецепторов ретикулярной формации ствола головного мозга противорвотный эффект – за счет блокады D2-рецепторов рвотного центра Механизмы действия аминазина.","Механизм антипсихотического действия аминазина связан с блокированием постсинаптических мезолимбических дофаминергических рецепторов в головном мозге.","Аминазин обладает гипотермическим действием при слабом влиянии на холинорецепторы. Он уменьшает или устраняет повышение артериального давления и другие эффекты, вызываемые адреналином и другими адреномиметиками.","Обладает сильным каталептогенным действием. Аминазин угнетает интерорецептивные рефлексы, уменьшает проницаемость капилляров, оказывает слабое антигистаминное действие. Под влиянием аминазина снижается артериальное давление, часто развивается тахикардия. Аминазин обладает местнораздражающим действием.","Показания к применению препаратов группы В психиатрической практике применяется при разных видах психомоторного возбуждения и психотических состояний у пациентов, страдающих шизофренией, маниакальным возбуждением при маниакально-депрессивном психозе и при других психических заболеваниях различного генеза, сопровождающихся страхом, тревогой, возбуждением, бессонницей, расстройствами настроения при психопатиях, при психотических расстройствах у пациентов с эпилепсией и органическими заболеваниями центральной нервной системы, для облегчения состояний абстиненции при алкоголизме и токсикоманиях.","В терапевтической и неврологической практике применяется как средство с выраженными седативными свойствами, как противорвотное и успокаивающее икоту средство; для усиления действия анальгетиков при упорных болях; при заболеваниях, сопровождающихся повышением мышечного тонуса (после нарушений мозгового кровообращения и других).","Побочные эффекты Развитие разнообразных экстрапирамидных нарушений: острая дистония – спастические сокращения скелетных мышц лица, опистотонус, дисфагия, ларингоспазм и т.д. паркинсонический синдром – брадикинезия, ригидность скелетных мышц, тремор, монотонная речь акатизия – неконтролируемое двигательное беспокойство, неусидчивость злокачественный нейролептический синдром – гипертемия, диффузная мышечная ригидность, вегетативные нарушения (тахикардия, гипертензия, тахипноэ и т.п.) поздняя дискинезия – хореоподобные стереотипные сокращения мышц лица периоральный тремор – гиперкинез круговой мышцы рта Противопоказания. противопоказан при поражениях печени (цирроз, гепатит, гемолитическая желтуха и др.), почек (нефрит), нарушении функции кроветворных органов, микседеме, прогрессирующих системных заболеваниях головного и спинного мозга, декомпенсированных пороках сердца, тромбоэмболической болезни, а также больным в поздних стадиях бронхоэктатической болезни. Относительными противопоказаниями являются желчнокаменная, мочекаменная болезни, острый пиелит, ревматизм, ревмокардит.","При язвенной болезни желудка и двенадцатиперстной кишки не следует назначать аминазин внутрь (вводят внутримышечно). Не назначают аминазин (а также другие фенотиазиновые препараты) лицам, находящимся в коматозном состоянии, в том числе в случаях, связанных с приемом барбитуратов, алкоголя, наркотиков. Следует контролировать картину крови, включая определение индекса протромбина, исследовать функции печени и почек. Нельзя применять аминазин для купирования возбуждения при острых травмах мозга. Не следует назначать аминазин беременным."]},"1-19":{"t":"19.НЕЙРОЛЕПТИКИ.","p":["Фармакологические эффекты и механизмы действия препаратов группы в сравнении с аминазином.","Трифтазин (трифлуоперазина гидрохлорид, стелазин) характеризуется более избирательным, чем аминазин, антипсихотическим влиянием и менее выраженным седативным эффектом. По противорвотной активности он превосходит аминазин. Отличается от последнего более слабым гипотензивным, адреноблокирующим и миорелаксирующим действием. Чаще возникают экстрапирамидные расстройства.","Фторфеназин (флуфеназина гидрохлорид, модитен) по эффективности в качестве антипсихотического средства аналогичен трифтазину. Как противорвотное средство несколько превосходит его. Используется пролонгированный препарат фторфеназина деканоат (модитендепо, флуфеназина деканоат), действие которого продолжается 7-14 дней и более.","АТИПИЧНЫЕ НЕЙРОЛЕПТИКИ.","Показания к применению препаратов группы при психозах (особенно с выраженным возбуждением, аффективными реакциями, агрессивностью, наличием бреда, галлюцинаций). Кроме того, они могут быть полезны в комплексе лечения лекарственной зависимости, вызванной опиоидными анальгетиками и этиловым спиртом. Производные фенотиазина и бутирофенона применяют также как противорвотные средства и при стойкой икоте. Практическое значение имеет способность антипсихотических средств потенцировать действие средств для наркоза, снотворных наркотического типа и опиоидных анальгетиков.","Побочные эффекты, нейролептиков разнообразны и порой очень опасны. К ним относятся неврологические, эндокринные и гематологические нарушения, гепатотоксичность, повышение веса и пигментная ретинопатия (в связи с опасностью последней максимальная доза тиоридазина, по рекомендации производителя, составляет 800 мг/сут).","Противопоказания.","Противопоказанием к применению препаратов являются хронические заболевания паренхиматозных органов с нарушением их функции, аллергиче­ские реакции, выраженная сердечно-сосудистая недостаточ­ность."]},"1-2":{"t":"2.АНТИХОЛИНЭСТЕРАЗНЫЕ СРЕДСТВА.","p":["Классификация препаратов по механизму действия.","I. Препараты обратимого действия - Физостигмина салицилат Прозерин Галантамина гидробромид","II. Препараты необратимого действия Армин Фармакологические эффекты:","1) ЦНС: низкие дозы – диффузная активация ЭЭГ, психостимуляция, высокие дозы – генерализированные судороги, кома, остановка дыхания.","2) Глаз, ЖКТ, МПС, дыхание: эффекты парасимпатической стимуляции (миоз, лакримация, саливация, кишечные спазмы, рвота, диарея, частое мочеиспускание, бронхоспазм, гиперсекреция)","3) ССС: средние дозы – умеренная брадикардия и уменьшение сердечного выброса, высокие дозы – брадикардия, снижение АД","4) Кожа – усиление потоотделение","5) Скелетные мышцы – фасцикуляция, слабость, деполяризационный блок, паралич.","Показания к применению: миастенический синдром, послеоперационная атония кишечника, атонические запоры, нарушения опорожнения мочевого пузыря после гинекологических операций и родов, устранение эффекта недеполяризующих курареподобных средств, периферический паралич поперечно-полосатой мускулатуры, полиомиелит, энцефалит, слабость родовой деятельности, атрофия зрительного нерва, для сужения зрачка и понижения внутриглазного давления при открытоугольной глаукоме.","Противопоказания к применению: механическая обструкция кишечника или мочевыводящих путей, бронхиальная астма, повышенная чувствительность к антихолинэстеразным средствам, эпилепсия, стенокардия, атеросклероз Симптомы отравления препаратами группы ФОС возбуждения М-холинорецепторов (миоз, саливация, потливость, рвота, диарея). Наибольшая угроза - бронхоспазм с отеком легких.","Меры помощи.","Прежде всего следует удалить ФОС с мест введения. Если это кожный покров или слизистые оболочки, их необходимо тщательно промыть 3-5% раствором натрия гидрокарбоната. При попадании веществ в пищеварительный тракт промывают желудок, дают адсорбирующие и слабительные средства, назначают высокие сифонные клизмы. Эти мероприятия проводят многократно, до исчезновения выраженных проявлений интоксикации. Если ФОС поступили в кровь, следует ускорить их выведение с мочой (с помощью форсированного диуреза).","Эффективными способами очищения крови от ФОС являются гемосорбция, гемодиализ и перитонеальный диализ. Важный компонент лечения острых отравлений ФОС - применение мхолиноблокаторов (атропин и атропиноподобные средства Кроме того, следует проводить симптоматическую терапию. Необходимо постоянно следить за дыханием больного.","Учитывая, что ФОС вызывают гиперсекрецию желез, следует проводить туалет полости рта и удалять секрет из трахеи и бронхов. При необходимости применяют вспомогательное или искусственное дыхание. При психомоторном возбуждении вводят аминазин, диазепам, натрия оксибутират и другие препараты угнетающего типа действия."]},"1-20":{"t":"20.ТРАНКВИЛИЗАТОРЫ.","p":["Классификация по химической структуре.","1. Агонисты бензодиазепиновых рецепторов (диазепам, феназепам и др.).","2. Агонисты серотониновых рецепторов (буспирон).","3. Вещества разного типа действия (амизил и др.).","Фармакологические эффекты Для бензодиазепиновых препаратов характерны следующие эффекты: • анксиолитический, • седативный,","• снотворный,","• мышечно-расслабляющий,","• противосудорожный,","• амнестический.","Механизмы действия.","Механизм действия бензодиазепинов связан с тем, что они являются агонистами бензодиазепиновых рецепторов, которые тесно связаны с ГАМКА-рецепторами. При стимуляции бензодиазепиновых рецепторов наблюдается аллостерическая активация ГАМКАрецепторов. Поэтому взаимодействие бензодиазепинов с одноименными рецепторами проявляется в виде ГАМК-миметического эффекта. При этом повышается частота открывания каналов для ионов Cl-, что увеличивает входящий ток Cl-. Возникают гиперполяризация мембраны и угнетение нейрональной активности.","Показания к применению Побочные эффекты. сонливость, замедленные двигательные реакции, нарушение памяти, слабость, диплопия, головная боль, тошнота, нарушение менструального цикла, снижение половой потенции, кожные высыпания. При длительном приеме бензодиазепинов (порядка 6 мес) развивается привыкание, возможно возникновение лекарственной зависимости (психической и физической). Синдром отмены протекает менее тягостно, чем в случае развития физической зависимости к барбитуратам.","СЕДАТИВНЫЕ СРЕДСТВА.","Работы школы И.П.Павлова по изучению бромидов.","Основоположником психофармакологии следует считать И . П . Павлова , который разработал теоретические основы фармакологии высшей нервной деятельности (см.), показав, что при помощи бромидов , кофеина и других средств можно вмешиваться в основные функции ЦНС, регулируя соотношение между раздражительными и тормозными процессами.","Показания к применению Применяют бромиды при неврозах, повышенной раздражительности, бессоннице. Широко используют в качестве успокаивающих средств препараты валерианы и пустырника.","Побочные эффекты. В связи с медленным выведением из организма бромиды кумулируют и могут быть причиной хронического отравления - бромизма. Проявляется это общей заторможенностью, апатией, нарушением памяти; типичны кожные поражения (acne bromica).","Раздражающее действие бромидов приводит к воспалению слизистых оболочек, что сопровождается кашлем, насморком, конъюнктивитом, диареей."]},"1-21":{"t":"21.СРЕДСТВА ЛЕЧЕНИЯ НЕДОСТАТОЧНОСТИ КРОВООБРАЩЕНИЯ. СЕРДЕЧНЫЕ ГЛИКОЗИДЫ.","p":["Классификация по источникам получения","• наперстянки пурпуровой (Digitalis purpurea; рис. 14.1) - дигитоксин;","• наперстянки шерстистой (Digitalis lanata) - дигоксин, целанид (ланатозид С, изоланид);","• строфанта Комбё (Strophanthus Kombé) - строфантин К1;","• ландыша (Convallaria) - коргликон;","• горицвета (Adonis vernalis) - настой травы горицвета.","Классификация по степени полярности.","1. Полярные или гидрофильные (содержат в молекуле агликона четыре-пять гидроксильных групп): - строфантин К - ландыша листьев гликозид (коргликон)","2. Относительно полярные или гидрофильно-липофильные (содержат в молекуле агликона дветри гидроксильные группы): - дигоксин - ланатозид Ц (целанид) Влияние сердечных гликозидов на функции миокарда и гемодинамику.","1) положительный инотропный эффект (усиление сокращений сердца)","2) укорочение систолы","3) удлинение диастолы","4) размеры сердца приближаются к норме (т.е. уменьшаются)","5) ударный объем (УО) и минутный обьем (МОК) увеличивается","6) отрицательный хронотропный эффект (уменьшение ЧСС).","7) отрицательный дромотропный эффект (замедление проведения импульсов по проводящей системе).","8) положительный батмотропный эффект (увеличение возбудимости миокарда).","9) повышение автоматизма сердца","10) противоаритмический эффект (увеличение рефрактерности АВ узла препятствует возникновению re-entryаритмий)","11) улучшают кровоснабжение сердца (увеличивая МОК без влияния на коронарные сосуды)","12) снижение преднагрузки на сердца (вследствие снижения ЦВД)","13) энергетический обмен миокарда нормализуется (повышение уровня гликогена и снижение уровня молочной кислоты, понижение потребления глюкозы, повышение мобилизации жирных кислот, обмен макроэргов дозозависимо сначала повышается, затем снижается)","14) понижает потребление кислорода, повышает содержание нуклеиновых кислот Показания","1) острая и хроническая сердечная недостаточность","2) мерцательная аритмия предсердий","3) пароксизмальная наджелудочковая тахикардия Противопоказания.","1) неполная предсердно-желудочковая блокада","2) выраженная брадикардия","3) резкие органические изменения сердца и сосудов (острый инфекционный миокардит, эндокардит, выраженный кардиосклероз).","4) тиреотоксикоз и предсердная экстрасистолия (относительное противопоказание: возможно развитие мерцания предсердий).","5) с осторожностью вводят при гипокалиемии и гиперкальциемии (чрезмерно усиленный ответ).","Особенности препаратов адониса.","По своему действию препараты горицвета относятся к группе гликозидов дигиталиса— строфанта и обладают выраженным кардиотоническим действием: замедляют ритм сердечный сокращений, удлиняют диастолу и усиливают систолу, умеренно снижают внутрисердечную проводимость (в этом случае препараты горицвета действуют слабее, чем наперстянка), увеличивают ударный объём сердца.","Препараты горицвета оказывают более выраженное по сравнению с другими гликозидами мочегонным действием, которое связывают с влиянием цимарина. Характерной особенностью препаратов горицвета весеннего является их успокаивающее действие на ЦНС.","Симптоматика интоксикации сердечными гликозидами.","а) возникновение аритмий (брадикардии, желудочковая экстрасистолия по типу би- и тригемении, наджелудочковая и желудочковая тахикардии, мерцание предсердий, фибрилляция желудочков)","б) изменения функции ЦНС: повышение тонуса блуждающего нерва поражение глазных нервов (ксантопсия – нарушение цветового зрения, фотофобия, нарушение полей зрения), радикулиты, психические расстройства (бессоница, апатия, утомляемость)","в) изменения функции ЖКТ (тошнота, рвота, анорексия, боли в животе) Меры помощи.","1. Отменить препарат сердечного гликозида и другие лекарственные средства, повышающие уровень сердечных гликозидов в крови и чувствительность к ним.","2. Назначить физические антагонисты: активированный уголь или другие сорбенты.","3. Коррекция гипокалигистии: калия хлорид и/или калия и магния аспарагинат (панангин или аспаркам).","4. Коррекция гиперкальциемии: антидоты - натрия цитрат, ЭДТА, трилон Б (образуют с ионами Са 2+ комплексное неактивное соединение).","5. Введение донаторов SH-групп: унитиол.","6. Назначение противоаритмических препаратов в зависимости от вида нарушения ритма (лидокаин или атропина сульфат).","7. Электроимпульсная терапия при нарушении сердечного ритма (если неэффективна медикаментозная терапия)."]},"1-22":{"t":"22.СРЕДСТВА ЛЕЧЕНИЯ НЕДОСТАТОЧНОСТИ КРОВООБРАЩЕНИЯ. ФАРМАКОЛОГИЧЕСКАЯ ХАРАКТЕРИСТИКА (МЕХАНИЗМЫ, ЭФФЕКТЫ, ПОКАЗАНИЯ И ПРОТИВОПОКАЗАНИЯ К ПРИМЕНЕНИЮ) ИНОТРОПНЫХ СТИМУЛЯТОРОВ НЕГЛИКОЗИДНОЙ ПРИРОДЫ.","p":["При длительном применении негликозидные кардиотоники повышают летальность. В связи с этим в настоящее время группа кардиотонических средств негликозидной структуры применяется в качестве средств скорой помощи (кратковременно) при острой (декомпенсированной) сердечной недостаточности.","1. Средства, повышающие содержание в кардиомиоцитах цАМФ и ионов Са2+:","А.Средства, стимулирующие β 1-адренорецепторы: Дофамин, Добутамин Б. Ингибиторы фосфодиэстеразы: Амринон, Милринон","2. Препараты, повышающие чувствительность миофибрилл к ионам кальция: Левосимендан 1.А. Кардиотоническое действие Дофамина связано со стимуляцией β1-адренорецепторов сердца. При этом активируется аденилатциклаза, что приводит к повышению содержания в кардиомиоцитах цАМФ и соответственно увеличивается концентрация ионов кальция. В итоге","- возрастает сила сердечных сокращений. Показания к применению: шок различной этиологии; острая сердечная и сосудистая недостаточность, синдром «низкого сердечного выброса», связанные с хирургическим вмешательством, особенно с кардиохирургическими операциями. Противопоказания к применению: феохромоцитома, при аритмии в сочетании с ингибиторами МАО (моноаминоксидазы), с Циклопропаном и галогенсодержащими средствами для наркоза. 1.Б. Амринон оказывает положительное инотропное, а также сосудорасширяющее действие; у больных застойной сердечной недостаточностью увеличивает сердечный выброс, снижает давление в легочной артерии и уменьшает периферическое сосудистое сопротивление.","Показания к применению: для кратковременной терапии острой застойной сердечной недостаточности. Побочные действия: гипотензия, тахикардия, наджелудочковая и желудочковая аритмии, нарушения функции почек, тромбоцитопения, а также головная боль, желудочно-кишечные расстройства, повышение температуры тела. Противопоказания: при обструктивной миопатии, поражении клапанов сердца, а также при гиповолемии, суправентрикулярной аритмии, аневризме аорты, острой артериальной гипотензии, острой недостаточности почек, тромбоцитопении.","2. Левосимендан повышает чувствительность сократительных белков к кальцию путем связывания с тропонином С миокарда в кальциево-зависимой фазе. Повышает силу сердечных сокращений, но не влияет на расслабление желудочков. Оказывает вазодилатирующее действие на артерии и вены. Левосимендан является селективным ингибитором фосфодиэстеразы III in vitro. Благодаря наличию положительного инотропного и вазодилатирующего действия при сердечной недостаточности повышает силу сердечных сокращений и уменьшает как преднагрузку, так и постнагрузку.","Показания: краткосрочное лечение острой декомпенсации тяжелой ХСН.","Побочное действие: значительное снижение артериального давления, экстрасистолия, фибрилляция предсердий, тахикардия, желудочковая тахикардия, трепетание предсердий, ишемия миокарда, головокружение, головная боль, тошнота, рвота, гемоглобина, гематокрита.","Противопоказания: гиперчувствительность, механическая обструкция, препятствующая заполнению и/или выбросу крови из желудочков, тяжелая почечная, печеночная недостаточность, выраженная артериальная гипотензия, выраженная тахикардия, желудочковая тахикардия типа \"пируэт\" в анамнезе, нескорректированная гипокалиемия или гиповолемия, период лактации, возраст до 18 лет."]},"1-23":{"t":"23.СРЕДСТВА ЛЕЧЕНИЯ НЕДОСТАТОЧНОСТИ КРОВООБРАЩЕНИЯ. ФАРМАКОЛОГИЧЕСКАЯ ХАРАКТЕРИСТИКА (МЕХАНИЗМЫ, ЭФФЕКТЫ, ПОКАЗАНИЯ И ПРОТИВОПОКАЗАНИЯ К ПРИМЕНЕНИЮ) СРЕДСТВ КОРРЕКЦИИ НЕЙРОГУМОРАЛЬНОЙ РЕГУЛЯЦИИ СЕРДЕЧНОСОСУДИСТОЙ СИСТЕМЫ.","p":["К средствам, подавляющим нарушения нейрогуморальной регуляции можно отнести бетаадреноблокаторы, в том числе с одновременной способностью к блокаде альфаадренорецепторов, ингибиторы ангиотензинпревращающего фермента.","Средства, действующие на ренин-ангиотензиновую систему Ингибиторы ангиотеизин-превращающего фермента - Каптоприл, Эналаприл, Рамиприл, Лизиноприл, Kвинaприл.","Механизм действия НАПФ связан с уменьшением образования ангиотензина II и снижением инактивации брадикинина, в результате чего расширяются артериолы, снижается общее периферическое сопротивление и постнагрузка. Расширение вен приводит к снижению преднагрузки, венозного возврата и объема желудочков. Увеличение содержания в тканях, в частности в почках, сосудорасширяющих кининов приводит к увеличению фильтрации, выведению избыточного количества натрия и воды, снижению объема циркулирующей крови и венозного возврата крови к сердцу. Снижение содержания альдостерона также приводит к увеличению выведения натрия и воды. Таким образом, при лечении НАПФ у больных с сердечной недостаточностью снижается давление в венах, нравом предсердии и легочной артерии, а также общее периферическое сопротивление. Вторично возрастает фракция выброса, ударный и минутный обьемы - улучшается функция почек и увеличивается диурез.","ИАПФ являются мощными нейрогуморальными модуляторами:","- они тормозят вредную для больных СН активацию ренин-ангиотензиновой системы. При этом по механизму обратной связи происходит торможение симпатоадреналовой системы.","- НАПФ стимулируют образование кининов, благодаря чему косвенным образом стимулируется поступление в кровь простагландинов 1-2 и Н-2, обладающих вазодилатирующим, натрийуретичес-ким, кардио- и цитопротекторным свойствами, а также выход эндотелиального расслабляющего фактора из клеток сосудистой стенки.","- НАПФ оказывают кардиопротективное действие, частично обусловленное наличием в их молекуле сульфгидрильной группы, они способны уменьшать объем левого желудочка и улучшать отдаленную выживаемость больных, перенесших острый инфаркт миокарда.","Противопоказания: ангионевротические отеки в анамнезе, беременность и лактация.","Бета-адреноблокаторы","1. Неселективные без собственной симпатомиметической активности – Пропранолол, Тимолол, Нидолол, Соталол, Хлораноол.","2. Неселективные с собственной симпатомиметической активностью – Окспренолол, Пиндолол, Пенбутолол, Бопиндолол.","3. Неселективиые с вазодилатирующими свойствами - Картеолол, Карведилол.","4. Кардиоселективные без собственной симпатомиметической активности – Атенолол, Meтопролon, Бетаксолол, Бисопролол, Эсмолол, Талинолол.","5. Кардиоселективные с собственной симнатомиметической активностью - Ацебутолол.","6. Кардиоселективные с вазодилатирующими свойствами – Целипролол, Бевандолол.","7. Новые различного механизма действия – Небивалол, Флестолол,.","8. Альфа-бета-адреноблокаторы - Лабеталол, Карведилол, Проксодолол.","Повышение активности ангиотензина II через стимуляцию ATI рецепторов синапсов приводит к усилению синтеза и смыва норадреналина из постсинаптических окончаний. В свою очередь, норадреналин через бета-адренорецепторы стимулирует выработку ренина. Формируется порочный нейрогуморальный круг, без разрыва которого (с помощью НАПФ и БAБ) невозможно устpaнениe дисфункции сердечной мышцы.","Целесообразно включать БАБ в терапевтический комплекс при некоронарогенных поражениях миокарда, высоком уровне активности симнатоадреналовой системы и упорной тахикардии.","Наилучшим способом достижения «миокардиальной» разгрузки (ближайшая перспектива улучшения прогноза больных СН) является сочетанная терапия НАПФ и БАБ.","Абсолютными противопоказаниями к применению бета-адреноблокаторов являются: бронхиальная астма, брадикардия, артериальная гипотензия, тяжелая декомпенсированная сердечная недостаточность."]},"1-24":{"t":"24. АНТИАРИТМИЧЕСКИЕ СРЕДСТВА. КЛАССИФИКАЦИЯ ПРЕПАРАТОВ ПО ВОГЕН-ВИЛЬЯМСУ. МЕХАНИЗМЫ ПРОТИВОАРИТМИЧЕСКОГО ДЕЙСТВИЯ ПРЕПАРАТОВ РАЗНЫХ ГРУПП И ФАРМАКОЛОГИЧЕСКИЕ ЭФФЕКТЫ. ПОКАЗАНИЯ И ПРОТИВОПОКАЗАНИЯ К ПРИМЕНЕНИЮ. ПРЕПАРАТЫ ТЕРАПИИ ВНУТРИСЕРДЕЧНЫХ БЛОКАД.","p":["Классификация антиаритмических препаратов Воген-Вильямса: 1-й класс – блокаторы натриевых каналов (мембраностабилизирующие препараты) А – препараты, которые вызывают умеренное замедление скорости деполяризации и ускорение реполяризации. В – препараты, которые способствуют незначительному замедлению скорости деполяризации и ускорение реполяризации. С – препараты, которые вызывают выраженное замедление скорости деполяризации при минимальном влиянии на реполяризацию. 2-й класс – блокаторы b-адренорецепторов. 3–й класс - препараты, которые увеличивают длительность ПД И тем самым замедляют реполяризацию. 4-й класс – блокаторы кальциевых каналов.","1. Средства, блокирующие натриевые каналы","- подгруппа 1a: ХИНИДИН. Блокируя натриевые каналы, уменьшает входящий натриевый ток, генерирующий потенциал действия. Хинидин действует на все отделы сердца. Хинидин эффективен при аритмиях, связанных с нарушением автоматизма и проводимости. Уменьшает кардиотропные симпатические влияния. Блокирующее воздействие на α-адренорецепторы проявляется также в отношении периферических сосудов, заметно снижает сократимость миокарда. Побочные и токсические эффекты: звон в ушах, головная боль, нарушение зрения, дисп.растройства. Тяжелым осложнением является тромбоцитопеническая пурпура, предсердно-желудочковый и межжелудочковый блоки, токсическая тахиаритмия. Хинидин снижает АД. Противопоказан при идиосинкразии и предсердно-желудочковом блоке. Больным с сердечной недостаточностью, гипотоническими состояниями эти вещества следует назначать с осторожностью.","- Подгруппа 1b: ЛИДОКАИН при резорбтивном действии оказывает угнетающее влияние на автоматизм (снижается скорость фазы 4 - диастолической деполяризации). Это происходит в волокнах Пуркинье и в мышце желудочков, но не в синусно-предсердном узле, что проявляется подавлением эктопических очагов возбуждения. На скорость быстрой деполяризации он не влияет или незначительно снижает ее (в волокнах Пуркинье). В отличие от хинидина длительность потенциала действия и в небольшой степени эффективный рефрактерный период лидокаин уменьшает. На ЭКГ отмечается укорочение интервала Q-T. Сократимость миокарда не изменяет или несколько снижает. Основное показание к применению - желудочковые аритмии.","- Подгруппа ic: ФЛЕКАИНИДА АЦЕТАТ вызывает выраженное угнетение проводимости, что проявляется в снижении скорости быстрой деполяризации, сниэается и проводимость в атриовентрикулярном узле, пучке Гиса, волокнах Пуркинье и желудочках сердца. На ЭКГ это проявляется увеличением интервала P-R и комплекса QRS. Скорость реполяризации в желудочках флекаинид не изменяет. Автоматизм синоатриального узла незначительно угнетает. Сократимость миокарда снижает в небольшой степени. Применяют при наджелудочковых и желудочковых аритмиях. Из побочных эффектов наблюдаются головокружение, нарушение зрения, тошнота, головная боль, диспноэ. Противопоказан при выраженном сердечном блоке и кардиогенном шоке.","2. Блокаторы b-адренорецепторов: АНАПРИЛИН, он блокирует β-адренорецепторы и устраняет влияние на сердце адренергической иннервации, а также циркулирующего в крови адреналина. Урежает ритм сердечных сокращений, увеличивает эффективный рефрактерный период предсердно-желудочкового узла, уменьшает автоматизм клеток сердца, угнетает проводимость в предсердно-желудочковом узле и снижает возбудимость. Применяют при суправентрикулярных и желудочковых аритмиях. Противопоказания: свежий инфаркт миокарда, резко выраженная недостаточность кровообращения, также при сенной лихорадке, бронхиальной астме, сахарном диабете с кетоацидозом, беременности. Побочные явления тошнота, рвота, понос, головокружение, ухудшение сна, общая слабость, брадикардия, гипотония, симптомы недостаточности кровообращения, бронхоспазм, импотенция.","3. Средства, увеличивающие длительность процесса реполяризации и удлиняющие потенциал действия: АМИОДАРОН, механизм действия связан с блокадой ионных каналов клеточных мембран кардиомиоцитов, а также с неконкурентной блокадой α- и βадренорецепторов. Снижает адренергические влияния на сердце и коронарные сосуды, является антагонистом глюкагона и слабым блокатором кальциевых каналов. Урежает частоту сердечных сокращений и снижает артериальное давление, улучшает коронарное кровообращение. Применяют при суправентрикулярных и желудочковых аритмиях, а также при стенокардии. Из побочных эффектов возможны диспепсические явления, чрезмерная брадикардия, предсердно-желудочковый блок, обратимое отложение микрокристаллов препарата в роговице, пигментация кожи, дисфункция щитовидной железы.","Противопоказания: синусовая брадикардия, синдром слабости синусного узла, синоатриальная блокада, выраженная артериальная гипотензия, коллапс, шок, гипотиреоз, гипертиреоз, период кормления грудью.","4. Средства, блокирующие кальциевые каналы: ВЕРАПАМИЛ - антагонист ионов кальция, способен избирательно блокировать кальциевые каналы, оказывает тройное действие: расширяет коронарные сосуды, понижает артериальное давление и нормализует сердечный ритм. Применяют при суправентрикулярных аритмиях (пароксизмальной тахикардии и мерцательной аритмии) и стенокардии. Возможны побочные эффекты (гипотензия, усиление сердечной недостаточности, атриовентрикулярная блокада, тошнота, рвота, головокружение, аллергические реакции). Противопоказания: выраженная гипотензия, кардиогенный шок, инфаркт миокарда, выраженная брадикардия (менее 50 уд./мин), хроническая сердечная недостаточность III стадии, трепетание и фибрилляция предсердий, тяжелый стеноз устья аорты, беременность, кормление грудью.","Лечение внутрисердечных блокад определяется рядом факторов:","• Заболеванием, приведшего к появлению блокады.","• Участием нервной системы.","• Уровнем блокады (проксимальный или дистальный)."]},"1-25":{"t":"25. АНТИАНГИНАЛЬНЫЕ СРЕДСТВА. КЛАССИФИКАЦИЯ НИТРАТОВ ПО ДЛИТЕЛЬНОСТИ ДЕЙСТВИЯ С УКАЗАНИЕМ НА ЛЕКАРСТВЕННУЮ ФОРМУ. НИТРОГЛИЦЕРИН (МЕХАНИЗМ АНТИАНГИНАЛЬНОГО ДЕЙСТВИЯ). ПОКАЗАНИЯ И ПРОТИВОПОКАЗАНИЯ К ПРИМЕНЕНИЮ, ПОБОЧНЫЕ ЭФФЕКТЫ.","p":["Нитраты можно подразделить по продолжительности действия:","1. Препараты короткой продолжительности действия (до 1 ч). Нитроглицерин под язык, различные аэрозоли нитроглицерина и изосорбида динитрата. Предназначенные для быстрого купирования ангинозного приступа;","2. Препараты умеренно пролонгированного действия (от 1 до 6 ч). Таблетки изосорбида динитрата, изосорбид-5-мононитрата, сустак, нитронг, нитрокор.","3. Препараты значительно пролонгированного действия: специальные таблетки или капсулы изосорбида динитрата (кардикет, изокет) и изосорбид-5-мононитрата (эфокс), пластыри с нитроглицерином для накожного применения. Действие таких таблеток и капсул может продолжаться до 15 ч, а пластырей - до 24 ч.","Нитроглицерин –эффективен при сублингвальном применении.","Антиангинальный эффект обусловлен тремя механизмами:","1. Стимулирует образование NO в стенке сосудов.","2. Стимулирует синтез простациклина в стенке сосудов.","3. Стимулирует ?2-адренорецепторы ЦНС и увеличивает влияние коронарорасширяющих импульсов на сосудодвигательный центр.","Уменьшает проникновение ионов кальция в сосуды и кардиомициты. Снижает АД и посленагрузку на сердце. Расслабляет стенку вен и уменьшает преднагрузку на сердце.","Расширяет коронарные сосуды. Уменьшает ударный объем крови, конечное диастолическое давление, улучшает кровоснабжение субэндокардиальных слоев миокарда. Уменьшает работу сердца и потребность миокарда в кислороде. Под влиянием нитроглицерина уменьшается венозный приток крови к сердцу, снижается давление в ПП, в системе легочной артерии, а также уменьшается периферическое сопротивление сосудов. В результате этого происходит разгрузка миокарда, уменьшается его напряжение по преодолению сопротивления выброса крови, снижаются его потребности в кислороде и энергетические затраты. Снижение кардиального напряжения способствует восстановлению кровотока в мелких сосудах миокарда. Наряду с уменьшением ишемии постепенно исчезает болевая импульсация от ишемизированного очага и прекращается болевой синдром.","Побочные эффекты: головная боль, головокружение, понижение АД, а при передозировке – ортостатический коллапс. Противопоказания: кровоизлияние в мозг, повышенное внутричерепное давление, выраженная гипотензия, а также закрытоугольная форма глаукомы с высоким внутриглазным давлением."]},"1-26":{"t":"26. АНТИАНГИНАЛЬНЫЕ СРЕДСТВА. КЛАССИФИКАЦИЯ АНТИАНГИНАЛЬНЫХ СРЕДСТВ (КРОМЕ НИТРАТОВ) ПО ХИМИЧЕСКОЙ СТРУКТУРЕ И МЕХАНИЗМАМ ПРОТИВОИШЕМИЧЕСКОГО ДЕЙСТВИЯ. ФАРМАКОЛОГИЧЕСКИЕ ЭФФЕКТЫ ОТДЕЛЬНЫХ ПРЕПАРАТОВ. ПРИНЦИПЫ ТЕРАПИИ ИБС.","p":["Средства, блокирующие кальциевые каналы:","Верапамил – Действие: блок L-кальциевых каналов вследствие чего снижается проводимость и увеличивается эффективный рефрактерный период в синусно-предсердном и предсердножелудочковом узлах (противоаритмическое действие). Уменьшение поступления ионов кальция в клетки миокарда приводит к уменьшению использования энергии фосфатных связей для механической работы сердца. При этом сила и частота сокращений снижаются, Соответственно уменьшается потребность сердца в кислороде. Также происходит расширение коронарных сосудов, что повышает доставку кислорода к сердцу (антиангинальный эффект).","Применение: наджелудочковые тахиаритмии и экстрасистолии. ИБС. Побочные эффекты:","Гипотензия, усиление сердечной недостаточности, атриовентрикулярная блокада, тошнота, рвота, головокружение, аллергические реакции.","Фенигидин (нифедипин): Блокирует кальциевые каналы преимущественно в сосудах – вызывает выраженное расширение коронарных сосудов, а также снижает АД и постнагрузку.","Это приводит к увеличению доставки кислорода, а также уменьшению потребности в нем.","Применение: в качестве антиангинального и гипотензивного средства. Побочные эффекты.рефлекторная тахикардия, отеки.","Активаторы калиевых каналов:","Пинацидил: вызывает расширение коронарных и периферических сосудов. Уменьшает постнагрузку на сердце. Увеличивает ЧСС. Побочные эффекты: отеки, головная боль, сердцебиение, тахикардия.","Применение: при вазоспастической стенокардии, при артериальной гипертензии. При легких приступах стенокардии – валидол.","Два основных принципа фармакологической коррекции ИБС:","1. Расширение коронарных сосудов и повышение таким образом доставки кислорода.","2. Снижение работы сердечной мышцы и уменьшение таким образом потребности миокарда в кислороде.","Антиангинальная терапия:","- Бета-блокаторы (кардиоселективные БАБ: метопролол, бисопролол, карведилол, небиволол.","Критерией адекватности дозировки – ↓ ЧСС в покое). Снижают вероятность ВС, повторного ИМ, увеличивают продолжительность жизни больных ПИКС. Улучшают прогноз, если ИБС осложнена СН","- Ингибиторы If каналов синусового узла (ивабрадин). Используют при противопоказаниях к назначению ББ","- Антагонисты кальция длительного действия (недигидропиридины м.б. альтернативой БАБ у больных перенесших ИМ и не страдающих СН. Используют пролонгированные ЛФ)","- Нитраты","- Миокардиальные цитопротекторы (триметазидин МВ) Предупреждение ОИМ и смерти:","- Антиагрегантная терапия (аспирин, клопидогрель)","- Антитромботическая терапия (варфарин, низкомолекулярные гепарины)","- Гиполипидемическая терапия","- Ингибиторы АПФ (периндоприл, рамиприл). Применяют у больных стенокардией в сочетании с АГ, СД, СН, бессимптомной дисфукцией ЛЖ, ПИКС. При плохой переносимости их заменяют на блокаторы АТ рецепторов (кандесартан, вальсартан)"]},"1-27":{"t":"27. ДИУРЕТИКИ. КЛАССИФИКАЦИЯ ПО ТОЧКАМ ПРИЛОЖЕНИЯ ДЕЙСТВИЯ И СИЛЕ ДЕЙСТВИЯ. ФАРМАКОЛОГИЧЕСКИЕ ЭФФЕКТЫ ОТДЕЛЬНЫХ ПРЕПАРАТОВ (БЫСТРОТА НАСТУПЛЕНИЯ И ДЛИТЕЛЬНОСТЬ ДИУРЕТИЧЕСКОГО ЭФФЕКТА). МЕХАНИЗМЫ ДИУРЕТИЧЕСКОГО ДЕЙСТВИЯ ОСНОВНЫХ ПРЕПАРАТОВ. ПОКАЗАНИЯ К ПРИМЕНЕНИЮ И ПОБОЧНЫЕ ЭФФЕКТЫ ПРЕПАРАТОВ.","p":["Средства, нарушающие функцию эпителия почечных канальцев","1. Средства, действующие преимущественно в начальной части дистальных канальцев Дихлотиазид, его диуретический эффект обусловлен способностью подавлять реабсорбцию ионов Na и Cl и способствовать выведению этих ионов. Препараты этой группы сохраняют диуретическое действие при любых смещениях рН крови, они равно эффективны и при ацидозе, и при алкалозе. Скорость развития эффекта Дихлотиазида - 0,5-1 час, продолжительность - 8-12 часов.","Основными показаниями к применению являются отеки, связанные с сердечной недостаточностью, заболеваниями почек и печени, гипертоническая болезнь.","При длительном применении тиазидных и тиазидоподобных диуретиков возможно развитие гипокалиемии, назначают в комбинации с препаратами, содержащими калий и магний. Другим побочным эффектом длительного приема препаратов этой группы может быть гиперурикемия и учащение приступов подагры.","2. Средства, действующие преимущественно в толстом сегменте восходящей части петли Генле: Фуросемид (Лазикс), этакриновая кислота (Урегит), являются наиболее мощными диуретиками. Применяют при неотложных состояниях: отеке легких, отеке мозга, при острых отравлениях. Они подавляют сочетанный транспорт ионов Na, К и Сl через апикальную мембрану эпителиальных клеток в толстом сегменте восходящего отдела петли Генле, селективно блокируя транспортную систему, осуществляющую активный перенос этих электролитов внутрь клетки. Таким образом, подавляется реабсорбция ионов, и они выводятся из организма. Увеличивают выведение из организма ионов Mg и Са. Скорость развития эффекта Фуросемида 0,3-0,5 часа, продолжительность – 3-4 часа. Скорость развития эффекта этакриновой к-ты 0,5-1 час, продолжительность – 6-8 часов. Побочные эффекты: увеличение экскреции ионов К+ и возможность развития гипокалиемического алкалоза, гипомагниемия, гиперурикемия в связи со снижением секреции мочевой кислоты в проксимальных канальцах, обратимая ототоксичность, гипергликемия. Этакриновая кислота в большей степени, чем фуросемид, нарушает слух, обладает раздражающими свойствами.","3. Средства, действующие в конечной части дистальных канальцев и собирательных трубках. Оказывают слабый диуретический эффект, но они способны усиливать выведение ионов Na, одновременно задерживая в организме ионы К и Mg. Эти препараты не нарушают кислотно-основное состояние.","Триамтерен (Птерофен) и Амилорид блокируют транспорт ионов Na+ внутрь клетки через натриевые каналы. Это снижает транспорт ионов К+ в обмен на Na+ через базолатеральную мембрану клетки и соответственно его секрецию в просвет канальцев. Триамтерен и Амилорид всасываются и проявляют свое действие довольно быстро (при приеме внутрь через 2-3 ч). По диуретическому эффекту значительно уступают тиазидным и петлевым диуретикам.","Продолжительность диуретического действия составляет 8-12 ч у триамтерена и до 24 ч — у амилорида. Главное достоинство этой группы — способность сохранять эндогенный калий, их часто применяют в комплексной терапии с салуретиками для предупреждения развития гипокалиемии, особенно при длительном применении, также возникает тошнота, рвота, гипотония, кожные высыпания.","Антагонисты альдостерона Спиронолактон (Альдактон, Верошпирон) является конкурентным антагонистом альдостерона и дезоксикортикостерона в конечном сегменте дистальных канальцев и в корковом отделе собирательных трубок. Альдостерон увеличивает реабсорбцию ионов натрия и таким образом уменьшает их выведение, при этом повышается секреция калия. Спиронолактон оказывает противоположное действие - снижает реабсорбцию ионов натрия, при этом уменьшается секреция калия. Повышение выведения из организма ионов натрия сопровождается выведением соответствующих количеств воды. Скорость развития эффекта Спироналоктона – 2-3 дня, продолжительность меньше 2-3 дней.","Основными показаниями к применению являются отеки, связанные с избыточной продукцией минералокортикоидов, гипертоническая болезнь. Побочные эффекты: тошнота, рвота, диарея, импотенция, гинекомастия, нарушение менструального цикла, гиперкалиемия.","Осмотически активные мочегонные средства Принцип действия маннита и мочевины заключается в том, что при попадании в просвет почечных канальцев они создают высокое осмотическое давление. При этом снижается реабсорбция воды и ионов натрия. На кислотно-основное состояние не влияют. Маннит (маннитол) в отличие от мочевины (карбамид) не проникает через клеточные мембраны и тканевые барьеры, не повышает содержание остаточного азота в крови, что может иметь место при применении мочевины (особенно при нарушенной функции почек). Маннит используется как мочегонное и дегидратирующее средство (при отеке мозга), при острых отравлениях химическими веществами. Мочевину применяют главным образом как дегидратирующее средство. Скорость развития эффекта около получала, длительность действия – до 4-х часов.","Побочные эффекты: головная боль, тошнота, рвота, головокружение, боли в области грудной клетки.","Препараты противопоказаны при нарушении выделительной функции почек. Мочевину не рекомендуется также назначать при выраженной печеночной и сердечно-сосудистой недостаточности."]},"1-28":{"t":"28. АНТИГИПЕРТЕНЗИВНЫЕ СРЕДСТВА. КЛАССИФИКАЦИЯ ГИПОТЕНЗИВНЫХ СРЕДСТВ НЕЙРОТРОПНОГО ТИПА ДЕЙСТВИЯ. МЕХАНИЗМЫ ГИПОТЕНЗИВНОГО ЭФФЕКТА ПРЕПАРАТОВ РАЗНЫХ ГРУПП, ФАРМАКОЛОГИЧЕСКИЕ ЭФФЕКТЫ. ПОБОЧНЫЕ ЭФФЕКТЫ ПРЕПАРАТОВ. СЕДАТИВНЫЕ И ДИУРЕТИЧЕСКИЕ ПРЕПАРАТЫ ДЛЯ ТЕРАПИИ ГИПЕРТОНИЧЕСКОЙ БОЛЕЗНИ.","p":["1. Клофелин, его гипотензивное действие связано со стимулирующими влияниями на постсинаптические а2-адренорецепторы и имидазолиновые I1-рецепторы нейронов ядер солитарного тракта в ростральной вентролатеральной части продолговатого мозга, что приводит к угнетению нейронов вазомоторного центра продолговатого мозга и снижению тонуса симпатической иннервации, активации нейронов центров блуждающих нервов и снижению продукции ренина. Результат - уменьшение тонуса гладких мышц сосудов и уменьшение работы сердца – АД снижается. Обладает выраженным гипотензивным эффектом, оказывает седативное действие, снижает частоту сердечных сокращений и внутриглазное давление. Побочные эффекты - при внезапном прекращении приема продукта возможно развитие гипертонического криза. Сухость во рту, слабость, сонливость, при больших дозах запор, ортостатический коллапс.","2. Бензогексоний, в результате угнетения симпатических ганглиев происходит расширение сосудов, уменьшается пред- и постнагрузка. Давление снижается. Кроме того, блокируются нхолинорецепторы хромафинных клеток мозгового слоя надпочечников, в результате уменьшается секреция адреналина и норадреналина в кровь. Это тоже способствует снижению давления. Вызывает уменьшение секреции желез и снижений функций ЖКТ и устранение бронхиальных спазмов под действием Бензогексония обуславливает применение препарата для лечения язвенной болезни, некоторых форм бронхиальной астмы, гипергидроза. Побочные действия: общая слабость, головокружение, сердцебиение. Большие дозы могут вызвать ортостатический коллапс, выраженный мидриаз, сухость во рту, атонию мочевого пузыря.","3. Резерпин, механизм гипотензивного действия - нарушение процесса депонирования норадреналина в везикулах, следствием чего является снижение содержания НА в варикозных утолщениях, что приводит к блоку эфферентных импульсов на уровне периферических адренергических окончаний. Это ведёт к снижению работы сердца и тонуса периферических сосудов. Так же он, оказывая центральное гипотензивное действие, замедляет сердечную деятельность, вызывают гипотермию (снижают температуру тела) и несколько замедляют обменные процессы, усиливают желудочную секрецию. Побочные эффекты - брадикардия; повышение секреторной и двигательной активности ЖКТ; миоз; сонливость; общая слабость; депрессивные состояния; экстрапирамидные расстройства. 4.А. Празозин, механизм гипотензивного действия связан с блоком, преимущественно, постсинаптических альфа1- адренорецепторов, благодаря чему функционируют пресинаптические альфа2- адренорецепторы и сохраняется механизм отрицательной обратной связи и повышенного выделения НА не происходит; происходит снижение тонуса резистивных сосудов, уменьшение венозного возврата и, следовательно, работы сердца. Побочные эффекты - головная боль; сердцебиение; сонливость; ортостатическая гипотензия; головокружение; задержка в тканях воды. 4.Б. Анаприлин, гипотензивный эффект связан с уменьшением минутного объема кро
