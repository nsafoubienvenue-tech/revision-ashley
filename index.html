 {d:12,p1:'41, 42, 43, 46, 47 — НПВС, стероидные ПВС, противоаллергические, бронхолитики, астма',p2:'14, 39 — противокашлевые и отхаркивающие, иммуногенез',p3:'21, 22',rx:'диклофенак, индометацин, ибупрофен, ацетилсалициловая кислота, дифенгидрамин, хлоропирамин, хифенадин, кромолин-натрий, сальбутамол, ипратропий, аминофиллин, бромгексин, метилурацил',t:'Allergie et immunité',pg:'PG 21, 22 — saponines, huiles essentielles'},
 {d:13,p1:'48, 49, 50 — антикоагулянты, антиагреганты',p2:'15 → 21 — аппетит, желудок, поджелудочная, рвотные, желчегонные, слабительные',p3:'23, 24',rx:'гепарин, апиксабан, клопидогрел, омепразол, фамотидин, висмута трикалия дицитрат, метоклопрамид, антрасенин, дротаверин, адеметионин',t:'Digestif',pg:'PG 18, 14 — anthracènes, polysaccharides'},
 {d:14,rev:'Révision légère : 30 ordonnances tirées au hasard dans les semaines 1 et 2, tests ratés, fiches PG 14–24. Jour de rattrapage si du retard s’est accumulé.'},
 {d:15,p1:'51 → 56 — гормональные препараты',p2:'26, 27 — эстрогены, андрогены',p3:'25, 26',rx:'гидрокортизон, преднизолон, дексаметазон, глибенкламид, глибутид, метформин, акарбоза, вилдаглиптин, эстрадиола дипропионат',t:'Hormones',pg:'PG 13 — huiles grasses'},
 {d:16,p1:'—',p2:'28, 29, 30, 33, 34 — витамины, антибластомные',p3:'27, 28',rx:'ретинол, токоферол, тиамин, рибофлавин, пиридоксин, аскорбиновая кислота, никотиновая кислота',t:'Vitamines',pg:'PG 12 — vitamines'},
 {d:17,exam:'Examen blanc complet, puis travail sur les points faibles de la semaine 1.'},
 {d:18,exam:'Examen blanc complet, puis travail sur les points faibles de la semaine 2.'},
 {d:19,exam:'Examen blanc complet, puis les sujets les plus faibles.'},
 {d:20,exam:'Examen blanc complet + passage complet des 143 ordonnances.'},
 {d:21,rev:'Veille de l’examen : relecture légère des fiches et des ordonnances difficiles le matin. Rien de nouveau. Coucher tôt.'}
];
</script>
<script>
(function(){
'use strict';
const D = window.DATA, PGO = window.PG_ORAL, GR = window.PG_GROUPS, RAW = window.PG_RAW, PLAN = window.PLAN;
const NAME = 'Ashley';
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];

/* ---------- état (localStorage, avec repli en mémoire) ---------- */
const KEY='rattrapage-pharma-v1';
let S;
try{ S = JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ S=null; }
S = Object.assign({start:null,plan:{},tp:{},rx:{},oral:{},pg:{},pgo:{},ui:{}}, S||{});
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- navigation ---------- */
const ICONS = {
 accueil:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
 oral:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
 recettes:'<path d="M6 3h9l3 3v15H6z"/><path d="M9 9h2.5a2 2 0 010 4H9V9zm0 4l4 4"/>',
 qcm:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l2 2 3-3M7 15h10"/>',
 pharmacognosie:'<path d="M12 21c0-6 0-9 0-12"/><path d="M12 12c-4 0-7-3-7-7 4 0 7 3 7 7zM12 9c3 0 6-2 6-6-3 0-6 2-6 6z"/>',
 planning:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'
};
const ROUTES = [['accueil','Accueil'],['oral','Oral pharmaco'],['recettes','Ordonnances'],['qcm','QCM pharmaco'],['pharmacognosie','Pharmacognosie'],['planning','Planning']];
const SHORT = {accueil:'Accueil',oral:'Oral',recettes:'Recettes',qcm:'QCM',pharmacognosie:'Pharmacogn.',planning:'Planning'};
function drawNav(cur){
  $('#nav').innerHTML = ROUTES.map(([k,l])=>`<a href="#${k}" ${k===cur?'aria-current="page"':''}><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${l}</a>`).join('');
  $('#tabbar').innerHTML = ROUTES.map(([k])=>`<a href="#${k}" ${k===cur?'aria-current="page"':''}><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${SHORT[k]}</a>`).join('');
}
const VIEWS = {};
function route(){
  let r = (location.hash||'#accueil').slice(1);
  if(!VIEWS[r]) r='accueil';
  drawNav(r);
  const v=$('#view'); v.className='wrap';
  VIEWS[r](v);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

/* ---------- utilitaires ---------- */
function dayIndex(){
  if(!S.start) return null;
  const a=new Date(S.start), b=new Date(); a.setHours(0,0,0,0); b.setHours(0,0,0,0);
  return Math.floor((b-a)/864e5)+1;
}
function count(obj,val){ return Object.values(obj).filter(x=>x===val).length; }
function statBlock(label,n,total,href){
  const pct = total? Math.round(100*n/total):0;
  return `<a class="panel stat" href="${href}" style="text-decoration:none;color:inherit"><b>${label}</b><div class="bar"><i style="width:${pct}%"></i></div><span class="n">${n} / ${total} maîtrisés</span></a>`;
}
function seg(id, opts, cur){ return `<div class="seg" role="group" id="${id}">${opts.map(([k,l])=>`<button type="button" data-k="${k}" aria-pressed="${k===cur}">${l}</button>`).join('')}</div>`; }
function chips(id, opts, cur){ return `<div class="chips" id="${id}">${opts.map(([k,l])=>`<button type="button" class="chip" data-k="${esc(k)}" aria-pressed="${k===cur}">${esc(l)}</button>`).join('')}</div>`; }
function onSeg(el, fn){ el.addEventListener('click',e=>{const b=e.target.closest('button[data-k]'); if(b) fn(b.dataset.k);}); }

/* ================= ACCUEIL ================= */
VIEWS.accueil = v => {
  const di = dayIndex();
  const today = di && di>=1 && di<=PLAN.length ? PLAN[di-1] : null;
  const hello = NAME ? `Bon courage, ${esc(NAME)}` : 'Bon courage pour ce rattrapage';
  let todayHtml;
  if(!S.start){
    todayHtml = `<div class="panel"><h2 class="h2">Commencer le planning</h2><p class="lead">Le planning dure 21 jours : 16 jours de cours, 4 examens blancs et une veille légère. Choisis le jour 1 pour que l'accueil affiche le programme du jour.</p><div class="row" style="margin-top:14px"><button class="btn primary big" id="startToday">Commencer aujourd'hui</button><a class="btn" href="#planning">Voir le planning</a></div></div>`;
  } else if(today){
    todayHtml = `<div class="panel"><div class="eyebrow">Jour ${di} sur ${PLAN.length}</div><h2 class="h2" style="margin-top:6px">Au programme aujourd'hui</h2>${dayDetail(today)}<div class="row" style="margin-top:16px"><a class="btn primary" href="#planning">Ouvrir le planning</a>${today.t?`<button class="btn" id="goTopic">QCM du jour</button>`:''}</div></div>`;
  } else {
    todayHtml = `<div class="panel"><h2 class="h2">${di<1?'Le planning n’a pas encore commencé':'Planning terminé'}</h2><p class="lead">${di<1?'Le jour 1 est fixé dans le futur.':'Les 21 jours sont passés : continue avec les examens blancs et les questions à revoir.'}</p><div class="row" style="margin-top:12px"><button class="btn" id="resetStart">Recommencer aujourd'hui</button></div></div>`;
  }
  const oralKnown = count(S.oral,'ok');
  v.innerHTML = `
  <header><div class="eyebrow">Pharmacologie · Pharmacognosie</div><h1 class="h1" style="margin-top:8px">${hello}</h1>
  <p class="lead">Tout le programme des deux examens au même endroit : tirage de билеты, ordonnances, QCM corrigés, problèmes de pharmacognosie et planning.</p></header>
  ${todayHtml}
  <section class="grid g3">
    ${statBlock('Oral pharmaco',oralKnown,123,'#oral')}
    ${statBlock('Ordonnances',count(S.rx,'ok'),D.recipes.length,'#recettes')}
    ${statBlock('QCM pharmaco',count(S.tp,'ok'),D.tests.length,'#qcm')}
    ${statBlock('Tests de pharmacognosie',count(S.pg,'ok'),D.pg.length,'#pharmacognosie')}
    ${statBlock('Oral pharmacognosie',count(S.pgo,'ok'),24,'#pharmacognosie')}
    ${statBlock('Jours du planning',Object.values(S.plan).filter(Boolean).length,PLAN.length,'#planning')}
  </section>
  <section class="panel"><h2 class="h2">Accès rapide</h2>
    <div class="grid g2" style="margin-top:14px">
      <a class="btn big" href="#oral">Tirer un билет</a>
      <a class="btn big" href="#recettes">10 ordonnances</a>
      <a class="btn big" href="#qcm">Série de 20 QCM</a>
      <a class="btn big" href="#pharmacognosie" id="goTask">Problème de pharmacognosie</a>
    </div>
  </section>`;
  const st=$('#startToday',v); if(st) st.onclick=()=>{S.start=new Date().toISOString().slice(0,10);save();route();};
  const rs=$('#resetStart',v); if(rs) rs.onclick=()=>{S.start=new Date().toISOString().slice(0,10);save();route();};
  const gt=$('#goTopic',v); if(gt) gt.onclick=()=>{S.ui.tpTopic=today.t;save();location.hash='qcm';};
  $('#goTask',v).onclick=()=>{S.ui.pgTab='task';save();};
};
function dayDetail(p){
  if(p.rev||p.exam) return `<p style="margin:8px 0 0">${esc(p.rev||p.exam)}</p>`;
  return `<dl class="kv" style="margin-top:10px">
    <dt>Oral I</dt><dd>${esc(p.p1)}</dd><dt>Oral II</dt><dd>${esc(p.p2)}</dd><dt>Oral III</dt><dd>${esc(p.p3)}</dd>
    <dt>Ordonnances</dt><dd>${esc(p.rx)}</dd><dt>Pharmacognosie</dt><dd>${esc(p.pg)}</dd></dl>`;
}

/* ================= ORAL PHARMACO ================= */
const LOTN = {1:'I',2:'II',3:'III'};
function livretHtml(q){
  let h='';
  if(q.g) h+=`<div class="note">${esc(q.g)}</div>`;
  if(!q.r.length) return h+'<p class="muted">Pas de réponse dans le livret.</p>';
  q.r.forEach((k,i)=>{
    const s=D.livret[k]; if(!s) return;
    if(q.r.length>1) h+=`<h4>${i===0?'Réponse du livret':'Complément'}</h4>`;
    h+=s.p.map(p=>`<p>${esc(p)}</p>`).join('');
  });
  return `<div class="reading">${h}</div>`;
}
function markBtns(store,key){
  const cur=store[key];
  return `<div class="row"><button class="btn ok" data-mark="ok" data-key="${key}" ${cur==='ok'?'aria-pressed="true"':''}>Je savais</button><button class="btn ko" data-mark="ko" data-key="${key}">À revoir</button>${cur?`<span class="badge ${cur}">${cur==='ok'?'Maîtrisée':'À revoir'}</span>`:''}</div>`;
}
let timerInt=null;
VIEWS.oral = v => {
  const mode = S.ui.oralMode||'ticket';
  v.innerHTML = `<header class="row" style="justify-content:space-between"><div><div class="eyebrow">Pharmacologie · épreuve orale</div><h1 class="h1" style="margin-top:6px">Oral : le билет</h1>
  <p class="lead">Une question tirée dans chaque lot. Prépare-toi 15 minutes comme devant la commission, puis compare avec la réponse du livret.</p></div></header>
  ${seg('oralMode',[['ticket','Tirer un билет'],['list','Toutes les questions']],mode)}
  <div id="oralBody"></div>`;
  onSeg($('#oralMode',v), k=>{S.ui.oralMode=k;save();VIEWS.oral(v);});
  if(mode==='ticket') oralTicket($('#oralBody',v)); else oralList($('#oralBody',v));
};
function drawTicket(pref){
  const t={};
  [1,2,3].forEach(l=>{
    let pool=D.oral[l];
    if(pref==='ko'){ const ko=pool.filter(q=>S.oral[l+'-'+q.n]==='ko'); if(ko.length) pool=ko; }
    if(pref==='new'){ const nw=pool.filter(q=>!S.oral[l+'-'+q.n]); if(nw.length) pool=nw; }
    t[l]=pick(pool).n;
  });
  return t;
}
function oralTicket(el){
  if(!S.ui.ticket){ S.ui.ticket=drawTicket('new'); save(); }
  const T=S.ui.ticket; let left=S.ui.tleft??900; let run=false;
  el.innerHTML = `<div class="panel row" style="justify-content:space-between;gap:18px">
     <div><div class="eyebrow">Préparation</div><div class="timer" id="tm">15:00</div></div>
     <div class="row"><button class="btn primary big" id="tgo">Démarrer</button><button class="btn" id="treset">15:00</button></div>
     <div class="row"><button class="btn" id="tnew">Nouveau билет</button><button class="btn" id="tko">Билет « à revoir »</button></div>
  </div>
  <div class="ticket">${[1,2,3].map(l=>{const q=D.oral[l].find(x=>x.n===T[l]);const key=l+'-'+q.n;return `<article class="panel tq">
     <div class="lot">Question ${LOTN[l]} · n° ${q.n}</div><div class="txt">${esc(q.q)}</div>
     <button class="btn" data-show="${key}">Voir la réponse</button>
     <div class="answer" id="ans-${key}" hidden>${livretHtml(q)}${markBtns(S.oral,key)}</div></article>`}).join('')}</div>`;
  const tm=$('#tm',el), go=$('#tgo',el);
  const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  const paint=()=>{tm.textContent=fmt(left);tm.classList.toggle('low',left<=60);};
  paint(); clearInterval(timerInt);
  go.onclick=()=>{ run=!run; go.textContent=run?'Pause':'Reprendre'; clearInterval(timerInt);
    if(run) timerInt=setInterval(()=>{ if(left>0){left--;S.ui.tleft=left;paint();} else {clearInterval(timerInt);go.textContent='Terminé';run=false;} },1000); };
  $('#treset',el).onclick=()=>{clearInterval(timerInt);run=false;left=900;S.ui.tleft=900;save();go.textContent='Démarrer';paint();};
  $('#tnew',el).onclick=()=>{S.ui.ticket=drawTicket('new');S.ui.tleft=900;save();clearInterval(timerInt);oralTicket(el);};
  $('#tko',el).onclick=()=>{S.ui.ticket=drawTicket('ko');S.ui.tleft=900;save();clearInterval(timerInt);oralTicket(el);};
  el.onclick=(e=>{
    const s=e.target.closest('[data-show]'); if(s){const a=$('#ans-'+s.dataset.show,el); a.hidden=!a.hidden; s.textContent=a.hidden?'Voir la réponse':'Masquer la réponse';}
    const m=e.target.closest('[data-mark]'); if(m){S.oral[m.dataset.key]=m.dataset.mark;save();const box=m.closest('.answer');const k=m.dataset.key;box.querySelector('.row:last-child').outerHTML=markBtns(S.oral,k);}
  });
}
function oralList(el){
  const lot = S.ui.oralLot||'1'; const f=S.ui.oralF||'all';
  el.innerHTML = `<div class="row" style="justify-content:space-between">${chips('olot',[['1','Premières (56)'],['2','Deuxièmes (39)'],['3','Troisièmes (28)']],lot)}
   ${chips('of',[['all','Toutes'],['ko','À revoir'],['new','Pas encore vues']],f)}</div>
   <input class="input" id="osearch" type="search" placeholder="Chercher un mot (ex. : атропин, диуретики)" value="${esc(S.ui.oq||'')}">
   <div class="panel" id="olist" style="padding-block:6px"></div>`;
  const draw=()=>{
    const term=(S.ui.oq||'').toLowerCase();
    const arr=D.oral[lot].filter(q=>{const st=S.oral[lot+'-'+q.n]; if(f==='ko'&&st!=='ko')return false; if(f==='new'&&st)return false; return !term||q.q.toLowerCase().includes(term);});
    $('#olist',el).innerHTML = arr.length? arr.map(q=>{const key=lot+'-'+q.n;const st=S.oral[key];return `<details class="q" data-key="${key}"><summary><span class="num">${LOTN[lot]}.${q.n}</span><span style="flex:1">${esc(q.q)}</span>${st?`<span class="badge ${st}">${st==='ok'?'Maîtrisée':'À revoir'}</span>`:''}</summary><div style="padding:0 4px 18px 58px" class="lbody"></div></details>`}).join('') : '<p class="empty">Aucune question avec ce filtre.</p>';
  };
  draw();
  onSeg($('#olot',el),k=>{S.ui.oralLot=k;save();oralList(el);});
  onSeg($('#of',el),k=>{S.ui.oralF=k;save();oralList(el);});
  $('#osearch',el).addEventListener('input',e=>{S.ui.oq=e.target.value;draw();});
  $('#olist',el).addEventListener('toggle',e=>{const d=e.target; if(d.open){const key=d.dataset.key;const [l,n]=key.split('-');const q=D.oral[l].find(x=>x.n==n);const b=d.querySelector('.lbody'); if(!b.innerHTML) b.innerHTML=livretHtml(q)+markBtns(S.oral,key);}},true);
  $('#olist',el).addEventListener('click',e=>{const m=e.target.closest('[data-mark]'); if(m){S.oral[m.dataset.key]=m.dataset.mark;save();m.closest('.row').outerHTML=markBtns(S.oral,m.dataset.key);}});
}

/* ================= ORDONNANCES ================= */
function rxForm(r){
  return `<div class="form107">${r.l.map(l=>{
    let h=esc(l);
    if(/^Rp/.test(l)) h=h.replace(/^(Rp\.?:?)/,'<span class="rp">$1</span>');
    if(/^(D\.?\s?S|S\.|S:|DS)/.test(l)) h=`<span class="sig">${h}</span>`;
    return `<span class="l">${h}</span>`;}).join('')}</div>${r.w?`<div class="note" style="margin-top:10px"><b>À vérifier :</b> ${esc(r.w)}</div>`:''}`;
}
VIEWS.recettes = v => {
  const mode=S.ui.rxMode||'flash';
  v.innerHTML=`<header><div class="eyebrow">Pharmacologie · épreuve écrite</div><h1 class="h1" style="margin-top:6px">Ordonnances</h1>
  <p class="lead">${D.recipes.length} médicaments à prescrire avec une indication précise. Lis le nom, écris l'ordonnance sur papier, puis vérifie.</p></header>
  ${seg('rxMode',[['flash','Entraînement'],['list','Liste complète']],mode)}<div id="rxBody"></div>`;
  onSeg($('#rxMode',v),k=>{S.ui.rxMode=k;save();VIEWS.recettes(v);});
  if(mode==='flash') rxFlash($('#rxBody',v)); else rxList($('#rxBody',v));
};
let rxQueue=null, rxPos=0;
function rxFlash(el){
  const f=S.ui.rxF||'new';
  if(!rxQueue||S.ui.rxFq!==f){
    let pool=D.recipes.map((r,i)=>i);
    if(f==='new') pool=pool.filter(i=>!S.rx[i]);
    if(f==='ko') pool=pool.filter(i=>S.rx[i]==='ko');
    rxQueue=shuffle(pool); rxPos=0; S.ui.rxFq=f;
  }
  const head=`${chips('rxf',[['new','Pas encore vues'],['ko','À revoir'],['all','Toutes']],f)}`;
  if(rxPos>=rxQueue.length){
    el.innerHTML=head+`<div class="panel empty"><p class="h2" style="color:var(--ink)">${rxQueue.length?'Série terminée':'Rien à revoir ici'}</p><p>${count(S.rx,'ok')} ordonnances maîtrisées sur ${D.recipes.length}.</p><button class="btn primary" id="rxAgain">Recommencer</button></div>`;
    onSeg($('#rxf',el),k=>{S.ui.rxF=k;save();rxQueue=null;rxFlash(el);});
    $('#rxAgain',el).onclick=()=>{rxQueue=null;rxFlash(el);}; return;
  }
  const i=rxQueue[rxPos], r=D.recipes[i];
  el.innerHTML=head+`<div class="panel flash">
    <div class="row" style="justify-content:space-between"><span class="counter">Carte ${rxPos+1} / ${rxQueue.length}</span>${S.rx[i]?`<span class="badge ${S.rx[i]}">${S.rx[i]==='ok'?'Maîtrisée':'À revoir'}</span>`:''}</div>
    <div class="drug">${esc(r.n)}</div>
    <p class="muted" style="text-align:center;margin:0">Écris : Rp., forme et dose, D.t.d., S. avec l'indication.</p>
    <div id="rxShow" class="hide">${rxForm(r)}</div>
    <div class="row" style="justify-content:center" id="rxAct"><button class="btn primary big" id="rxReveal">Afficher l'ordonnance</button></div>
  </div>`;
  onSeg($('#rxf',el),k=>{S.ui.rxF=k;save();rxQueue=null;rxFlash(el);});
  $('#rxReveal',el).onclick=()=>{
    $('#rxShow',el).classList.remove('hide');
    $('#rxAct',el).innerHTML=`<button class="btn ok big" data-m="ok">Je savais</button><button class="btn ko big" data-m="ko">À revoir</button>`;
    $('#rxAct',el).onclick=e=>{const b=e.target.closest('[data-m]'); if(!b)return; S.rx[i]=b.dataset.m; save(); rxPos++; rxFlash(el);};
  };
}
function rxList(el){
  el.innerHTML=`<input class="input" id="rxs" type="search" placeholder="Chercher un médicament ou une indication" value="${esc(S.ui.rxq||'')}"><div class="panel" style="padding-block:4px;overflow-x:auto"><table class="list" id="rxt"></table></div>`;
  const draw=()=>{const t=(S.ui.rxq||'').toLowerCase();
    $('#rxt',el).innerHTML=D.recipes.map((r,i)=>[r,i]).filter(([r])=>!t||(r.n+' '+r.l.join(' ')).toLowerCase().includes(t)).map(([r,i])=>`<tr><td>${esc(r.n)}${S.rx[i]?`<br><span class="badge ${S.rx[i]}">${S.rx[i]==='ok'?'Maîtrisée':'À revoir'}</span>`:''}${r.w?'<br><span class="badge warn">À vérifier</span>':''}</td><td class="rxl">${r.l.map(esc).join('<br>')}${r.w?`<div class="muted small" style="font-family:var(--f-body);margin-top:6px">${esc(r.w)}</div>`:''}</td></tr>`).join('');};
  draw(); $('#rxs',el).addEventListener('input',e=>{S.ui.rxq=e.target.value;draw();});
}

/* ================= QCM (moteur commun) ================= */
function topicsOf(arr){ const m=new Map(); arr.forEach(x=>m.set(x.t,(m.get(x.t)||0)+1)); return [...m.entries()]; }
function quizSetup(el,cfg){
  const topic=S.ui[cfg.k+'Topic']||'all', size=S.ui[cfg.k+'Size']||'20', only=S.ui[cfg.k+'Only']||'all';
  const tp=topicsOf(cfg.items);
  el.innerHTML=`<div class="panel" style="display:flex;flex-direction:column;gap:16px">
    <div><div class="eyebrow" style="margin-bottom:8px">Thème</div>${chips(cfg.k+'tp',[['all','Tous les thèmes ('+cfg.items.length+')'],...tp.map(([t,n])=>[t,t+' ('+n+')'])],topic)}</div>
    <div class="row" style="gap:24px"><div><div class="eyebrow" style="margin-bottom:8px">Nombre</div>${seg(cfg.k+'sz',[['10','10'],['20','20'],['all','Toutes']],size)}</div>
    <div><div class="eyebrow" style="margin-bottom:8px">Questions</div>${seg(cfg.k+'on',[['all','Toutes'],['ko','Mes erreurs'],['new','Jamais faites']],only)}</div></div>
    <div><button class="btn primary big" id="qstart">Commencer la série</button></div></div>`;
  onSeg($('#'+cfg.k+'tp',el),k=>{S.ui[cfg.k+'Topic']=k;save();quizSetup(el,cfg);});
  onSeg($('#'+cfg.k+'sz',el),k=>{S.ui[cfg.k+'Size']=k;save();quizSetup(el,cfg);});
  onSeg($('#'+cfg.k+'on',el),k=>{S.ui[cfg.k+'Only']=k;save();quizSetup(el,cfg);});
  $('#qstart',el).onclick=()=>{
    let pool=cfg.items.filter(x=>topic==='all'||x.t===topic);
    if(only==='ko') pool=pool.filter(x=>cfg.store[x.id]==='ko');
    if(only==='new') pool=pool.filter(x=>!cfg.store[x.id]);
    pool=shuffle(pool); if(size!=='all') pool=pool.slice(0,+size);
    if(!pool.length){ $('#qstart',el).insertAdjacentHTML('afterend','<p class="muted" style="margin-top:10px">Aucune question avec ces filtres.</p>'); return; }
    quizRun(el,cfg,{list:pool,pos:0,good:0,done:[]});
  };
}
function quizRun(el,cfg,st){
  if(st.pos>=st.list.length){
    const pct=Math.round(100*st.good/st.list.length);
    el.innerHTML=`<div class="panel" style="text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center">
      <div class="eyebrow">Série terminée</div><div class="score">${st.good}/${st.list.length}</div><p class="lead" style="margin:0">${pct>=80?'Très bien. Passe au thème suivant.':pct>=60?'Correct. Refais tes erreurs demain.':'Relis la fiche du thème, puis refais tes erreurs.'}</p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="again">Nouvelle série</button><button class="btn" id="errs">Refaire mes erreurs</button></div></div>`;
    $('#again',el).onclick=()=>quizSetup(el,cfg);
    $('#errs',el).onclick=()=>{S.ui[cfg.k+'Only']='ko';save();quizSetup(el,cfg);};
    return;
  }
  const q=st.list[st.pos];
  el.innerHTML=`<div class="row" style="justify-content:space-between"><span class="counter">Question ${st.pos+1} / ${st.list.length} · ${esc(q.t)}</span><span class="counter">${st.good} juste${st.good>1?'s':''}</span></div>
   <div class="bar"><i style="width:${100*st.pos/st.list.length}%"></i></div>
   <article class="panel qcard" id="qc"></article>
   <div class="row"><button class="btn" id="quit">Quitter la série</button></div>`;
  $('#quit',el).onclick=()=>quizSetup(el,cfg);
  const card=$('#qc',el);
  const next=(ok)=>{ cfg.store[q.id]=ok?'ok':'ko'; if(ok) st.good++; save(); st.pos++; quizRun(el,cfg,st); };
  cfg.render(card,q,next);
}
/* rendu « auto-évaluation » : la réponse s'affiche, l'étudiante se note */
function renderSelf(card,html,next,extra){
  card.innerHTML=`<div class="content">${html}</div>${extra?`<div class="ansbox" id="ab" hidden>${extra}</div>`:''}
   <div class="row" style="margin-top:16px" id="act"><button class="btn primary big" id="rev">Voir la réponse</button></div>`;
  $('#rev',card).onclick=()=>{ card.classList.add('shown'); const ab=$('#ab',card); if(ab) ab.hidden=false;
    $('#act',card).innerHTML=`<span class="muted small" style="width:100%">Réponds d'abord dans ta tête ou sur papier, puis note-toi honnêtement.</span><button class="btn ok big" data-m="1">J'avais juste</button><button class="btn ko big" data-m="0">J'avais faux</button>`;
    $('#act',card).onclick=e=>{const b=e.target.closest('[data-m]'); if(b) next(b.dataset.m==='1');}; };
}
VIEWS.qcm = v => {
  v.innerHTML=`<header><div class="eyebrow">Pharmacologie · test</div><h1 class="h1" style="margin-top:6px">QCM pharmaco</h1>
  <p class="lead">${D.tests.length} questions de la banque officielle avec leur corrigé. Les questions sont de formes variées (correspondances, tableaux, mots à compléter) : réponds sur papier, puis affiche la réponse.</p></header><div id="qz"></div>`;
  quizSetup($('#qz',v),{k:'tp',items:D.tests,store:S.tp,render:(card,q,next)=>renderSelf(card,q.h,next)});
};

/* ================= PHARMACOGNOSIE ================= */
VIEWS.pharmacognosie = v => {
  const tab=S.ui.pgTab||'tests';
  v.innerHTML=`<header><div class="eyebrow">Фармакогнозия</div><h1 class="h1" style="margin-top:6px">Pharmacognosie</h1>
  <p class="lead">Les tests avec correction automatique, les 24 questions de cours et des problèmes (задачи) générés au hasard sur le modèle de l'examen.</p></header>
  ${seg('pgTab',[['tests','Tests'],['oral','Questions de cours'],['task','Задача']],tab)}<div id="pgBody"></div>`;
  onSeg($('#pgTab',v),k=>{S.ui.pgTab=k;save();VIEWS.pharmacognosie(v);});
  const b=$('#pgBody',v);
  if(tab==='tests'){
    b.innerHTML=`<div class="note">Cette banque n'avait pas de corrigé. Les réponses ont été établies d'après les manuels de pharmacognosie ; celles marquées « à vérifier » sont incertaines, contrôle-les dans ton cours.</div><div id="pgq" style="display:flex;flex-direction:column;gap:22px;margin-top:22px"></div>`;
    quizSetup($('#pgq',b),{k:'pg',items:D.pg,store:S.pg,render:renderPg});
  } else if(tab==='oral') pgOral(b); else pgTask(b);
};
function renderPg(card,q,next){
  const doubt=q.d?'<span class="badge warn">Réponse à vérifier dans le cours</span>':'';
  if(q.kind==='self'){
    renderSelf(card,`<p class="stem">${esc(q.q)}</p>${q.pre}`,next,`<b>Réponse :</b> ${esc(q.ans)}${q.d?'<div style="margin-top:8px">'+doubt+'</div>':''}`);
    return;
  }
  const multi=q.a.length>1;
  card.innerHTML=`<div class="content"><p class="stem">${esc(q.q)}</p>${q.pre}</div>
   <p class="muted small" style="margin:6px 0 0">${multi?'Plusieurs réponses justes possibles.':'Choisis la ou les bonnes réponses.'}</p>
   <div class="opts">${q.o.map((o,i)=>`<button type="button" class="optb" data-i="${i+1}" aria-pressed="false"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join('')}</div>
   <div class="row" style="margin-top:16px" id="act"><button class="btn primary big" id="val" disabled>Valider</button></div>`;
  const sel=new Set(); const opts=$('.opts',card);
  opts.onclick=e=>{const b=e.target.closest('.optb'); if(!b||card.dataset.done)return; const i=+b.dataset.i; sel.has(i)?sel.delete(i):sel.add(i); b.setAttribute('aria-pressed',sel.has(i)); $('#val',card).disabled=!sel.size;};
  $('#val',card).onclick=()=>{
    card.dataset.done=1; const ok=q.a.length===sel.size&&q.a.every(x=>sel.has(x));
    opts.querySelectorAll('.optb').forEach(b=>{const i=+b.dataset.i; b.setAttribute('aria-pressed','false');
      if(q.a.includes(i)&&sel.has(i)) b.classList.add('right'); else if(sel.has(i)) b.classList.add('wrong'); else if(q.a.includes(i)) b.classList.add('missed','right');});
    $('#act',card).innerHTML=`<span class="verdict ${ok?'ok':'ko'}">${ok?'Juste':'Faux'} · réponse : ${q.a.join(', ')}</span>${doubt}<button class="btn primary big" id="nx" style="margin-left:auto">Suivante</button>`;
    $('#nx',card).onclick=()=>next(ok);
  };
}
function pgOral(el){
  el.innerHTML=`<div class="row"><button class="btn primary big" id="pgDraw">Tirer une question au hasard</button></div><div id="pgDrawn"></div>
   <div class="panel" style="padding-block:6px" id="pgList">${PGO.map(q=>{const st=S.pgo[q.n];return `<details class="q" data-n="${q.n}"><summary><span class="num">${q.n}</span><span style="flex:1">${esc(q.q)}</span>${st?`<span class="badge ${st}">${st==='ok'?'Maîtrisée':'À revoir'}</span>`:''}</summary><div style="padding:0 4px 18px 58px">${pgPlan(q)}</div></details>`}).join('')}</div>`;
  $('#pgDraw',el).onclick=()=>{const q=pick(PGO);$('#pgDrawn',el).innerHTML=`<article class="panel tq" style="margin-top:4px"><div class="lot">Question n° ${q.n}</div><div class="txt" style="font-size:18px">${esc(q.q)}</div><p class="muted small" style="margin:0">Récite ta réponse à voix haute, puis ouvre le plan.</p><details><summary class="btn" style="width:max-content">Voir le plan de réponse</summary><div style="margin-top:14px">${pgPlan(q)}</div></details></article>`;};
  el.onclick=e=>{const m=e.target.closest('[data-pgm]'); if(m){S.pgo[m.dataset.n]=m.dataset.pgm;save();pgOral(el);}};
}
function pgPlan(q){
  return `<div class="reading"><h4>Points clés à développer</h4>${q.p.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
  <p class="muted small">Plan de révision rédigé à partir des manuels ; complète-le avec ton cours.</p>
  <div class="row"><button class="btn ok" data-pgm="ok" data-n="${q.n}">Je sais la traiter</button><button class="btn ko" data-pgm="ko" data-n="${q.n}">À revoir</button></div>`;
}
function units(n){ if(n<=5) return n; if(n<=50) return 5; return Math.ceil(n*0.1); }
function pgTask(el){
  const r=pick(RAW), g=GR[r[1]]; const n=pick([4,12,23,37,51,64,88,105,120,150]);
  const u=units(n);
  const rule = n<=5?`партия до 5 единиц — вскрывают все единицы`: n<=50?`партия от 6 до 50 единиц — отбирают 5 единиц`:`партия больше 50 единиц — отбирают 10 %: ${n} × 0,1 = ${(n*0.1).toFixed(1).replace('.',',')} → ${u} (дробное число округляют в большую сторону)`;
  el.innerHTML=`<article class="panel" style="display:flex;flex-direction:column;gap:14px">
   <div class="eyebrow">Задача</div>
   <p class="reading" style="margin:0">На аптечный склад поступила партия лекарственного растительного сырья «${esc(r[0])}» в количестве ${n} транспортных единиц. Сопроводительная документация оформлена правильно, все транспортные единицы упакованы в соответствии с требованиями нормативной документации, без признаков повреждения. Необходимо отобрать пробы для анализа и провести определение подлинности и доброкачественности сырья.</p>
   <ol class="reading" style="margin:0;padding-left:1.3em">
    <li>Сколько транспортных единиц необходимо отобрать для анализа?</li>
    <li>Какие биологически активные соединения обуславливают терапевтическое действие сырья?</li>
    <li>Перечислите качественные реакции на эту группу соединений.</li>
    <li>Укажите способы количественного определения.</li>
    <li>Как хранить данное сырьё?</li></ol>
   <div class="row"><button class="btn primary big" id="tkShow">Voir le corrigé</button><button class="btn" id="tkNew">Autre problème</button></div>
   <div class="ansbox reading" id="tkAns" hidden style="font-size:16px">
    <p><b>1.</b> ${u} ${u===1?'единицу':(u<5?'единицы':'единиц')} (${rule}).</p>
    <p><b>2.</b> Группа БАВ — ${esc(g.bav)}. Основные вещества: ${esc(r[2])}.</p>
    <p><b>3.</b> ${esc(g.r)}.</p>
    <p><b>4.</b> ${esc(g.q)}.</p>
    <p><b>5.</b> ${esc(r[3]||('Хранить '+g.s+'.'))}</p>
   </div></article>
   <p class="muted small">Règle d'échantillonnage utilisée : jusqu'à 5 unités, toutes ; de 6 à 50, 5 unités ; au-delà, 10 % arrondis à l'unité supérieure. Vérifie que c'est bien la règle donnée en cours.</p>`;
  $('#tkShow',el).onclick=()=>{$('#tkAns',el).hidden=false;};
  $('#tkNew',el).onclick=()=>pgTask(el);
}

/* ================= PLANNING ================= */
VIEWS.planning = v => {
  const di=dayIndex();
  v.innerHTML=`<header><div class="eyebrow">21 jours</div><h1 class="h1" style="margin-top:6px">Planning</h1>
  <p class="lead">Environ 5 h 30 par jour : rappel de la veille, oral I (gros morceau), ordonnances du groupe, oral II, pharmacognosie, oral III, puis les tests du jour. Coche chaque jour terminé.</p></header>
  <div class="panel row" style="justify-content:space-between">
    <div>${S.start?`Jour 1 : <b>${new Date(S.start).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</b>${di?` · aujourd'hui : jour ${di}`:''}`:'Le planning n’a pas encore commencé.'}</div>
    <div class="row"><label class="small muted" for="startDate">Jour 1</label><input class="input" style="width:auto" type="date" id="startDate" value="${S.start||''}"></div>
  </div>
  <div class="panel" style="padding-block:6px">${PLAN.map(p=>{const done=!!S.plan[p.d];return `<div class="day ${done?'done':''} ${di===p.d?'today':''}">
     <button class="dn" data-d="${p.d}" aria-pressed="${done}" aria-label="Jour ${p.d} ${done?'terminé':'à faire'}">${done?'✓':p.d}</button>
     <div style="min-width:0"><b>Jour ${p.d}</b>${p.exam?' · <span class="badge">Examen blanc</span>':''}${p.rev?' · <span class="badge">Révision</span>':''}${dayDetailShort(p)}</div></div>`}).join('')}</div>
  <div class="panel"><h2 class="h2">Déroulé d'un examen blanc</h2><ol style="margin:10px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px">
   <li>Ordonnances (20 min) : 10 médicaments au hasard, écrits sans aide.</li>
   <li>Test pharmaco (40 min) : une série de 20 à 50 QCM.</li>
   <li>Oral pharmaco (45 min) : un билет, 15 min de préparation, réponse à voix haute.</li>
   <li>Pharmacognosie (45 min) : 40 tests, une question de cours, une задача.</li>
   <li>Après-midi : reprendre chaque erreur dans les fiches.</li></ol></div>`;
  $('#startDate',v).onchange=e=>{S.start=e.target.value||null;save();VIEWS.planning(v);};
  v.querySelectorAll('.dn').forEach(b=>b.onclick=()=>{S.plan[b.dataset.d]=!S.plan[b.dataset.d];save();VIEWS.planning(v);});
};
function dayDetailShort(p){
  if(p.rev||p.exam) return `<p style="margin:6px 0 0" class="small">${esc(p.rev||p.exam)}</p>`;
  return `<dl><dt>Oral I</dt><dd>${esc(p.p1)}</dd><dt>Oral II</dt><dd>${esc(p.p2)}</dd><dt>Oral III</dt><dd>${esc(p.p3)}</dd><dt>Recettes</dt><dd>${esc(p.rx)}</dd><dt>Pharmacogn.</dt><dd>${esc(p.pg)}</dd></dl>`;
}

route();
})();
</script>
