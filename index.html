 веществ, комбинированному действию фармакологических средств и др. Н.П.","Кравков положил начало исследованиям в области «патологической фармакологии» изучению фармакодинамики и фармакокинетики веществ на фоне экспериментально вызванных патологических состояний (например, атеросклероза, воспаления). Кроме того, в лаборатории Н.П. Кравкова исследовалось действие веществ на изолированное сердце, почку, селезенку людей, умерших от различных заболеваний. Многие исследования были посвящены фармакологии сердечнососудистой системы, эндокринных желез, обмена веществ.","Несомненный интерес представляют работы Н.П. Кравкова по токсикологии.","Он впервые предложил препарат для внутривенного наркоза (гедонал). Ему принадлежит также идея комбинированного наркоза (гедонал с хлороформом).","Широко известным фармакологом был ученик Н.П. Кравкова С.В. Аничков.","Научные интересы С.В. Аничкова были весьма разнообразны. В течение многих лет он занимался фармакологией медиаторных средств. Большой объем исследований был посвящен веществам, влияющим на хеморецепторы каротидных клубочков. Многие работы лаборатории С.В. Аничкова посвящены нейроэндокринологии, фармакологии трофических процессов.","Важную роль в развитии советской фармакологии сыграл ученик Н.П. Кравкова В.В. Закусов.","Основные его работы посвящены исследованию влияния фармакологических средств на синаптическую передачу возбуждения в ЦНС. Большое внимание В.В. Закусов уделял фармакологии коронарного кровообращения. В.В. Закусовым и его сотрудниками предложен ряд новых психотропных препаратов, анестетиков, миорелаксантов, ганглиоблокирующих, антиангинальных и противоаритмических средств..","В развитии химиотерапии инфекций заметную роль сыграли исследования З.В. Ермольевой. В тяжелые годы Великой Отечественной войны З.В. Ермольева получила пенициллин. Широко известны ее работы по интерферону, экмолину, многим антибиотикам. З.В. Ермольева является автором ряда монографий по фармакологии этих препаратов."]},"3-20":{"t":"20. ПОНЯТИЕ О ЛЕКАРСТВЕННОЙ ЗАВИСИМОСТИ, ЕЕ РАЗНОВИДНОСТИ; ПРЕПАРАТЫ, ВЫЗЫВАЮЩИЕ ЛЕКАРСТВЕННУЮ ЗАВИСИМОСТЬ. ПРОФИЛАКТИКА ЯТРОГЕННОЙ ЛЕКАРСТВЕННОЙ ЗАВИСИМОСТИ. ПОНЯТИЕ О ТОКСИКОМАНИИ.","p":["Под лекарственной зависимостью понимают психическое и (иногда) физическое состояние, характеризующееся поведенческими и другими реакциями, которые всегда включают настоятельную потребность в постоянном или периодическом приёме определённых ЛС для того, чтобы испытать его действие на психику или избежать неприятных симптомов, возникающих без приёма этого ЛС.","• Синдром психической зависимости — состояние организма, характеризующееся патологической потребностью в приёме какого-либо психотропного вещества с тем, чтобы избежать нарушений психики или дискомфорта, возникающих при прекращении применения.","Этот синдром протекает без явлений абстиненции.","• Синдром физической зависимости — состояние, характеризующееся развитием абстиненции при прекращении приёма ЛС или после введения его антагонистов. Характерен, в первую очередь, для ЛС, обладающих наркотическим эффектом.","Обезболивающие, транквилизаторы и даже гипотензивные средства нередко вызывают толерантность и физическую зависимость.","Ятрогении — это все болезни и травмы, которые возникают у пациентов и медицинских работников в результате оказания любых видов медицинской помощи.","Профилактика. Соблюдение медработниками принципов мед. деонтологии. Для предупреждения ятрогений необходимо проводить систематическую воспитательную работу со всем персоналом, общающимся с больными.","Наркомании и токсикомании - заболевания, возникающие в результате систематического злоупотребления различными химическими веществами и характеризующиеся следующими основными признаками: изменение толерантности (выносливости) к химическому веществу, патологическое пристрастие к интоксикации (патологическое влечение), изменение картины интоксикации (наркотического опьянения), возникновение абстинентного синдрома (симптомокомплекса соматовегативных, неврологических и психических нарушений при прекращении приема того или иного вещества). Важнейшим признаком является патологическое пристрастие, без наличия которого нельзя диагностировать наркоманию или токсикоманию. Токсикомания - заболевание, возникающее в результате злоупотребления веществами, не отнесенными к наркотикам. Все вещества, способные вызывать патологическое пристрастие, обозначаются как психоактивные средства. Токсикомания, вызываемая злоупотреблением летучими веществами (ингалянтами). Ингалянты угнетают деятельность коры головного мозга и стволовых структур, вызывают гипоксию. Они быстро проникают через легочную ткань (все жирорастворимые), кровь в мозг. Эффект воздействия начинается уже через несколько секунд после ингаляции. Токсическое поражение органов вызывают метаболиты летучих веществ, а не исходные формы. При регулярном употреблении лицо становится отечным, приобретает землистый цвет. Подростки отстают в развитии, теряют мыслительные способности вплоть до развития слабоумия."]},"3-21":{"t":"21. ЯВЛЕНИЯ, НАБЛЮДАЕМЫЕ ПРИ ФАРМАКОДИНАМИЧ ВЗАИМОДЕЙС ЛС (УСИЛЕНИЕ ЭФФЕКТА, РАЗНОВИД АНТАГОНИЗМА), ПРИМЕРЫ. ПРОБЛЕМЫ КОМБИНИР ФАРМАКОТЕРАП","p":["Фармакологическое взаимодействие разделяют на фармакокинетическое и фармакодинамическое взаимодействие.","Фармакодинамическое взаимодействие. Основными «мишенями» действия лекарственных веществ являются специфические рецепторы, ферменты, ионные каналы, транспортные системы. 1.Взаимодействие лекарственных веществ на уровне специфических рецепторов Налтрексон блокирует опиоидные рецепторы, поэтому на фоне налтрексона морфин не вызывает эйфории. Налтрексон используют при лечении морфинизма.","Возможно взаимодействие при влиянии веществ на разные рецепторы. Так, М-холиноблокатор ипратропий и бета-адреномиметик сальбутамол способны расслаблять гладкие мышцы бронхов и в качестве бронхорасширяющих средств действуют как синергисты. 2.Взаимодействие лекарственных веществ на уровне ферментов. Фосфорорганические соединения (ФОС) ковалентно связывают холинэстеразы, в частности, ацетилхолинэстеразу. В первые часы при отравлении ФОС могут быть эффективны реактиваторы холинэстеразы — тримедоксим (дипироксим) и изонитрозин. 3.Взаимодействие лекарственных веществ на уровне ионных каналов Активатор К+-каналов диазоксид, действуя на артериолы, вызывает гиперполяризацию мембраны мышечных волокон; на фоне гиперполяризации не открываются потенциалзависимые Са2+-каналы. Нифедипин - блокатор потенциал-зависимых Са2+-каналов. Оба препарата расширяют в основном артериальные сосуды. Нифедипин усиливает сосудорасширяющее действие диазоксида. 4.Взаимодействие лекарственных веществ на уровне транспортных систем.","На фоне действия трициклических антидепрессантов (имипрамин, амитриптилин) значительно ослабляется гипотензивное действие гуанетидина, так как трициклические антидепрессанты нарушают нейрональный захват гуанетидина Особые варианты взаимодействия лекарственных веществ.","Ацетилхолин обычно снижает артериальное давление, но в больших дозах на фоне действия атропина повышает артериальное давление (проявляется никотиноподобное действие ацетилхолина).","Адреналин обычно повышает артериальное давление, но на фоне действия фентоламина снижает артериальное давление (проявляется сосудорасширяющее действие адреналина, связанное с активацией бета-адренорецепторов).","Резерпин оказывает седативное действие и снижает артериальное давление. На фоне действия ингибиторов МАО резерпин вызывает возбуждение ЦНС и повышает артериальное давление.","Проблемы комбинированной фармакотерапии. Выбор комбинации ЛС относят к наиболее трудным элементам фармакотерапии. В настоящее время грамотная комбинированная фармакотерапия невозможна без учёта достижений клинической фармакологии в изучении механизмов взаимодействия ЛС."]},"3-22":{"t":"22.Характеристика фармококинетических несовместимостей: а)","p":["ПАСК и рифампицина; б) аспирина и фенобарбитала; в) неодикумарина и бутадиона; г) бутамида и бутадиона; д) этанола с метронидазолом и левомицетином; е) аспирина и антацидных средств; и) тетрациклина и препар, содерж металлы.","Взаимодействие лекарственных веществ может быть нежелательным, неблагоприятным.","Возможны ослабление терапевтических свойств лекарственных веществ, усиление их побочного действия или возникновение токсических эффектов. В таких случаях говорят о несовместимости лекарственных веществ.","Например, пенициллины оказывают бактерицидное действие на растущие микроорганизмы, а тетрациклины нарушают синтез белков и препятствуют росту бактерий. В связи с этим тетрациклины ослабляют действие пенициллинов.","а) ПАСК и рифампицин. Ослабление противомикробного действия рифампицина. Задержка парааминосалициловой кислотой всасывания рифампицина из ЖКТ.","б) Фенобарбитал и аспирин. Ослабление противовоспалительного, анальгезирующего, антипиретического и других видов фармакологического действия салицилатов. Повышение лекарственными средствами II группы растворимости, а следовательно, и экскреции салицилатов почками","в) Неодикумарин и бутадион. Усиление антикоагулирующего действия вплоть до геморрагического синдрома. Вытеснение лекарственными средствами бутадионом неодикумарина из комплекса с транспортными белками плазмы крови.","г) Бутамид и бутадион. Усиление гипогликемии, возможно развитие коматозного состояния.","Вытеснение бутадионом бутадина из комплексов с транспортными белками плазмы крови","д) Этанол с метронидазолом и левомицетином. Это сочетание вызывает тетурамоподобный эффект (торможение метоболизма этанола на стадии ацетальдегида).","е) Аспирин и антацидные средства. Уменьшение всасывания ацетилсалициловой кислоты под действием антацидных средств.","и) Тетрациклин и препараты, содержащие металлы. Тетрациклины образуют нерастворимые или труднорастворимые комплексы с катионами многовалентных металлов и соответственно нарушается всасывание взаимодействующих препаратов."]},"3-25":{"t":"25. ОСНОВНЫЕ ПРИНЦИПЫ ТЕРАПИИ ОТРАВЛЕНИЙ. АНТИДОТЫ ПРИ ОТРАВЛЕНИИ ТЯЖЕЛ МЕТАЛЛ; ФОС; МОРФИНОМ; МЕТИЛОВЫМ СПИРТОМ; БАРБИТУРАТАМИ; МУСКАРИНОМ.","p":["Основные принципы терапии отравлений:","1) удаление токсич в-ва с места попадания в организм и задержка его всасыв в кровь","2) уменьшение концентрации всосавшегося токсического вещества в крови и удаление его из организма","3) устранение действия всосавшегося в кровь токсического вещества","4) восстановление жизненно важных функций Тяжелые металлы: Антидоты связывают тяжелые металлы (ртуть, висмут, медь, свинец, железо и др.) в неактивные комплексы, которые хорошо растворимы в воде и быстро выводятся с мочой. К ним относятся унитиол, тетацин-кальций, пентацин, динатриевая соль этилендиаминтетрауксусной кислоты (ЭДТА), пеницилламин, деферроксамин ФОС: Препаратом экстренной помощи является атропин (0,1% раствор, 1 мл под кожу) или другой аналогичный м-холинолитик. В первые часы эффективно применение реактиваторов холинэстеразы: Дипироксим, Изонитрозин.","Удаление и детоксикация яда:","1) промывание желудка 0,02% раствором калия перманганата","2) абсорбирующие в-ва, солевое слабительное - магния сульфат, натрия сульфат","3) Форсированный диурез 4) Внутривенно р-ры натрия гидрокарбоната 4%, глюкозы 5%, натрия хлорида 0,9% 5) Перитонеальный диализ","Морфин:","1) П/к, в/в или в/м введение антидота морфина - анторфина 1-3 мл 0,5 % р-ра.","2) Форсированный диурез, ощелачивание крови.","3) Подкожно и в/в: атропин 1-2 мл 0,1 % р-ра, кордиамин - 2 мл.","4) Витаминотерапия: тиамин 3 мл 5 % раствора в вену повторно.","При развившемся токсическом действии используют специфический антагонист опиодных анальгетиков налоксон, блокирующий все типы опиоидных рецепторов. Он устраняет не только угнетение дыхания, но и большинство других эффектов. Вводят в\\в и в\\м.","Метиловый спирт: промывание желудка, прием активированного уголя.","Применение антидота – этанола – возможно внутривенно, перорально. Если пациент в сознании и может употреблять жидкость, то дозу вводимого спирта рассчитывают так, чтобы в сутки на каждый килограмм веса пациента приходилось 1-2 г 96% этилового спирта. При внутривенном введении этанола 40% спирт разводят в растворе глюкозы в количестве 50 мл и вводят каждые 3 часа.","Барбитураты: Делают промывание желудка, дают адсорбенты, солевые слабительные.","Проводят форсированный диурез. Показано также введение щелочных р-ров, гемосорбция, перитонеальный гемодиализ. Антидотом барбитуратов явл. Бемегрид, который вводится в/в медленно по 10 мл 0,5% р-ра.","Мускарин: Удаление яда из ЖКТ (путём промывания желудка и приёма адсорбентов), уменьшение его концентрации в крови (инфузионная терапия). В качестве антидота используют атропин и другие М-холиноблокаторы. Также могут быть показания к применению адреномиметиков или глюкокортикоидов."]},"3-27":{"t":"27. ПОНЯТИЕ О ПОБОЧНОМ ДЕЙСТВИИ ЛЕКАРСТВЕННЫХ ВЕЩЕСТВ. КЛАССИФИКАЦИЯ ОСНОВНЫХ РАЗНОВИДНОСТЕЙ ПОБОЧНОГО ДЕЙСТВИЯ.","p":["Побочное действие лекарственных средств — нежелательные эффекты, возникающие при применении лекарственных средств в лечебных дозах. Нежелательные эффекты, вызываемые лекарственными средствами в дозах, превышающих терапевтические, рассматриваются как токсические.","По патогенетическому принципу побочные эффекты лекарственных средств можно классифицировать следующим образом.","I. Побочные эффекты, обусловленные химической природой ЛС.","1. Побочные эффекты, обусловленные специфическими фармакологическими эффектами лекарственных средств:","а) вследствие действия на однотипные рецепторы в разных органах или на различные типы рецепторов;","б) вследствие изменения синтеза или биотрансформации эндогенных медиаторных веществ;","в) вследствие влияния на гуморальные регуляторные механизмы (ферментативные, гормональные).","2. Побочные эффекты цитотоксической природы:","а) общеклеточное цитотоксическое действие;","б) избирательное цитотоксическое действие.","3. Вторичные побочные эффекты, обусловленные:","а) изменениями сапрофитной микрофлоры в организме;","б) массовой гибелью возбудителей инфекционных и паразитарных болезней.","4. Побочные эффекты, обусловленные взаимодействием лекарственных средств друг с другом или с биологически активными ингредиентами пищевых продуктов.","5. Побочные эффекты аллергической природы.","6. Лекарственная зависимость.","7. Мутагенное, тератогенное и эмбриотоксическое действие.","II. Побочные эффекты, обусловленные особенностями реакции организма на ЛС.","1. Побочные эффекты, связанные с генетически предопределенными особенностями организма: а) вследствие ферментопатий; б) вследствие наследственных заболеваний с измененной реактивностью на лекарства.","2. Побочные эффекты, связанные с приобретенными особенностями организма:","а) вследствие изменения чувствительности организма к лекарственным средствам при некоторых физиологических состояниях (ранний детский возраст, старческий возраст, беременность, лактация); б) при заболеваниях органов, участвующих в элиминации лекарственных средств;","в) при заболеваниях, сопровождающихся изменениями чувствительности к лекарственным средствам; г) обусловленные особенностями личности больного; д) обусловленные вредными привычками или воздействием вредных факторов окружающей среды (курение, алкоголизм и т.д.)."]},"3-28":{"t":"28. ПОНЯТИЕ О БИОЛОГИЧЕСКОЙ СТАНДАРТИЗАЦИИ ЛВ. ПРЕПАРАТЫ, ДОЗЫ КОТОРЫХ ОПРЕДЕЛЯЮТСЯ МЕТОДАМИ БИОСТАНДАРТИЗАЦИИ (ПРИМЕРЫ).","p":["В тех случаях, когда качество лекарственного препарата не удается полностью охарактеризовать химическими и физико-химическими методами, прибегают к биологической стандартизации.","Биологической стандартизацией называют определение качества лекарственных препаратов с помощью биологических методов. В задачу биологической стандартизации входит определение количества действующего вещества в препарате путем установления его активности и испытание на отсутствие в нем недопустимых или нежелательных примесей.","Для количественного определения используется такое действие лекарственного вещества, от которого зависит его лечебная ценность.","Для биологической стандартизации важно, чтобы эффект, по которому устанавливается качество препарата, легко определялся, а еще лучше, чтобы он поддавался измерению. В первом случае при стандартизации определяется доза, вызывающая данную качественную ответную реакцию. Во втором случае устанавливается доза, которая вызывает реакцию определенной интенсивности.","Во всех случаях при стандартизации реакцию на испытуемый препарат сравнивают с реакциями на строго определенный препарат, принятый за стандарт.","Активность препаратов, подвергающихся биологической стандартизации, выражается в единицах действия (ЕД). Для ряда препаратов установлены международные стандарты и международные единицы действия (ME).","Для лекарственных препаратов, подлежащих биологической стандартизации, в специальных документах (технические условия, или фармакопейные статьи) указывается количество единиц действия на единицу веса препарата.","При биостандартизации проводят оценку активности сырья или препарата в сравнении со стандартным препаратом. Обычно активность препаратов определяют в опытах на лягушках и выражают в «лягушачьих ЕД». Одна лягушачья ЕД соответствует минимальной дозе стандартного препарата, в которой он вызывает остановку сердца в систоле у большинства подопытных лягушек. Так, 1 г листьев наперстянки должен содержать 50-66 лягушачьих ЕД; 1 г семян строфанта - 2 000 лягушачьих ЕД; 1 г дигитоксина - 8 000-10 000 лягушачьих ЕД; 1 г целанида - 14 000-16 000 лягушачьих ЕД; а 1 г строфантина - 44 000-56 000 лягушачьих ЕД.","Реже для стандартизации используют кошачьи и голубиные ЕД."]},"3-29":{"t":"29. ПРИНЦИПЫ КЛАССИФИКАЦИИ ЛЕКАРСТВЕННЫХ СРЕДСТВ. РАЗЛИЧНЫЕ ВИДЫ КЛАССИФИКАЦИИ ПРЕПАРАТОВ НА ПРИМЕРЕ АНТИБИОТИКОВ (ПО ИСТОЧНИКАМ ПОЛУЧЕНИЯ, МЕХАНИЗМУ И СПЕКТРУ ДЕЙСТВИЯ, ХИМИЧЕСКОЙ СТРУКТУРЕ И ДР.).","p":["Все современные лекарственные средства группируются по следующим принципам:","1. Терапевтическому применению. Например, препараты для лечения опухолей, снижения артериального давления, противомикробные.","2. Фармакологическому действию, т.е. вызываемому эффекту (вазодилататоры — расширяющие сосуды, спазмолитики — устраняющие спазм сосудов, анальгетики — снижающие болевое раздражение).","3. Химическому строению. Группы лекарственных препаратов, сходных по своему строению.","Таковы все салицилаты, полученные на основе ацетилсалициловой кислоты — аспирин, салициламид, метилсалицилат и т.д.","4. Нозологическому принципу. Ряд различныхлекарств, применяемых для лечения строго определенной болезни (например, средства для лечения инфаркта миокарда, бронхиальной астмы и т.д.).","Современная классификация антибиотиков:","1. По источникам получения: природные, синтетические, полусинтетические","2. По механизму действия:","а) ингибиторы синтеза клеточной стенки микроорганизма (пенициллины, цефалоспорины, ванкомицин, тейкопланин и др.);","б) антибиотики, нарушающие молекулярную организацию, функции клеточных мембран (полимиксин, нистатин, леворин, амфотерицин и др.);","в) антибиотики, подавляющие синтез белка и нуклеиновых кислот, в частности, ингибиторы синтеза белка на уровне рибосом (хлорамфеникол, тетрациклины, макролиды, линкомицин, аминогликозиды) и ингибиторы РНК-полимеразы (рифампицин) и др.","3. По спектру действия различают:","а) антибиотики широкого спектра действия","б) антибиотики узкого спектра действия","4. Классификация антибиотиков по химической структуре:","• β-лактамы (пенициллины, цефалоспорины, карбапенемы, монобактамы);","• гликопептиды; • липопептиды; • аминогликозиды;","• тетрациклины (и глицилциклины);","• макролиды (и азалиды);","• линкозамиды;","• хлорамфеникол/левомицетин;","• рифамицины;","• полипептиды;","• полиены;","• разные антибиотики (фузидиевая кислота, фузафунжин, стрептограмины и др.)."]},"3-3":{"t":"3.СОВРЕМЕННЫЕ НАПРАВЛЕНИЯ РАЗВИТИЯ ФАРМАКОЛОГИИ ФАРМАКОКИНЕТИКА, ФАРМАКОГЕНЕТИКА, МОЛЕКУЛЯРНАЯ ФАРМАКОЛОГИЯ, ХРОНОФАРМАКОЛОГИЯ.","p":["Фармакокинетика — раздел фармакологии, изучающий закономерности всасывания, распределения, метаболизма и выделения лекарственных средств. Исследование этих закономерностей основано на математическом моделировании указанных процессов.","Фармакогенетика — раздел медицинской генетики и фармакологии, изучающий зависимость реакций организма на лекарственные средства от наследственных факторов. Основной задачей Ф. является изучение этих реакций, разработка методов их диагностики, коррекции и профилактики.","Установлено, что причинами атипичных реакций организма на лекарственные средства обычно являются наследственные изменения ферментных систем, т.е. генетически обусловленные энзимопатии, а также некоторые наследственные болезни обмена веществ и иногда передающиеся по наследству пороки развития отдельных органов.","Молекулярная фармакология – это раздел фундаментальной фармакологии, изучающий механизмы “молекулярного узнавания” лекарственных средств на уровне молекул с помощью современных структурно-морфологических методов.","Хронофармакология - направление фармакологии, связывающее зависимость уровня физиологических функций от времени суток или других периодических колебаний состояния организма с эффективностью действия лекарственных средств. В зависимости от времени суток может изменяться и действие веществ, причем не только количественно, но иногда и качественно. В большинстве случаев наиболее выраженный эффект лекарств отмечается в период максимальной активности (у людей - в дневное время, у ночных животных - в темное время суток). В течение суток существенно меняется чувствительность организма к негативному действию препарата, а, следовательно, и токсичность веществ. Так, в экспериментах на животных в разное время суток летальный эффект фенобарбитала в токсической дозе колеблется от 0 до 100%."]},"3-32":{"t":"32. СУЩНОСТЬ МЕТОДА ЭКСПЕРИМЕНТАЛЬНОЙ ТЕРАПИИ И ЕГО РОЛЬ В ФАРМАКОЛОГИЧЕСКИХ ИССЛЕДОВАНИЯХ. СОВРЕМЕННЫЕ ПРИНЦИПЫ ПОИСКА НОВЫХ ЛВ. СХЕМЫ ИССЛЕДОВАНИЯ НОВЫХ ЛС (ПЕРВИЧНЫЙ СКРИНИНГ, МЕТОДЫ ПЛАЦЕБО).","p":["Экспериментальные методы — это новые и не полностью опробованные виды терапий, которые находятся на стадии научных, клинических исследований и экспериментов, которые не были включены в терапевтические стандарты. Применение экспериментальных методов лечения у пациентов требует особого юридического оформления, в отличие от использования стандартной терапии. Экспериментальные методы лечения могут быть эффективными, однако их внедрение в практику здравоохранения зависит от выполнения сложных административных процедур.","Поиск новых лекарственных средств развивается по следующим направлениям.","I. Химический синтез препаратов А. Направленный синтез:","1) воспроизведение биогенных веществ;","2) создание антиметаболитов;","3) модификация молекул соединений с известной биологической активностью;","4) изучение структуры субстрата, с которым взаимодействует ЛС;","5) сочетание фрагментов структур двух соединений с необходимыми свойствами;","6) синтез, основанный на изучении химических превращений веществ в организме.","Б. Эмпирический путь:","1) случайные находки; 2) скрининг.","II. Получение препаратов из лекарственного сырья и выделение индивидуальных в-в","1) животного происхождения; 2) растительного происхождения; 3) из минералов.","III. Выделение лекарственных веществ, являющихся продуктами жизнедеятельности грибов и микроорганизмов; биотехнология (клеточная и генная инженерия) Схемы исследования новых ЛС. При клиническом испытании новых ЛС следует исходить из ряда принципов. Прежде всего их необходимо исследовать на значительном контингенте больных. Во многих странах этому часто предшествует испытание на здоровых (добровольцах). Очень важно, чтобы каждое новое вещество сравнивалось с хорошо известными препаратами той же группы. При клиническом испытании веществ необходимо использовать объективные методы, позволяющие количественно оценить наблюдаемые эффекты. Комплексное исследование с использованием большого набора адекватных методик","- еще одно из требований, предъявляемых к клиническим испытаниям фармакологических в-в.","В случаях, когда в эффективности веществ существенную роль может играть элемент суггестии (внушения), используют плацебо - лекарств формы, которые по внешнему виду, запаху, вкусу и прочим св-вам имитируют принимаемый препарат, но не содержат ЛВ. При «слепом контроле» в неизвестной для больного последовательности чередуют ЛВ и плацебо.","При «двойном слепом контроле» об этом информировано третье лицо. Одной из разновидностей эмпирического поиска является скрининг. В этом случае любые химические соединения, которые могут быть предназначены и для немедицинских целей, проверяют на биологическую активность с использованием разнообразных методик."]},"3-4":{"t":"4.ОСОБЕННОСТИ ВСАСЫВАНИЯ И ДЕЙСТВИЯ ЛЕКАРСТВЕННЫХ СРЕДСТВ ПРИ ЭНТЕРАЛЬНОМ ВВЕДЕНИИ (СУБЛИНГВАЛЬНО, В ЖЕЛУДОК, РЕКТАЛЬНО). ВРЕМЯ РАЗВИТИЯ ЭФФЕКТА, ВЛИЯНИЕ РН СРЕДЫ ЖЕЛУДКА НА ВСАСЫВАНИЕ ЛЕКАРСТВ-КИСЛОТ И ЛЕКАРСТВОСНОВАНИЙ.","p":["1.Прием внутрь (оральный путь) При характеристике всасывания лекарственных средств из пищеварительного тракта необходимо учитывать, что слизистая оболочка желудка имеет большую толщину, малую всасывающую поверхность, высокое электрическое сопротивление, покрыта слизью. Эпителий кишечника тонкий, с низким электрическим сопротивлением, формирует значительную всасывающую поверхность. Лекарственные средства даже в виде ионов быстрее всасываются из кишечника. Эффект наступает через 15-40минут, дозы в 2-3раза выше, чем при парентеральном введении. В ряде случаев внутрь назначают лекарственные средства, предназначенные для местного действия в просвете кишечника. 2.Сублингвальный (рассасывание под языком) Рассасывание в полости рта обеспечивает быстрое поступление лекарственных средств в систему верхней полой вены, при этом отсутствует действие пищеварительных соков и ферментов печени. Сублингвально принимают только средства с высокой растворимостью в липидах - нитроглицерин для купирования приступа стенокардии, антигипертензивные средства - клофелин, нифедипин при гипертоническом кризе, стероидные гормоны метилтестостерон, прегнин, анаболические препараты. 3.Ректальный путь Ректальный путь необходим при невозможности приема лекарственных средств внутрь. Из прямой кишки 50% дозы всасывается в систему нижней полой вены, минуя печень, а 50% поступает в воротную вену и частично инактивируется в печени.","Наступление эффекта. Всасывание ЛС при пероральном приеме начинается через 15–30 мин.","Эффект при сублингвальном приеме наступает к концу первой минуты. Лечебный эффект при ректальном пути введения развивается через 5–15 мин.","С увеличением значения рН среды диссоциация кислот увеличивается, а оснований уменьшается."]},"3-5":{"t":"5.ОСОБЕННОСТИ ДЕЙСТВИЯ ЛЕКАРСТВЕННЫХ СРЕДСТВ ПРИ ПАРЕНТЕРАЛЬНОМ ВВЕДЕНИИ (ИНЪЕКЦИОННЫЕ ПУТИ, ИНГАЛЯЦИОННОЕ, ПЕРКУТАННОЕ ВВЕДЕНИЕ). ВРЕМЯ РАЗВИТИЯ ЭФФЕКТА, ДЛИТЕЛЬНОСТЬ ЭФФЕКТА И ВРЕМЯ СОХРАНЕНИЯ В КРОВИ АКТИВНОЙ КОНЦЕНТРАЦИИ. ФИЗИКО-ХИМИЧЕСКИЕ СВОЙСТВА ЛЕКАРСТВ, ИСКЛЮЧАЮЩИЕ ВОЗМОЖНОСТЬ ВНУТРИВЕННОГО, ВНУТРИМЫШЕЧНОГО, ПОДКОЖНОГО ВВЕДЕНИЯ.","p":["Внутривенное введение. При таком пути введения лекарственные вещества сразу попадают в системный кровоток, чем объясняется короткий латентный период их действия. В вену вводят водные растворы лекарственных веществ.","Если нужно быстро создать высокую концентрацию лекарственного вещества в крови, его вводят быстро, струйно. Внутривенное введение растворов больших объемов осуществляют капельным способом.","В небольших количествах внутривенно можно вводить гипертонические растворы. Из-за риска закупорки сосудов (эмболии) недопустимо внутривенное введение масляных растворов, суспензий, водных растворов с пузырьками газа. Введение в вену средств с раздражающим действием может привести к развитию тромбоза.","Внутримышечное введение. Внутримышечно вводят как липофильные, так и гидрофильные лекарственные вещества. Всасывание гидрофильных при внутримышечном введении происходит в основном путем фильтрации через межклеточные промежутки в эндотелии сосудов скелетных мышц. Липофильные ЛВ всасываются в кровь путем пассивной диффузии.","Мышечная ткань имеет хорошее кровоснабжение и поэтому всасывание лекарственных веществ в кровь происходит довольно быстро, что позволяет через 5-10 мин создать достаточно высокую концентрацию лекарственного вещества в крови Внутримышечно вводят водные растворы (до 10 мл), а для обеспечения длительного эффекта","- масляные растворы и суспензии, что задерживает всасывание вещества из места введения в кровь. Внутримышечно нельзя вводить гипертонические растворы и раздражающие вещества.","Подкожное введение. При введении под кожу лекарственные вещества (липофильные и гидрофильные) всасываются такими же способами, что и при внутримышечном введении.","Однако из подкожной клетчатки лекарственные вещества всасываются несколько медленнее, чем из мышечной ткани, поскольку кровоснабжение подкожной клетчатки менее интенсивно, чем кровоснабжение скелетных мышц.","Ингаляционное введение. Ингаляционно вводят газообразные вещества, пары легко испаряющихся жидкостей, аэрозоли и воздушные взвеси мелкодисперсных твердых веществ.","Всасывание лекарственных веществ в кровь с большой поверхности легких происходит очень быстро. Это один из самых распространенных способов введения бронхорасширяющих средств и препаратов глюкокортикоидов при бронхиальной астме. В этом случае всасывание веществ в кровь является нежелательным, так как приводит к появлению системных побочных эффектов.","Перкутанный способ введения лекарства, т. е. назначение лекарств через неповрежденную кожу, используется только в крайних случаях из-за практической непроницаемости ее в отношении большинства лекарственных веществ. Однако имеется большая группа химических соединений и среди них весьма ядовитых, обладающих способностью, как правило, растворяться в кожной смазке и легко всасываться, вызывая тяжелые отравления. К таким соединениям относятся фосфор, фенол, салициловая кислота, ртуть, некоторые ее соли и т. д.","Однако путем применения ускорителей всасывания - поверхностно-активных веществ солюбилизаторов, а также специальных обработок кожи (горячие компрессы, припарки) нередко удается ввести через неповрежденную кожу достаточные для лечебного воздействия дозы лекарственных веществ."]},"3-6":{"t":"6.ПУТИ ВЫВЕДЕНИЯ ЛЕКАРСТВЕННЫХ ВЕЩЕСТВ (ПРИМЕРЫ). ИЗМЕНЕНИЕ ЭЛИМИНАЦИИ ЛЕКАРСТВ В ЗАВИСИМОСТИ ОТ ДОЗЫ, ВОЗРАСТА, РАСТВОРИМОСТИ, ПОЛЯРНОСТИ, ИОНИЗИРОВАННОСТИ И СВЯЗИ С БЕЛКАМИ, ЗАБОЛЕВАНИЙ ПЕЧЕНИ, ПОЧЕК, ССС.","p":["Лекарственные вещества и их метаболиты выводятся из организма:","- с мочой – клубочковая фильтрация, активная канальцевая секреция – большинство лекарственных средств в свободной форме.","- с желчью – активный транспорт, пассивная диффузия, пиноцитоз – дигитоксин, пенициллины, тетрациклины, стрептомицин, хинин, стрихнин.","- через кишечник – пассивная диффузия, желчная секреция без рециклирования – доксициклин, ионизированные органические кислоты.","- со слюной – пассивная диффузия и активный транспорт – пенициллины, сульфаниламиды, салицилаты, этанол.","- через легкие – пассивная диффузия – средства д/ингаляционного наркоза, иодиды, камфора, этанол, эфирные масла.","- с потом – пассивная диффузия - некоторые сульфаниламиды.","- с молоком – пассивная диффузия и активный транспорт – непрямые антикоагулянты, антибиотики, соли лития.","Элиминация - удаление лекарственного вещества из организма путем как биотрансформации, так и экскреции.","Биотрансформация лекарств может происходить в печени, стенке кишечника, почках и других органах.","Лекарственные препараты могут влиять на скорость биотрансформации в печени, угнетая ее (индометацин, аминазин) или ускоряя (фенобарбитал).","На биотрансформацию лекарств влияет печеночный кровоток. Если препараты (ацетилсалициловая кислота) способны быстро инактивироваться, то при остром гепатите, когда скорость кровотока не снижена, их биотрансформация не меняется. Она уменьшается при цирротическом процессе, с обеднением кровотока.","Экскреция - удаление ксенобиотика из организма может быть осуществлено печенью, почками, кишечником, легкими, железа ми внешней секреции. Главное значение имеют печень и почки.","Печень экскретирует с желчью как неизмененные соединения, так и образовавшиеся в ней метаболиты. При этом большинство веществ обратно не всасываются и выводятся кишечником.","Выведение лекарств почками складывается из их фильтрации, секреции и реабсорбции.","Фильтрация лекарств в клубочках осуществляется пассивно. Молекулярная масса веществ не должна быть больше 5-10 тыс, они не должны быть связаны с белками плазмы крови. Секреция","- процесс активный, не зависящий от связывания препаратов с белками плазмы крови.","Реабсорбция глюкозы, аминокислот, катионов и анионов происходит активно, а жирорастворимых веществ - пассивно. У детей младшего возраста (до 3 лет) эти процессы осуществляются медленнее, чем в более старшем возрасте.","Фильтрация - основной механизм экскреции почками лекарств, не связанных с белками плазмы крови.","При почечной недостаточности корректировку режима дозирования осуществляют с помощью расчета клиренса эндогенного креатинина. Клиренс - это гипотетический объем плазмы крови, который полностью очищается от лекарственного средства за единицу времени. В норме клиренс эндогенного креатинина составляет 80-120 мл/мин."]},"3-7":{"t":"7.ОСНОВНЫЕ МЕХАНИЗМЫ ВСАСЫВАНИЯ. ВИДЫ КЛЕТОЧНЫХ МЕМБРАН И ПУТИ ТРАНСПОРТА ЧЕРЕЗ БИОМЕМБРАНЫ. ВЛИЯНИЕ ФИЗИКО-ХИМИЧЕСКИХ СВОЙСТВ ЛЕКАРСТВЕННЫХ СРЕДСТВ НА ТРАНСПОРТ ЛЕКАРСТВ (ИОНИЗИРОВАННОСТЬ, МОЛЕКУЛЯРНАЯ МАССА, РАСТВОРИМОСТЬ В ЛИПИДАХ И ДР.).","p":["Всасывание – это процесс поступления ЛС из места введения в кровь.","Различают 4 основные механизма всасывания: диффузия, фильтрация, активный транспорт, пиноцитоз.","Пассивная диффузия осуществляется через клеточную мембрану. Всасывание происходит до тех пор, пока концентрация лекарственного вещества по обе стороны биомембраны не сравняется. Пассивная диффузия веществ идет без затраты энергии по градиенту концентрации.","Облегченная диффузия – это транспорт лекарственных веществ через биологические мембраны с участием молекул специфических переносчиков. При этом перенос лекарства осуществляется также по градиенту концентрации, но скорость переноса при этом значительно выше.","Фильтрация осуществляется через поры клеточных мембран. Этот механизм пассивного всасывания идет без затраты энергии и осуществляется по градиенту концентрации.","Характерен для гидрофильных веществ.","Активный транспорт осуществляется с участием специфических транспортных систем клеточных мембран. В отличие от пассивной диффузии и фильтрации активный транспорт процесс энергозатратный и способен осуществляться против градиента концентрации.","Пиноцитоз (корпускулярная абсорбция или пенсорбция) представляет также разновидность всасывания с затратой энергии, осуществление которого возможно против градиента концентрации. При этом происходит захват лекарственного вещества и инвагинация клеточной мембраны с образованием вакуоли, которая направляется к противоположной стороне клетки, где происходит экзоцитоз с высвобождением лекарственного соединения.","Химическое строение, физико-химические и физические свойства лекарственных средств. Для эффективного взаимодействия вещества с рецептором необходима такая структура лекарственного средства, которая обеспечивает наиболее тесный контакт его с рецептором. От степени сближения вещества с рецептором зависит прочность межмолекулярных связей. Для взаимодействия вещества с рецептором особенно важно их пространственное соответствие, т. е. комплементарность. Это подтверждается различиями в активности стереоизомеров. Если вещество имеет несколько функционально активных группировок, то необходимо учитывать расстояние между ними. Многие количественные и качественные характеристики действия вещества зависят также от таких физических и физико-химических свойств, как растворимость в воде и липидах; для порошкообразных соединений очень важна степень их измельчения, для летучих веществ - степень летучести и т.д."]},"3-8":{"t":"8.РАСПРЕДЕЛЕНИЕ ЛЕКАРСТВЕННЫХ СРЕДСТВ В ОРГАНИЗМЕ; ЗАВИСИМОСТЬ ОТ МАССЫ ТЕЛА, ПРОНИЦАЕМОСТИ ТКАНЕЙ, СОСТОЯНИЯ ГЕМОДИНАМИКИ, СВЯЗЫВАНИЯ С БЕЛКАМИ ПЛАЗМЫ КРОВИ. ДЕПОНИРОВАНИЕ ЛЕКАРСТВЕННЫХ ВЕЩЕСТВ (ПРИМЕРЫ).","p":["Распределение лекарственных веществ - движение вещества от места всасывания до места действия и, далее, до места элиминации.","Большинство лекарственных средств распределяется неравномерно и лишь незначительная часть - относительно равномерно (например, некоторые ингаляционные средства для наркоза).","Существенное влияние на характер распределения веществ оказывают биологические барьеры, которые встречаются на пути их распространения: стенка капилляров, клеточные (плазматические) мембраны, гематоэнцефалический и плацентарный барьеры.","Через стенку капилляров, имеющую характер пористой, большинство лекарственных средств проходит довольно легко. Исключение составляют белки плазмы и их комплексы с препаратами. Гидрофильные соединения, хорошо растворимые в воде, проходят через поры стенки капилляров и попадают в интерстициальное пространство. Через белковофосфолипидные мембраны клеток они практически не диффундируют. Липофильные соединения хорошо проникают через эндотелий капилляров и клеточные мембраны.","Затруднено прохождение многих веществ через гематоэнцефалический барьер. Это связано с особенностями строения капилляров мозга. Через гематоэнцефалический барьер плохо проходят полярные соединения. Липофильные молекулы проникают в ткани мозга легко. В основном вещества проходят через гематоэнцефалический барьер путем диффузии, а некоторые соединения - за счет активного транспорта.","Сложным биологическим барьером является плацентарный барьер. Через него проходят липофильные соединения (путем диффузии). Ионизированные полярные вещества (например, четвертичные аммониевые соли) через плаценту проникают плохо.","В некоторой степени распределение зависит от сродства препаратов к тем или иным тканям.","Определенное значение имеет также интенсивность кровоснабжения органа или ткани.","Следует учитывать, что значительные количества веществ могут накапливаться на путях их выведения. Лекарственные средства, циркулирующие в организме, частично связываются, образуя внеклеточные и клеточные депо. К экстрацеллюлярным депо могут быть отнесены белки плазмы (особенно альбумины). Вещества могут накапливаться в соединительной ткани (некоторые полярные соединения, в том числе четвертичные аммониевые соли), в костной ткани (тетрациклины). Некоторые препараты (в частности, акрихин) в особенно больших количествах обнаруживаются в клеточных депо. Связывание их в клетках возможно за счет белков, нуклеопротеидов и фосфолипидов. Жировые депо представляют особый интерес, так как в них могут задерживаться липофильные соединения (в частности, некоторые средства для наркоза). Депонируются лекарственные средства, как правило, за счет обратимых связей.","Продолжительность их нахождения в тканевых депо варьирует в широких пределах. Так, некоторые сульфаниламиды образуют стойкие комплексы с белками плазмы, с чем частично связана значительная продолжительность их действия. Очень длительно задерживаются в организме ионы тяжелых металлов."]},"3-9":{"t":"9.Понятие о биодоступности лекарственных средств. Влияние","p":["лекарственной формы на биодоступность. Период полуэлиминации и его зависимость от связи препарата с белками плазмы крови.","Параметром, который характеризует абсорбцию лекарств является биодоступность.","Биодоступность показывает, какая часть от введенной дозы лекарства поступила в системный кровоток и характеризует скорость с которой это происходит. Факторы, влияющие на биодоступность:","1. Доза лекарственного вещества.","2. Путь введения лекарственного вещества (при внутривенном пути введения биодоступность 100%).","3. Химическая структура (некоторые препараты разрушаются кислым содержимым желудка, поэтому перорально не назначаются, например, пенициллин, инсулин).","4. Состояние ЖКТ (ускоренная перистальтика нарушает всасывание, следовательно, биодоступность снижается).","При внутривенном введении биодоступность лекарства составляет 100 %. (Но и при этом биодоступность может быть уменьшена введением другого препарата). Если же данное вещество введено другими путями (например, перорально), то его биодоступность уменьшается, в результате его неполного всасывания и метаболизма, которому это лекарственное средство подвергается в результате первого прохождения.","Период полуэлиминации выражает связь между объемом распределения и клиренсом вещества и зависит от обоих этих параметров. Время полуэлиминации препарата ( t1/2) зависит как от объема его распределения (Vd), так и от клиренса препарата (Cl). Изменения связывания препарата с белками могут влиять как на объем распределения, так и на клиренс препарата, иногда в совершенно противоположных направлениях.","Объемом распределения - условный объем жидкости, необходимый для равномерного распределения в нем лекарственного средства, обнаруживаемого в терапевтической концентрации в плазме крови.","Если объем распределения меньше 0,5 л/кг, лекарственный препарат находится преимущественно в плазме крови и во внеклеточной жидкости, если больше - лекарство распределено во всей водной фазе и в маловаскуляризованных тканях.","Если объем распределения более 1 л/кг, вещество преимущественно содержится в липидах, мышцах и других тканях. В этом случае применение гемосорбции при отравлении бесполезно."]}},"pg":[{"id":1,"src":1,"t":"Analyse et normes (PG 1–11)","q":"Задачи фармакогнозии ...","kind":"mcq","pre":"","o":["Химическое изучение растений","Ресурсно-товароведческое изучение растений","Химический синтез природных соединений растений","Нормирование и стандартизация лекарственного растительного сырья (ЛРС)","Изучение и использование опыта народной медицины"],"a":[1,2,4,5]},{"id":2,"src":2,"t":"Analyse et normes (PG 1–11)","q":"Целью макроскопического анализа является определение","kind":"mcq","pre":"","o":["чистоты и доброкачественности","подлинности ЛРС","наличия органических и минеральных примесей","содержания действующих 3 – а (железа закисного сульфат) ; 4 – б (Борнтрегер)."},{"id":287,"src":293,"t":"Groupes phénoliques (mélange)","q":"становите соответствие:","kind":"self","pre":"<p>Группа биологически активных соединений<\/p><p class=\"opt\">Антраценпроизводные;<\/p><p class=\"opt\">Дубильные вещества;<\/p><p class=\"opt\">Хромоны;<\/p><p class=\"opt\">Флавоноиды;<\/p><p>Физические свойства<\/p><p>а) белые или желтоватые кристаллические вещества без запаха, горького вкуса. Нерастворимы в воде, хорошо растворимы в органических растворителях;<\/p><p>б) бесцветные или окрашенные в желтые, оранжевые, красные, синие или фиолетовые аморфные или кристаллические вещества, без запаха, горького вкуса, с определенной температурой плавления. Оптически активны, способны флуоресцировать в УФ-свете, имеют характерные УФ-спектры и ИК-спектры;<\/p><p>в) кристаллические вещества желтого, оранжевого или красного цвета, горького вкуса.При нагревании до 200°С и выше способны возгоняться (сублимироваться) без разрушения основной структуры. Способны флуоресцировать в УФ-свете;<\/p><p>г) аморфные вещества желтого или желто-бурого цвета, без запаха, вяжущего вкуса, очень гигроскопичные. Хорошо растворяются в воде (особенно в горячей) с образованием коллоидных растворов, также растворимы в спиртах.<\/p>","ans":"1 – в ; 2 – г ; 3 – а ; 4 – б"},{"id":288,"src":294,"t":"Groupes phénoliques (mélange)","q":"Установите соответствие:","kind":"self","pre":"<p>Группа биологически активных соединенийХарактерные качественные реакции<\/p><p class=\"opt\">Флавоноиды;а) синее окрашивание с 10 % раствором натрия<\/p><p class=\"opt\">Антраценпроизводные;фосфорномолибденовокислого;<\/p><p class=\"opt\">Кумарины;б) проба Брианта;<\/p><p class=\"opt\">Простые фенолы;в) реакция микросублимирования;<\/p><p>г) лактонная проба.<\/p>","ans":"1 – б (проба Брианта) ; 2 – в (микросублимация) ; 3 – г (лактонная проба) ; 4 – а (фосфорномолибдат натрия)."},{"id":289,"src":295,"t":"Groupes phénoliques (mélange)","q":"Установите соответствие:","kind":"self","pre":"<p>Группа биологически активных соединенийВещество<\/p><p class=\"opt\">Дубильные вещества;а) арбутин;<\/p><p class=\"opt\">Кумарины; б) схизандрин;<\/p><p class=\"opt\">Простые фенолы;в) умбеллиферон;<\/p><p class=\"opt\">Лигнаны;г) кислота галловая.<\/p>","ans":"1 – г ; 2 – в ; 3 – а ; 4 – б"},{"id":290,"src":296,"t":"Groupes phénoliques (mélange)","q":"Установите соответствие:","kind":"self","pre":"<p>Группа биологически активных соединенийКачественные реакции<\/p><p class=\"opt\">Дубильные вещества;а) синее окрашивание с 10 % раствором натрия<\/p><p class=\"opt\">Кумарины;фосфорномолибденовокислого;<\/p><p class=\"opt\">Хромоны;б) хлопьевидный осадок с 1 % раствором желатина;<\/p><p class=\"opt\">Простые фенолы;в) реакция с 0,1 % раствором уранилацетата;<\/p><p>г) лактонная проба.<\/p>","ans":"1 – б (желатин) ; 2 – г (лактонная проба) ; 3 – в (уранилацетат) ; 4 – а (фосфорномолибдат)."},{"id":291,"src":297,"t":"Groupes phénoliques (mélange)","q":"Установите соответствие:","kind":"self","pre":"<p>Группа биологически активных соединенийСтроение<\/p><p class=\"opt\">Антраценпроизводные;а) 9,10-бензо-альфа-пирон;<\/p><p class=\"opt\">Кумарины; б) ядро антрацена;<\/p><p class=\"opt\">Хромоны;в) димеры фенилпропанового ряда;<\/p><p class=\"opt\">Лигнаны;г) бензо-гамма-пирон.<\/p>","ans":"1 – б ; 2 – а ; 3 – г ; 4 – в"},{"id":292,"src":298,"t":"Groupes phénoliques (mélange)","q":"УКАЖИТЕ НЕСКОЛЬКО ПРАВИЛЬНЫХ ОТВЕТОВ.","kind":"mcq","pre":"<p>Качественные реакции на конденсированные дубильные вещества:<\/p>","o":["Черно-зеленое окрашивание или осадок с 1 % раствором квасцов железоаммонийных;","Черно-синее окрашивание или осадок с 1 % раствором квасцов железоаммонийных;","Проба Стиасни;","Реакция Борнтрегера;","Оранжевый или желтый осадок с бромной водой."],"a":[1,3,5]},{"id":293,"src":299,"t":"Groupes phénoliques (mélange)","q":"Установите соответствие:","kind":"self","pre":"<p>Лекарственное растительное сырьеДействующее вещество<\/p><p class=\"opt\">Трава зверобоя пятнистого;а) келлин;<\/p><p class=\"opt\">Плоды амми большой;б) гиперицин;<\/p><p class=\"opt\">Плоды амми зубной;в) бергаптен;<\/p><p class=\"opt\">Корневища с корнями подофилла;г) виснагин;<\/p><p>д) подофиллотоксин.<\/p>","ans":"1 – б (гиперицин) ; 2 – в (бергаптен) ; 3 – а, г (келлин, виснагин) ; 4 – д (подофиллотоксин)."},{"id":294,"src":300,"t":"Groupes phénoliques (mélange)","q":"УКАЖИТЕ НЕСКОЛЬКО ПРАВИЛЬНЫХ ОТВЕТОВ.","kind":"mcq","pre":"<p>Качественные реакции на флавоноиды:<\/p>","o":["Проба Брианта;","Реакция Борнтрегера;","Реакция азосочетания с диазосоединениями;","Реакция микросублимации (микровозгонки);","Реакция с солями железа (III)."],"a":[1,3,5]},{"id":295,"src":301,"t":"Groupes phénoliques (mélange)","q":"УКАЖИТЕ ПРАВИЛЬНЫЙ ОТВЕТ.","kind":"mcq","pre":"<p>На рисунке изображена формула:<\/p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAACrCAIAAADAXBY4AAAAAXNSR0IArs4c6QAACVRJREFUeF7tndGS4yoOQLe36v7/B+9Db25RxXjsGAuQhISPn2bSWIijYxq7E/Lz+/v7Hw4IvIPAf98xTEYJgX8JoDsenAn8czhOP/v85Cuvu9ejwUX3aBVZnM9H3P8djiweC6mhuxDUK5oV149D/fx3J+PR/RUeSwZ5db2ctZPx6C4xgTabEPjhQeQmlZwext3s/glcf9RY2JxWQdPpmARgdjfBunHQ441s/XeW8aJ7lkqRpwIBdFeASIgsBNA9S6XM87x7AtNY05vnpN0BumsTzRzvavxOrn8qg+6Z9TTIvRhfjxTPW+QYeBApZ0XL9ASY3dOXkAHICaC7nBUt0xNA9/QlNBrATu8Mq4jQ3cgWwkYkgO4Rq0JORgTQ3QgsYSMSQPeIVSEnIwLobgSWsBEJoHvEqpCTEQF0NwJL2IgE0D1iVcjJiAC6G4ElbEQC6B6xKuRkRADdjcASNiIBdI9YFXIqBNS370N31ApKwGL7PnQPWuyXp2W0fR+6v9yriMO3274P3SPWm5yMCKC7EVjCmhM43sjWf7d7RXfzqtCBEYGB7fvQ3agWicOWmbLuwJF4JJfU0X2nas6OpYpetpcp02d5cTZ0jPPRPUYdAmRRn3OfcvGX3m77PnQPINrqFOqk3kikSu+TrNH2fewi5lO+oL2UVcrXnfHuHn43Thke5F3M4yLqlGQjvcZGf+g+XKPcJ7ZFv7sG6pi1pNeKIywGugtBbdVMa+aelPUuDTvW6G7HNmLkgdXL4zAGpB845TENSQN0l1Daoc3k6uURgXCqXiV6yR/dH+u4QwOt1UubxaPKwkvCjji627ENEbn90MPi2wq+9vh4JfjAQncfzgt6sVimy4dRew8iOosZee3ytfRZvTxyWb56OWXIX1UfS7ZJg/qnU4sFTBZG6J6lUrN5lncBzEZJfj66Jy8g6fcQQPceWrQVEDi+0UXQ3LUJurviprO1BNB9LX96dyWA7q646WwtAXRfy5/eXQmguytuOltLAN3X8qd3VwLo7oqbztYSQPe1/OndlQC6u+Kms7UE0H0tf3p3JYD .И. Гизе;","А.П. Орехов;","Г. Драгендорф."],"a":[2]},{"id":301,"src":307,"t":"Alcaloïdes","q":"Установите соответствие:","kind":"self","pre":"<p class=\"opt\">Производные хинолизидина;а) пахикарпин;<\/p><p class=\"opt\">Производные изохинолина;б) колхамин;<\/p><p class=\"opt\">Ациклические алкалоиды;в) термопсин;<\/p><p>г) папаверин.<\/p>","ans":"1 – а, в (пахикарпин, термопсин) ; 2 – г (папаверин) ; 3 – б (колхамин)."},{"id":302,"src":308,"t":"Alcaloïdes","q":"Установите соответствие:","kind":"self","pre":"<p>Группа алкалоидов:Свойства<\/p><p class=\"opt\">Кислородсодержащие алкалоиды;а) летучие маслянистые жидкости;<\/p><p class=\"opt\">Бескислородные алкалоиды;б) твердые кристаллические вещества;<\/p><p>в) без запаха;<\/p><p>г) с сильным неприятным запахом;<\/p><p>д) легко перегоняются с водяным паром.<\/p>","ans":"Кислородсодержащие – б, в ; бескислородные – а, г, д."},{"id":303,"src":309,"t":"Alcaloïdes","q":"Установите соответствие:","kind":"self","pre":"<div class=\"tw\"><table><tr><td>Группа реакций: 1. Реакция осаждения; Реакции окрашивания;<\/td><td>Название реактивов: а) Реактив Майера; б) Реактив Эрдмана; в) Реактив Марки; г) Реактив Бушарда.<\/td><\/tr><\/table><\/div>","ans":"Осаждения – а, г (Майер, Бушард) ; окрашивания – б, в (Эрдман, Марки)."},{"id":304,"src":310,"t":"Alcaloïdes","q":"УКАЖИТЕ ПРАВИЛЬНЫЙ ОТВЕТ.","kind":"mcq","pre":"<p>Впервые алкалоид в чистом виде выделил:<\/p>","o":["Ф. И. Гизе;","Ф. В. Сертюрнер;","Дерон;","К. Мейснер."],"a":[2]},{"id":305,"src":311,"t":"Alcaloïdes","q":"становите соответствие:","kind":"self","pre":"<p class=\"opt\">Кислородсодержащие алкалоиды;а) нуфлеин;<\/p><p class=\"opt\">Бескислородные алкалоиды;б) анабазин;<\/p><p class=\"opt\">Серосодержащие алкалоиды;в) папаверин;<\/p><p>г) пахикарпин;<\/p><p>д) кодеин.<\/p>","ans":"Кислородсодержащие – в, д (папаверин, кодеин) ; бескислородные – б, г (анабазин, пахикарпин) ; серосодержащие – а (нуфлеин)."},{"id":306,"src":312,"t":"Alcaloïdes","q":"Установите соответствие:","kind":"self","pre":"<p>Название реактива:Алкалоиды:<\/p><p class=\"opt\">Реакция Витали-Морена;а) пуриновые алкалоиды;<\/p><p class=\"opt\">Мурексидная проба;б) алкалоиды спорыньи;<\/p><p class=\"opt\">Реактив Ван-Урка;в) тропановые алкалоиды.<\/p>","ans":"1 – в ; 2 – а ; 3 – б"},{"id":307,"src":313,"t":"Alcaloïdes","q":"Установите соответствие:","kind":"self","pre":"<p class=\"opt\">Производные пирролизидина;а) соласонин;<\/p><p class=\"opt\">Стероидные алкалоиды;б) хелеритрин;<\/p><p class=\"opt\">Производные изохинолина;в) платифиллин;<\/p><p>г) протовератрины;<\/p><p>д) кодеин.<\/p>","ans":"1 – в (платифиллин) ; 2 – а, г (соласонин, протовератрины) ; 3 – б, д (хелеритрин, кодеин)."},{"id":308,"src":314,"t":"Huiles grasses","q":"Выберите несколько вариантов ответа.","kind":"mcq","pre":"<p>Физико-химические свойства смол:<\/p>","o":["Твёрдые, обычно аморфные, вязкие, реже кристаллические вещества или сиропообразные жидкости;","Маслянистые жидкости с характерным запахом, легче воды;","Плавятся при нагревании, образуя плёнку;","При нагревании испаряются, оставляя жирное пятно;","При горении дают коптящее пламя."],"a":[1,3,5]},{"id":309,"src":315,"t":"Huiles grasses","q":"УКАЖИТЕ ПРАВИЛЬНЫЕ ОТВЕТЫ","kind":"self","pre":"<p>В отличие от жиров воски:1) трудно омыляются водными растворами щелочей;2) легко омыляются водными растворами щелочей;<\/p><p class=\"opt\">при сжигании не выделяют акролеина, т.к. не содержат глицерина;<\/p><p class=\"opt\">легко растворимы в воде и спирте;5) очень стойки и почти не прогоркают при хранении.<\/p>","ans":"Воски : трудно омыляются (1), не дают акролеина (нет глицерина) (3), очень стойки и почти не прогоркают (5)."},{"id":310,"src":316,"t":"Ressourcologie","q":"Установите соответствие:","kind":"self","pre":"<p>Заготавливаемое растительное сырьеОпределение урожайности<\/p><p class=\"opt\">Побеги багульника болотного;а) метод учетных площадок;<\/p><p class=\"opt\">Трава чабреца;б) метод модельных экземпляров;<\/p><p class=\"opt\">Корень барбариса обыкновенного;в) определение проективного покрытия.<\/p><p class=\"opt\">Трава ландыша майского;<\/p><p>.<\/p>","ans":"1 – б ; 2 – в ; 3 – б ; 4 – а"},{"id":311,"src":317,"t":"Ressourcologie","q":"ЗАПОЛНИТЕ СХЕМУ!","kind":"self","pre":"<p>( Выберите из «библиотеки» правильные ответы и поставьте их буквенные обозначения в квадраты).<\/p><p>Последовательность операций при определении урожайности методом модельных экземпляров:<\/p><p>1 [ ] 2 [ ] 3 [ ] 4 [ ] 5 [ ]<\/p><p>А. Взвешивание сырьевой части каждого модельного экземпляра;<\/p><p>Б. Расчет средней величины массы модельного экземпляра;<\/p><p>В. Закладка учётных площадках размером от 0,25 до 10 м2;<\/p><p>Г. Рассчитывают урожайность как произведение среднего проективного покрытия на среднюю массу модельного экземпляра;<\/p><p>Д. Отбор модельных экземпляров;<\/p><p>Е. Рассчитывают урожайность как произведение числа экземпляров на единицу площади на среднюю массу модельного экземпляра.<\/p>","ans":"В → Д → А → Б → Е"},{"id":312,"src":318,"t":"Ressourcologie","q":"Установите соответствие:","d":1,"kind":"self","pre":"<p>Заготавливаемое сырьеПериодичность заготовок<\/p><p class=\"opt\">Плоды шиповника;а) один раз в 2 года;<\/p><p class=\"opt\">Трава зверобоя продырявленного;б) не чаще одного раза в 15-20 лет;<\/p><p class=\"opt\">Корневище и корни элеутерококка колючего;в) один раз в 4-6 лет;<\/p><p class=\"opt\">Трава горца птичьего; г) ежегодно.<\/p>","ans":"1 – г ; 2 – а ; 3 – б ; 4 – г"}]};</script>

{n:1,q:'Фармакогнозия. Определение. Задачи. Значение.',p:[
'Фармакогнозия — наука о лекарственном растительном сырье (ЛРС) и продуктах его первичной переработки, а также о сырье животного происхождения.',
'Задачи: поиск новых лекарственных растений; химическое изучение БАВ; стандартизация и контроль качества ЛРС; ресурсоведение (запасы, рациональная заготовка, воспроизводство); изучение опыта народной медицины.',
'Значение: ЛРС — источник индивидуальных веществ (атропин, дигоксин, рутин), галеновых и новогаленовых препаратов, сборов и чаёв.']},
{n:2,q:'Нормативная документация на ЛРС.',p:[
'ГФ РФ: общие фармакопейные статьи (ОФС — методы анализа, отбор проб) и фармакопейные статьи (ФС) на конкретное сырьё.',
'Также: ГОСТы, ОСТы, ФСП (фармакопейные статьи предприятия), нормативная документация производителя.',
'Содержание ФС: определение сырья, внешние признаки, микроскопия, качественные реакции и ТСХ, числовые показатели (влажность, зола, примеси, измельчённость, содержание ДВ), упаковка, маркировка, хранение, срок годности.']},
{n:3,q:'Отбор проб. Товароведческий анализ. Точечная, объединённая, аналитическая проба.',p:[
'Партия — количество однородного ЛРС, оформленное одним документом качества.',
'Объём выборки (ГФ): до 5 единиц — все; 6–50 единиц — 5 единиц; свыше 50 — 10 % (дробное число округляют в большую сторону).',
'Точечная проба — взятая за один раз из одного места; из каждой вскрытой единицы — 3 точечные пробы (сверху, из середины, снизу).',
'Объединённая проба = совокупность точечных. Из неё выделяют: среднюю пробу (квартованием) и пробы на зараженность вредителями и микробиологическую чистоту.',
'Из средней пробы — аналитические пробы: 1) внешние признаки, микроскопия, качественные реакции, измельчённость, примеси; 2) влажность; 3) зола и действующие вещества.']},
{n:4,q:'Зараженность амбарными вредителями. Степени. Меры борьбы. Примеси.',p:[
'Вредители: клещи, амбарная моль, хлебный точильщик и их личинки. Аналитическую пробу просеивают; клещей ищут в просеве, моль и точильщика — в сырье на сите.',
'Степени (на 1 кг): I — клещей не более 20, моли/точильщика не более 5; II — клещей больше 20, свободно передвигаются, моли/точильщика 6–10; III — клещи образуют сплошные войлочные массы, моли/точильщика больше 10.',
'I степень — сырьё используют после очистки; II — после очистки и повторного анализа; III — сырьё бракуют.',
'Меры: профилактика (чистые, сухие, проветриваемые склады, контроль поступающего сырья), дезинсекция (фумигация), отсев и прогрев сырья.',
'Примеси: допустимые в пределах норм (изменившие окраску части, другие части растения, органическая и минеральная примесь) и недопустимые (части ядовитых растений, стекло, помёт грызунов и птиц).']},
{n:5,q:'Гистохимический и микрохимический анализ. Реакции на группы БАВ. Макро-, микроскопический и химический анализ.',p:[
'Макроскопический анализ — подлинность по внешним признакам: форма, размеры (линейка, миллиметровая бумага, лупа), цвет (при дневном свете), запах (при растирании), вкус (только неядовитое сырьё).',
'Микроскопический анализ — диагностические признаки анатомического строения; включающие жидкости: вода, глицерин, хлоралгидрат.',
'Микрохимия: крахмал — раствор Люголя, синее; слизь — тушь (белые пятна на тёмном фоне), метиленовый синий; жирные и эфирные масла — Судан III, оранжево-красное; одревеснение — флороглюцин + конц. кислота, малиново-красное; дубильные — железоаммонийные квасцы, чёрно-синее или чёрно-зелёное; инулин — α-нафтол + конц. H₂SO₄, розово-фиолетовое; антраценпроизводные — щёлочь, красное.',
'Химический анализ: качественные реакции, ТСХ, люминесцентный анализ, количественное определение ДВ.']},
{n:6,q:'Химический состав ЛРС. Действующие, сопутствующие, балластные вещества. Первичный и вторичный метаболизм.',p:[
'Действующие вещества — обуславливают фармакологический эффект (алкалоиды, гликозиды и т. д.).',
'Сопутствующие — влияют на всасывание, стабильность и силу действия действующих веществ (сапонины, слизи, дубильные).',
'Балластные — индифферентные (клетчатка, крахмал, хлорофилл); их часто удаляют при переработке.',
'Первичный метаболизм: углеводы, липиды, белки, аминокислоты, витамины. Вторичный: алкалоиды, гликозиды, терпеноиды и эфирные масла, фенольные соединения.']},
{n:7,q:'Методы выявления новых лекарственных растений.',p:[
'Изучение опыта народной медицины.',
'Химический скрининг: сплошной (массовый) и направленный — по группам БАВ.',
'Филогенетический (хемотаксономический) принцип: родственные виды содержат сходные БАВ.',
'Массовые фармакологические исследования экстрактов; случайные находки.']},
{n:8,q:'Заготовительный процесс. Этапы. Сушка. Хранение ЛРС.',p:[
'Сроки сбора: почки — ранней весной до распускания; кора — весной в период сокодвижения; листья — в бутонизацию и цветение; цветки — в начале цветения; травы — в цветение; плоды и семена — при полной зрелости; подземные органы — осенью или ранней весной.',
'Этапы: сбор, первичная обработка, сушка, приведение в стандартное состояние, упаковка и маркировка, хранение.',
'Сушка: эфирномасличное — 30–35 (40) °С, толстым слоем; сердечные гликозиды — 50–60 °С, быстро; алкалоиды — до 50 °С; витамин С (плоды шиповника) — 80–90 °С.',
'Хранение раздельно: общее сырьё, ядовитое и сильнодействующее, эфирномасличное, плоды и семена. Сухое, прохладное, проветриваемое помещение, защищённое от света. Сырьё с сердечными гликозидами — ежегодный переконтроль активности.']},
{n:9,q:'Определение экстрактивных веществ, влажности, золы.',p:[
'Влажность (потеря в массе при высушивании): навеску сушат при 100–105 °С до постоянной массы; учитываются гигроскопическая вода и летучие вещества.',
'Зола общая: сжигание и прокаливание при 500–600 °С до постоянной массы. Зола, нерастворимая в 10 % HCl, показывает примесь песка и земли.',
'Экстрактивные вещества: навеску экстрагируют растворителем, указанным в ФС, аликвоту выпаривают, остаток сушат при 100–105 °С; результат — в % на абсолютно сухое сырьё. Определяют, когда группа ДВ неизвестна или нет методики их количественного определения.']},
{n:10,q:'Ресурсоведение. Определение урожайности. Этапы экспедиционного исследования.',p:[
'Ресурсоведение изучает запасы лекарственных растений, их рациональное использование и воспроизводство.',
'Этапы: подготовительный (литература, карты), экспедиционный (выявление зарослей, их площадь, урожайность), камеральный (расчёт запасов).',
'Урожайность: метод учётных площадок (некрупные травы), модельных экземпляров (кустарники, деревья, крупные травы), проективного покрытия (низкорослые растения, образующие дерновины).',
'Биологический запас = урожайность × площадь заросли. Эксплуатационный запас — часть биологического, которую можно заготовить без ущерба. Объём ежегодной заготовки = эксплуатационный запас / (период восстановления + 1).']},
{n:11,q:'Степень измельчённости ЛРС (цельного, измельчённого, порошкованного).',p:[
'Навеску просеивают через сита, указанные в ФС; взвешивают фракции.',
'Цельное сырьё: определяют частицы, прошедшие сквозь сито (мелочь). Измельчённое сырьё и порошок: определяют частицы, не прошедшие сквозь крупное сито, и прошедшие сквозь мелкое.',
'Просеивание закончено, если за 1 мин дополнительного просева проходит менее 1 % массы.']},
{n:12,q:'Витамины. Классификации. Свойства. Качественные реакции и количественное определение. Применение.',p:[
'Классификации: по растворимости (водорастворимые: C, группы B, P; жирорастворимые: A, D, E, K, F); химическая: алифатические (C, F, пантотеновая кислота), алициклические (A, D), ароматические (K), гетероциклические (B₁, B₆, E, P).',
'Аскорбиновая кислота: белый кристаллический порошок кислого вкуса, легко окисляется. Обнаружение — ТСХ с 2,6-дихлорфенолиндофенолятом натрия (белые пятна на розовом фоне). Количественно — титрование 2,6-дихлорфенолиндофенолятом натрия.',
'Каротиноиды: с конц. H₂SO₄ — синее окрашивание; количественно — спектрофотометрия.',
'ЛРС: плоды шиповника, чёрной смородины, облепихи, рябины; листья крапивы (вит. К); трава пастушьей сумки; цветки календулы; кукурузные столбики с рыльцами.',
'Применение: гипо- и авитаминозы, кровоостанавливающее (К), капилляроукрепляющее (Р).']},
{n:13,q:'Жирные масла. Классификация, получение, очистка, анализ. Свойства. Применение.',p:[
'Жирные масла — сложные эфиры глицерина и высших жирных кислот.',
'По высыхаемости (по йодному числу): невысыхающие (оливковое, миндальное, касторовое), полувысыхающие (подсолнечное, кукурузное, хлопковое), высыхающие (льняное, конопляное, маковое).',
'Получение: холодное и горячее прессование, экстракция органическими растворителями. Очистка (рафинация): механическая, коагуляция (белки, слизи), нейтрализация (свободные кислоты), вымораживание.',
'Подлинность: органолептика, плотность, показатель преломления, йодное число, число омыления. Доброкачественность: кислотное и перекисное числа.',
'Химические свойства: гидролиз и омыление (эфирные связи), гидрирование и окисление (двойные связи), образование акролеина (глицерин).',
'Применение: основы мазей и линиментов, растворители для инъекций, касторовое — слабительное, облепиховое — ранозаживляющее.']},
{n:14,q:'Полисахариды: крахмал, инулин, целлюлоза, пектины, камеди, слизи.',p:[
'Гомополисахариды (крахмал = амилоза + амилопектин, инулин — фруктозан, целлюлоза) и гетерополисахариды (слизи, камеди, пектины).',
'Свойства: высокомолекулярные, аморфные; слизи набухают в воде, осаждаются спиртом; при гидролизе дают моносахариды и уроновые кислоты.',
'Реакции: крахмал — раствор Люголя, синее; инулин — α-нафтол + конц. H₂SO₄ (с Люголем синего окрашивания нет); слизь — тушь, метиленовый синий, осаждение спиртом.',
'Количественно: гравиметрия (осаждение спиртом), показатель набухания.',
'Сушка 40–50 °С. ЛРС: корни алтея, листья подорожника большого, семена льна, слоевища ламинарии, цветки липы.',
'Применение: обволакивающее, отхаркивающее, мягчительное, слабительное (ламинария, лён).']},
{n:15,q:'Алкалоиды. Классификации. Свойства. Качественные реакции, количественное определение. Применение.',p:[
'Алкалоиды — азотсодержащие органические соединения основного характера с сильным специфическим действием; в растениях находятся в виде солей.',
'Химическая классификация (А. П. Орехов) — по азотистому гетероциклу: пирролидиновые, пиперидиновые, тропановые, хинолизидиновые, хинолиновые, изохинолиновые, индольные, пуриновые, стероидные, дитерпеновые, с азотом в боковой цепи (протоалкалоиды).',
'Свойства: основания не растворимы в воде, растворимы в органических растворителях; соли — наоборот. Бескислородные — летучие маслянистые жидкости (никотин, анабазин); кислородсодержащие — кристаллические вещества.',
'Осадочные реактивы (в кислом извлечении): Драгендорфа, Майера, Вагнера–Бушарда, кремневольфрамовая и фосфорномолибденовая кислоты. Цветные: Марки, Эрдмана, Фреде. Специфические: Витали–Морена (тропановые), мурексидная проба (пуриновые), Ван-Урка (спорынья).',
'Количественно: гравиметрия, титриметрия (прямая и обратная ацидиметрия), спектрофотометрия.',
'Сушка до 50 °С; хранение — отдельно, как ядовитое или сильнодействующее сырьё. ЛРС: листья красавки, белены, дурмана; трава чистотела, термопсиса; рожки спорыньи; листья чая.']},
{n:16,q:'Дубильные вещества. Классификация. Свойства. Качественные реакции, количественное определение. Применение.',p:[
'Полифенольные соединения, способные осаждать белки (дубить кожу).',
'Классификация (Фрейденберг): гидролизуемые (галлотанины, эллаготанины) и конденсированные (производные катехинов, не гидролизуются, при нагревании с кислотами дают флобафены).',
'Свойства: аморфные, растворимы в воде и спирте, не растворимы в хлороформе и эфире; вяжущий вкус.',
'Реакции: с желатином — осадок; с алкалоидами и солями тяжёлых металлов — осадок; с железоаммонийными квасцами — чёрно-синее (гидролизуемые) или чёрно-зелёное (конденсированные); бромная вода — осадок с конденсированными.',
'Количественно (ГФ): перманганатометрия по Левенталю (индикатор индигосульфокислота).',
'Сушка 40–60 °С или на солнце. ЛРС: кора дуба, корневища змеевика, бадана, лапчатки, корни кровохлебки, соплодия ольхи, плоды черники и черёмухи.',
'Применение: вяжущее, противовоспалительное, кровоостанавливающее; антидот при отравлении алкалоидами и солями тяжёлых металлов.']},
{n:17,q:'Кумарины. Классификация. Свойства. Качественные реакции, количественное определение. Применение.',p:[
'Кумарины — производные бензо-α-пирона (лактон цис-орто-оксикоричной кислоты).',
'Классификация: простые (кумарин, умбеллиферон, скополетин), фурокумарины (псорален, бергаптен, ксантотоксин), пиранокумарины, куместаны.',
'Свойства: кристаллические, флуоресцируют в УФ-свете; лактонное кольцо раскрывается в горячей щёлочи и замыкается при подкислении.',
'Реакции: лактонная проба, азосочетание с диазотированными реактивами, флуоресценция в УФ, ТСХ.',
'Количественно: спектрофотометрия, фотоколориметрия, полярография.',
'ЛРС: плоды амми большой, пастернака посевного, псоралеи; трава донника. Применение: фотосенсибилизирующее (витилиго, псориаз), спазмолитическое, антикоагулянтное.']},
{n:18,q:'Антраценпроизводные. Классификация. Свойства. Качественные реакции, количественное определение. Применение.',p:[
'Классификация: мономеры — окисленные (антрахиноны: производные хризацина и ализарина) и восстановленные (антранолы, антроны, оксиантроны); димеры (диантроны: сеннозиды); конденсированные (гиперицин).',
'Свойства: кристаллические, жёлтые, оранжевые, красные; агликоны возгоняются; флуоресцируют в УФ жёлтым, оранжевым, красным.',
'Реакции: Борнтрегера (со щёлочью — красное окрашивание), микросублимация, с ацетатом магния.',
'Количественно: фотоколориметрия или спектрофотометрия после гидролиза.',
'ЛРС: кора крушины (используют после 1 года хранения или прогрева 1 ч при 100 °С — восстановленные формы вызывают рвоту), листья сенны, корни ревеня, плоды жостера, корневища марены.',
'Применение: производные хризацина — слабительное; ализарина — мочегонное и нефролитическое (марена).']},
{n:19,q:'Флавоноиды. Классификация. Свойства. Качественные реакции, количественное определение. Применение.',p:[
'Флавоноиды — фенольные соединения со скелетом C₆–C₃–C₆ (дифенилпропан).',
'Классификация: флавоны, флавонолы (кверцетин, рутин), флаваноны, флаванонолы, халконы, ауроны, антоцианидины, катехины, изофлавоны.',
'Свойства: гликозиды — кристаллические, оптически активные, гидролизуются кислотами и ферментами; жёлтые или бесцветные, флуоресцируют в УФ.',
'Реакции: цианидиновая проба (Mg + HCl, красное), с AlCl₃ (жёлто-зелёная флуоресценция), со щёлочью, с солями Fe(III), борно-лимонная (реактив Вильсона).',
'Количественно: спектрофотометрия, в том числе дифференциальная с AlCl₃.',
'ЛРС: трава зверобоя, цветки бессмертника, плоды боярышника, бутоны софоры, трава пустырника, хвоща, горца птичьего, плоды аронии. Применение: Р-витаминное, желчегонное, спазмолитическое, кардиотоническое.']},
{n:20,q:'Сердечные гликозиды. Классификация. Свойства. Качественные реакции, количественное определение. Применение.',p:[
'Агликон — циклопентанпергидрофенантрен с ненасыщенным лактонным кольцом при С17: пятичленным (карденолиды) или шестичленным (буфадиенолиды). Сахара: специфические 2-дезоксисахара (дигитоксоза, цимароза).',
'Свойства: белые кристаллические вещества горького вкуса, растворимы в водных спиртах; в щёлочи лактонное кольцо раскрывается с потерей активности.',
'Реакции: на стероидное ядро — Либермана–Бурхарда, Розенгейма; на пятичленное лактонное кольцо (щелочная среда) — Легаля, Кедде, Балье, Раймонда; на дезоксисахара — Келлер–Килиани.',
'Количественно: биологическая стандартизация (ЛЕД, КЕД) и физико-химические методы (спектрофотометрия).',
'Сушка быстрая при 50–60 °С (ферменты разрушают гликозиды). Хранение — как сильнодействующее сырьё, ежегодный переконтроль.',
'ЛРС: листья наперстянки пурпурной и шерстистой, трава горицвета, ландыша, желтушника, семена строфанта. Применение: сердечная недостаточность.']},
{n:21,q:'Сапонины. Классификация. Свойства. Качественные реакции, количественное определение. Применение.',p:[
'Классификация: тритерпеновые (пентациклические — олеанан, урсан; тетрациклические — даммаран, циклоартан) и стероидные (спиростаны, фуростаны).',
'Свойства: пенообразование, гемолиз эритроцитов, токсичность для холоднокровных; аморфные, растворимы в воде; сапогенины в воде не растворимы.',
'Реакции: пенообразование, гемолиз, Лафона, Либермана–Бурхарда, Сальковского; осадок с холестерином (стероидные), с ацетатом свинца (тритерпеновые — средним, стероидные — основным).',
'Количественно: гравиметрия, спектрофотометрия (глицирризиновая кислота), гемолитический индекс.',
'Сушка в тени или до 60 °С. ЛРС: корни солодки, корневища синюхи, корни женьшеня, аралии, заманихи, истода; семена конского каштана; корневища диоскореи; трава якорцев.',
'Применение: отхаркивающее, адаптогенное, венотонизирующее, гипохолестеринемическое.']},
{n:22,q:'Эфирные масла. Классификация, получение, анализ. Свойства. Применение.',p:[
'Эфирные масла — смеси летучих душистых веществ: монотерпеноиды, сесквитерпеноиды, ароматические соединения.',
'Локализация: экзогенная (железистые волоски, железки) и эндогенная (секреторные клетки, вместилища, канальцы).',
'Получение: перегонка с водяным паром, прессование (цитрусовые), экстракция, анфлераж.',
'Анализ: плотность, показатель преломления, угол вращения, кислотное и эфирное числа. Примеси: жирные масла — жирное пятно на бумаге; спирт — помутнение капель на воде, проба с фуксином; вода — помутнение с петролейным эфиром.',
'Количественно (ГФ): перегонка с водяным паром, объёмный метод.',
'Сушка 30–35 °С толстым слоем; хранение отдельно, в плотной таре. ЛРС: листья мяты, шалфея, эвкалипта; цветки ромашки; трава тимьяна, душицы; плоды кориандра, фенхеля, аниса; корневища аира, валерианы, девясила.',
'Применение: антисептическое, противовоспалительное, спазмолитическое, отхаркивающее, ветрогонное, седативное.']},
{n:23,q:'Горечи. Классификации. Свойства. Применение.',p:[
'Горечи — безазотистые неядовитые вещества горького вкуса.',
'Классификация: иридоиды (логанин, генциопикрин — вахта, золототысячник, горечавка) и сесквитерпеноиды (абсинтин — полынь; лактоны — одуванчик, тысячелистник).',
'Свойства: иридоиды — белые кристаллические вещества, растворимые в воде и спирте.',
'Оценка: показатель горечи (органолептически).',
'ЛРС: трава полыни горькой, золототысячника, тысячелистника; листья вахты; корни одуванчика; корневища аира.',
'Применение: повышают аппетит и секрецию желудочного сока; принимают за 15–30 минут до еды.']},
{n:24,q:'Хромоны. Характеристика, свойства. Качественные реакции. Применение.',p:[
'Хромоны — производные бензо-γ-пирона; фурохромоны — келлин, виснагин.',
'Свойства: кристаллические вещества, флуоресцируют в УФ-свете; растворимы в органических растворителях.',
'Реакции: флуоресценция в УФ, реакции со щёлочью, ТСХ.',
'Количественно: спектрофотометрия.',
'ЛРС: плоды амми зубной.',
'Применение: спазмолитическое (коронаро- и бронхоспазмолитик), при бронхиальной астме; синтетический аналог — кромоглициевая кислота.']}
];
