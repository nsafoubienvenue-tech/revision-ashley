нижения риска внутренних кровотечений; для предупреждения кровотечений после хирургических вмешательств; для формирования прочных костей и профилактики остеопороза.","Витамин Р.","Б/х функции: они взаимосвязаны с функциями витамина С. Рутин влияет на течение тканевого дыхания и, как следствие, на сосудистую систему. Также через гормоны действует на другие ферментные системы.","Витамин Р - это группа веществ, обладающих витаминной активностью, участвующих во взаимодействии с аскорбиновой кислотой в окислительно-восстановительных процессах, уменьшающих ломкость и проницаемость капилляров, препятствующих окислению аскорбиновой кислоты.","Показания к применению: гиповитаминоз и авитаминоз Р (профилактика и лечение), гиповитаминоз и авитаминоз С. Заболевания, сопровождающиеся повышением проницаемости капилляров — геморрагические диатезы, кровоизлияния сетчатку глаза, геморрагический васкулит, ревматизм, гломерулонефриты, аллергические заболевания, тромбоцитопеническая пурпура.","Витамин Н.","Б/х функции: в качестве кофермента карбоксилированная участвует в реакциях обмена жиров, белков, углеводов и образования субстратов ЦТК.","Он является обязательным участником дифференцировки клеток и нервно-трофических процессов, влияет на обменные процессы в организме: взаимодействуя с инсулином, нормализует уровень сахара в крови, что особенно важно при сахарном диабете; способствует хорошему усвоению белка, участвует в сжигании жира и разложении жирных кислот; оказывает благоприятное воздействие на функциональное состояние центральной нервной системы и желудочно-кишечного тракта; участвует в синтезе гемоглобина; положительно влияет на структуру волос, предотвращая их ломкость и способствуя лучшему росту, и ногтей, предупреждая их расслоение; контролирует обмен жиров в клетках волос и кожи; останавливает выпадение волос (при условии, что оно обусловлено негормональными сбоями).","Показания к применению: недостаточная выработка витамина H, обусловленная неполноценным питанием, дисбактериозом, злоупотреблением алкоголя, длительным приемом антибиотиков и противосудорожных медикаментов; заболевания ногтей; кожные болезни; заболевания волос; нарушения психоэмоциональной сферы; синдром мальабсорбции.","Основные причины гиповитаминозов: • Недостаток витаминов в пище; • Нарушение всасывания в ЖКТ; • Врождённые дефекты ферментов, участвующих в превращениях витаминов; • Действие структурных аналогов витаминов (антивитамины).","Потребность человека в витаминах зависит от пола, возраста, физиологического состояния и интенсивности труда. Существенное влияние на потребность человека в витаминах оказывают характер пищи (преобладание углеводов или белков в диете, количество и качество жиров), а также климатические условия.","Поливитаминные комплексы. (компливит, витрум, супрадин). Применяются для повышения иммунитета, после перенесенных болезнях для восстановления, при повышенных физических нагрузках, при беременности (элевит-пренатал) и тд."]},"2-38":{"t":"38.АНТИГЕЛЬМИНТНЫЕ СРЕДСТВА. КЛАССИФИКАЦИЯ ПРЕПАРАТОВ ПО ПРЕИМУЩЕСТВЕННОМУ ДЕЙСТВИЮ НА РАЗЛИЧНЫЕ КЛАССЫ ГЕЛЬМИНТОВ. СУЩНОСТЬ МЕХАНИЗМОВ АНТИГЕЛЬМИНТНОГО ДЕЙСТВИЯ, ПРИНЦИПЫ И УСЛОВИЯ НАЗНАЧЕНИЯ ОТДЕЛЬНЫХ ПРЕПАРАТОВ. ПОБОЧНЫЕ ЭФФЕКТЫ. АНТИГЕЛЬМИНТНЫЕ СРЕДСТВА РАСТИТЕЛЬНОГО ПРОИСХОЖДЕНИЯ.","p":["Противоглистные средства (антигельминтные средства) — препараты, применяемые для лечения глистных инвазий (нематодозов, цестодозов, трематодозов).","Противоглистные средства делят на 2 группы.","1. Средства, применяемые для лечения кишечных гельминтозов, в том числе противонематодные средства (пиперазин, гептилрезорцин, нафтамон, сера очищенная, тимол, масло хеноподиевое, четыреххлористый этилен, дитиазанин, генцианвиолет) и противоцестодные средства (экстракт мужского папоротника густой, филиксан, дихлорофен, фенасал, акрихин, аминоакрихин, кора гранатника, семена тыквы).","2. Средства, применяемые для лечения внекишечных гельминтозов, в том числе противонематодные средства — дитразин и противотрематодные средства — антимониланатрия тартрат, гексахлорэтан, хлоксил.","Механизм действия противоглистных средств разнообразен. Одни из противоглистных средств повреждают кутикулу гельминтов (гептилрезорцин, фенасал), другие оказывают на них наркотическое действие (тимол, гексахлорэтан), третьи изменяют тонус и двигательную активность паразитов (сантонин, дитразин, пиперазин, нафтамон).","Противоглистные средства могут оказывать токсическое действие не только на гельминтов, но и на организм их носителя. Поэтому следует строго соблюдать схему и правила назначения каждого препарата.","Различные виды гельминтов могут обитать почти во всех органах и тканях хозяина, в связи с чем противоглистные средства и методы терапии гельминтозов весьма разнообразны.","Отдельно рассматриваются средства от глистов для лечения гельминтозов, возбудители которых обитают в пищеварительном тракте и в глубине тех или иных тканей. Одно и то же средство от глистов в зависимости от дозы, физиологического состояния организма хозяина, числа гельминтов и их расселения в организме может повести к выделению паразитов еще в живом состоянии или убить их (экстракт мужского папоротника и др.).","Побочные явления возникают редко, возможны головная боль, диспепсические явления, при длительном применении – абдоминальные боли.","Из препаратов растительного происхождения в качестве П. с. используют в основном экстракт мужского папоротника густой, семя тыквы и эметина гидрохлорид."]},"2-39":{"t":"39.ПРОТИВОМИКОЗНЫЕ СРЕДСТВА. КЛАССИФИКАЦИЯ ПО ТЕРАПЕВТИЧЕСКОМУ ПРИМЕНЕНИЮ. СУЩНОСТЬ МЕХАНИЗМОВ ДЕЙСТВИЯ ПРЕПАРАТОВ ТЕРАПИИ ДЕРМАТОМИКОЗОВ.","p":["Противогрибковые средства – препараты, применяемые для профилактики и лечения микозов.","Подразделение противогрибковых препаратов по основным показаниям к применению:","I. Средства, применяемые при лечении заболеваний, вызванных патогенными грибами: 1. При системных или глубоких микозах (кокцидиоидомикоз, паракокцидиомикоз, гистоплазмоз, криптококкоз, бластомикоз):","- антибиотики (амфотерицин В, микогептин);","- производные имидазола (миконазол, кетоконазол);","- производные триазола (итраконазол, флуконазол).","2. При эпидермомикозах (дерматомикозах):","- антибиотики (гризеофульвин);","- производные N-метилнафталина (тербинафин);","- производные нитрофенола (хлорнитрофенол);","- препараты йода (раствор йода спиртовой, калия йодид).","II. Средства, применяемые при лечении заболеваний, вызванных условно-патогенными грибами (например при кандидамикозе):","- антибиотики (нистатин, леворин, амфотерицин В);","- производные имидазола (миконазол, клотримазол);","- бис-четвертичные аммониевые соли (деквалиния хлорид).","В клинической практике противогрибковые средства делят на 3 основные группы:","1. Препараты для лечения глубоких (системных) микозов. 2. Препараты для лечения эпидермофитий и трихофитий. 3. Препараты для лечения кандидозов.","Гризеофульвин - механизм действия: обладает фунгистатическим эффектом, который обусловлен ингибированием митотической активности грибковых клеток в метафазе и нарушением синтеза ДНК. Избирательно накапливаясь в «прокератиновых» клетках кожи, волос, ногтей, гризеофульвин придает вновь образуемому кератину устойчивость к грибковому поражению. Излечение наступает после полной замены инфицированного кератина, поэтому клинический эффект развивается медленно.","Механизм действия тербинафина. Это противогрибковый препарат широкого спектра действия. Механизм действия тербинафина основан на подавлении синтеза некоторых биологически активных веществ в клетке гриба, что вызывает гибель этих клеток. Тербинафин связывается с белками плазмы крови и в составе образованного комплекса быстро достигает пораженных грибками органов. Он проникает в поверхностный роговой слой кожи и в секрет сальных желез, это создает его высокую концентрацию в корнях волос, в коже и сальных железах. Кроме того, тербинафин проникает в ногтевые пластинки, воздействуя на грибки, обитающие в этой области."]},"2-4":{"t":"4.РАЗДРАЖАЮЩИЕ СРЕДСТВА.","p":["1.Препараты, относящиеся к этой группе средств.","Эфирное масло, спирт этиловый (20-40%), масло терпентинное очищенное, перцовый пластырь, 10% раствор аммиака, ментол 2.Механизмы раздражающего эффекта различных препаратов.","Горчичная бумага - действие связано с горчичным эфирным маслом .Горчица содержит гликозид синигрин и фермент мирозин,при смачивании теплой водой (не под влиянием мирозина происходит расщепление синигрина с образованием горчичного эфирного масла, которое оказывает выраженное раздражающее действие.","Масло терпентинное очищено- действующее вещество- а-пинен, проникает через эпидермис, раздражая окончания чувствительных нервов.","Ментол — избирательное возбуждающее влияние на холодовые рецепторы, что вызывает ощущение холода. Раздражающее действие может сменяться незначительной анестезией.","Рефлекторно изменяет тонус сосудов поверхностных, и глубокорасположенных тканей и внутренних органов.","Аммиак-вдыхание паров раствора аммиака приводит к возбуждению окончаний чувствительных нервов верхних дыхательных путей и рефлекторной стимуляции центра дыхания. Растворами аммиака пользуются. 3.Показания к применению этих препаратов.","Горчичники- при заболеваниях органов дыхания, стенокардии, а также при невралгиях, миалгиях.","Масло терпентинное очищенное- местно для растираний при невралгиях, миалгиях, суставных болях.","Ментол- при воспалительных заболеваниях верхних дыхательных путей (в виде капель, смазывания, интратрахеальных вливаний, ингаляций). Входит в состав Валидола-при стенокардии., накожно-при невралгиях, артралгиях, при мигрени Раствор аммиака- для ингаляции при обмороках, опьянении, для обработки рук хирурга."]},"2-40":{"t":"40.АНТИБЛАСТОМНЫЕ ПРЕПАРАТЫ. КЛАССИФИКАЦИЯ АЛКИЛИРУЮЩИХ СРЕДСТВ ПО ХИМИЧЕСКОЙ СТРУКТУРЕ. МЕХАНИЗМЫ ДЕЙСТВИЯ ПРЕПАРАТОВ ЭТОЙ ГРУППЫ, ПОКАЗАНИЯ К ПРИМЕНЕНИЮ. ПРОТИВООПУХОЛЕВЫЕ АНТИБИОТИКИ, АНТИМЕТАБОЛИТЫ, АЛКАЛОИДЫ И СИНТЕТИЧЕСКИЕ ПРОТИВОБЛАСТОМНЫЕ СРЕДСТВА, МЕХАНИЗМЫ ДЕЙСТВИЯ, ПОКАЗАНИЯ К ПРИМЕНЕНИЮ. ОСНОВНЫЕ ПОБОЧНЫЕ ЭФФЕКТЫ АНТИБЛАСТОМНЫХ СРЕДСТВ.","p":["Механизм действия. Молекулярный механизм действия алкилирующих препаратов заключается в алкилировании ДНК злокачественных клеток с нуклеофильным замещением.","Все алкилирующие вещества образуют ковалентные связи между алкильными (насыщенными атомами углерода) группами и клеточными молекулами и дают реактивные электрофильные метаболиты, которые связываются с нуклеофильными веществами, такими как ДНК.","Показания: при лимфогранулематозе, хронических лейкозах и ретикулосаркоме, рак пищевода, меланома, раке яичника.","Антиметаболиты. Действуют антиметаболиты на разных этапах синтеза нуклеиновых кислот.","Так, механизм противобластомного эффекта метотрексата заключается в угнетении дигидрофолатредуктазы, а также тимидилсинтетазы. Это нарушает образование пуринов и тимидина, в результате чего угнетается синтез ДНК.","Антагонист фолиевой кислоты метотрексат и антагонист пурина меркаптопурин назначают главным образом при острых лейкозах. Метотрексат эффективен при указанной патологии в основном у детей, а меркаптопурин - также у взрослых. Кроме того, меркаптопурин и особенно метотрексат с успехом применяют при хорионэпителиоме матки.","Антибиотики. Ряд антибиотиков наряду с противомикробной активностью обладает выраженными цитотоксическими свойствами, обусловленными угнетением синтеза и функции нуклеиновых кислот. К их числу относится дактиномицин. Применяют дактиномицин при хорионэпителиоме матки, опухоли Вильмса у детей, при лимфогранулематозе.","Антибиотики группы антрациклинов - доксорубицина гидрохлорид, карминомицин используют при остеогенных саркомах, саркомах мягких тканей, а также при раке молочной железы и других опухолевых заболеваниях.","Антибиотик блеомицин активныен при раке слизистой оболочки ротовой полости, миндалин, гортани, лимфогранулематозе, при комбинированной химиотерапии злокачественных опухолей яичка и ряде других опухолевых заболеваний.","Побочные: отрицательные стороны действия препаратов проявляются в угнетении ими кроветворения, тошноте, рвоте, диарея. У ряда больных наблюдается нарушение функции печени. Иногда отмечается кардиотоксическое действие. Нередко происходит выпадение волос. Имеются у этих препаратов и раздражающие свойства. Следует учитывать также их выраженное иммунодепрессивное действие.","Алкалоиды. Выраженной антимитотической активностью обладает колхамин - алкалоид безвременника великолепного. Колхамин иногда применяют местно в мазях при раке кожи (без метастазов). При этом злокачественные клетки погибают, а нормальные клетки эпителия практически не повреждаются. Однако во время лечения может возникать раздражающий эффект (гиперемия, отек, боль), что заставляет делать перерывы в лечении. После отторжения некротических масс заживление раны происходит с хорошим косметическим эффектом. При резорбтивном действии колхамин довольно сильно угнетает кроветворение, вызывает диарею, выпадение волос.","Противоопухолевая активность обнаружена также у алкалоидов растения барвинок розовый винбластина, винкристина. Они оказывают антимитотическое действие и, подобно колхамину, блокируют митоз в стадии метафазы. Винбластин (розевин) рекомендуют при генерализованных формах лимфогранулематоза и при хорионэпителиоме.","Токсическое влияние винбластина характеризуется угнетением кроветворения, диспепсическими явлениями, болями в животе. Препарат обладает выраженным раздражающим эффектом и может быть причиной флебитов. Другой алкалоид барвинка розового - винкристин - применяется в качестве одного из компонентов комплексной терапии острого лейкоза, а также других гемобластозов и истинных опухолей. Токсическое действие винкристина проявляется по-разному. Практически мало угнетая кроветворение, он может приводить к неврологическим нарушениям (атаксии, нарушению нервно-мышечной передачи, невралгии, парестезии), поражению почек (полиурии, дизурии) и др.","Синтетические противоопухолевые средства.","Механизм противоопухолевого действия связан со способностью соединения ингибировать рибонуклеозиддифосфатредуктазу, являющуюся одним из ключевых ферментов, участвующих в биосинтезе ДНК.","Показания: для лечения хронического миелолейкоза, лимфогранулематоза, меланомы, рак молочной железы. Монотерапия - при неэффективности химиотерапии препаратами из группы таксанов или антрациклинового ряда или при наличии противопоказаний к химиотерапии антрациклинами.","Возможно развитие диспепсических явлений, кожных аллергических реакций, редко стоматита, а также лейкопении, мегалопластической анемии, тромбоцитопении."]},"2-41":{"t":"41.ФЕРМЕНТНЫЕ ПРЕПАРАТЫ. ОСНОВНЫЕ ГРУППЫ ФЕРМЕНТНЫХ СРЕДСТВ, ПРЕПАРАТЫ, ВХОДЯЩИЕ В ЭТИ ГРУППЫ, СУЩНОСТЬ ИХ ДЕЙСТВИЯ, ПОКАЗАНИЯ К ПРИМЕНЕНИЮ. АНТИПОДАГРИЧЕСКИЕ СРЕДСТВА (КЛАССИФИКАЦИЯ ПО МЕХАНИЗМУ ДЕЙСТВИЯ, ПОКАЗАНИЯ К ПРИМЕНЕНИЮ, ПОБОЧНЫЕ ЭФФЕКТЫ).","p":["Ферментные препараты - это лекарственные вещества белковой природы, обладающие ферментной активностью. Большинство ферментных препаратов — животного происхождения, некоторые из них могут быть выделены из растений или микроорганизмов.","В зависимости от состава ферментные препараты можно разделить на несколько групп:","1. Экстракты слизистой оболочки желудка, основным действующим веществом которых является пепсин (абомин, ацидинпепсин).","2. Панкреатические энзимы, представленные амилазой, липазой и трипсином (панкреатин, панцитрат, мезим-форте, креон).","3. Комбинированные ферменты, содержащие панкреатин в комбинации с компонентами желчи, гемицеллюлозой и прочими дополнительными компонентами (дигестал, фестал, панзинорм-форте, энзистал).","4. Растительные энзимы, представленные папаином, грибковой амилазой, протеазой, липазой и др. ферментами (пепфиз, ораза).","5. Комбинированные ферменты, содержащие панкреатин в сочетании с растительными энзимами, витаминами (вобэнзим).","6. Дисахаридазы (тилактаза).","Первая группа ферментов в основном направлена на коррекцию секреторной дисфункции желудка. Содержащиеся в их составе пепсин, катепсин, пептидазы расщепляют практически все природные белки. Эти препараты используются преимущественно при атрофическом гастрите, их не следует назначать при заболеваниях, протекающих на фоне нормального или повышенного кислотообразования.","Препараты, включающие панкреатические энзимы, используются для коррекции нарушений процесса пищеварения, а также для регуляции функций поджелудочной железы. Эти ферменты обеспечивают достаточный спектр пищеварительной активности и способствуют купированию клинических признаков внешнесекреторной недостаточности поджелудочной железы, к которым относят снижение аппетита, тошноту, урчание в животе, метеоризм, стеато, креато- и амилорею.","Комбинированные препараты, содержащие компоненты желчи и гемицеллюлазу, создают оптимальные условия для быстрого и полного расщепления белков, жиров и углеводов в двенадцатиперстной и тощей кишках. Препараты назначают при недостаточной внешнесекреторной функции поджелудочной железы, в сочетании с патологией печени, желчевыводящей системы, при нарушении жевательной функции, малоподвижном образе жизни, кратковременных погрешностях в еде.","Ферментные препараты растительного происхождения содержат папаин или грибковую амилазу, протеазу, липазу. Папаин и протеазы гидролизируют белки, грибковая амилаза углеводы, липаза, соответственно, - жиры.","Антиподагрические средства делаться на 3 группы:","1. Урикодепрессивные средства: уменьшают синтез мочевой кислоты путем ингибирования ксантиноксидазы.","2. Урикозурические средства: повышают экскрецию мочевой кислоты путем уменьшения реабсорбции уратов и увеличения их секреции в почках.","3. Средства смешанного действия.","Показания: почечный (гиперэкскреторный) тип подагры при отсутствии выраженной подагрической нефропатии; смешанный тип подагры при суточной экскреции мочевой кислоты менее 2,7 ммоль.","Из побочных эффектов наиболее характерно раздражающее действие на слизистую оболочку пищеварительного тракта (поэтому препарат следует принимать с пищей), возможны аллергические реакции, образование камней в мочевыводящих путях, редко - угнетение кроветворения."]},"2-42":{"t":"42.АНТИСЕПТИЧЕСКИЕ И ДЕЗИНФИЦИРУЮЩИЕ СРЕДСТВА. ПОНЯТИЕ ОБ АНТИСЕПТИЧЕСКОМ И ДЕЗИНФИЦИРУЮЩЕМ ДЕЙСТВИИ, ФАКТОРЫ, ВЛИЯЮЩИЕ НА АНТИСЕПТИЧЕСКУЮ АКТИВНОСТЬ ПРЕПАРАТОВ. КЛАССИФИКАЦИЯ АНТИСЕПТИКОВ ПО ХИМИЧЕСКОЙ СТРУКТУРЕ, МЕХАНИЗМЫ АНТИСЕПТИЧЕСКОГО ДЕЙСТВИЯ ПРЕПАРАТОВ РАЗНЫХ ГРУПП. ПОКАЗАНИЯ К ПРИМЕНЕНИЮ В РАЗЛИЧНЫХ ОБЛАСТЯХ МЕДИЦИНЫ.","p":["Антисептики и дезинфицирующие средства должны обладать широким спектром действия в отношении бактерий, простейших и грибов, характеризоваться малым латентным периодом действия, высокой активностью, в том числе в присутствии биологических субстратов. Важно, чтобы препараты были химически стойкими и доступными с точки зрения их производства и стоимости. Важными требованиями к антисептикам являются отсутствие местного отрицательного (например, раздражающего) действия на ткани, минимальная всасываемость с места их нанесения, отсутствие аллергизирующего влияния и низкая токсичность.","Распространенным критерием оценки активности антисептиков является так называемый феноловый коэффициент (соотношение концентраций фенола и испытуемого антисептика, в которых вещества оказывают одинаковый противомикробный эффект). Механизм действия разных антисептиков и дезинфицирующих веществ неодинаков и может быть связан с денатурацией белка, нарушением проницаемости плазматической мембраны, торможением важных для жизнедеятельности микроорганизмов ферментов.","Бактерицидное действие детергентов обусловлено нарушением структуры клеточной мембраны, денатурацией белков и ингибированием ферментов. Применяют детергенты для обработки рук хирурга, стерилизации инструментов, аппаратуры.","Важной группой антисептиков являются производные нитрофурана. Нитрофураны обладают широким спектром действия. Они губительно влияют на грамположительные и грамотрицательные бактерии, простейшие. Фурацилин применяют главным образом наружно для обработки ран, кожи, слизистых оболочек, для промывания серозных и суставных полостей.","Группа фенола и его производных включает многие хорошо известные антисептики ароматического ряда. Фенол действует в основном на вегетативные формы бактерий и грибы.","Растворы фенола используют для дезинфекции инструментов, предметов обихода.","К группе красителей относится ряд соединений различного химического строения. Наиболее широко применяется бриллиантовый зеленый. Особенно чувствительны к красителям грамположительные кокки. Бриллиантовый зеленый является высокоактивным и относительно быстродействующим антисептиком. В присутствии белков эффективность его снижается.","Применяется наружно, в основном при гнойных поражениях кожи (пиодермиях). Этакридина лактат (риванол) окрашен в желтый цвет. Активность у него достаточно высокая, но действие развивается медленно. Применяют его наружно и для промывания инфицированных полостей (плевры, брюшины), мочевого пузыря, матки.","Галогеносодержащие антисептики представлены препаратами, содержащими хлор и йод.","Важное значение имеет образование хлорноватистой кислоты, являющейся сильным окислителем. Одним из препаратов, отщепляющих хлор, является хлорамин Б, обладающий антисептическими и дезодорирующими свойствами. Его применяют для обеззараживания выделений больных, предметов обихода, неметаллического инструментария, а также для обработки рук и инфицированных раневых поверхностей. Значительное число антисептиков представлено соединениями (солями) металлов. Механизм противомикробного действия солей металлов в низких концентрациях связывают с блокированием сульфгидрильных групп ферментов микроорганизмов. В больших концентрациях в зависимости от характера металла и кислотного остатка, концентрации соли, степени ее диссоциации и растворимости могут возникать различные местные эффекты: вяжущий, раздражающий, прижигающий (некротизирующий). К группе окислителей относятся перекись водорода и калия перманганат.","Принцип действия обоих препаратов заключается в высвобождении кислорода. При нанесении на ткани в присутствии белков перекись водорода под влиянием каталаз расщепляется с выделением молекулярного кислорода. Калия перманганат в присутствии органических веществ отщепляет атомарный кислород. Применяют препарат в растворах для полосканий, спринцеваний, орошения ран, обработки ожоговых поверхностей, промывания желудка в случае отравления морфином, фосфором и др. К антисептикам относятся также некоторые соединения из группы альдегидов и спиртов. Одним из представителей альдегидов является раствор формальдегида. Он обладает сильными противомикробными и дезодорирующими свойствами. Его применяют в качестве дезинфицирующего средства, а также для обработки кожи при потливости. В качестве антисептиков может быть использован ряд кислот и щелочей.","Так, для промывания слизистых оболочек и полоскания полости рта иногда назначают раствор кислоты борной. Ее можно применять также накожно в мазях и присыпках. Однако противомикробная активность кислоты борной низкая."]},"2-43":{"t":"43.ПЛАЗМОЗАМЕЩАЮЩИЕ РАСТВОРЫ И СРЕДСТВА ДЛЯ ПАРЕНТЕРАЛЬНОГО ПИТАНИЯ. КЛАССИФИКАЦИЯ ПЛАЗМОЗАМЕЩАЮЩИХ РАСТВОРОВ ПО ХИМИЧЕСКОЙ ПРИРОДЕ, СУЩНОСТЬ ДЕЙСТВИЯ, ПОКАЗАНИЯ К ПРИМЕНЕНИЮ. ПРЕПАРАТЫ, ПРИМЕНЯЕМЫЕ ДЛЯ КОРРЕКЦИИ КИСЛОТНО-ЩЕЛОЧНОГО РАВНОВЕСИЯ, ПРИМЕНЕНИЕ. ОСНОВНЫЕ СРЕДСТВА ДЛЯ ПАРЕНТЕРАЛЬНОГО ПИТАНИЯ, СУЩНОСТЬ ДЕЙСТВИЯ, ПРИМЕНЕНИЕ.","p":["Плазмозамещающие растворы - лечебные средства, восполняющие дефицит плазмы крови или отдельных ее компонентов. Плазмозамещающие растворы, близкие по составу к плазме крови и вводимые в больших количествах, называют инфузионными. Эти растворы способны некоторое время поддерживать жизнедеятельность организма или изолированных органов, не вызывая развития патологических сдвигов гомеостаза.","Классификация. 1.","Растворы аминокислот: общего назначения; специального назначения (дипептиды глутамина; растворы аминокислот для больных печеночной недостаточностью; растворы аминокислот для больных почечной недостаточностью; растворы аминокислот, предназначенные для детей).","2. Жировые эмульсии: на основе длинноцепочечных триглицеридов; на основе смеси длинноцепочечных и среднецепочечных триглицеридов; на основе смеси длинноцепочечных и среднецепочечных триглицеридов с добавлением омега-3 жирных кислот; только на основе рыбьего жира","3. Поливитаминные комплексы и микроэлементы: препараты водорастворимых витаминов; препараты жирорастворимых витаминов; препараты водо- и жирорастворимых витаминов; комплекс микроэлементов.","4. Комбинированные препараты: двухкомпонентные, «два в одном» (раствор аминокислот+раствор глюкозы); трехкомпонентные, «три в одном»: раствор аминокислот + раствор глюкозы + жировая эмульсия; раствор аминокислот + раствор глюкозы + многокомпонентная жировая эмульсия с включением омега-3 жирных кислот.","Замещение недостающих эндогенных субстратов и регуляция метаболизма.","Показания к применению: коллапс, шок; метаболический ацидоз; дезинтоксикационная инфузионная терапия, острая кровопотеря. Гиповолемия. Гестоз беременных; потеря белка после операций, ожогов. Острый панкреатит. Гипогликемия. Повышенное внутричерепное давление, глаукома, кахексия, заболевания печени. Хроническая почечная недостаточность, воздушная и морская болезнь, риниты, конъюнктивиты, стоматиты, ларингиты.","Регуляторы водно-солевого баланса и кислотно-основного равновесия: солевые растворы, осмодиуретики. Растворы осуществляют коррекцию состава крови при обезвоживании, вызванном диареей, отеках мозга, токсикозах (происходит увеличение почечной гемодинамики): «Трисоль», «Ацесоль», «Дисоль», «Хлосоль», «Квартасоль» Препараты для парентерального питания. Служат для обеспечения энергетических ресурсов организма, доставки питательных веществ к органам и тканям (полиамин; аминостерил КЕ 10%, инфезол и др.)"]},"2-44":{"t":"44.АНТИАТЕРОСКЛЕРОТИЧЕСКИЕ (ГИПОЛИПИДЕМИЧЕСКИЕ) СРЕДСТВА. КЛАССИФИКАЦИЯ ПРЕПАРАТОВ ПО МЕХАНИЗМУ ДЕЙСТВИЯ, ФАРМАКОЛОГИЧЕСКИЕ ЭФФЕКТЫ, ПОКАЗАНИЯ К ПРИМЕНЕНИЮ ПРИ РАЗНЫХ ФОРМАХ ГИПЕРЛИПИДЕМИИ. АНГИОПРОТЕКТОРЫ, СУЩНОСТЬ ДЕЙСТВИЯ, ПРИМЕНЕНИЕ.","p":["Гиполипидемические средства – вещества, снижающие повышенное содержание липидов в крови и тканях.","Отмечают заметное уменьшение концентрации ЛПНП и холестерина в сыворотке крови, а также умеренное снижение содержания ЛПОНП и триглицериды. Одновременно снижение активности указанного фермента приводит к снижению синтеза биологически активных веществ - изопреноидов, что лежит в основе так называемых «плейотропных» эффектов статинов, а именно, противовоспалительного, антипролиферативного и способности улучшать функцию эндотелия. Эффект развивается медленно (через 1-2 мес после начала лечения) и проходит после отмены препарата, поэтому, как правило, необходима длительная (пожизненная) терапия.","Наиболее узкими показаниями к назначению характеризуются секвестранты желчных кислот, которые рекомендуются исключительно больным со IIа типом ГЛП. Статины показаны больным как со IIа, так и со IIв типами ГЛП. Никотиновую кислоту можно назначать больным с любыми типами ГЛП. Фибраты предназначены в основном для коррекции ГЛП IIа типа и крайне редко встречающейся дисбеталипопротеидемии (ГЛП III типа).","Ангиопротекторы — лекарственные средства, уменьшающие проницаемость сосудов, нормализующие метаболические процессы в сосудистой стенке и улучшающие микроциркуляцию. Основные свойства, которые проявляют ангиопротекторы: улучшение микроциркуляции и состояния тканевого обмена; спазмолитическое действие, расширяющее просвет сосудов; уменьшение проницаемости сосудов, то есть уменьшение отечности ткани; улучшение кровяных свойств, например, текучести, и нормализация свертываемости крови.","Показания к применению. 1.Лечение сосудистых поражений, которые происходят пи сахарном диабете, ревматологические заболевания, распространенный атеросклероз. 2.Закупорка сосудистого просвета. Причиной такого состояния может быть появление атеросклеротических бляшек или изменение кровяного состава. 3.Нарушение кровообращения в периферическом русле. При этом ангиопротекторами служат средства, которые увеличивают устойчивость окружающих тканей к нехватке кислорода. 4.Последствия нарушения мозгового кровообращения и ИБС 5.Поражение венозного русла. Ангиопротекторами в такой ситуации служат венотонизирующие медикаменты, антитромботические препараты и сосудорасширяющие средства."]},"2-5":{"t":"5.СПИРТ ЭТИЛОВЫЙ. ФАРМАКОКИНЕТИЧЕСКИЕ ОСОБЕННОСТИ (СКОРОСТЬ ОКИСЛЕНИЯ, ЭНЕРГЕТИЧЕСКИЙ ПОТЕНЦИАЛ, ЭЛИМИНАЦИЯ).","p":["При приеме внутрь быстро всасывается в основном в тонкой кишке и около 20% - в желудке.","Скорость абсорбции зависит от характера содержимого ЖКТ и интенсивности перистальтики.","Особенно быстро резорбтивное действие наступает натощак. Жиры и углеводы задерживают его всасывание. 90% метаболизируется до СО2 и воды. В печени спирт окисляется (со скоростью 10 мл/ч), при этом выделяется энергия (7,1 ккал/г). При длительном применении индукция ферментов печени, при которой скорость инактивации спирта возрастает.В неизмененном виде выделяется легкими, почками и потовыми железами.","Фармакодинамические эффекты (влияние на кору головного мозга, ЦНС, передачу импульсов, микросомальный аппарат печени, анальгезирующее действие, генетический аппарат).","Резорбтивное действие направлено на ЦНС- угнетающее влияние, усиливающееся с увеличением концентрации спирта этилового в крови и тканях мозга. 3 стадии: 1)Стадия возбуждения -эйфория, повышение настроения,человек чрезмерно общительный.","Страдают поведение, самоконтроль, неадекватна оценка окружающей обстановки; работоспособность понижена. 2)Стадия наркоза: наступают анальгезия, сонливость, нарушается сознание. Угнетаются спинальные рефлексы. Наступает стадия наркоза, которая, однако, непродолжительна и 3)","Агональная: полный паралич ЦНС.","Центральное действие на ЦНС: влияние на теплорегуляцию-повышение теплоотдачи (расширение сосудов кожи - угнетения сосудодвигательного центра). Поэтому на холоде спирт этиловый способствует переохлаждению.","Мочегонное действие -снижается продукция антидиуретического гормона задней доли гипофиза).Влияние на пищеварительную систему: усиливает секреторную активность слюнных и желудочных желез. Повышение секреции желез желудка при прямом воздействии спирта связано с высвобождением гуморальных веществ (гастрин, гистамин). Спирт усиливает секрецию HCl. В ответ на раздражающее действие на слизистую оболочку –железы желудка продуцируют большое количество слизи. Меняется и моторика желудка. В высоких концентрациях вызывает спазм привратника и снижает моторику желудка.","Показания к применению в медицинских целях.","Иногда - как противошоковое средство (учитывая его обезболивающее действие), редко - в качестве снотворного или седативного вещества. В некоторых случаях показано назначение спирта этилового (в низких концентрациях) истощенным больным- энергетическое значение.","Однако при этом следует учитывать, что спирт этиловый не является питательным веществом.","Применяют как антисептикдля обработки рук хирургов, инструментов, поверхностей, подсушивающее средство, для приготовления настоек, в компрессах согревающих. Как противоядие при отравлении метанолом.","Симптомы острого отравления этанолом и меры помощи.","Симптомы:","•Эмоциональная лабильность;","Нарушение координации движений:","Покраснение лица;","Тошнота и рвота;","Угнетение дыхания;","Нарушение сознания;","Алкогольная кома Кома поверхностная: нет речевого контакта, потеря сознания,снижены зрачковые рефлексы, угнетена болевая чувствительность, снижение или повышение мышечного тонуса и сухожильных рефлексов; плавающие движения глазных яблок, зрачки обычно сужены, при нарастании расстройств дыхания расширяются,","Глубокая: полная утрата болевой чувствительности, отсутствие или резкое снижение корнеальных, зрачковых, сухожильных рефлексов, мышечная атония, снижение температуры тела, тахипное, акроцианоз, тахикардия,резкое снижение АД,расширение зрачков.","Меры помощи:Обеспечение адекватной вентиляции легких. Проводят туалет ротовой полости, очищают верхние дыхательные пути. Для уменьшения секреции слюнных и бронхиальных желез вводят атропин. Назначают ингаляции кислорода. При необходимости ИВЛ. Вводят аналептики(для стимуляции дыхательного и сосудо-двигательного центров)коразол, кордиамин, кофеин. Промывают желудок, проводят форсированный диурез.","Коррекция кислотно-основного состояния (внутривенно вводят натрия гидрокарбонат). При тяжелом состоянии пациента -гемодиализ."]},"2-6":{"t":"6.ПРОТИВОЭПИЛЕПТИЧЕСКИЕ СРЕДСТВА. 1. ФАРМАКОТЕРАПЕВТИЧЕСКАЯ КЛАССИФИКАЦИЯ С УКАЗАНИЕМ ПРЕПАРАТОВ.","p":["I. Генерализованные формы эпилепсии Большие судорожные припадки: Натрия вальпроат Ламотриджин Дифенин Эпилептический статус: Диазепам Клоназепам Дифенин-натрий, Лоразепам Фенобарбитал-натрий Средства для наркоза Малые приступы эпилепсии :Этосуксимид Клоназепам Триметин Натрия вальпроат Миоклонус-эпилепсия : Клоназепам Натрия вальпроат Ламотриджин","II. Фокальные (парциальные) формы эпилепсии Карбамазепин Ламотриджин Клоназепам Тиагабин, Натрия вальпроат Фенобарбитал Топирамат 2.Механизмы противосудорожного действия.","Фенобарбитал - активирует ГАМК-ергическую систему. Дифенин -изменяет баланс электролитов на уровне мембраны нервной клетки, что влечет за собой затруднение распространения судорожных электрических разрядов по веществу мозга. Карбмазепинуменьшение пароксизмальных разрядов нейронов (блокада Na-каналов) и ослабление влияния возбуждающих аминокислот (глутамат). Вальпроат натрия-потенцирует ГАМК-эргическую передачу в ряде областей мозга; блокада Na- и Са-каналов Т-типа 3.Фармакологические эффекты отдельных препаратов (анальгезирующий эффект, влияние на микросомальный аппарат печени и др.).","Фенобарбитал- Может вызывать слабую анальгезию, но возможно и усиление реакции на болевой стимул. В высоких дозах понижает АД, при остром отравлении возможно развитие олигурии или анурии, понижает тонус гладкой мускулатуры ЖКТ, вызывает индукцию микросомальных ферментов печени, При высоких дозах-угнетение дыхательного центра, снижает объем дыхания и чувствительность дыхательного центра к углекислому газу, в малых дозах- сосудорасширяющие действие Диазепам- Увеличивает порог болевой чувствительности, оказывает антиаритмическое действие, понижает АД (при быстром в/в введении). Уменьшает ночную секрецию желудочного сока. Обладает способностью затруднять отток внутриглазной жидкости либо повышать ее секрецию и, тем самым, увеличивать внутриглазное давление. Индукторы микросомальных ферментов печени уменьшают эффективность диазепама. 4.Препараты для купирования эпилептического статуса.","Магния сульфат —седативное, спазмолитическое и противосудорожное действие.","Противосудорожный эффект обусловлен непосредственным действием на ЦНС и конкурентным вытеснением Cа2+ в саркоплазматическом ретикулуме, и уменьшением выделения ацетилхолина.","Диазепам —транквилизирующее, миорелаксантное и противосудорожное свойства. Метиндион—При эпилептическом статусе метиндионвводят внутривенно (медленно!)"]},"2-7":{"t":"7.ПРОТИВОПАРКИНСОНИЧЕСКИЕ СРЕДСТВА. 2) Возможность","p":["использования при паркинсонизме центральных и периферических миорелаксантов (препараты).","Центральные холиноблокаторы:","Тропацин- уменьшает возбудимость периферических м-холинореактивных систем и вызывает расслабление гладкой мускулатурыа. Показания: лечении паркинсонизма, болезни Паркинсона, стриарные гиперкинезы, спастические парезы и параличи. Противопоказания: глаукома, Побочные эффекты: Сухость во рту, расширение зрачков, диспептические явления, тахикардия, головная боль, головокружение.","Также используют бензтропина мезилат-центральный холиноблокатор.","Циклодол- Блокирует центральные н-холино- и периферические м-холинорецепторы.","Показания: Паркинсонизм, болезнь Паркинсона и Литтла; спастические параличи.","Побочные: Сухость во рту, сонливость, головокружение, нервозность, бред, галлюцинации, нарушение зрения, повышение внутриглазного давления, запор, задержка мочеиспускания, тахикардия, кожная сыпь, гнойный паротит (при длительном применении).","Противопоказания: Гиперчувствительность, глаукома (особенно закрытоугольная), обструкция ЖКТ, фибрилляция предсердий, аденома предстательной железы, беременность. 3)Побочные эффекты отдельных средств и противопоказк применению.","Леводопа: Побочные: Тошнота, анорексия, рвота, боли в эпигастрии, запоры, дисфагия, гипотониа, слабость, головокружение, возбуждение, бессонница, тахикардия, полиурия.","Противопоказания: Глаукома, психозы, нарушения функции печени, почек, сердечнососудистой системы, эндокринной системы, болезни крови, беременность, лактация,","Бромокриптин: Побочные: Тошнота, рвота, сухость во рту, запор, снижение АД, головная боль, головокружение, сонливость, возбуждение, снижение остроты зрения, аллергические реакции, судороги в икроножных мышцах; редко — ортостатическая гипотензия, коллапс.","Противопоказания: Гиперчувствительность, гестоз, заболевания сердечно-сосудистой системы, артериальная гипо- или гипертензия, заболевания клапанного аппарата сердцавыраженное нарушение ритма, печеночная недостаточность.","Мидантан: Побочные: судороги, головная боль, головокружение, раздражительность, бессонница, тремор, психические расстройства, зрительные галлюцинации, сердечная недостаточность, тахикардия, сухость во рту, тошнота, диспепсия, полиурия, никтурия, появление голубоватой окраски кожи верхних и нижних конечностей, снижение остроты зрения. Противопоказания: Гиперчувствительность, эпилепсия, тиреотоксикоз, глаукома, печеночная и почечная недостаточность, беременность"]},"2-8":{"t":"8.АНТИДЕПРЕССАНТЫ. 2) Возможные механизмы","p":["антидепрессивного эффекта препаратов разных групп.","Средства неизбирательного нейронального захвата: Ингибируя обратный нейрональный захват моноаминов, преимущественно норадреналина и серотонина, ослабляют или устраняют тревогу, ажитацию и собственно депрессивные проявления.","Избирательного действия:Серотонина: Механизм связан с усилением серотонинергической активности в ЦНС, в результате ингибирования обратного захвата серотонина нейронами мозга.Меньшее холиноблокирующее действие,незначительное влияние на адреногистаминовые рецепторы.","Норадреналина: блокирует обратный захват моноаминов, но значительно более сильно тормозит обратный захват норадреналина пресинаптическими нервными окон¬чаниями по сравнению с обратным захватом серотонина.","Ингибиторы МАО: при ингибировании МАО-А, в результате чего в тканях мозга повышается содержание норадреналина и серотонина. Неизбирательные-необратимо блокируют МАО-А и МАО-В, избирательные-обратимооооблокируют МАО-А 3)Тактика назначения ингибиторов МАО.","Лечение начинают со средней терапевтической суточной дозы, при необходимости увеличивая ее через 7-10 дней до появления терапевтического или побочного эффекта.","Все антидепрессанты со стимулирующим действием назначаются в первой половине дня, т.е. до 15 ч, в 2-3 приема. Препараты с седативным действием назначаются в 3 приема, большая часть суточной дозы приходится на вторую половину дня.","При применении препаратов из группы ингибиторов МАО необходимо соблюдение специальной диеты: запрещается употребление сыра, копченостей, бобовых, бананов, пива, вина, молочнокислых продуктов, рыбы. Их нельзя применять в сочетании со многими другими, особенно адреномиметическими, препаратами. 4)Побочные эффекты отдельных препаратов.","Прозак- диарея, тошнота, рвота, дисфагия, судороги, атаксия, головокружение, утомляемость (сонливость, астения), нарушение процесса концентрации и мышления, маниакальная реакция, мидриаз, нечеткость зрения, сухость во рту, повышенное потоотделение,зуд, кожная сыпь, крапивница, фоточувствительность Амитриптилин- сухость во рту, задержка мочеиспускания, запор, кишечная непроходимость, нарушение зрения, парез аккомодации, повышение внутриглазного давления, усиленное потоотделение. ахикардия, ортостатическая гипотензия, аритмия, стоматит, нарушение вкуса, потемнение языка. кожная сыпь, зуд, агранулоцитоз, лейкопения, эозинофилия, тромбоцитопения Мапротилин- Ортостатическая гипотензия, тахикардия ,судороги, атаксия, чувство жара, нечеткость зрения, нарушения аккомодации, нарушения координации движений и почерка, выпадение волос, овышение аппетита, агрессивность, нарушение памяти и концентрации внимания, усиление депрессии"]},"2-9":{"t":"9.ПСИХОСТИМУЛИРУЮЩИЕ СРЕДСТВА.","p":["1)Значение работ И.П.Павлова для развития психофармакологии.","Научные основы использования веществ, влияющих на высшую нервную деятельность, разработаны И. П. Павловым, который указал, что определенные лекарственные вещества седативного и возбуждающего характера действуют на высшую нервную деятельность и имеют отношение к главным процессам нервной деятельности-возбуждению и торможению.","Данные И.П. Павлова о нормализации соотношения между раздражительным и тормозным процессом под влиянием психотропных средств –это основа современных представлений о механизме действия психофармакологических средств. 3)Механизмы психостимулирующего действия и фармакологические эффекты кофеина и характеристика других психостимуляторов в сравнении с ним.","Кофеин ингибирует фосфодиэстеразу цАМФ и повышает концентрацию цАМФ в тканях мозга, сердца и других органов.","Повышает умственную и физическую работоспособность, снимает чувство усталости, уменьшает потребность во сне. Зависит от типа нервной деятельности (у некоторых усиливает процессы торможения, вызывает сонливость).Оказывает аналептическое действие. Возбуждая центры блуждающего нерва, вызывает брадикардию. Результат при применении кофеина будет зависеть от преобладающего влияния (центрального или периферического). В больших до¬зах вызывает тахикардию, может вызвать аритмии.Стимуляция сосудодвигательного центра пповышение сосудистого тонуса,а действие на гладкие мышцы сосудов -их расслабление.","Расширяет коронарные сосуды и сосуды почек, но суживает сосуды других органов. Сосуды мозга суживаются.Расслабляет мышцы бронхов, повышает диурез. При гипотензии -повышает АД, нормальное АД не изменяет или незначительно его повышает.","Фенамин- Механизм связан со способностью:1. Освобождать из пресинаптических окончаний НА и дофамин.2. Уменьшать нейрональный захват НА и дофамина. 3.Повышать чувствительность адренергических и дофаминэргических рецепторов к медиаторам.4. Ингибировать в цитоплазме активность МАО. Улучшение памяти, повышение мышечной работоспособности, увеличение переносимости стрессорных ситуаций, снижение потребности в пище, сне и еде.Повышает возбудимость дыхат. и сосудодвигательного центра,обладает анорексигенным действием, стимулируя центры насыщения, что приводит к угнетению центра голода.","Сиднокарб- вытесняет норадреналин из везикул в синаптическую щель и активирует норадренергических влияний в ЦНС. Мало влияет на гемодинамику, мягкое психостимулирующее действие без н стадии эйфории и последующего истощения энергетических ресурсов организма. 4)Показания и противопоказания к применению кофеина и других препаратов.","Кофеин: Показания: Заболевания,с угнетением функций ЦНС и сердечно-сосудистой системы: инфекционные заболевания; отравление наркотическими препаратами; мигрен.","Повышение психического и физического тонуса. Ночное недержание мочи. Противопоказ:","Выраженная артериальная гипертензия, органические заболевания сердечно-сосудистой системы (атеросклероз), повышенная возбудимость, глаукома, нарушения сна, старческий возраст.","Амфетамина сульфат: Показания: Астенодепрессивное состояние, Переутомление и слабость, для повышения работоспособности Противопоказ: шизофрения, гипертония, психическое возбуждение, старческий возраст, атеросклероз, заболевания сердечнососудистой системы, нарушения функции печени, стенокардия.","Меридил : Показания: при астено-депрессивных и астено-невротических состояниях, старческих психозах, повышенной утомляемости Противопоказ: сильное физическое и нервное истощение, гипертония, психическое возбуждение, бессонница, атеросклероз, гипертиреоз.","Синокарб : Показания: физическое и психическое переутомление, после тяжелых заболеваний и черепно-мозговых травм, невротические расстройства с заторможенностью, вялотекущая шизофрения","Противопоказ: атеросклероз, гиперчувствительность, психомоторное возбуждение, артериальная гипертензия, одновременный прием ингибиторов МАО. 5)Теизм (распространение, последствия).","Теизм- психическая зависимость от кофеина. Абстинентный синдром:нервозность, раздражительность, беспокойство, дрожь, подергивание мышц , бессонница, головные боли, респираторный алкалоз, учащенное сердцебиение.Поскольку кофеин увеличивает выработку кислоты желудком, может привести к язвенной болезни, эрозивному эзофагиту, гастроэзофагеальной рефлюксной болезни."]},"3-1":{"t":"1.СОДЕРЖАНИЕ ФАРМАКОЛОГИИ И ЕЕ ПОЛОЖЕНИЕ В СИСТЕМЕ МЕДИЦИНСКОГО ОБРАЗОВАНИЯ. ЗНАЧЕНИЕ ФАРМАКОЛОГИИ ДЛЯ ВРАЧЕБНОГО ОБРАЗОВАНИЯ. ХАРАКТЕРИСТИКА ОСНОВНЫХ ЭТАПОВ РАЗВИТИЯ ФАРМАКОЛОГИИ. РОЛЬ ГИППОКРАТА, ГАЛЕНА, АВИЦЕННЫ, ПАРАЦЕЛЬСА В РАЗВИТИИ ЛЕКАРСТВОВЕДЕНИЯ.","p":["Фармакология - это наука о взаимодействии химических соединений с живыми организмами.","В основном фармакология изучает лекарственные средства, применяемые для лечения и профилактики различных заболеваний и патологических состояний. Одна из важнейших задач фармакологии заключается в изыскании новых эффективных и безопасных лекарственных средств. Диапазон фармакологических исследований очень широк. Он включает изучение влияния веществ на биологические системы разной сложности - от целостного организма до отдельных клеток, субклеточных образований, рецепторов и ферментов. Изменения в функционировании биологической системы, вызванные химическими веществами, служат проявлением их биологического действия (активности). Фармакология изучает лекарственные средства, применяемые в медицине для лечения и профилактики, а также диагностики у больных (и животных) различных заболеваний и патологических процессов, то есть, по существу, фармакология - это наука о лекарственных препаратах, используемых в медицине с различными целями.","История применения лекарственных веществ в медицине восходит к древнейшим временам.","Уже давно люди при заболеваниях инстинктивно стремились для облегчения своих страданий прибегать к той или иной терапии. Лечебные средства они черпали из мира растений, а по мере накопления опыта стали использовать вещества животного и минерального происхождения.","Отыскание лечебных средств было эмпирическим, то есть на основании личного опыта, причем внимание обращалось прежде всего на такие средства, которые привлекали древнего человека формой, окраской, запахом, вкусом, сильным физиологическим действием. Некоторым книгам, содержащим сведения о препаратах растительного происхождения, а также препаратах, приготовленных на основе металлов, средств животного происхождения уже около 3000 лет.","Лекарственные препараты, описанные вначале в аюрведах (книгах жизни), в дальнейшем в некоторой степени были заменены химическими веществами или даже изменены алхимиками.","Первая систематизация имеющегося опыта лечения больных лекарственными средствами была сделана в IY веке до нашей эры, когда древнегреческий врач и мыслитель Гиппократ собрал воедино медицинские наблюдения и сделал попытку дать им философское обоснование. Так как Гиппократ не был сторонником широкого применения лекарственных средств, он рекомендовал лишь логически оправданное применение простых и эффективных средств.","Дальнейшее развитие фармакология получила в трудах Галена, крупнейшего представителя Римской медицины II века нашей эры. В отличие от Гиппократа, считавшего, что в природе даны лекарства в готовом виде, Гален ввел в практику извлечение из природных материалов, чаще всего из растений, полезных начал. Такие препараты до сих пор носят название галеновых.","Дальнейшее развитие о лекарствах наука получила в трудах Авиценны (Х век нашей эры).","Ученый оставил замечательный труд \"Канон врачебного искусства\" в 5 книгах, причем вторая книга \"Канона\" посвящена изучению простых лекарственных средств с точки зрения практического врача.","В XYI веке, в эпоху Возрождения, против учения Гиппократа-Галена выступил крупнейший мыслитель Парацельс (Теофраст Гогенгейм). Этот врач явился основателем ятрохимии. Он дал начало химическому направлению фармакологии."]},"3-10":{"t":"10.ПОНЯТИЕ О ДОЗЕ. КЛАССИФИКАЦИЯ ДОЗ ПО ЭФФЕКТУ И ПЕРИОДИЧНОСТИ НАЗНАЧЕНИЯ. ШИРОТА ТЕРАПЕВТИЧЕСКОГО ДЕЙСТВИЯ ПРЕПАРАТОВ (ПРИМЕРЫ), ЗНАЧЕНИЕ.","p":["Доза - количество вводимого в организм лекарственного средства, которое вызывает фармакологический эффект, выраженное весовым, объемным способом или в единицах биологической активности.","Классификация доз по эффекту Терапевтическая - Лечебная доза - вызывает в организме физиологические изменения, оказывает лечебный эффект. Минимальная (min.) – дает минимальные лечебные проявления (пороговая доза). Средняя (med.) – стандартная доза, которая дает выраженный терапевтический эффект у большинства животных. Максимальная (max.) – высшая доза, ДВР, ДВС, предел терапевтического действия ЛВ.","Токсическая - Отравляющая доза - обусловливает признаки отравления, приводит к появлению токсических эффектов Летальная - Смертельная доза - от действия которой наступает смерть. DL5– (min.) – вызывает гибель 10% животных; DL50- (media) - вызывает гибель 50% животных; DL100 - (abs.) вызывает гибель 100% животных.","Классификация доз по периодичности назначения Разовая - 1) Полная – доза на одномоментный прием. 2) Дробная – уменьшен-ная полная доза, разде-ленная на отдельные порции. 3) Ударная – доза, пре-вышающая последую-щие в 2 раза.","Суточная - Количество лекарственного средства (доза), применяемое больным за день/сутки.","Курсовая - Доза лекарственного вещества, необходимая для проведения всего курса лечения.","Цикловая - Доза лекарственного средства, назначаемая с перерывами (Диакарб - 3 дня прием препарата, следующие 3 дня – перерыв).","Широта терапевтического действия - диапазон между minтерапевтической (действующей) иminтоксической дозой препарата. Чем больше ШТД ЛВ, тем легче дозировать ЛВ, тем оно безопасней. ШТД – признак безопасности препарата. ШТД эфира = 140-200мг%. ШТД хлороформа = 40-55мг%."]},"3-11":{"t":"11.ФИЗИОЛОГИЧЕСКИЕ ОСОБЕННОСТИ ОРГАНИЗМА, ОПРЕДЕЛЯЮЩИЕ НЕОБХОДИМОСТЬ ИНДИВИДУАЛЬНОГО ДОЗИРОВАНИЯ ЛЕКАРСТВ. ВРЕДНЫЕ ПРИВЫЧКИ (КУРЕНИЕ, ЗЛОУПОТРЕБЛЕНИЕ АЛКОГОЛЕМ), МЕНЯЮЩИЕ ХАРАКТЕР ДЕЙСТВИЯ ПРЕПАРАТОВ.","p":["Влияние возраста и пола человека. Для молодых больных характерны более высокие показатели всасывания, выведения, наименьшее время достижения максимальной концентрации лекарства, для старых - более высокое значение периодов полувыведения лекарств.","При назначении лекарств детям необходимо помнить, что у детей до полутора лет биодоступность лекарств, принятых внутрь лишь немного отличается от таковой у взрослых.","Однако всасывание происходит очень медленно. В результате в плазме крови создаются небольшие концентрации, часто недостаточны для достижения терапевтического эффекта.","С давних времен замечены различия в действии лекарств, обусловленные полом. Время пребывания лекарства в организме женщин значительно больше, чем у мужчин, соответственно и уровень концентрации лекарственных веществ в крови женщин выше.","Считается, что это связано с относительно большим содержанием «инертной» жировой ткани у женщин, которая играет роль депо.","Влияние алкоголя. Отрицательно влияет на проявление терапевтического эффекта многих лекарств и является причиной появления опасных осложнений. Непосредственно на биодоступность влияют следующие факторы:","• Изменение проницаемости гистогематические барьеров вследствие нарушения текучести липидных мембран при их взаимодействии с этанолом.","• Изменение структуры и функции клеточных мембран, нарушению проникновения лекарственных веществ через биомембраны.","• Изменение структуры и функции ферментов (Na +-K +-АТФазы, ацетилхолинэстеразы, аденилатциклазы, ферментов митохондриальной электрон-транспортной цепи).","• Повышение секреции желудочной слизи и снижение всасывания лекарств в желудке.","• Переключение системы микросомальной неспецифической ферментативной оксидазные окисляет системы печени на окисление этанола, в результате чего происходит снижение степени окисления других эндогенных и экзогенных лигандов.","• Индукция ферментов печени и, как следствие, изменение скорости и уровня биотрансформации лекарственных веществ.","Всасывание многих лекарственных веществ увеличивается в результате повышения их растворимости под влиянием этанола. Обладая липофильными свойствами, алкоголь облегчает проникновение лекарственных веществ через фосфолипидный мембраны клеток, а в больших концентрациях, поражая слизистую оболочку желудка, еще больше увеличивает всасывание лекарств. Будучи сосудорасширяющим средством, этанол ускоряет проникновение лекарственных препаратов в ткани. Угнетение многих ферментов, которое наступает при употреблении алкоголя, усиливает действие лекарств и приводит к тяжелым интоксикации при приеме обычных лечебных доз. Это касается нейролептиков, анальгетиков, противовоспалительных, снотворных, мочегонных средств; антидепрессантов; инсулина; нитроглицерина.","Алкоголь усиливает действие антикоагулянтов (ацетилсалициловой кислоты, дикумарин). Он настолько усиливает их действие, может возникнуть обильное кровотечение и кровоизлияния во внутренние органы и мозг.","Алкоголь многонаправленного влияние на всасывание и обмен гормональных препаратов. В частности, усиливается сахароснижающей действие инсулина и синтетических препаратов для лечения диабета, в результате чего может развиться диабетическая кома.","Особенно недопустимо применение алкоголя и лекарственных средств, влияющих на функцию центральной нервной системы: успокоительных, снотворных, противосудорожных, а также транквилизаторов (диазепама, оксазепамом), антигистаминных препаратов и др.","Под влиянием алкоголя снижается эффективность витаминотерапии. Происходит инактивация и снижение концентрации антибиотиков в тканях. Алкоголь усиливает токсичность сульфаниламидов и антигельминтное средств, несовместим с противосудорожными средствами.","Влияние курения. На действие лекарственных препаратов могут влиять вещества, поступающие в организм при курении. Никотин, как Н-холиномиметики приводит к активации симпатических и парасимпатических ганглиев, мозгового слоя надпочечников, нарушение функции ЦНС. Стимуляция мозгового слоя надпочечников ведет к сужению периферических сосудов, нарушает кровоснабжение многих органов и тканей. Активация парасимпатических ганглиев повышает секрецию кислого желудочного сока, играющего роль при всасывании лекарств. Никотин, бензпирен и их производные изменяют активность ферментов метаболизма. Курение стимулирует окислительный метаболизм фенацетин, пропранолола, теофиллина, ноксирон, аминазина, диазепама вследствие чего их эффективность снижается.","Курение снижает терапевтический эффект дексаметазона, фуросемида (лазикса), пропоксифена и пероральных контрацептивов. В состав ароматизированных сигарет входят кумарины, которые могут усилить действие антикоагулянтов - производных кумарина."]},"3-12":{"t":"12. ОСОБЕННОСТИ ДЕТСКОГО ОРГАНИЗМА. ВСАСЫВАНИЕ ЛС В ЖКТ У НОВОРОЖДЕН. И ГРУДНЫХ ДЕТЕЙ С УЧЕТОМ ЗНАЧЕНИЯ РН ЖЕЛУД. СОКА, РАЗМЕРА ПОР МЕЖДУ КЛЕТКАМИ КИШЕЧНОГО ЭПИТЕЛИЯ, ТЕМПА ПРОЦЕССОВ ПАССИВ ДИФФ И ИНТЕНСИВНОСТИ АКТИВНОГО ТРАНСПОРТА ЛС. ПРИНЦИПЫ ДОЗИРОВАНИЯ ЛС ДЛЯ ДЕТЕЙ, ВАРИАНТЫ РАСЧЕТА ДОЗ.","p":["Врач-педиатр должен рационально оценивать как преимущества, так и опасности медикаментозного лечения. У детей могут возникнуть побочные реакции на лекарство, не проявляющиеся у взрослых. Необходимо учитывать особенности нервно-психического статуса ребенка, так как дети по-особому реагируют на боль, горький вкус медикаментов, склонны ко многим аллергическим реакциям, судорожным состояниям и др Новорожденные в первый месяц жизни имеют более высокую чувствительность к лекарственным веществам. По скорости всасывания, распределения, метаболизма и выведения веществ они существенно отличаются от взрослых. Связано это в основном с низкой интенсивностью метаболических процессов (вследствие недостаточности ферментов, метаболизирующих ЛВ), сниженной функцией почек, повышенной проницаемостью гематоэнцефалического барьера, недоразвитием эндокринной, нервной систем и других систем организма. Так, у новорожденных отсутствуют ферменты, участвующие в конъюгации хлорамфеникола (левомицетина), что усиливает токсическое действие этого препарата.","Особенности перорального введения ЛС.","ЛС новорожденным вводятся обычно в виде водных растворов и суспензий. Используя этот способ применения ЛС, необходимо учитывать особенности всасывания препаратов в ЖКТ у новорожденных, т. к. у них существенно понижена секреция соляной кислоты, замедлена эвакуаторная способность желудка. Длительно пребывание ЛС в желудке может способствовать их более полному всасыванию и, следовательно, повышению концентрации препаратов в плазме крови. Время пребывания ЛС в кишечнике новорожденных трудно предсказать, так как перистальтика у них нестабильна и далеко не всегда связана с приемом пищи. Однако необходимо отметить, что у новорожденных в период перед и после кормления скорость всасывания ЛС замедляется. При лечении новорожденных следует учитывать, что гиперосмолярные растворы многих ЛС, даже сахарозы, могут вызвать у них развитие некротического энтероколита.","Лекарственное средство детям принято назначать из расчета на 1 кг массы тела, на 1 м2 поверхности тела или на год жизни ребенка. Существуют различные подходы к расчету доз для детей на основе дозы лекарственного препарата для взрослого:","- исходя из массы тела (правило Кларка);","- исходя из возраста (правило Янга);","- исходя из площади поверхности тела;","- на основе дозис фактора."]},"3-13":{"t":"13. ПРЕВРАЩЕНИЕ ЛВ В ОРГАНИЗМЕ. ЭТАПЫ И ВИДЫ БИОТРАНСФОРМАЦ. ИНДУКТОРЫ И ИНГИБИТОРЫ МИКРОСОМАЛ АППАР ПЕЧЕНИ,ВЛИЯНИЕ ИХ НА БИОТРАНС ЛВ(ПРИМЕРЫ)","p":["Биотрансформация (метаболизм) — изменение химической структуры лекарственных веществ и их физико-химических свойств под действием ферментов организма. Основной направленностью этого процесса является превращение липофильных веществ, которые легко реабсорбируются в почечных канальцах, в гидрофильные полярные соединения, которые быстро выводятся почками. В процессе биотрансформации, как правило, происходит снижение активности (токсичности) исходных веществ.Различают метаболические реакции лекарственных веществ двух типов – несинтетические и синтетические.","Несинтетические реакции в свою очередь бывают:","- микросомальные – катализируемые ферментами эндоплазматического ретикулума;","- немикросомальные – катализируемые ферментами иной локализации (реакции окисления, восстановления и гидролиза).","Биотрансформация липофильных ЛВ в основном происходит под влиянием ферментов печени, локализованных в мембране эндоплазматического ретикулума гепатоцитов. Эти ферменты называются микросомальными, потому что они оказываются связанными с мелкими субклеточными фрагментами гладкого эндоплазматического ретикулума (микросомами), которые образуются при гомогенизации печеночной ткани или тканей других органов. Известны индукторы синтеза микросомальных ферментов (фенобарбитал, фенитоин, гризеофульвин и др.) и ингибиторы микросомальных ферментов (циметидин, хлорамфеникол, фуразолидон, ингибиторы МАО). В связи с этим на фоне систематического применения фенобарбитала или гризеофульвина ослабляется действие глюкокортикоидов, контрацептивных средств для назначения внутрь. Фенитоин увеличивает возможность токсического действия парацетамола. Ингибиторы МАО пролонгируют действие барбитуратов.","В основе синтетических реакций лежит конъюгация ЛВ с эндогенными соединениями или химическими группировками (глюкуроновая кислота, глутатион, сульфаты, глицин и др.).","Лекарства, поступившие в организм, проходят следующие превращения:","• всасывание;","• связывание с белками и транспорт кровью;","• взаимодействие с рецепторами;","• распределение в тканях;","• метаболизм и выведение из организма.","Механизм первого этапа (всасывание) определяется физико-химическими свойствами лекарства. Гидрофобные соединения легко проникают через мембраны простой диффузией, в то время как лекарственные вещества, нерастворимые в липидах, проникают через мембраны путём трансмембранного переноса при участии разных типов транслоказ. Некоторые нерастворимые крупные частицы могут проникать в лимфатическую систему путём пиноцитоза. Следующие этапы метаболизма лекарственного вещества в организме тоже определяются его химическим строением."]},"3-14":{"t":"14. КЛАССИФИКАЦИЯ ЛЕКАРСТВЕННЫХ ФОРМ С УКАЗАНИЕМ РАЗНОВИДНОСТЕЙ. ФАРМАКОЛОГИЧЕСКАЯ Х-КА","p":["МИКРОКАПСУЛИРОВАННЫХ ЛЕКАРСТВ ФОРМ, разновидностей таблеток и терапевтических систем.","Можно выделить следующие группы классификации лекарственных форм:","I. Классификация лекарственных форм по агрегатному состоянию.","1. Твердые. 2. Мягкие. 3. Жидкие. 4. Газообразные.","1. Твердые лекарственные формы.","• таблетки – дозированная лекарственная форма, получаемая путем прессования или формирования ЛС, лекарственных смесей и вспомогательных веществ;","• драже – дозированная лекарственная форма округлой формы, получаемая путем многократного наслаивания ЛС и вспомогательных в-в в гранулы;","• гранулы – однородные частицы (крупинки, зернышки) лекарственных средств округлой, цилиндрической или неправильной формы размером 0,2 – 0,3 мм.;","• порошки – лекарственные формы, обладающие сыпучестью; различают порошки простые (однокомпонентные) и сложные (из двух и более компонентов), разделенные на отдельные дозы и неразделенные;","• сборы – смесь нескольких видов лекарственного сырья растений - иногда с добавлением других лекарственных средств;","• капсулы – дозированные порошкообразные, гранулированные, иногда жидкие лекарственные средства, заключенные в оболочку из желатина, крахмала;","• спансулы – капсулы, в которых содержимым является определенное количество гранул или микрокапсул;","• карандаши лекарственные (медицинские) – цилиндрические палочки толщиной 4-8 мм и длиной до 10 см с заостренным или закругленным концом;","• пленки лекарственные – лекарственная форма в виде полимерной пленки.","2. Мягкие лекарственные формы.","• мази – лекарственные формы мягкой консистенции для наружного применения;","• пластыри – лекарственная форма для наружного применения, обладающая способностью после размягчения при температуре тела прилипать к коже;","• суппозитории (свечи) – дозированные лекарственные формы, предназначенные для введения в полости тела (ректальные, вагинальные свечи).","• пилюли – дозированная лекарственная форма в виде шарика, содержащей ЛС и вспомогательные вещества; пилюля весом более 0,5 г называется болюсом.","3. Жидкие лекарственные формы.","• растворы – лекарств формы, получ. путем растворения одного или нескольких ЛС;","• суспензии (взвеси) - системы, в которых твердое вещество взвешено в жидком;","• эмульсии – лекарств формы, образованные нерастворим друг в друге жидкостями;","• настои и отвары–водяные вытяжки из растительн сырья или водные р-ры экстракт;","• слизи – лекарственные формы высокой вязкости, а также приготовленные с применением крахмала из водной вытяжки растительного сырья;","• линименты – густые жидкости или студнеобразные массы;","• пластыри жидкие – при нанесении на кожу оставляют эластичную пленку;","• сиропы лекарственные – раствор ЛВ в густом растворе сахара;","• настойки–спиртовое, водно-спиртовое или спирто-эфирное прозрачные извлечения из лекарств растительного сырья, получ без нагревания и удаления экстрактов;","• экстракты – концентрированные извлечения из лекарственного растительного сырья; различают жидкие, густые, сухие и другие виды экстрактов.","4. Газообразные лекарственные формы.","• аэрозоль – лекарственная форма в специальной упаковке, в которой твердые или жидкие лекарственные средства находятся в газе или газообразном веществе;","II. Классификация лекарственных форм в зависимости от способа применения или метода дозирования. 1. Капли. 2. Микстуры. 3. Таблетки. 4. Примочки. 5. Припарки.","6. Промывания. 7. Пудры. 8. Присыпки. 9. Полоскания.","III. Классификация лекарственных форм в зависимости от способа введения в организм. 1.","Энтеральные - формы, вводимые в организм через ЖКТ.","2. Парентеральные - формы, вводимые, минуя ЖКТ, путем нанесения на кожу и слизистые оболочки организма; путем инъекций в сосудистое русло, под кожу или мышцу; путем вдыхания, ингаляций."]},"3-15":{"t":"15. ОСНОВНЫЕ ВИДЫ ЛЕКАРСТВЕННОЙ ТЕРАПИИ (ПРИМЕРЫ). ПРИНЦИПЫ ХИМИОТЕРАПИИ.","p":["1. Симптоматическая терапия направлена на устранение определенного симптома заболевания, например, назначение противокашлевых средств при бронхите.","2. Этиотропная терапия — устранение причины заболевания, когда лекарственные вещества уничтожают возбудителя болезни. Например, лечение инфекционных болезней химиотерапевтическими средствами.","3. Патогенетическая терапия — направлена на устранение механизма развития заболевания.","Например, применение болеутоляющих средств при травме, когда болевой синдром влечет развитие опасного для жизни шока.","4. Заместительная терапия — восстановление в организме дефицита естественных веществ, образующихся в нем (гормоны, ферменты, витамины) и принимающих участие в регуляции физиологических функций. Например, введение гормонального препарата при выпадении функции соответствующей железы. Заместительная терапия, не устраняя причины заболевания, может обеспечить жизнедеятельность в течение многих лет. Так, препараты инсулина не влияют на выработку этого гормона в поджелудочной железе, но при постоянном введении его больному сахарным диабетом обеспечивают нормальный обмен углеводов в его организме.","Общие принципы химиотерапии","- злокачественные клетки должны быть чувствительны к используемому препарату;","- лекарство должно достигать раковой опухоли (например, должно проникать через гематоэнцефалический барьер при опухолях головного мозга);","- если лекарство действует только в одну фазу цикла развития клетки, то его следует принимать настолько часто, чтобы можно было повлиять на все клетки опухоли;","- все злокачественные клетки должны быть уничтожены до того, как станут нечувствительными к химиотерапии;","- применение нескольких химиопрепаратов одновременно есть более эффективным, чем применение одного.","Принципы выбора химиопрепаратов","- л-во должно обладать достаточной эффективностью против опухоли данного типа;","- если в распоряжении несколько лекарства одного типа, то предпочтение отдается тому, у которого меньше побочных эффектов;","- лекарство должно использоваться в наиболее эффективном режиме и дозировке;","- предпочтительно комбинировать лекарства с разными механизмами действия;","- интервал между курсами химиотерапии должен быть максимально коротким."]},"3-16":{"t":"16. ВИДЫ ДЕЙСТВИЯ ЛВ В ЗАВИСИМОСТИ ОТ ЭФФЕКТА ИЗМЕНЕНИЯ Ф-ЦИИ (ПРИМЕРЫ). МЕХАНИЗМЫ ДЕЙСТВИЯ ЛВ НА РАЗНЫХ УРОВНЯХ (СУБКЛЕТОЧ, КЛЕТОЧ, ОРГ, СИСТЕМН) ВИДЫ ДЕЙСТВИЯ ЛЕКАРСТВЕННЫХ СРЕДСТВ.","p":["1. Местное действие ЛС возникает на месте его применения (кожа, слизистые). Местное действие может быть обволакивающим, вяжущим, прижигающим, противовоспалительным, местноанестезирующим, раздражающим.","2. Рефлекторное действие – изменение лекарствами функции органов в результате прямого влияния на чувствительные нервные окончания. Рефлекторными эффектами при возбуждении экстерорецепторов обладают кожные раздражители; интерорецепторов – рвотные, желчегонные, слабительные, отхаркивающие средства; хеморецепторов сосудов – аналептики, проприорецепторов скелетных мышц – миорелаксанты. Например, при вдыхании раздражающих средств возникают рефлексы с дыхательных путей на сердце, дыхательный центр. Использ. горчичников при патологии органов дыхания рефлекторно улучшает их трофику.","3. Резорбтивное действие лекарственные средства оказывают после всасывания, поступления в кровоток, а, затем, в ткани. Оно может быть прямым и косвенным. Прямое (первичное) действие – изменение лекарствами функции органов в результате действия на клетки этих органов (усиление сердечных сокращений сердечными гликозидами вследствие блокады Na+, K+ - АТФ-азы мышечных клеток миокарда). Косвенное (вторичное) действие - изменение лекарствами функции органов и клеток в результате действия на другие органы и клетки, функционально связанные с первыми (сердечные гликозиды оказывают мочегонное влияние, так как усиливают сердечные сокращения, улучшают кровоток в почках, повышают фильтрацию и образование мочи).","4. Избирательное (элективное) действие. Лекарственные средства с избирательным действием оказывают направленное действие, они, как правило, изменяют функции только одного органа.","К сожалению, пока лишь немногие лекарства способны оказывать прицельное действие на патологически измененный орган.","Механизмы действия ЛВ на разных уровнях. Главное действие – совокупность изменений в организме, для достижения которых лекарства применяют в клинике. Побочное действие – дополнительные, нежелательные эффекты лекарств. Влияние лекарств на биохимические процессы, происходящие в организме человека, и лежит в основе их механизма действия. Все лекарства по механизму действия можно разделить на 3 группы: 1. Лекарства, в основе действия которых лежат физические факторы; 2. Лекарства, механизм действия которых обусловлен химическими взаимодействиями вне клеток; 3. Лекарства, действующие на клеточные структуры.. Физические явления лежат и в основе механизма действия адсорбирующих средств и некоторых слабительных. Лекарства второй группы вступают в химическое взаимодействие вне клеток с различными ферментами, гормонами, медиаторами и при этом могут как вызвать их инактивацию, так и повышение активности (цитрат натрия, связывающий кальций, протаминсульфат, инактивирующий действие гепарина). Большая же часть лекарств по механизму действия относится к третьей группе."]},"3-17":{"t":"17. ОСНОВНЫЕ РАЗНОВИДНОСТИ РЕЗОРБТИВНОГО ДЕЙСТВИЯ ЛЕКАРСТВ (ПРИМЕРЫ).","p":["Действие вещества, развивающееся после его всасывания, поступления в общий кровоток и затем в ткани, называют резорбтивным.","Резорбтивное действие развивается после всасывания лекарства в кровь и распределения его вместе с ней по периферическим тканям (периферическое действие) или в ЦНС (центральное действие).","Резорбтивное действие может быть прямым и косвенным.","1. Прямое (первичное) действие – изменение лекарствами функции органов в результате действия на клетки этих органов (усиление сердечных сокращений сердечными гликозидами вследствие блокады Na+, K+ - АТФ-азы мышечных клеток миокарда; повышение мочеобразования при действии мочегонных средств на реабсорбцию ионов и воды в почечных канальцах).","2. Косвенное (вторичное) действие - изменение лекарствами функции органов и клеток в результате действия на другие органы и клетки, функционально связанные с первыми (сердечные гликозиды оказывают мочегонное влияние, так как усиливают сердечные сокращения, улучшают кровоток в почках, повышают фильтрацию и образование мочи).","Частным случаем косвенного действия является рефлекторное."]},"3-18":{"t":"18. ОПРЕДЕЛЕНИЕ ПОНЯТИЙ: «ПОБОЧ ДЕЙСТВИЕ», «ЭМБРИОТОКСИЧ», «ТЕРАТОГЕН.», «ФЕТОТОКСИЧНОСТЬ», «КАНЦЕРОГЕННОСТЬ», «СЕНСИБИЛИЗ.», «ИДИОСИНКРАЗИЯ». МЕХАНИЗМ РАЗВИТИЯ ИДИОСИНКРАЗИИ ПРИ НАЗНАЧ ТЕРАПЕВТИЧ","p":["Токсическое действие может быть вызвано использованием высоких доз, относительной передозировкой в связи с замедленным выведением лекарства или индивидуальной гиперчувствительностью пациента. Индивидуальная, атипичная и бурно протекающая токсическая реакция больного на лекарство называется идиосинкразией. К специфическим видам токсичности относятся: аллергизующее, мутагепиое и канцерогенное действие, а у беременных — эмбриотоксическое, фетотоксическое и тератогенное действие лекарств.","Эмбриотоксическими и фетотоксическими эффектами называют токсические влияния на зародыш или плод, соответственно. Они приводят к повреждению тканей или гибели плода, провоцируют прерывание беременности.","Фетотоксичность может развиться под влиянием лекарственных средств от 4 месяцев беременности до ее завершения. Это нарушение жизнедеятельности органов плода в результате действия лекарств на него (преждевременное заращение артериального протока под влиянием нестероидных противовоспалительных препаратов, угнетение дыхания от воздействия резерпина).","Канцерогенными называют лекарственные вещества, которые через определенный отрезок времени могут вызвать рост злокачественных опухолей.","Тератогенное действие — способность лекарства вызывать различные уродства в результате нарушений закладки органов на 3-10 неделях беременности.","Сенсибилизация - это повышение чувствительности при повторном введении. В механизме этого явления - образование прочных связей с белками (гаптен - антиген) с последующим развитием медикаментозной аллергии - через 7-12 дней или при повторном лечении после первого введения.","Идиосинкразия - генетически обусловленная патологическая реакция на определенный лекарственный препарат. Эта реакция характеризуется резко повышенной чувствительностью больного к соответствующему препарату с необычайно сильным и (или) продолжительным эффектом. В основе идиосинкразии - реакции, обусловленные наследственными дефектами ферментных систем. Они встречаются реже, чем аллергические реакции.","Известны многочисленные примеры идиосинкразии. При лечении сульфаниламидами или примахином больных с дефицитом глюкоза-6-фосфатлегидрогеназы Г-6 ФДО развивается гемолитическая анемия.","При усиленной барбитуратами индукции синтетазы аминолевулиновой кислоты развивается приступ печеночной порфирии. Дефицит метгемоглобинредуктазы при лечении нитратами приводит к метгемоглобинемии. К аналогичному эффекту приводит применение нитратов при наличии патологических гемоглобинов и фенацетина при уменьшении дезалкилирования этого препарат"]},"3-19":{"t":"19. ПОНЯТИЕ О КУМУЛЯЦИИ, ВИДЫ (ПРИМЕРЫ). ПРИВЫКАНИЕ И ТАХИФИЛАКСИЯ (ПРИМЕРЫ); ВОЗМОЖНЫЕ ПРИЧИНЫ ЭТИХ ПРОЯВЛЕНИЙ И ПРИНЦИПЫ ПРЕОДОЛЕНИЯ.","p":["Кумуляция (cumulatio накопление, увеличение) — усиление действия лекарственных средств и ядов при их повторных введениях в одних и тех же дозах.","Различают материальную и функциональную кумуляцию.","Под материальной подразумевают накопление действующего вещества в организме, что подтверждается прямым измерением его концентраций в крови и тканях. Материальная кумуляция как правило, характерна для веществ, которые медленно метаболизируются и недостаточно полно выводятся из организма. Материальная кумуляция часто возникает при приеме ряда сердечных гликозидов (например, дигитоксина), алкалоидов (атропина, стрихнина), снотворных средств длительного действия (фенобарбитала), антикоагулянтов непрямого действия (синкумара и др.), солей тяжелых металлов (например, ртути).","Функциональная кумуляция в большей степени свойственна веществам, влияющим на деятельность ЦНС, и, как правило, свидетельствует о высокой чувствительности организма к таким веществам. Классическим примером функциональной кумуляции является нарушение психики и изменение личности при хроническом алкоголизме и наркоманиях. Функциональная кумуляция возможна также при приеме антидепрессантов из группы ингибиторов МАО, антихолинэстеразных средств необратимого действия (фосфакол) и др.","Привыкание к лекарственным средствам — ослабление эффектов ЛС при их повторном применении. Быстрое привыкание к лекарствам (после 2—4 введений) обозначают термином «тахифилаксия». Привыкание к ЛС может иметь фармакокинетическую и (или) фармакодинамическую природу. Основой фармакокинетических механизмов развития привыкания является снижение концентрации ЛС в области чувствительных к ним рецепторов вследствие изменения при повторных введениях каких-либо параметров фармакокинетики препаратов (препаратам из группы производных барбитуровой кислоты, транквилизаторам бензодиазепинового ряда и некоторым другим лекарственным средствам). При фармакодинамическом типе привыкания к лекарственным средствам их концентрация в области соответствующих специфических рецепторов не изменяются, однако происходит снижение чувствительности органов и тканей к препаратам. Причинами такого рода адаптивной реакции организма на лекарства являются уменьшение плотности специфических рецепторов, снижение их чувствительности к лекарственным средствам и изменение процесса сопряжения функции рецепторов их внутриклеточных посредников и эффекторных молекулярных систем. Фармакодинамические механизмы характерны для привыкания к наркотическим анальгетикам, адреномиметикам, симпатомиметикам, адреноблокирующим средствам и др. Весьма часто привыкание к лекарственным средствам развивается как в результате изменений их фармакокинетики, так и вследствие снижения чувствительности к ним организма.","Для профилактики осложнений наиболее важное значение имеют правильный подбор доз препаратов, выбор оптимальной схемы их назначения, тщательный контроль за динамикой функциональных изменений в организм."]},"3-2":{"t":"2.КРАТКАЯ ХАРАКТЕРИСТИКА РАЗВИТИЯ ОТЕЧЕСТВЕННОЙ ФАРМАКОЛОГИИ (А.А.СОКОЛОВСКИЙ, А.А.ИОВСКИЙ, А.П.НЕЛЮБИН, В.Н.ДЫБКОВСКИЙ И ДР.). ЗАСЛУГИ И.П.ПАВЛОВА И Н.П.КРАВКОВА В РАЗВИТИИ ОТЕЧЕСТВЕННОЙ ФАРМАКОЛОГИИ. ВКЛАД РУССКИХ ФИЗИОЛОГОВ И КЛИНИЦИСТОВ В РАЗВИТИЕ ФАРМАКОЛОГИИ (Н.И.ПИРОГОВ, И.М.СЕЧЕНОВ, Е.В.ПЕЛИКАН, Л.В.СОБОЛЕВ И ДР.) РАБОТЫ З.В.ЕРМОЛЬЕВОЙ, С.В.АНИЧКОВА, В.В.ЗАКУСОВА И ДР.","p":["Зародилась экспериментальная фармакология в Юрьевском (Тартуском) университете. Здесь в 1849 г. была создана первая в мире лаборатория экспериментальной фармакологии.","Крупнейшим медицинским научным центром в России была Медико-хирургическая академия в Санкт-Петербурге. Она объединяла блестящую плеяду ученых, в том числе ряд фармакологов. Так, А.П. Нелюбин известен своими исследованиями кавказских минеральных вод и 3-томным руководством «Фармакография, или химико-врачебные предписания приготовления и употребления новейших лекарств».","О.В. Забелин организовал при академии специальную фармакологическую лабораторию. Здесь был выполнен ряд экспериментальных работ, в том числе 11 диссертаций. Е.В. Пеликан, будучи профессором судебной химии и токсикологии, прославился работами по изучению механизма действия кураре и препаратов строфанта.","В 1835 г. вышел в свет учебник московского фармаколога А.А. Иовского «Начертание общей фармакологии». Экспериментальная фармакология в Московском университете стала развиваться благодаря работам А.А. Соколовского (1822-1891), посвященным вопросам нейрофармакологии. Его перу принадлежат также руководства «Курс органической фармакодинамики», «Неорганическая фармакология» и др.","В Киевском университете начало экспериментальной фармакологии было положено В.И.","Дыбковским, который интересовался в основном фармакологией кардиотропных веществ. В.И.","Дыбковский является автором лекций по фармакологии.","Большую роль в развитии фармакологии сыграли экспериментальные и клинические работы ряда крупных физиологов и клиницистов. Так, хорошо известны исследования средств для наркоза, выполненные знаменитым хирургом Н.И. Пироговым и физиологом А.М.","Филомафитским. Ряд интересных работ в области фармакологии нейротропных средств принадлежит основоположнику отечественной физиологии И.М. Сеченову. Выдающийся русский терапевт С.П. Боткин с сотрудниками проводил широкое изучение кардиотропных средств.","Значительное влияние на развитие отечественной фармакологии оказал И.П. Павлов. Он начал свою деятельность в области фармакологии в клинике С.П. Боткина, где руководил экспериментальной лабораторией в течение 11 лет. Здесь под руководством И.П. Павлова изучались сердечные гликозиды, жаропонижающие средства, ряд ионов и др.","Он по праву считается одним из основоположников психофармакологии. Впервые в истории науки И.П. Павлов и его сотрудники изучали влияние веществ (бромидов, кофеина) на высшую нервную деятельность у здоровых животных и при экспериментально вызванных неврозах.","Яркой личностью в истории фармакологии был Н.П. Кравков (1865-1924). Он был избран заведующим кафедры фармакологии Военно-медицинской академии вскоре после И.П.","Павлова и руководил ею в течение 25 лет. Большое внимание Н.П. Кравков уделял проблемам общей фармакологии: выяснению зависимости биологического эффекта от дозы и концентрации
