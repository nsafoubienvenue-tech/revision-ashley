<title>Rattrapage Pharma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout : app tablette — barre latérale fixe (≥ 760 px), barre d'onglets en bas sur téléphone ; colonne de travail centrée ~ 760 px */
:root{
  --paper:#f3f6f5; --surface:#ffffff; --sunk:#e8eeec; --ink:#13221e; --muted:#566862; --line:#d3ddd9;
  --accent:#0b6b57; --accent-ink:#ffffff; --accent-soft:#d9eee7; --rx:#7b2d3a; --rx-soft:#f6e9eb;
  --ok:#1f7a45; --ok-soft:#dcf1e3; --ko:#b23a26; --ko-soft:#f9e3de; --warn:#8a5a00; --warn-soft:#fbefd5;
  --hl:#fff1b8;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"PT Serif",Georgia,"Times New Roman",serif;
  --r:14px; --side:232px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1513; --surface:#151f1c; --sunk:#1b2824; --ink:#e2ebe8; --muted:#93a59f; --line:#283733;
  --accent:#4cc3a2; --accent-ink:#06231b; --accent-soft:#163128; --rx:#e48b99; --rx-soft:#2c1a1e;
  --ok:#5ccf8b; --ok-soft:#16301f; --ko:#f08a74; --ko-soft:#34191373; --warn:#e8b65a; --warn-soft:#2f2614; --hl:#4a4215; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1513; --surface:#151f1c; --sunk:#1b2824; --ink:#e2ebe8; --muted:#93a59f; --line:#283733;
  --accent:#4cc3a2; --accent-ink:#06231b; --accent-soft:#163128; --rx:#e48b99; --rx-soft:#2c1a1e;
  --ok:#5ccf8b; --ok-soft:#16301f; --ko:#f08a74; --ko-soft:#34191373; --warn:#e8b65a; --warn-soft:#2f2614; --hl:#4a4215; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{text-wrap:balance;margin:0}
.app{display:flex;min-height:100%}
/* ---------- navigation ---------- */
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:flex-start;height:100vh;width:var(--side);flex:none;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.brand{font:700 15px/1.25 var(--f-display);letter-spacing:.01em;padding:4px 10px 18px}
.brand small{display:block;font:500 12px var(--f-body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:6px}
.nav a{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .foot{margin-top:auto;font-size:12.5px;color:var(--muted);padding:0 10px}
.main{flex:1;min-width:0;padding-inline:clamp(16px,4vw,48px);padding-block:28px 120px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.wrap.wide{max-width:1100px}
.tabbar{display:none}
@media (max-width:759px){
  .side{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;padding:6px 0;min-height:52px;justify-content:center}
  .tabbar a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
  .tabbar a[aria-current="page"]{color:var(--accent);font-weight:600}
  .main{padding-block:18px 110px}
}
/* ---------- typographie ---------- */
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h1{font:700 clamp(24px,3.4vw,34px)/1.15 var(--f-display);letter-spacing:-.01em}
.h2{font:600 20px/1.3 var(--f-body)}
.lead{color:var(--muted);max-width:62ch;margin:6px 0 0}
.muted{color:var(--muted)}
.small{font-size:14px}
/* ---------- éléments ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,2.4vw,26px)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.ko{background:var(--ko-soft);border-color:transparent;color:var(--ko)}
.btn.big{min-height:56px;font-size:17px;padding-inline:24px}
.btn[disabled]{opacity:.45;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{min-height:42px;padding:8px 16px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.input{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.ko{background:var(--ko-soft);color:var(--ko)} .badge.warn{background:var(--warn-soft);color:var(--warn)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.stat{display:flex;flex-direction:column;gap:8px}
.stat b{font:600 15px var(--f-body)}
.stat .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.note{border-radius:12px;padding:12px 14px;background:var(--warn-soft);color:var(--warn);font-size:14.5px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
details.q{border-top:1px solid var(--line)}
details.q:first-child{border-top:0}
details.q summary{list-style:none;cursor:pointer;padding:14px 4px;display:flex;gap:12px;align-items:flex-start}
details.q summary::-webkit-details-marker{display:none}
details.q summary .num{font:700 13px var(--f-display);color:var(--accent);min-width:42px;padding-top:3px;font-variant-numeric:tabular-nums}
details.q[open] summary{font-weight:600}
.reading{font:17px/1.65 var(--f-read);max-width:68ch}
.reading p{margin:0 0 .7em}
.reading h4{font:600 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:1.2em 0 .5em}
/* ---------- oral : билет ---------- */
.ticket{display:flex;flex-direction:column;gap:14px}
.tq{display:flex;flex-direction:column;gap:12px}
.tq .lot{font:700 12px var(--f-display);letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.tq .txt{font-size:17px;max-width:70ch}
.tq > .btn{align-self:flex-start}
.timer{font:700 clamp(40px,7vw,64px)/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer.low{color:var(--ko)}
.answer{border-top:1px dashed var(--line);padding-top:14px;margin-top:4px}
/* ---------- ordonnances ---------- */
.flash{display:flex;flex-direction:column;gap:18px;align-items:stretch}
.drug{font:700 clamp(26px,4.4vw,40px)/1.15 var(--f-display);letter-spacing:-.01em;text-align:center;padding:26px 8px 8px}
.form107{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px clamp(18px,3vw,34px);font:18px/1.7 var(--f-read);box-shadow:0 1px 0 var(--line),0 8px 24px -16px rgba(0,0,0,.3)}
.form107::before{content:"Рецепт";position:absolute;top:10px;right:16px;font:600 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--rx)}
.form107 .l{display:block}
.form107 .rp{color:var(--rx);font-weight:700;font-style:italic}
.form107 .sig{font-style:italic}
.hide{filter:blur(9px);user-select:none;pointer-events:none}
.counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
table.list{width:100%;border-collapse:collapse;font-size:15px}
table.list td{border-top:1px solid var(--line);padding:12px 8px;vertical-align:top}
table.list td:first-child{font-weight:600;width:34%}
.rxl{font-family:var(--f-read)}
/* ---------- QCM ---------- */
.qcard .content{font-size:16px;overflow-wrap:anywhere}
.qcard .content p{margin:.35em 0}
.qcard .content .stem{font-weight:600;font-size:17px;margin-bottom:.6em}
.qcard .content .gap{display:inline-block;width:1.2em}
.qcard .content .opt .n{font-weight:700;color:var(--muted);margin-right:4px}
.tw{overflow-x:auto;margin:.6em 0}
.tw table{border-collapse:collapse;font-size:14.5px;min-width:100%}
.tw td{border:1px solid var(--line);padding:8px 10px;vertical-align:top}
.qcard img{max-width:100%;height:auto;background:#fff;border-radius:6px;padding:4px;display:block;margin:.5em 0}
/* mode question : réponses masquées */
.qcard:not(.shown) b.a{font-weight:inherit}
.qcard:not(.shown) b.a.bl{display:inline-block;min-width:3em;color:transparent;border-bottom:2px solid var(--muted);user-select:none}
.qcard:not(.shown) td.a.bl{color:transparent;user-select:none}
.qcard:not(.shown) td.a.bl *{color:transparent}
.qcard.shown b.a{background:var(--ok-soft);color:var(--ok);border-radius:4px;padding:0 3px;font-weight:700}
.qcard.shown td.a{background:var(--ok-soft);color:var(--ok);font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.optb{display:flex;gap:12px;align-items:flex-start;text-align:left;min-height:52px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;line-height:1.4}
.optb .k{flex:none;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted)}
.optb[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.optb[aria-pressed="true"] .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.optb.right{border-color:var(--ok);background:var(--ok-soft)}
.optb.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.optb.wrong{border-color:var(--ko);background:var(--ko-soft)}
.optb.wrong .k{background:var(--ko);border-color:var(--ko);color:#fff}
.optb.missed{border-style:dashed;border-color:var(--ok)}
.verdict{font-weight:700;font-size:17px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--ko)}
.ansbox{background:var(--ok-soft);color:var(--ink);border-radius:12px;padding:14px 16px;font-size:16px}
.ansbox b{color:var(--ok)}
.score{font:700 clamp(44px,8vw,72px)/1 var(--f-display);font-variant-numeric:tabular-nums}
/* ---------- planning ---------- */
.day{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:16px 4px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .dn{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font:700 16px var(--f-display);background:var(--sunk);color:var(--muted);border:0}
.day.done .dn{background:var(--accent);color:var(--accent-ink)}
.day.today{background:var(--accent-soft);border-radius:12px;padding-inline:12px}
.day dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:6px 0 0;font-size:14.5px}
.day dt{color:var(--muted);font-weight:600}
.day dd{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>window.DATA={"tests":[{"id":1,"t":"Cholinergiques","h":"<p class=\"stem\">Укажите соответствие<\/p>\n<p><span class=\"gap\"><\/span> ПРЕПАРАТ <span class=\"gap\"><\/span> ГРУППА<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> пилокарпина гидрохлорид; <span class=\"gap\"><\/span> <b class=\"a bl\">б<\/b> <span class=\"gap\"><\/span> а) антихолинэстеразные<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> физостигмина салицилат; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> препараты обратимого<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> карбахолин; <span class=\"gap\"><\/span> <b class=\"a bl\">в<\/b> <span class=\"gap\"><\/span> действия;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> неостигмин; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> б)  М-холиномиметики;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> пиридостигмин. <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> в)  М+Н-холиномиметики.<\/p>"},{"id":2,"t":"Cholinergiques","h":"<p class=\"stem\">Укажите соответствие<\/p>\n<p><span class=\"gap\"><\/span> ПРЕПАРАТ <span class=\"gap\"><\/span> ГРУППА<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> ацетилхолин; <span class=\"gap\"><\/span> <b class=\"a bl\">в<\/b> <span class=\"gap\"><\/span> а) антихолинэстеразные<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> ипидакрин; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> препараты обратимого<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> стефаглабрина сульфат; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> действия;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> диэтиксим. <span class=\"gap\"><\/span> <b class=\"a bl\">б<\/b> <span class=\"gap\"><\/span> б)  реактиваторы холинэстеразы;<\/p>\n<p><span class=\"gap\"><\/span> в)  М+Н-холиномиметики.<\/p>"},{"id":3,"t":"Cholinergiques","h":"<p class=\"stem\">Вставьте недостающие слова<\/p>\n<p>Ацетилхолин-хлорид относится к фармакологической группе <span class=\"gap\"><\/span> , по химическому строению является сложным эфиром аминоспирта <span class=\"gap\"><\/span> и<\/p>\n<p><span class=\"gap\"><\/span> кислоты.<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> М-холиномиметиков, <b class=\"a\">М+Н-холиномиметиков<\/b>, антихолинэстеразных;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> Тропина, <b class=\"a\">холина, уксусной<\/b>, троповой.<\/p>"},{"id":4,"t":"Cholinergiques","h":"<p class=\"stem\">Охарактеризуйте неостигмин (заполните таблицу)<\/p>\n<div class=\"tw\"><table><tr><td>Фармакологическая<br>группа<\/td><td>Источник получения<\/td><td>Химическое строение<\/td><\/tr><tr><td class=\"a bl\">1<\/td><td class=\"a bl\">5<\/td><td class=\"a bl\">9<\/td><\/tr><\/table><\/div>\n<p>Фармакологическая группа<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> <b class=\"a\">антихолинэстеразный препарат обратимого действия;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> антихолинэстеразный препарат «необратимого» действия;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> М-холиномиметик;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> Реактиватор холинэстеразы.<\/p>\n<p>Источник получения<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> <b class=\"a\">синтетический препарат;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">6)<\/span> подснежник Воронова;<\/p>\n<p class=\"opt\"><span class=\"n\">7)<\/span> «калабарские» бобы.<\/p>\n<p>Химическое строение<\/p>\n<p class=\"opt\"><span class=\"n\">8)<\/span> фосфорорганическое соединение;<\/p>\n<p class=\"opt\"><span class=\"n\">9)<\/span> <b class=\"a\">четвертичный амин;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">10)<\/span> третичный амин.<\/p>"},{"id":5,"t":"Cholinergiques","h":"<p class=\"stem\">Охарактеризуйте пилокарпина гидрохлорид (заполните таблицу)<\/p>\n<div class=\"tw\"><table><tr><td>Фармакологическая<br>группа<\/td><td>Источник получения<\/td><td>Химическое строение<\/td><\/tr><tr><td class=\"a bl\">2<\/td><td class=\"a bl\">5<\/td><td class=\"a bl\">8<\/td><\/tr><\/table><\/div>\n<p>Фармакологическая  группа<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> антихолинэстеразный препарат;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> <b class=\"a\">М-холиномиметик;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> Н-холиномиметик;<\/p>\n<p>Источник получения<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> стефания гладкая;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> <b class=\"a\">растение Pilocarpus Jaborandi.<\/b><\/p>\n<p>Химическое строение<\/p>\n<p class=\"opt\"><span class=\"n\">6)<\/span> фосфорорганическое соединение;<\/p>\n<p class=\"opt\"><span class=\"n\">7)<\/span> алкалоид-четвертичный амин;<\/p>\n<p class=\"opt\"><span class=\"n\">8)<\/span> <b class=\"a\">алкалоид-производное метилимидазола (третичный амин).<\/b><\/p>"},{"id":6,"t":"Cholinergiques","h":"<p class=\"stem\">Впишите недостающие слова (название фармакологической группы) .<\/p>\n<p>Диэтиксим относится к группе <span class=\"gap\"><\/span> <b class=\"a bl\">реактиваторы холинэстеразы<\/b> <span class=\"gap\"><\/span><\/p>"},{"id":7,"t":"Cholinergiques","h":"<p class=\"stem\">Классифицируйте по химическому строению следующие антихолинэстеразные средства (заполните таблицу)<\/p>\n<div class=\"tw\"><table><tr><td>Физостигмина салицилат<\/td><td>Галантамин<\/td><td>Неостигмин<\/td><td>Пиридостигмин<\/td><\/tr><tr><td class=\"a bl\">2<\/td><td class=\"a bl\">2<\/td><td class=\"a bl\">1<\/td><td class=\"a bl\">1<\/td><\/tr><\/table><\/div>\n<p class=\"opt\"><span class=\"n\">1)<\/span> синтетический препарат из группы производных карбаминовой кислоты (карбамат);<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> алкалоид;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> фосфорорганическое соединение (ФОС).<\/p>"},{"id":8,"t":"Cholinergiques","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>Галантамин относится к группе:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> М-холиномиметиков;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> Реактиваторов холинэстеразы;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> <b class=\"a\">Антихолинэстеразных средств обратимого действия;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> Антихолинэстеразных средств “необратимого” действия;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> М- + Н-холиномиметиков.<\/p>"},{"id":9,"t":"Digestif","h":"<p class=\"stem\">Классифицируйте следующие препараты,угнетающие секрецию хлористоводородной кислоты в желудке (заполните таблицу)<\/p>\n<div class=\"tw\"><table><tr><td>Н2-гистаминоблокаторы<\/td><td>М1-холиноблокатор<\/td><td>Ингибиторы протоннойпомпы<\/td><\/tr><tr><td class=\"a bl\">23<\/td><td class=\"a bl\">1<\/td><td class=\"a bl\">45<\/td><\/tr><\/table><\/div>\n<p>1) пирензепин; <span class=\"gap\"><\/span> 3) циметидин;<\/p>\n<p>2) фамотидин; <span class=\"gap\"><\/span> 5) лансопразол.<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> омепразол;<\/p>"},{"id":10,"t":"SNC et analeptiques","h":"<p class=\"stem\">Укажите ошибки!<\/p>\n<p>Бемегрид – это:<\/p>\n<p>1) аналептик;<\/p>\n<p>2) антидот при отравлении барбитуратами;<\/p>\n<p>3) <b class=\"a\">противокашлевое средство;<\/b><\/p>\n<p>4) стимулятор дыхания прямого типа действия;<\/p>\n<p>5) <b class=\"a\">психомоторный стимулятор.<\/b><\/p>"},{"id":11,"t":"Cholinergiques","h":"<p class=\"stem\">Вставьте недостающие слова<\/p>\n<p>Лобелин и цитизин относятся к фармакологической группе________, по фармакологической классификации входят в группу________, в химическом плане оба препарата являются_______.<\/p>\n<p>1) М-холиномиметиков<b class=\"a\">, Н-холиномиметиков<\/b>, антихолинэстеразных средств;<\/p>\n<p>2) антидепрессантов, противокашлевых средств, <b class=\"a\">стимуляторов дыхания;<\/b><\/p>\n<p>3) <b class=\"a\">алкалоидами,<\/b> трициклическими соединениями, производными <span class=\"gap\"><\/span><\/p>\n<p><span class=\"gap\"><\/span> глютарамида.<\/p>"},{"id":12,"t":"Cholinergiques","h":"<p class=\"stem\">Укажите правильные ответы.<\/p>\n<p>При отравлениях антихолинэстеразными средствами «необратимого» действия (фосфорорганическими соединениями) применяют препараты следующих групп:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> <b class=\"a\">М-холиноблокаторы;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> -адреноблокаторы;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> миорелаксанты;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> ганглиоблокаторы;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> <b class=\"a\">реактиваторы холинэстеразы.<\/b><\/p>"},{"id":13,"t":"Cholinergiques","h":"<p class=\"stem\">Охарактеризуйте следующие антихолинэстеразные средства .<\/p>\n<p class=\"stem\">Укажите правильные ответы.<\/p>\n<p>К антихолинэстеразным препаратам бисчетвертичным аммониевым соединениям относятся :<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> эдрофоний;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> <b class=\"a\">хинотилин;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> <b class=\"a\">амбенония хлорид;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> амиридин;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> неостигмин.<\/p>"},{"id":14,"t":"Cholinergiques","h":"<p class=\"stem\">Укажите соответствие.<\/p>\n<p><span class=\"gap\"><\/span> ПРЕПАРАТ <span class=\"gap\"><\/span> ГРУППА<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> амиридин; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> а) антихолинэстеразные препараты обратимого<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> диэтиксим; <span class=\"gap\"><\/span> <b class=\"a bl\">б<\/b> <span class=\"gap\"><\/span> действия;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> неостигмин; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> б) реактиваторы холинэстеразы;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> эдрофоний. <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> .<\/p>"},{"id":15,"t":"Cholinergiques","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>К антихолинэстеразным препаратам обратимого действия не относится :<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> неостигмин; <span class=\"gap\"><\/span> 4) пиридостигмин;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> амиридин; <span class=\"gap\"><\/span> 5)  стефаглабрина сульфат.<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> <b class=\"a\">армин;<\/b><\/p>"},{"id":16,"t":"Cholinergiques","h":"<p class=\"stem\">Классифицируйте следующие препараты (заполните таблицу) .<\/p>\n<div class=\"tw\"><table><tr><td>Антихолинэстеразные препараты обратимого действия<\/td><td>Антихолинэстеразные препараты «необратимого» действия<\/td><td>Реактиватор холинэстеразы<\/td><\/tr><tr><td class=\"a bl\">134<\/td><td class=\"a bl\">2<\/td><td class=\"a bl\">5<\/td><\/tr><\/table><\/div>\n<p class=\"opt\"><span class=\"n\">1)<\/span> неостигмин;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> армин;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> стефаглабрина сульфат;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> амбенония хлорид;<\/p>\n<p>5) <span class=\"gap\"><\/span> диэтиксим.<\/p>"},{"id":17,"t":"Cholinergiques","h":"<p class=\"stem\">Укажите соответствие .<\/p>\n<p>ПРЕПАРАТ <span class=\"gap\"><\/span> ГРУППА<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> скополамина гидробромид; <b class=\"a bl\">б<\/b> <span class=\"gap\"><\/span> а) М-холиноблокатор периферического<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> гоматропина гидробромид; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> действия;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> платифиллина гидротартрат; <span class=\"gap\"><\/span> <b class=\"a bl\">в<\/b>  б) холиноблокатор центрального <span class=\"gap\"><\/span><\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> тригексифенидил. <span class=\"gap\"><\/span> <b class=\"a bl\">в<\/b> <span class=\"gap\"><\/span> действия;<\/p>\n<p><span class=\"gap\"><\/span> в) М-холиноблокатор периферического и<\/p>\n<p><span class=\"gap\"><\/span> центрального действия.<\/p>"},{"id":18,"t":"Cholinergiques","h":"<p class=\"stem\">Охарактеризуйте атропина сульфат (заполните таблицу) .<\/p>\n<div class=\"tw\"><table><tr><td>Фармакологическая группа<\/td><td>Химическое строение<\/td><\/tr><tr><td class=\"a bl\">3<\/td><td class=\"a bl\">4<\/td><\/tr><\/table><\/div>\n<p>Фармакологическая группа<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> антихолинэстеразный препарат;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> М1-холиноблокатор;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> <b class=\"a\">Неселективный М-холиноблокатор периферического и центрального действия (М1 + М2 + М3 – холиноблокатор).<\/b><\/p>\n<p>Химическое строение<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> <b class=\"a\">алколоид, сложный эфир тропина и D,L-троповой кислоты, третичный амин;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> сложный эфир холина и бензиловой кислоты;<\/p>\n<p class=\"opt\"><span class=\"n\">6)<\/span> алколоид, сложный эфир скопина и L-троповой кислоты, третичный амин.<\/p>"},{"id":19,"t":"Cholinergiques","h":"<p class=\"stem\">Классифицируйте следующие М-холиноблокаторы (заполните таблицу) .<\/p>\n<div class=\"tw\"><table><tr><td>М1-холиноблокатор<\/td><td>М-холиноблокаторы для ингаляционного применения<\/td><td>М-холиноблокатор, оказывающий прямое спазмолитическое действие<\/td><td>М-холиноблокатор селективного периферического действия<\/td><\/tr><tr><td class=\"a bl\">3<\/td><td class=\"a bl\">45<\/td><td class=\"a bl\">1<\/td><td class=\"a bl\">2<\/td><\/tr><\/table><\/div>\n<p class=\"opt\"><span class=\"n\">1)<\/span> платифиллина гидротартрат;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> метациний;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> пирензепин;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> тиотропиум;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> ипратропиум.<\/p>"},{"id":20,"t":"Cholinergiques","h":"<p class=\"stem\">Укажите правильные ответы.<\/p>\n<p>К М-холиноблокаторам для ингаляционного применения относятся :<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> метацин; <span class=\"gap\"><\/span> 4) <b class=\"a\">ипратропиум бромид;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> пирензепин; <span class=\"gap\"><\/span> 5) скополамина гидробромид.<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> <b class=\"a\">тиотропиум. <\/b><\/p>"},{"id":21,"t":"Cholinergiques","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>В группу ценральных М-холиноблокаторов не входит:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> бенактизин; <span class=\"gap\"><\/span> 4) тригексифенидил;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> <b class=\"a\">пирензепин;<\/b> <span class=\"gap\"><\/span> 5) скополамина гидробромид.<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> <b class=\"a\">метациний;<\/b><\/p>"},{"id":22,"t":"Cholinergiques","h":"<p class=\"stem\">Укажите соответствие.<\/p>\n<p>ПРЕПАРАТ <span class=\"gap\"><\/span> ГРУППА<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> скополамина гидробромид;<b class=\"a bl\">б<\/b> <span class=\"gap\"><\/span> а) М-холиноблокатор периферического<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> гоматропина гидробромид; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> действия;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> платифиллина гидротартрат; <b class=\"a bl\">в<\/b> <span class=\"gap\"><\/span> б) холиноблокатор центрального <span class=\"gap\"><\/span><\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> тригексифенидил. <span class=\"gap\"><\/span>
