ss=\"opt\"><span class=\"n\">2)<\/span> <b class=\"a\">надолол;<\/b> <span class=\"gap\"><\/span> 5)  <b class=\"a\">эфедрина гидрохлорид.<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> резерпин;<\/p>"},{"id":38,"t":"Adrénergiques","h":"<p class=\"stem\">Укажите соответствие.<\/p>\n<p>ПРЕПАРАТ <span class=\"gap\"><\/span> ГРУППА<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> октадин; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> а) симпатолитик;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> надолол; <span class=\"gap\"><\/span> <b class=\"a bl\">б<\/b> <span class=\"gap\"><\/span> б) неселективные 1+2-адреноблокаторы;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> резерпин; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> в) адреномиметики косвенного действия<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> орнид; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> (симпатомиметики).<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> эфедрин.<b class=\"a bl\">в<\/b><\/p>"},{"id":39,"t":"Adrénergiques","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>К кардиоселективным 1-адреноблокаторам пролонгированного действия не относится:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> атенолол; <span class=\"gap\"><\/span> 4)  талинолол;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> метопролол; <span class=\"gap\"><\/span> 5)  <b class=\"a\">эсмолол;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> бетаксолол; <span class=\"gap\"><\/span> 6)  ацебутолол.<\/p>"},{"id":40,"t":"Adrénergiques","h":"<p class=\"stem\">Укажите соответствие.<\/p>\n<p>ПРЕПАРАТ <span class=\"gap\"><\/span> ГРУППА<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> атенолол; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> а) 1-адреноблокатор пролонгированного действия;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> метопролол; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> б) 1-адреноблокатор, действующий в период<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> бетаксолол; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> внутривенного введения и в течении 30 мин. после<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> талинолол; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> инфузии.<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> эсмолол;<b class=\"a bl\">б<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">6)<\/span> ацебутолол.<b class=\"a bl\">а<\/b><\/p>"},{"id":41,"t":"Adrénergiques","h":"<p class=\"stem\">Впишите недостающее слово (название препарата по-русски)<\/p>\n<p>Единственным адреномиметиком природного происхождения является <span class=\"gap\"><\/span> <b class=\"a bl\">эфедрин<\/b> <span class=\"gap\"><\/span> .<\/p>"},{"id":42,"t":"Adrénergiques","h":"<p class=\"stem\">Укажите правильный ответ .<\/p>\n<p>Норэпинефрина гидротартрат относится к группе:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> -адреномиметиков; <span class=\"gap\"><\/span> 3) 1+2-адреномиметиков;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> <b class=\"a\">+1-адреномиметиков;<\/b> <span class=\"gap\"><\/span> 4) 1,2+1,2-адреномиметиков.<\/p>"},{"id":43,"t":"Adrénergiques","h":"<p class=\"stem\">Укажите правильный ответ .<\/p>\n<p>Сальбутамол относится к группе:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> 1+1,2-адреномиметиков;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> симпатолитиков;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> -адреноблокаторов;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> <b class=\"a\">селективных 2-адреномиметиков;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> 1+2-адреномиметиков.<\/p>"},{"id":44,"t":"Digestif","h":"<p class=\"stem\">Классифицируйте следующие антацидные средства.<\/p>\n<p class=\"stem\">Заполните таблицу.<\/p>\n<div class=\"tw\"><table><tr><td>Алюминийсодержащие<\/td><td>Магнийсодержащие<\/td><td>Алюминий+магнийсодержащие<\/td><td>Содержащие карбонатную группу<\/td><\/tr><tr><td class=\"a bl\">3<\/td><td class=\"a bl\">2<\/td><td class=\"a bl\">45<\/td><td class=\"a bl\">1<\/td><\/tr><\/table><\/div>\n<p>1) натрия гидрокарбонат; <span class=\"gap\"><\/span> 4) гастал;<\/p>\n<p>2) магния трисиликат; <span class=\"gap\"><\/span> 5) маалокс.<\/p>\n<p>3) алюминия гидроокись;<\/p>"},{"id":45,"t":"Digestif","h":"<p class=\"stem\">Классифицируйте следующие препараты, влияющие на секрецию желез желудка.<\/p>\n<p class=\"stem\">Укажите соответствие.<\/p>\n<p>ПРЕПАРАТ <span class=\"gap\"><\/span> СОСТАВ<\/p>\n<p>1) гастал; <span class=\"gap\"><\/span> <b class=\"a bl\">б<\/b> <span class=\"gap\"><\/span> а) алюминия гидроокись+магния гидроокись;<\/p>\n<p>2) маалокс. <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> б) алюминия гидроокись+магния карбонат+маг-<\/p>\n<p><span class=\"gap\"><\/span> ния окись.<\/p>"},{"id":46,"t":"Digestif","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>К невсасывающимся антацидам не относится:<\/p>\n<p>1) алмагель; <span class=\"gap\"><\/span> 4) маалокс;<\/p>\n<p>2) фосфалюгель; <span class=\"gap\"><\/span> 5<b class=\"a\">) натрия гидрокарбонат.<\/b><\/p>\n<p>3) гастал;<\/p>"},{"id":47,"t":"Digestif","h":"<p class=\"stem\">Впишите недостающее слово.<\/p>\n<p>В группу гепатотропных средств входят:<\/p>\n<p>1) гепатопротекторные средства;<\/p>\n<p>2) «холелитические» средства;<\/p>\n<p>3) <span class=\"gap\"><\/span> <b class=\"a\">желчегонные<\/b> <span class=\"gap\"><\/span> средства.<\/p>"},{"id":48,"t":"Digestif","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>Холензим относится к гуппе средств:<\/p>\n<p>1) угнетающих моторику кишечника;<\/p>\n<p>2) повышающих аппетит;<\/p>\n<p>3) <b class=\"a\">желчегонных<\/b>;<\/p>\n<p>4) гепатопротекторов;<\/p>\n<p>5) понижающих секрецию желез желудка.<\/p>"},{"id":49,"t":"Digestif","h":"<p class=\"stem\">Классифицируйте следующие препараты (заполните таблицу)<\/p>\n<div class=\"tw\"><table><tr><td>Амфепрамон<\/td><td>Инсулин<\/td><td>Плантаглюцид<\/td><td>Дифенгидрамин<\/td><\/tr><tr><td class=\"a bl\">3<\/td><td class=\"a bl\">1<\/td><td class=\"a bl\">2<\/td><td class=\"a bl\">4<\/td><\/tr><\/table><\/div>\n<p>1) гормональный препарат, стимулирующий аппетит;<\/p>\n<p>2) растительный препарат, стимулирующий аппетит,<\/p>\n<p>3) анорексигенное средство,<\/p>\n<p>4) противорвотный препарат из группы Н1-гистаминоблокаторов.<\/p>"},{"id":50,"t":"Digestif","h":"<p class=\"stem\">Укажите соответсвие.<\/p>\n<p>ПРЕПАРАТ <span class=\"gap\"><\/span> ГРУППА<\/p>\n<p>1)скополамин/гиосциамин; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> а) блокаторы М-холинорецепторов; <span class=\"gap\"><\/span><\/p>\n<p>2)тиэтилперазин; <span class=\"gap\"><\/span> <b class=\"a bl\">б<\/b>  б) блокаторы дофаминовых Д2-рецепторов.<\/p>\n<p>3)метоклопрамид.<b class=\"a bl\">б<\/b><\/p>"},{"id":51,"t":"Digestif","h":"<p class=\"stem\">Укажите соответствие<\/p>\n<p>ПРЕПАРАТ <span class=\"gap\"><\/span> ИСТОЧНИК  ПОЛУЧЕНИЯ<\/p>\n<p>1)абомин; <span class=\"gap\"><\/span> а) средства заместительной терапии при <span class=\"gap\"><\/span><\/p>\n<p>2)панкреатин <span class=\"gap\"><\/span> недостаточности пищеарительной функции<\/p>\n<p>3)панзинорм; <span class=\"gap\"><\/span> желудка и кишечника;<\/p>\n<p>4)панцитрат; <span class=\"gap\"><\/span> б) средства заместительной терапии при<\/p>\n<p>5)мезим форте. <span class=\"gap\"><\/span> недостаточности желез желудка;<\/p>\n<p><span class=\"gap\"><\/span> в) средства заместительной терапии при<\/p>\n<p><span class=\"gap\"><\/span> недостаточности экскреторой функции<\/p>\n<p><span class=\"gap\"><\/span> поджелудочной железы.<\/p>\n<p><span class=\"gap\"><\/span> <b class=\"a bl\">1-б, 2-в, 3-в, 4-б, 5-в.<\/b><\/p>"},{"id":52,"t":"Digestif","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>Гутталакс относится к группе:<\/p>\n<p>1. желчегонных средств; <span class=\"gap\"><\/span><\/p>\n<p>2. противодиарейных средств;<\/p>\n<p>3<b class=\"a\">. слабительных средств;<\/b><\/p>\n<p>4. антацидов;<\/p>\n<p>5. гастропротекторов.<\/p>"},{"id":53,"t":"Digestif","h":"<p class=\"stem\">Классифицируйте по механизму действия следующие слабительные средства (заполните таблицу).<\/p>\n<div class=\"tw\"><table><tr><td>Вызывающие химическое раздражение рецепторов слизистой кишечника<\/td><td>Вызывающие механическое раздражение рецепторов слизистой кишечника в связи с увеличением его объема<\/td><td>Способствующие размягчению каловых масс и облегчению их прохождения по кишечнику<\/td><\/tr><tr><td class=\"a bl\">145<\/td><td class=\"a bl\">2<\/td><td class=\"a bl\">3<\/td><\/tr><\/table><\/div>\n<p class=\"opt\"><span class=\"n\">1.<\/span> антрасенин;<\/p>\n<p class=\"opt\"><span class=\"n\">2.<\/span> ламинарид;<\/p>\n<p class=\"opt\"><span class=\"n\">3.<\/span> масло вазелиновое;<\/p>\n<p class=\"opt\"><span class=\"n\">4.<\/span> масло касторовое;<\/p>\n<p class=\"opt\"><span class=\"n\">5.<\/span> фенолфталеин (пурген).<\/p>"},{"id":54,"t":"Digestif","h":"<p class=\"stem\">Классифицируйте по химическому строению следующие слабительные средства<\/p>\n<p>ПРЕПАРАТ <span class=\"gap\"><\/span> ХИМИЧЕСКАЯ  ГРУППА<\/p>\n<p class=\"opt\"><span class=\"n\">1.<\/span> бисакодил; <span class=\"gap\"><\/span> а) антрагликозиды;<\/p>\n<p class=\"opt\"><span class=\"n\">2.<\/span> антрасенин; <span class=\"gap\"><\/span> б) дифенильные соединения;<\/p>\n<p class=\"opt\"><span class=\"n\">3.<\/span> масло вазелиновое; <span class=\"gap\"><\/span> в) минеральные масла.<\/p>\n<p class=\"opt\"><span class=\"n\">4.<\/span> фенолфталеин;<\/p>\n<p class=\"opt\"><span class=\"n\">5.<\/span> рамнил.<\/p>\n<p><b class=\"a bl\">1-б 2-а 3-в 4-б 5-а <\/b><\/p>"},{"id":55,"t":"Respiratoire","h":"<p class=\"stem\">Классифицируйте следующие противокашлевые сред-<\/p>\n<p>ства (заполните таблицу)<\/p>\n<div class=\"tw\"><table><tr><td>Ненаркотические противокашлевые средства<\/td><td>Наркотические противокашлевые средства<\/td><\/tr><tr><td class=\"a bl\">235<\/td><td class=\"a bl\">14<\/td><\/tr><\/table><\/div>\n<p>1)кодеин; <span class=\"gap\"><\/span> 4)этилморфина гидрохлорид;<\/p>\n<p>2)глауцин; <span class=\"gap\"><\/span> 5)либексин.<\/p>\n<p>3)тусупрекс;<\/p>"},{"id":56,"t":"Respiratoire","h":"<p class=\"stem\">Укажите правильные ответы<\/p>\n<p>К отхаркивающим средствам из группы муколитиков относятся:<\/p>\n<p>1) терпингидрат;<\/p>\n<p>2) мукалтин;<\/p>\n<p>3) <b class=\"a\">амброксол;<\/b><\/p>\n<p><b class=\"a\">4) ацетилцистеин;<\/b><\/p>\n<p>5) масло эвкалиптовое.<\/p>"},{"id":57,"t":"Respiratoire","h":"<p class=\"stem\">Классифицируйте следующие препараты, применяемые при бронхиальной астме в качестве противовоспалительных средств (заполните таблицу)<\/p>\n<div class=\"tw\"><table><tr><td>Кромолин-натрий (интал)<\/td><td>Монтелукаст<\/td><td>Беклометазон<\/td><td>Преднизолон<\/td><\/tr><tr><td class=\"a bl\">3<\/td><td class=\"a bl\">4<\/td><td class=\"a bl\">1<\/td><td class=\"a bl\">2<\/td><\/tr><\/table><\/div>\n<p>1) глюкокортикоид для ингаляций;<\/p>\n<p>2) глюкокортикоид для резорбтивного действия;<\/p>\n<p>3) препарат, тормозящий высвобождение гистамина и других медиаторов<\/p>\n<p><span class=\"gap\"><\/span> аллергии и воспаления (мембраностабилизатор).<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> блокатор лейкотриеновых рецепторов.<\/p>"},{"id":58,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Классифицируйте следующие лекарственные средства, используемые при лечении больных хронической недостаточностью кровообращения (заполните таблицу).<\/p>\n<div class=\"tw\"><table><tr><td>Увеличивающие сократимость миокарда<\/td><td>Уменьшающие нагрузку на миокард<\/td><td>Блокирующие нарушения нейроэндокринной регуляции сердца и сосудов<\/td><td>Улучшающие метаболизм миокарда<\/td><\/tr><tr><td class=\"a bl\">1<\/td><td class=\"a bl\">2<\/td><td class=\"a bl\">35<\/td><td class=\"a bl\">4<\/td><\/tr><\/table><\/div>\n<p>1) сердечные гликозиды; <span class=\"gap\"><\/span> 4) антиоксиданты;<\/p>\n<p>2) вазадилататоры; <span class=\"gap\"><\/span> 5) –адреноблокаторы.<\/p>\n<p>3) +1–адреноблокаторы;<\/p>"},{"id":59,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>К препаратам, с положительным инотропным действием на сердце, I класса относятся:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> <b class=\"a\">-адреномиметики;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> ингибиторы фосфодиэстеразы;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> допаминергические средства;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> сердечные гликозиды.<\/p>"},{"id":60,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Классифицируйте следующие препараты сердечных гликозидов (укажите соответствие):<\/p>\n<p class=\"opt\"><span class=\"n\">1.<\/span> строфантин; <span class=\"gap\"><\/span><\/p>\n<p class=\"opt\"><span class=\"n\">2.<\/span> коргликон; <span class=\"gap\"><\/span> а) препараты сильного, быстрого и кратковременного <span class=\"gap\"><\/span><\/p>\n<p class=\"opt\"><span class=\"n\">3.<\/span> дигоксин; <span class=\"gap\"><\/span> действия;<\/p>\n<p class=\"opt\"><span class=\"n\">4.<\/span> дигитоксин; <span class=\"gap\"><\/span> б) препараты сильного и длительного действия.<\/p>\n<p><b class=\"a bl\">1–а, 2–а, 3–б, 4–б<\/b><\/p>"},{"id":61,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Классифицируйте следующие лекарственные средства, используемые при лечении больных хронической недостаточностью кровообращения (заполните таблицу).<\/p>\n<div class=\"tw\"><table><tr><td>Увеличивающие сократимость миокарда<\/td><td>Уменьшающие нагрузку на миокард<\/td><td>Блокирующие нарушения нейроэндокринной регуляции сердца и сосудов<\/td><td>Улучшающие метаболизм миокарда<\/td><\/tr><tr><td class=\"a bl\">2<\/td><td class=\"a bl\">1<\/td><td class=\"a bl\">35<\/td><td class=\"a bl\">4<\/td><\/tr><\/table><\/div>\n<p class=\"opt\"><span class=\"n\">1.<\/span> диуретики;<\/p>\n<p class=\"opt\"><span class=\"n\">2.<\/span> агонисты дофаминовых рецепторов (допаминергические препараты);<\/p>\n<p class=\"opt\"><span class=\"n\">3.<\/span> -адреноблокаторы;<\/p>\n<p class=\"opt\"><span class=\"n\">4.<\/span> витамины с электронакцепторными свойствами;<\/p>\n<p class=\"opt\"><span class=\"n\">5.<\/span> ингибиторы ангиотензинпревращающего фермента.<\/p>"},{"id":62,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Классифицируйте по классам препараты с положительным инотропным действием на сердце (заполните таблицу).<\/p>\n<div class=\"tw\"><table><tr><td>I класс (увеличивающие содерживающие цАМФ)<\/td><td>II класс (действующие на ионные каналы в сарколемме)<\/td><td>IIIб класс (кальциевые сенситизаторы)<\/td><td>IV класс (сочетанного механизма действия)<\/td><\/tr><tr><td class=\"a bl\">35<\/td><td class=\"a bl\">1<\/td><td class=\"a bl\">2<\/td><td class=\"a bl\">4<\/td><\/tr><\/table><\/div>\n<p class=\"opt\"><span class=\"n\">1.<\/span> сердечные гликозиды;<\/p>\n<p class=\"opt\"><span class=\"n\">2.<\/span> левозимендан;<\/p>\n<p class=\"opt\"><span class=\"n\">3.<\/span> -адреномиметики;<\/p>\n<p class=\"opt\"><span class=\"n\">4.<\/span> веснарион;<\/p>\n<p class=\"opt\"><span class=\"n\">5.<\/span> амринон.<\/p>"},{"id":63,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Классифицируйте по источникам получения следующие сердечные гликозиды (укажите соответствие)<\/p>\n<p>ПРЕПАРАТ <span class=\"gap\"><\/span> ИСТОЧНИК  ПОЛУЧЕНИЯ<\/p>\n<p class=\"opt\"><span class=\"n\">1.<\/span> дигитоксин; <span class=\"gap\"><\/span> а) наперстянка шерстистая;<\/p>\n<p class=\"opt\"><span class=\"n\">2.<\/span> строфантин <span class=\"gap\"><\/span> б) наперстянка пурпуровая;<\/p>\n<p class=\"opt\"><span class=\"n\">3.<\/span> дигоксин; <span class=\"gap\"><\/span> в) строфант Комбе; <span class=\"gap\"><\/span><\/p>\n<p><b class=\"a bl\"> <span class=\"gap\"><\/span> 1 – б, 2 – в, 3 – а <span class=\"gap\"><\/span> <\/b><\/p>"},{"id":64,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Укажите ошибку!<\/p>\n<p>К основным, наиболее часто применяемым гликозидам относятся:<\/p>\n<p class=\"opt\"><span class=\"n\">1.<\/span> дигоксин;<\/p>\n<p class=\"opt\"><span class=\"n\">2.<\/span> дигитоксин;<\/p>\n<p class=\"opt\"><span class=\"n\">3.<\/span> строфантин;<\/p>\n<p class=\"opt\"><span class=\"n\">4.<\/span> <b class=\"a\">ацетилдигитоксин.<\/b><\/p>"},{"id":65,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Укажите правильные ответы.<\/p>\n<p>Ингибиторы ангиотензинпревращающего фермента, применяемые при хронической сердечной недостаточности, входят в следующие фармакологические группы препаратов:<\/p>\n<p class=\"opt\"><span class=\"n\">1.<\/span> увеличивающие сократимость миокарда;<\/p>\n<p class=\"opt\"><span class=\"n\">2.<\/span> <b class=\"a\">уменьшающие нагрузку на миокард;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">3.<\/span> прямые артериальные вазодилататоры;<\/p>\n<p class=\"opt\"><span class=\"n\">4.<\/span> прямые венозные вазодилататоры;<\/p>\n<p class=\"opt\"><span class=\"n\">5.<\/span> <b class=\"a\">блокаторы нарушений нейроэндокринной регуляции сердечно-сосудистой системы.<\/b><\/p>"},{"id":66,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Классифицируйте следующие диуретики (заполните таблиц)<\/p>\n<div class=\"tw\"><table><tr><td>Производные дихлорфеноксиуксусной кислоты<\/td><td>Птеридины<\/td><td>Аминопиразины<\/td><td>Ксантины<\/td><\/tr><tr><td class=\"a bl\">1<\/td><td class=\"a bl\">4<\/td><td class=\"a bl\">2<\/td><td class=\"a bl\">35<\/td><\/tr><\/table><\/div>\n<p>1) кислота этакриновая; <span class=\"gap\"><\/span> 4) триамтерен;<\/p>\n<p>2) амилорид; <span class=\"gap\"><\/span> 5) теофиллин.<\/p>\n<p>3) аминофиллин;<\/p>"},{"id":67,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>Точкой приложения действия спиронолактона в нефроне является:<\/p>\n<p>1) клубочек;<\/p>\n<p>2) проксимальные канальцы;<\/p>\n<p>3) нисходящий сегмент петли Генле;<\/p>\n<p>4) толстый сегмент восходящего колена петли Генле;<\/p>\n<p>5) <b class=\"a\">конечная часть дистальных канальцев и собирательные трубки.<\/b><\/p>"},{"id":68,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">укажите соответствие<\/p>\n<p>ПРЕПАРАТ <span class=\"gap\"><\/span> ГРУППА<\/p>\n<p class=\"opt\"><span class=\"n\">1.<\/span> триамтерен; <span class=\"gap\"><\/span> а) «мощные»;<\/p>\n<p class=\"opt\"><span class=\"n\">2.<\/span> маннит; <span class=\"gap\"><\/span> б) «умеренные»;<\/p>\n<p class=\"opt\"><span class=\"n\">3.<\/span> клопамид; <span class=\"gap\"><\/span> в) «слабые».<\/p>\n<p class=\"opt\"><span class=\"n\">4.<\/span> торасенид.<\/p>\n<p><b class=\"a bl\">1 – в, 2 – а, 3 – б, 4 – а<\/b><\/p>"},{"id":69,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>Торасенид-это:<\/p>\n<p class=\"opt\"><span class=\"n\">1.<\/span> осмодиуретик;<\/p>\n<p class=\"opt\"><span class=\"n\">2.<\/span> калийсберегающий диуретик;<\/p>\n<p class=\"opt\"><span class=\"n\">3.<\/span> <b class=\"a\">салуретик;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">4.<\/span> антагонист альдостерона;<\/p>\n<p class=\"opt\"><span class=\"n\">5.<\/span> кислотообразующий диуретик.<\/p>"},{"id":70,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>По химической классификации фуросемид относится к:<\/p>\n<p class=\"opt\"><span class=\"n\">1.<\/span> тиазидным диуретикам;<\/p>\n<p class=\"opt\"><span class=\"n\">2.<\/span> <b class=\"a\">производным сульфамоилантраниловой кислоты;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">3.<\/span> производным дихлорфеноксиуксусной кислоты;<\/p>\n<p class=\"opt\"><span class=\"n\">4.<\/span> птеридинам.<\/p>"},{"id":71,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Укажите ошибку!<\/p>\n<p>К урикозурическим средствам относятся:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> <b class=\"a\">колхицин;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> антуран;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> пробенецид;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> этамид.<\/p>"},{"id":72,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>Аллопуринол относится к препаратам :<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> повышающим выведение мочевой кислоты из организма;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> <b class=\"a\">угнетающим образование мочевой кислоты;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> обладающим смешанным антигиперурикемическим действием.<\/p>"},{"id":73,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Впишите недостающую римскую цифру<\/p>\n<p>-адреноблокаторы относятся к <span class=\"gap\"><\/span> <b class=\"a bl\">II<\/b> <span class=\"gap\"><\/span> классу противоаритмических средств.<\/p>"},{"id":74,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Укажите соответствие<\/p>\n<p>ПРЕПАРАТ <span class=\"gap\"><\/span> СОСТАВ<\/p>\n<p class=\"opt\"><span class=\"n\">1.<\/span> панангин; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> а) смесь калия и магния аспарагината (таблетки,<\/p>\n<p class=\"opt\"><span class=\"n\">2.<\/span> аспаркам; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> драже, ампулы) <span class=\"gap\"><\/span><\/p>\n<p class=\"opt\"><span class=\"n\">3.<\/span> мирал. <span class=\"gap\"><\/span> <b class=\"a bl\">б<\/b> <span class=\"gap\"><\/span> б) смесь калия хлорида и магния гидроокиси<\/p>\n<p><span class=\"gap\"><\/span> (таблетки).<\/p>"},{"id":75,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Классифицируйте следующие препараты (заполните таблицу).<\/p>\n<div class=\"tw\"><table><tr><td>Для  купирования приступов стенокардии<\/td><td>Для предупреждения приступов стенокардии<\/td><\/tr><tr><td class=\"a bl\">125<\/td><td class=\"a bl\">34<\/td><\/tr><\/table><\/div>\n<p class=\"opt\"><span class=\"n\">1.<\/span> валидол;<\/p>\n<p class=\"opt\"><span class=\"n\">2.<\/span> нитроглицерин (сублингвально, буккальные, аэрозольные лекарственные формы);<\/p>\n<p class=\"opt\"><span class=\"n\">3.<\/span> верапамил;<\/p>\n<p class=\"opt\"><span class=\"n\">4.<\/span> изосорбида динитрат для приема внутрь,<\/p>\n<p class=\"opt\"><span class=\"n\">5.<\/span> спрей изосорбида динитрата.<\/p>"},{"id":76,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Охарактеризуйте следующие препараты: пропранолол, атенолол, метопролол, надолол.<\/p>\n<p class=\"stem\">Впишите недостающее слово (название фармакологической группы).<\/p>\n<p>Эти препараты относятся группе <span class=\"gap\"><\/span> <b class=\"a bl\">β-адреноблокаторы <span class=\"gap\"><\/span> <\/b> <span class=\"gap\"><\/span> .<\/p>"},{"id":77,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Охарактеризуйте следующие препараты: пропранолол, атенолол, метапролол, надолол.<\/p>\n<p>Эти препараты не входят в группу (укажите правильный ответ):<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> средств, применяемых при недостаточности коронарного кровообращения;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> антигипертензивных средств;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> антиаритмических средств;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> <b class=\"a\">диуретиков. <\/b><\/p>"},{"id":78,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Классифицируйте следующие антигипертензивные препараты (заполните таблицу)<\/p>\n<div class=\"tw\"><table><tr><td>Проксодолол<\/td><td>Фентоламин<\/td><td>Надолол<\/td><td>Соталол<\/td><\/tr><tr><td class=\"a bl\">2<\/td><td class=\"a bl\">1<\/td><td class=\"a bl\">3<\/td><td class=\"a bl\">4<\/td><\/tr><\/table><\/div>\n<p class=\"opt\"><span class=\"n\">1.<\/span> неселективный -адреноблокатор;<\/p>\n<p class=\"opt\"><span class=\"n\">2.<\/span> 1+1-адреноблокатор;<\/p>\n<p class=\"opt\"><span class=\"n\">3.<\/span> неселективный -адреноблокатор без собственной симпатомиметической активности продолжительного действия;<\/p>\n<p class=\"opt\"><span class=\"n\">4.<\/span> неселективный -адреноблокатор без собственной симпатомиметической активности, антиаритмическое средство III класса.<\/p>"},{"id":79,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Укажите правильные ответы<\/p>\n<p>К артериальным вазодилататорам прямого действия из группы активаторов калиевых каналов не относятся:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> <b class=\"a\">апрессин:<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> <b class=\"a\">натрия нитропруссид;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> пинацидил;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> миноксидил;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> диазоксид.<\/p>"},{"id":80,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Охарактеризуйте следующие антигипотензивные препараты<\/p>\n<div class=\"tw\"><table><tr><td>Сосудосуживающие средства, центрального действия<\/td><td>-адреномиметики<\/td><td>1,2+1,2-адреномиметики<\/td><td>Синтетический аналог<br>ангиотензина II<\/td><\/tr><tr><td class=\"a bl\">45<\/td><td class=\"a bl\">1<\/td><td class=\"a bl\">2<\/td><td class=\"a bl\">3<\/td><\/tr><\/table><\/div>\n<p class=\"opt\"><span class=\"n\">1)<\/span> митодрин;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> эпинефрина гидрохлорид;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> ангиотензинамид;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> кофеин;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> камфора.<\/p>"},{"id":81,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Классифицируйте следующие антигипотензивные средства (укажите соответствие)<\/p>\n<p>ПРЕПАРАТ <span class=\"gap\"><\/span> ГРУППА<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> настойка женьшеня; <span class=\"gap\"><\/span> а) симпатомиметики;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> кофеин; <span class=\"gap\"><\/span> б) общетонизирующие средства;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> эфедрина гидрохлорид; <span class=\"gap\"><\/span> в) аналептики-стимуляторы<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> фенилэфрин; <span class=\"gap\"><\/span> сосудодвигательного центра;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> эпинефрина гидрохлорид. <span class=\"gap\"><\/span> г) -адреномиметики;<\/p>\n<p><span class=\"gap\"><\/span> д) 1,2+1,2-адреномиметики.<\/p>\n<p><b class=\"a bl\">1 – б, 2 – в, 3 – а, 4 – г, 5 – д<\/b><\/p>"},{"id":82,"t":"Cardio-vasculaire et rein","h":"<p class=\"stem\">Впишите недостающее слово (название класса гиполипидемических средств)<\/p>\n<p>К гиполипидемическим средствам, ингибирующим редуктазу 3-гидрокси-3-метилглутарил- КоА, относятся ингибиторы синтеза холестерина (статины).<\/p>"},{"id":83,"t":"Hormones","h":"<p class=\"stem\">Классифицируйте следующие антитиреоидные средства(заполните таблицу)<\/p>\n<div class=\"tw\"><table><tr><td>Микройод <span class=\"gap\"><\/span><\/td><td>Тиамазол<\/td><td>Калия перхлорат<\/td><td>Радиоактивный йод I131<\/td><\/tr><tr><td class=\"a bl\">1<\/td><td class=\"a bl\">3<\/td><td class=\"a bl\">2<\/td><td class=\"a bl\">4<\/td><\/tr><\/table><\/div>\n<p class=\"opt\"><span class=\"n\">1)<\/span> угнетает продукцию тиреотропного гормона пердней доли гипофиза;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> нарушает поглощение йода щитовидной железой;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> угнетает синтез тиреоидных гормонов;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> разрушает клетки фолликулов щитовидной железы.<\/p>\n<p><span class=\"gap\"><\/span> 84Укажите соответствие<\/p>\n<p><span class=\"gap\"><\/span> Препарат <span class=\"gap\"><\/span> Группа<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> бутамид; <span class=\"gap\"><\/span> а) бигуаниды;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> хлорпропамид; <span class=\"gap\"><\/span> б) производные сульфанилмочевины<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> глибенкламид; <span class=\"gap\"><\/span> I поколения;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> глибутид; <span class=\"gap\"><\/span> в) производные сульфанилмочевины<\/p>\n<p><span class=\"gap\"><\/span> II поколения.<\/p>\n<p><b class=\"a bl\">1 – а, 2 – а, 3 – в, 4 – в<\/b><\/p>"},{"id":84,"t":"Hormones","h":"<p class=\"stem\">Укажите правильные ответы<\/p>\n<p>К препаратам естественных ( нативных ) глюкокортикоидов относятся:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> дезоксикортикостерон;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> <b class=\"a\">гидрокортизон;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> альдостерон;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> <b class=\"a\">кортизон;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> дексаметазон.<\/p>"},{"id":85,"t":"Hormones","h":"<p class=\"stem\">Укажите соответствие<\/p>\n<p><span class=\"gap\"><\/span> Препарат <span class=\"gap\"><\/span> Группа<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> дезоксикортикостерон; <span class=\"gap\"><\/span> <b class=\"a bl\">б<\/b> <span class=\"gap\"><\/span> а) глюкокортикоиды; <span class=\"gap\"><\/span><\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> спиронолактон; <span class=\"gap\"><\/span> <b class=\"a bl\">в<\/b> <span class=\"gap\"><\/span> б) минералкортикоиды;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> гидрокортизон; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> в) антагонисты альдостерона.<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> преднизолон;<b class=\"a bl\">а<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> дексаметазон.<b class=\"a bl\">а<\/b><\/p>"},{"id":86,"t":"Hormones","h":"<p class=\"stem\">Укажите правильный ответ<\/p>\n<p>При простом эндемическом зобе применяют:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> микройод;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> <b class=\"a\">антиструмин<\/b>;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> мерказолил;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> радиоактивный йод 131.<\/p>"},{"id":87,"t":"Hormones","h":"<p class=\"stem\">Укажите правильные ответы<\/p>\n<p>При гипотиреозе (микседеме, кретинизме ) применяют:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> <b class=\"a\">тиреоидин;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> микройод;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> перхлорат калия;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> <b class=\"a\">трийодтиронин;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> мерказолил.<\/p>"},{"id":88,"t":"Hormones","h":"<p class=\"stem\">Вставьте в таблицу номера препаратов инсулина в соответствии с длительностью их действия<\/p>\n<div class=\"tw\"><table><tr><td>Короткого действия<br>(  4-6 часов )<\/td><td>Средней длительностью<br>действия ( 10-14 часов )<\/td><td>Длительного действия<br>( более 20 часов )<\/td><\/tr><tr><td class=\"a bl\">12<\/td><td class=\"a bl\">34<\/td><td class=\"a bl\">5<\/td><\/tr><\/table><\/div>\n<p class=\"opt\"><span class=\"n\">1)<\/span> инсулин С;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> актрапид МС;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> инсулин-Zn-суспензия  монокомпонентного  инсулина ;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> суспензия монокомпонентного  инсулина;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> ультраленте-монокомпонентный инсулин.<\/p>"},{"id":89,"t":"Hormones","h":"<p class=\"stem\">Укажите правильные ответ<\/p>\n<p>Глибенкламид относится к группе:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> <b class=\"a\">пероральных гипогликемических средств;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> антитиреодных средств;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> антагонистов гонадотропных гормонов гипофиза;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> <b class=\"a\">производных сульфонилмочевины II поколения;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> производных аминокислоты тирозина.<\/p>"},{"id":90,"t":"Hormones","h":"<p class=\"stem\">Классифицируйте следующие пероральные гипогликемические средства ( укажите соответствие )<\/p>\n<p>Препарат <span class=\"gap\"><\/span> Группа<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> глибутид; <span class=\"gap\"><\/span> <b class=\"a bl\">в<\/b> <span class=\"gap\"><\/span> а) задерживающие всасывание<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> акрбоза; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> глюкозы  в кишечнике;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> метформин; <span class=\"gap\"><\/span> <b class=\"a bl\">б<\/b> <span class=\"gap\"><\/span> б) бигуаниды;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> гликлазид <span class=\"gap\"><\/span> <b class=\"a bl\">в<\/b> <span class=\"gap\"><\/span> ; <span class=\"gap\"><\/span> в) производные сульфонилмочевины<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> глибенкламид. <span class=\"gap\"><\/span> <b class=\"a bl\">в<\/b> <span class=\"gap\"><\/span> II поколения.<\/p>"},{"id":91,"t":"Hormones","h":"<p class=\"stem\">Классифицируйте следующие глюкокортикоидные препараты ( вставьте в таблицу номера препаратов в соответствии с длительностью их действия )<\/p>\n<div class=\"tw\"><table><tr><td>Короткого действия<\/td><td>Средней продолжительности<\/td><td>Длительного действия<\/td><\/tr><tr><td class=\"a bl\">12<\/td><td class=\"a bl\">3<\/td><td class=\"a bl\">45<\/td><\/tr><\/table><\/div>\n<p class=\"opt\"><span class=\"n\">1)<\/span> гидрокортизон, кортизон;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> преднизолон , преднизон;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> триамцинолон;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> дексаметазон;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> бетаметазон.<\/p>"},{"id":92,"t":"Hormones","h":"<p class=\"stem\">Вставьте недостающие слова<\/p>\n<p>Беклометазон- это синтетический______________ глюкокортикоид, применяющийся в виде___________________ при _________________.<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> фторсодержащий;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> <b class=\"a\">хлорсодержащий;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> мазей, <b class=\"a\">ингаляций,<\/b> таблеток;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> заболеваниях кожи, <b class=\"a\">бронхиальной астме,<\/b> болезни Аддисона.<\/p>"},{"id":93,"t":"Hormones","h":"<p class=\"stem\">Укажите неправильный ответ!<\/p>\n<p>К фторсодержащим препаратам относятся:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> синафлан;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> дексаметазон;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> флуметазона пивалат;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> триамцинолон;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> <b class=\"a\">беклометазон;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">6)<\/span> бетаметазон.<\/p>"},{"id":94,"t":"Hormones","h":"<p class=\"stem\">Вставьте недостающие слова<\/p>\n<p>Оксипрогестерона капронат относится к группе __________________, обладает____________ действием, применяют__________________.<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> эстрогенов, <b class=\"a\">гестагенов<\/b>, антигестагенов;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> коротким, <b class=\"a\">длительным;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> перорально, <b class=\"a\">внутримышечно<\/b>, сублингвально.<\/p>"},{"id":95,"t":"Hormones","h":"<p class=\"stem\">Укажите не правильные ответы!<\/p>\n<p>В группу анаболических стероидов входят следующие препараты:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> <b class=\"a\">метилтестостерон;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> <b class=\"a\">флутамид;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> феноболин;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> ретаболил;<\/p>\n<p><span class=\"gap\"><\/span> 5) <span class=\"gap\"><\/span> метандростенолон.<\/p>"},{"id":96,"t":"Hormones","h":"<p class=\"stem\">Впишите недостающее слово ( название препарата по-русски )<\/p>\n<p>Синтетический аналог тестостерона длительного действия-это тестенат_____________.<\/p>"},{"id":97,"t":"Hormones","h":"<p class=\"stem\">Вставьте недостающие слова<\/p>\n<p>Полипептидный гормон, образующийся в щитовидной железе, это______________, к препаратам этого гормона относятся______________ и_______________.<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> тироксин, <b class=\"a\">кальцитонин<\/b>, паратгормон;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> антиструмин, <b class=\"a\">миакальцик, кальцитрин<\/b>, рифатироин.<\/p>"},{"id":98,"t":"Hormones","h":"<p class=\"stem\">Укажите правильные ответы<\/p>\n<p>Глибенкламид относится к группе<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> <b class=\"a\">пероральных сахароснижающих средств;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> препаратов свиного инсулина;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> препаратов говяжьего инсулина;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> производных гуанидина ( бигуанидам );<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> <b class=\"a\">производных сульфонилмочевины II поколения.<\/b><\/p>"},{"id":99,"t":"Hormones","h":"<p class=\"stem\">Укажите правильный ответ<\/p>\n<p>Гликлазид относится к группе:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> пероральных гипогликемических средств из группы бигуанидов;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> <b class=\"a\">пероральных гипогликемических средств из группы производных сульфонилмочевины I поколения;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> антитиреоидных средств;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> антидиабетических препаратов, задерживающих всасывание глюкозы в кишечнике.<\/p>"},{"id":100,"t":"Hormones","h":"<p class=\"stem\">Укажите неправильный ответ!<\/p>\n<p>К синтетическим аналогам природных глюкокортикоидов местного применения относятся:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> синафлан;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> флуметазона пивалат;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> бетаметазон;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> <b class=\"a\">преднизон<\/b>.<\/p>"},{"id":101,"t":"Hormones","h":"<p class=\"stem\">Укажите соответствие<\/p>\n<p>Препарат <span class=\"gap\"><\/span> Применение<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> синафлан; <span class=\"gap\"><\/span> <b class=\"a bl\">б<\/b> <span class=\"gap\"><\/span> а) пероральное,  парентеральное,местное; <span class=\"gap\"><\/span><\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> флуметазона пивалат; <b class=\"a bl\">б<\/b> <span class=\"gap\"><\/span> б) только местное ( мазь );<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> беклометазон; <span class=\"gap\"><\/span> <b class=\"a bl\">в<\/b> <span class=\"gap\"><\/span> в) местное в виде ингаляций;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> преднизолон; <span class=\"gap\"><\/span> <b class=\"a bl\">а<\/b> <span class=\"gap\"><\/span> г) только пероральное.<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> преднизон.<b class=\"a bl\">г<\/b><\/p>"},{"id":102,"t":"Hormones","h":"<p class=\"stem\">Укажите правильный ответ<\/p>\n<p>Преднизолон – это<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> минералокортикоид;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> пероральное гипогликемическое средство;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> антитиреоидный препарат;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> <b class=\"a\">глюкокортикоид<\/b>;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> ингибитор биосинтеза кортикостероидов.<\/p>"},{"id":103,"t":"Hormones","h":"<p class=\"stem\">Укажите неправильные ответы!<\/p>\n<p>К гестагенным препаратам относятся:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> прогестерон;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> оксипрогестерона капронат;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> прегнин;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> <b class=\"a\">кломифенцитрат;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> <b class=\"a\">синестрол.<\/b><\/p>"},{"id":104,"t":"Hormones","h":"<p class=\"stem\">Укажите неправильные ответы!<\/p>\n<p>В медицинской практике применяются следующие препараты тестестерона:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> тестостерона пропионат;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> тестэнат;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> метилтестостерон;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> <b class=\"a\">ципротерон;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> <b class=\"a\">флутамид.<\/b><\/p>"},{"id":105,"t":"Hormones","h":"<p class=\"stem\">Впишите недостающее слово ( название гормона щитовидной железы )<\/p>\n<p>Миакальцик- это синтетический аналог гормона кальцитонина<\/p>"},{"id":106,"t":"Hormones","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>Тиамазол относится  к группе:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> средств, применяемых при эндемическом зобе;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> <b class=\"a\">антитиреоидных средств;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> средств, применяемых при остеопорозе;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> стимуляторов секреции тиреотропного гормона;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> ингибиторов гонадотропных гормонов.<\/p>"},{"id":107,"t":"Hormones","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>Левотироксин представляет собой<\/p>\n<p><span class=\"gap\"><\/span> 1) синтетический аналог трийодтиронина;<\/p>\n<p><b class=\"a\"> <span class=\"gap\"><\/span> 2) синтетический аналог тироксина<\/b>;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> высушенную ткань щитовидных желез убойного скота, содержит тироксин и трийодтиронин;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> высушенную ткань паращитовидных желез, содержит паратгормон;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> аналог кальцитонина.<\/p>"},{"id":108,"t":"Hormones","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>Гликлазид  относится к<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> препаратам свиного инсулина;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> глюкокортикоидам;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> аналогам глюкагона;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> пероральным гипогликемическим средствам из группы бигуанидов;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> <b class=\"a\">пероральным гипогликемическим средствам из группы производных сульфонилмочевины II поколения.<\/b><\/p>"},{"id":109,"t":"Hormones","h":"<p class=\"stem\">Вставьте недостающие слова<\/p>\n<p>Дексаметазон и бетаметазон относятся к группе____________________, оказывают_________________ действие, по химической структуре являются_______________ соединениями.<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> минералкортикоидов, <b class=\"a\">глюкокортикоидов<\/b>, рилизинг-гормонов;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> короткое, <b class=\"a\">длительное;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> <b class=\"a\">фторсодержащими<\/b>, хлорсодержащими, негалогенизированными.<\/p>"},{"id":110,"t":"Hormones","h":"<p class=\"stem\">Вставьте недостающие слова.<\/p>\n<p>К естественным минералокортикоидам относятся II-дезоксикортикостерон и ______________,  с лечебной целью применяется___________________, антагонистом минералокортикоидов является__________________, используемый в качестве_________________ средства.<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> гидрокортизон, кортизон, <b class=\"a\">альдостерон<\/b>, андростерон;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> <b class=\"a\">дезоксикортикостерона ацетат,<\/b> гидрокортизона гемисукцинат, гидрокортизона ацетат;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> дофамин, синэстрол, <b class=\"a\">спиронолактон<\/b>, триамтерен;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> <b class=\"a\">диуретического,<\/b> гипогликемического, антитиреоидного, антиангинального.<\/p>"},{"id":111,"t":"Hormones","h":"<p class=\"stem\">Классифицируйте следующие антагонисты половых гормонов ( вставьте в таблицу номера препаратов в соответствии с их группой )<\/p>\n<div class=\"tw\"><table><tr><td>Антиэстрогены<\/td><td>Антигестагены<\/td><td>Антиандрогены<\/td><\/tr><tr><td class=\"a bl\">13<\/td><td class=\"a bl\">2<\/td><td class=\"a bl\">45<\/td><\/tr><\/table><\/div>\n<p class=\"opt\"><span class=\"n\">1)<\/span> кломифенцитрат;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> мефипристон (RLL –486);<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> тамоксифен;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> флутамид;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> ципротерон.<\/p>"},{"id":112,"t":"Hormones","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>Прегнин- это<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> эстрогенный препарат;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> <b class=\"a\">синтетический препарат прогестерона;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> анаболический стероид;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> антиандрогенный препарат;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> оральный контрацептив.<\/p>"},{"id":113,"t":"Hormones","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>Ретаболил входит в группу:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> эстрогенных препаратов;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> андрогенных препаратов;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> <b class=\"a\">анаболических стероидов для внутримышечного введения;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> оральных контрацептивов;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> оральных анаболических средств.<\/p>"},{"id":114,"t":"Vitamines","h":"<p class=\"stem\">Впишите недостающее слово ( название витамина по-русски )<\/p>\n<p>К антианемическим витаминным препаратам относятся:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> кислота фолиевая;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> __цианокобаламин___.<\/p>"},{"id":115,"t":"Vitamines","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>К антирахитическим витаминным препаратам относятся:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> токоферола ацетат;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> <b class=\"a\">эргокальциферол;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> ретинола ацетат;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> <b class=\"a\">рыбий жир тресковый;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> кальция пантотенат.<\/p>"},{"id":116,"t":"Vitamines","h":"<p class=\"stem\">Укажите правильные ответы:<\/p>\n<p>Токоферол- это:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> препарат витамина D3;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> <b class=\"a\">синтетический препарат витамина E;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> антианемический витамин;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> <b class=\"a\">витамин-антиоксидант;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> антиневритический витамин.<\/p>"},{"id":117,"t":"Vitamines","h":"<p class=\"stem\">Укажите соответствие.<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> D3 <span class=\"gap\"><\/span> б) <span class=\"gap\"><\/span> а) ретинола ацетат;<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> В6 <span class=\"gap\"><\/span> в) <span class=\"gap\"><\/span> б) эргокальциферол;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> Е <span class=\"gap\"><\/span> г) <span class=\"gap\"><\/span> в) пиридоксин;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> А <span class=\"gap\"><\/span> а) <span class=\"gap\"><\/span> г) токоферола ацетат.<\/p>"},{"id":118,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите ошибки!<\/p>\n<p>К препаратам выбора для лечения сифилиса относятся:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> бензилпенициллин (натриевая, калиевая, новокаиновая соли);<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> бензатинбензилпенициллин;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> <b class=\"a\">феноксиметилпеициллин;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> <b class=\"a\">ципрофлоксацин.<\/b><\/p>"},{"id":119,"t":"Anti-infectieux","h":"<p class=\"stem\">Впишите недостающее слово (название металла)<\/p>\n<p>К основным препаратам для лечения сифилиса относятся препараты двух групп:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> препараты бензилпенициллина;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> препараты <span class=\"gap\"><\/span> <b class=\"a\">висмута <\/b>. <span class=\"gap\"><\/span> .<\/p>"},{"id":120,"t":"Anti-infectieux","h":"<p class=\"stem\">Классифицируйте следующие противосифилитические средства по показаниям к применению.<\/p>\n<div class=\"tw\"><table><tr><td>Препараты бензилпенициллина<\/td><td>Бийохинол<\/td><td>Бисмоверол<\/td><td>Азитромицин (сумамед)<\/td><td>Цефтриаксон (роцефин)<\/td><\/tr><tr><td class=\"a bl\">2<\/td><td class=\"a bl\">1<\/td><td class=\"a bl\">1<\/td><td class=\"a bl\">3<\/td><td class=\"a bl\">3<\/td><\/tr><\/table><\/div>\n<p class=\"opt\"><span class=\"n\">1)<\/span> для лечения позднего сифилиса (висцерального);<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> для лечения раннего и позднего сифилиса;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> для лечения сифилиса при непереносимости препаратов бензилпенициллина.<\/p>"},{"id":121,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>Химиотерапевтические средства из группы фторхинолонов:<\/p>\n<p>1) средства выбора для лечения сифилиса;<\/p>\n<p>2) <b class=\"a\">при сифилисе не эффективны.<\/b><\/p>"},{"id":122,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите ошибку! К наиболее эффективным средствам, применяемым при гонорее, относятся:<\/p>\n<p>1) фторхинолоны;<\/p>\n<p>2) цефалоспорины 3 поколения;<\/p>\n<p>3) макролиды.<\/p>\n<p>4) <b class=\"a\">препараты пенициллина;<\/b><\/p>\n<p>5) спектиномицин.<\/p>"},{"id":123,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите соответствие.<\/p>\n<p>Наиболее эффетивные антигонорейные средства:<\/p>\n<p>1) фторхинолон;<b class=\"a\">а)<\/b> <span class=\"gap\"><\/span> а) ципрофлоксацин;<\/p>\n<p>2) цефалоспорин;<b class=\"a\">в),б)<\/b> <span class=\"gap\"><\/span> б) цефтриаксон (роцефин);<\/p>\n<p><span class=\"gap\"><\/span> 3 поколения; <span class=\"gap\"><\/span> в) цефотаксим (клафоран);<\/p>\n<p>3) макролид (азалид);<b class=\"a\">г)<\/b> <span class=\"gap\"><\/span> г) азитромицин (сумамед);<\/p>\n<p>4) трициклический <b class=\"a\">д)<\/b> <span class=\"gap\"><\/span> д) спектиномицин.<\/p>\n<p><span class=\"gap\"><\/span> аминогликозид <span class=\"gap\"><\/span><\/p>"},{"id":124,"t":"Anti-infectieux","h":"<p class=\"stem\">Впишите недостающее слово. (название препарата по-русски).<\/p>\n<p>К препаратам висмута, применяемым при лечении сифилиса относятся:<\/p>\n<p><b class=\"a\">1) бийохинол; <span class=\"gap\"><\/span> <\/b> 2) бисмоверол <span class=\"gap\"><\/span> .<\/p>\n<p>125 Классифицируйте следующие антибиотики (вставьте в таблицу номера препаратов в соответствии с их группой).<\/p>\n<div class=\"tw\"><table><tr><td>Влияющие преимущественно на грамположительные бактерии<\/td><td>Широкого спектра действия<\/td><td>Противотуберк  улезный<br>антибиотик<\/td><td>Противогрибковый антибиотик<\/td><\/tr><tr><td class=\"a bl\">34<\/td><td class=\"a bl\">2<\/td><td class=\"a bl\">1<\/td><td class=\"a bl\">5<\/td><\/tr><\/table><\/div>\n<p>1) циклосерин; <span class=\"gap\"><\/span> 4) мидекамицин;<\/p>\n<p>2) амоксициллин; <span class=\"gap\"><\/span> 5) гризеофульвин.<\/p>\n<p>3) кларитромицин;<\/p>"},{"id":125,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите ошибки!<\/p>\n<p>К биосинтетическим и полусинтетическим пенициллинам для перорального приема относятся:<\/p>\n<p>1) феноксиметилпенициллин;<\/p>\n<p>2) ампициллин;<\/p>\n<p>3) оксациллин;<\/p>\n<p>4) <b class=\"a\">карбенициллин;<\/b><\/p>\n<p><b class=\"a\">5) бензилпенициллин.<\/b><\/p>"},{"id":126,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите неправильные ответы.<\/p>\n<p>К пенициллинам 1 поколения (биосинтетическим) относится:<\/p>\n<p>1) феноксиметилпенициллин;<\/p>\n<p>2) <b class=\"a\">оксациллин;<\/b><\/p>\n<p><b class=\"a\">3) ампициллин;<\/b><\/p>\n<p>4)  бензатинбензилпенициллин.<\/p>"},{"id":127,"t":"Anti-infectieux","h":"<p class=\"stem\">Охарактеризуйте следующие препараты.<\/p>\n<p class=\"stem\">Укажите соответствие.<\/p>\n<p>ПРЕПАРАТ <span class=\"gap\"><\/span> СОСТАВ<\/p>\n<p>1) ампиокс; <span class=\"gap\"><\/span> а) ампициллин+сульбактам;<\/p>\n<p>2) уназин; <span class=\"gap\"><\/span> б) ампициллин+оксациллин;<\/p>\n<p>3) аугметин; <span class=\"gap\"><\/span> в) амоксициллин+клавулановая к-та;<\/p>\n<p>4) бициллин-5 <span class=\"gap\"><\/span> г) новокаиновая соль бензилпенициллина +<\/p>\n<p><span class=\"gap\"><\/span> +бензатинбензилпенициллин.<\/p>\n<p><b class=\"a bl\">1 – б, 2 – а, 3 – в, 4 – г<\/b><\/p>"},{"id":128,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите соответствие.<\/p>\n<p>ПРЕПАРАТ <span class=\"gap\"><\/span> ГРУППА<\/p>\n<p>1) ампициллин; <span class=\"gap\"><\/span> а) суицидный инактиватор -лактамаз необратимого<\/p>\n<p>2) сульбактам; <span class=\"gap\"><\/span> действия; <span class=\"gap\"><\/span><\/p>\n<p>3) оксациллин; <span class=\"gap\"><\/span> б) полусинтетический пенициллин широкого спектра<\/p>\n<p>4) клавулановая <span class=\"gap\"><\/span> действия; <span class=\"gap\"><\/span><\/p>\n<p><span class=\"gap\"><\/span> кислота; <span class=\"gap\"><\/span> в) полусинтетический пенициллин 2 поколения,<\/p>\n<p>5) бензатинбензилпенициллин <span class=\"gap\"><\/span> ингибирующий <span class=\"gap\"><\/span> -лактамазы  микроорганизмов;<\/p>\n<p><span class=\"gap\"><\/span> г) биосинтетический (природный) пенициллин<\/p>\n<p><span class=\"gap\"><\/span> продолжительного действия.<\/p>\n<p><b class=\"a bl\">1 – б, 2 – а, 3 – в, 4 – а, 5 – г<\/b><\/p>"},{"id":129,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>Имипинем относится к группе:<\/p>\n<p>1) биосинтетических пенициллинов 1 поколения;<\/p>\n<p>2) -лактамов;<\/p>\n<p>3) монобактамов;<\/p>\n<p>4) <b class=\"a\">карбапенемов.<\/b><\/p>"},{"id":130,"t":"Anti-infectieux","h":"<p class=\"stem\">Классифицируйте следующие антибиотики-аминогликозиды ( вставьте в таблицу номер информации о препарате )<\/p>\n<div class=\"tw\"><table><tr><td>Мономицин<\/td><td>Канамицин<\/td><td>Амикацин<\/td><td>Тобрамицин<\/td><\/tr><tr><td class=\"a bl\">1<\/td><td class=\"a bl\">2<\/td><td class=\"a bl\">4<\/td><td class=\"a bl\">3<\/td><\/tr><\/table><\/div>\n<p>1) первое поколение (подгруппа неомицина);<\/p>\n<p>2) первое поколение (подгруппа стрептомицина);<\/p>\n<p>3) второе поколение;<\/p>\n<p><span class=\"gap\"><\/span> 4) третье поколение.<\/p>"},{"id":131,"t":"Anti-infectieux","h":"<p class=\"stem\">Охарактеризуйте антибиотик гентамицин.<\/p>\n<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>Гентамицин входит в группу:<\/p>\n<p>1) тетрациклинов;<\/p>\n<p>2) <b class=\"a\">аминогликозидов;<\/b><\/p>\n<p>3) макролидов;<\/p>\n<p>4) карбапенемов;<\/p>\n<p>5) азалидов.<\/p>"},{"id":132,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>Гентамицин относится к:<\/p>\n<p>1) антибиотикам 1 поколения подгруппы неомицина;<\/p>\n<p>2) антибиотикам 1 поколения подгруппы стрептомицина;<\/p>\n<p>3<b class=\"a\">) антибиотикам 2 поколения;<\/b><\/p>\n<p>4) антибиотикам 3 поколения.<\/p>"},{"id":133,"t":"Anti-infectieux","h":"<p class=\"stem\">Впишите недостающее слово (название препарата по-русски)<\/p>\n<p>Наиболее эффективный препарат из группы азалидов для лечения гонореи («золотой стандарт»), сифилиса, урогенитальной хламидийной инфекции (хламидиоза) – это <span class=\"gap\"><\/span> <b class=\"a bl\">азитромицин<\/b>. <span class=\"gap\"><\/span> .<\/p>"},{"id":134,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите ошибку!<\/p>\n<p>К наиболее эффективным препаратам, применяемым для лечения хламидийной инфекции, относятся:<\/p>\n<p>1) антибиотики-тетрациклины;<\/p>\n<p>2) антибиотики-азалиды-макролиды;<\/p>\n<p>3) фторхинолоны;<\/p>\n<p>4) рифампицин;<\/p>\n<p>5) <b class=\"a\">-лактамные антибиотики<\/b>.<\/p>"},{"id":135,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите соответствие.<\/p>\n<p>ПРЕПАРАТ <span class=\"gap\"><\/span> ГРУППА<\/p>\n<p>1) азитромицин; <span class=\"gap\"><\/span> а) тетрациклины;<\/p>\n<p>2) кларитромицин; <span class=\"gap\"><\/span> б) макролиды; <span class=\"gap\"><\/span><\/p>\n<p>3) доксициклин; <span class=\"gap\"><\/span> в) фторхинолоны;<\/p>\n<p>4) ципрофлоксацин; <span class=\"gap\"><\/span> г) азалиды.<\/p>\n<p>5) офлоксацин.<\/p>\n<p><b class=\"a bl\">1 – г, 2 – б, 3 – а, 4 – в, 5 – в<\/b><\/p>"},{"id":136,"t":"Anti-infectieux","h":"<p class=\"stem\">Классифицируйте следующие синтетические противомикозные средства (вставьте в таблицу номера препаратов в соответствии с химической классификацией)<\/p>\n<div class=\"tw\"><table><tr><td>Имидазол<\/td><td>Триазол<\/td><td>Аллиламин<\/td><td>Пиримидин<\/td><\/tr><tr><td class=\"a bl\">3<\/td><td class=\"a bl\">4<\/td><td class=\"a bl\">1<\/td><td class=\"a bl\">2<\/td><\/tr><\/table><\/div>\n<p class=\"opt\"><span class=\"n\">1)<\/span> тербинафин;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> флуцитозин;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> клотримазол;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> итраконазол .<\/p>"},{"id":137,"t":"Anti-infectieux","h":"<p class=\"stem\">К противогрибковым препаратам, объединенным в группу азолов, относятся:<\/p>\n<p class=\"stem\">Укажите ошибки!<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> итраконазол;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> кетоконазол;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> <b class=\"a\">тербинафин;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> <b class=\"a\">микосептин;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> флуконазол.<\/p>"},{"id":138,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите соответствие.<\/p>\n<p>ПРЕПАРАТ <span class=\"gap\"><\/span> ХИМИЧЕСКАЯ ГРУППА<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> итраконазол; <span class=\"gap\"><\/span> а) имидазолы;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> кетоконазол; <span class=\"gap\"><\/span> б) триазолы;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> тербинафин; <span class=\"gap\"><\/span> в) производные ундециленовой кислоты; <span class=\"gap\"><\/span><\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> микосептин; <span class=\"gap\"><\/span> г) аллиламины.<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> флуконазол.<\/p>\n<p><b class=\"a bl\">1 – б, 2 – а, 3 – г, 4 – в, 5 – б<\/b><\/p>"},{"id":139,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите правильные ответы.<\/p>\n<p>К синтетическим противомикозным средствам, объединенным в группу азолов, относятся:<\/p>\n<p>1) <b class=\"a\">клотримозол;<\/b> <span class=\"gap\"><\/span><\/p>\n<p>2) тербинафин; <span class=\"gap\"><\/span><\/p>\n<p>3) <b class=\"a\">интраконазол;<\/b><\/p>\n<p>4) флуцитозин.<\/p>"},{"id":140,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите соответствие.<\/p>\n<p>ПРЕПАРАТ <span class=\"gap\"><\/span> ХИМИЧЕСКАЯ  ГРУППА<\/p>\n<p>1) кетоконазол <span class=\"gap\"><\/span> а) имидазолы;<\/p>\n<p>2) клотримкамол; <span class=\"gap\"><\/span> б) триазолы.<\/p>\n<p>3) флуконазол;<\/p>\n<p>4) миконазол;<\/p>\n<p>5) итраконазол.<\/p>\n<p><b class=\"a bl\">1 – а, 2 – а, 3 – б, 4 – а, 5 – б<\/b><\/p>"},{"id":141,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите ошибки!<\/p>\n<p>В группу противомикозных антибиотиков входят:<\/p>\n<p>1) <b class=\"a\">бензатинбензилпенициллин;<\/b><\/p>\n<p><b class=\"a\">2) индинавир;<\/b><\/p>\n<p>3) амфотерицин В;<\/p>\n<p>4) нистатин;<\/p>\n<p>5) леворин.<\/p>"},{"id":142,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите ошибки!<\/p>\n<p>В группу синтетических противогрибковых препаратов, применяемых при глубоких микозах, входят:<\/p>\n<p>1) миконазол;<\/p>\n<p>2) кетоконазол;<\/p>\n<p>3) флуконазол;<\/p>\n<p>4) <b class=\"a\">тербинафин;<\/b><\/p>\n<p><b class=\"a\">5) микосептин.<\/b><\/p>"},{"id":143,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите соответствие.<\/p>\n<p>ПРЕПАРАТ <span class=\"gap\"><\/span> ПРИМЕНЕНИЕ<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> дитразин; <span class=\"gap\"><\/span> а) трематодозы печени, амебиаз;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> медамин; <span class=\"gap\"><\/span> б) нематодозы кишечника;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> мебендазол; <span class=\"gap\"><\/span> в) внекишечный нематодоз-филяриатоз;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> эметина гидрохлорид. <span class=\"gap\"><\/span> г) нематодоз кишечника, внекишечный цестодоз,<\/p>\n<p><span class=\"gap\"><\/span> внекишечный нематодоз, трихинеллез.<\/p>\n<p><b class=\"a bl\">1-в, 2-б, 3-г, 4-а.<\/b><\/p>"},{"id":144,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите правильный ответ<\/p>\n<p>Нафтамон применяется для лечения:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> печеночных трематодозов (описторхоза и др.);<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> шистозоматоза (внекишечный трематодоз);<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> цестодозов кишечника;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> <b class=\"a\">нематодозов кишечника;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> внекишечных нематодозов.<\/p>"},{"id":145,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите правильные ответы<\/p>\n<p>При аскаридозе применяют следующие препараты:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> фенасал;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> <b class=\"a\">левамизол;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> экстракт мужского папоротника;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> дитразин;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> <b class=\"a\">пиперазина адипинат.<\/b><\/p>"},{"id":146,"t":"Anti-infectieux","h":"<p class=\"stem\">Классифицируйте следующие противоглистные средства (вставьте в таблицу номера препаратов в соответствии с фармакотерапевтической группой).<\/p>\n<div class=\"tw\"><table><tr><td>Применяемые при нематодозах кишечника.<\/td><td>Применяемые при кишечных цестодозах<\/td><\/tr><tr><td class=\"a bl\">34<\/td><td class=\"a bl\">12<\/td><\/tr><\/table><\/div>\n<p>1) экстракт мужского папоротника;<\/p>\n<p>2) фенасал;<\/p>\n<p>3) левамизол;<\/p>\n<p>4) пиперазина адипинат.<\/p>"},{"id":147,"t":"Anti-infectieux","h":"<p class=\"stem\">Классифицируйте следующие противоглистные препараты ( вставьте в таблицу номер информации о механизме их действия).<\/p>\n<div class=\"tw\"><table><tr><td>Дитразин<\/td><td>Нафтамон<\/td><td>Пирвиния<br>памоат<\/td><td>Фенасал<\/td><td>Левамизол<\/td><\/tr><tr><td class=\"a bl\">1<\/td><td class=\"a bl\">1<\/td><td class=\"a bl\">3<\/td><td class=\"a bl\">2<\/td><td class=\"a bl\">4<\/td><\/tr><\/table><\/div>\n<p>1) парализуюие нервно-мышечную систему у круглых червей;<\/p>\n<p>2) парализующие нервно-мышечную систему у плоских червей и разрушающие их покровные ткани;<\/p>\n<p>3) действующие преимущественно на энергетические процессы гельминтов;<\/p>\n<p>4) парализующие нерно-мышечную систему и энергитические процессы у круглых гельминтов.<\/p>"},{"id":148,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите правильные ответы<\/p>\n<p>При аскаридозе применяют следующие препараты:<\/p>\n<p>1) <b class=\"a\">нафтамон;<\/b><\/p>\n<p><b class=\"a\">2) пирантел;<\/b><\/p>\n<p>3) бетионол;<\/p>\n<p>4) празиквантель;<\/p>\n<p>5) хлоксил.<\/p>"},{"id":149,"t":"Anti-infectieux","h":"<p class=\"stem\">Впишите недостающее слово (название препарата по-русски)<\/p>\n<p>Широким спектром противоглистного действия при кишечных нематодозах обладает препарат из группы производных бензимидазола <span class=\"gap\"><\/span> <b class=\"a bl\">мебендазол<\/b>. <span class=\"gap\"><\/span> .<\/p>"},{"id":150,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите правильный ответ.<\/p>\n<p>Наиболее широким спекром  противотрематодного действия при внекишечной локализации гельминтов обладает:<\/p>\n<p>1) эметина гидрохлорид;<\/p>\n<p>2) бетионол;<\/p>\n<p>3) дитразин;<\/p>\n<p><b class=\"a\">4) хлоксил.<\/b><\/p>"},{"id":151,"t":"Allergie et immunité","h":"<p class=\"stem\">Классифицируйте следующие препараты, препятствующие освобождению гистамина из тучных клеток и базофилов при РГНТ ( вставьте в таблицу номера<\/p>\n<p>групп)<\/p>\n<div class=\"tw\"><table><tr><td>Дексаметазон<\/td><td>Аминофиллин<\/td><td>Орципреналин<\/td><td>Сальбутамол<\/td><\/tr><tr><td class=\"a bl\"><b class=\"a\">1<\/b><\/td><td class=\"a bl\"><b class=\"a\">3<\/b><\/td><td class=\"a bl\"><b class=\"a\">2<\/b><\/td><td class=\"a bl\"><b class=\"a\">2<\/b><\/td><\/tr><\/table><\/div>\n<p class=\"opt\"><span class=\"n\">1)<\/span> глюкокортикоиды;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> β-адреноагонисты;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> ксантины.<\/p>"},{"id":152,"t":"Allergie et immunité","h":"<p class=\"stem\">Укажите правильные ответы<\/p>\n<p>К Н1-гистаминоблокаторам II поколения относятся:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> дипразин;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> диазолин;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> кетотифен;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> <b class=\"a\">кларитин;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> <b class=\"a\">цетиризин.<\/b><\/p>"},{"id":153,"t":"Allergie et immunité","h":"<p class=\"stem\">Впишите недостающее слово (название препарата по-русски )<\/p>\n<p>Противоаллергический препарат длительного действия (24-48ч ) из группы тетрагидрокарболинов без седативного эффекта  - это <b class=\"a bl\">диазолин.<\/b><\/p>"},{"id":154,"t":"Allergie et immunité","h":"<p class=\"stem\">Укажите правильные ответы<\/p>\n<p>К группе средств, уменьшающих повреждение тканей при реакциях гиперчувствительности замедленного типа ( РГЗТ ) относятся:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> <b class=\"a\">глюкокортикоиды;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> нестероидные противовоспалительные средства;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> Н2-гистаминоблокаторы;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> Н1-гистаминоблокаторы;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> адреномиметики.<\/p>"},{"id":155,"t":"Allergie et immunité","h":"<p class=\"stem\">Впишите недостающее слово<\/p>\n<p>Антибиотик полипептидной структуры с мощным иммунодепрессивным действием – это <b class=\"a bl\">циклоспорин<\/b><\/p>"},{"id":156,"t":"Allergie et immunité","h":"<p class=\"stem\">Укажите ошибку!<\/p>\n<p>В группу иммуностимулирующих средств входят:<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> тималин;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> тактивин;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> левамизол;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> метилурацил;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> <b class=\"a\">пеницилламин.<\/b><\/p>"},{"id":157,"t":"Allergie et immunité","h":"<p class=\"stem\">Укажите правильные ответы:<\/p>\n<p>Кромолин-натрий относится к противоаллергическим средствам<\/p>\n<p class=\"opt\"><span class=\"n\">1)<\/span> <b class=\"a\">блокирующим высвобождение гистамина из тучных клеток и базофилов;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> препятствующим освобождению гистамина из тучных клеток и базофилов;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> бронхолитикам миотропного действия;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> <b class=\"a\">применяемым для профилактики приступов удушья при бронхиальной астме;<\/b><\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> купирующим приступ удушья при бронхиальной астме.<\/p>"},{"id":158,"t":"Anti-infectieux","h":"<p class=\"stem\">Впишите недостающее слово ( название препарата по-русски )<\/p>\n<p>Противомалярийный препарат, обладающий выраженным иммунодепрессивным действием, это <b class=\"a bl\">хингамин<\/b><\/p>"},{"id":159,"t":"Anti-infectieux","h":"<p class=\"stem\">Впишите недостающее слово (название препарата по-русски )<\/p>\n<p>Биогенное вещество, обладающее противовирусным и иммуностимулирующим действием, это__<b class=\"a bl\">интерферон<\/b>________________.<\/p>"},{"id":160,"t":"Anti-infectieux","h":"<p class=\"stem\">Впишите недостающее слово ( название препарата по-русски )<\/p>\n<p>Препарат, представляющий собой фермент, содержащийся в разных тканях и жидкостях организма и используемый в качестве антибактериального и иммуностимулирующего средства, называется <b class=\"a bl\">лизоцим<\/b><\/p>"},{"id":161,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите правильные ответы.<\/p>\n<p>Для профилактики гриппа применяют следующие препараты:<\/p>\n<p>1) ацикловир; <span class=\"gap\"><\/span> <b class=\"a\">4) кагоцел;<\/b><\/p>\n<p>2) видарабин; <span class=\"gap\"><\/span> 5) метисазон.<\/p>\n<p><b class=\"a\">3) ремантадин<\/b><\/p>"},{"id":162,"t":"Anti-infectieux","h":"<p class=\"stem\">Впишите недостающее слово (название препарата по-руски)<\/p>\n<p>В качестве противовирусного средства из группы нуклеозидов только для местного применения при кератитах используется <span class=\"gap\"><\/span> <b class=\"a bl\">Идоксуридин <\/b> <span class=\"gap\"><\/span> .<\/p>"},{"id":163,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите соответствие.<\/p>\n<p>ПРОТИВОВИРУСНЫЙ <span class=\"gap\"><\/span> ХИМИЧЕСКАЯ<\/p>\n<p><span class=\"gap\"><\/span> ПРЕПАРАТ <span class=\"gap\"><\/span> ГРУППА<\/p>\n<p>1) ремантадин; <span class=\"gap\"><\/span> а) производное тетрагидронафталина;<\/p>\n<p>2) оксолин; <span class=\"gap\"><\/span> б) производное адамантана;<\/p>\n<p>3) зидовудин; <span class=\"gap\"><\/span> в) производное тиосемикарбазона;<\/p>\n<p>4) метисазон. <span class=\"gap\"><\/span> г) аналоги нуклеозидов вируса<\/p>\n<p><span class=\"gap\"><\/span> иммунодефицита <span class=\"gap\"><\/span> человека. <span class=\"gap\"><\/span><\/p>\n<p><span class=\"gap\"><\/span> <b class=\"a bl\">1-Б,2-А, 3-г, 4-в <span class=\"gap\"><\/span> <\/b><\/p>"},{"id":164,"t":"Anti-infectieux","h":"<p class=\"stem\">Укажите ошибку!<\/p>\n<p>К специфическим противовирусным препаратам для лечения ВИЧ-инфекции из группы ингибиторов обратной транскриптазы ВИЧ относятся:<\/p>\n<p>1) диданозин;<\/p>\n<p>2) залцитабин;<\/p>\n<p>3) ламивудин;<\/p>\n<p>4) <b class=\"a\">индинавир (криксиван);<\/b><\/p>\n<p>5) ставудин.<\/p>"},{"id":165,"t":"Hormones","h":"<p class=\"stem\">Классифицируйте следующие средства, влияющие на миометрий<\/p>\n<div class=\"tw\"><table><tr><td>Усиливающие сократительную активность миометрия<\/td><td>Ослабляющие сократительную активность миометрия<\/td><td>Повышающие тонус миометрия<\/td><td>Понижающие тонус шейки матки<\/td><\/tr><tr><td class=\"a bl\">25<\/td><td class=\"a bl\">14<\/td><td class=\"a bl\">3<\/td><td class=\"a bl\">2<\/td><\/tr><\/table><\/div>\n<p class=\"opt\"><span class=\"n\">1)<\/span> гинипрал;<\/p>\n<p class=\"opt\"><span class=\"n\">2)<\/span> динипростон;<\/p>\n<p class=\"opt\"><span class=\"n\">3)<\/span> эрготал;<\/p>\n<p class=\"opt\"><span class=\"n\">4)<\/span> тербуталин;<\/p>\n<p class=\"opt\"><span class=\"n\">5)<\/span> дезаминоокситоцин.<\/p>"}],"recipes":[{"n":"Адеметионин","l":["Rp.: Ademethionini 400 mg","D.t.d. № 10 in Tab.","S. при хроническом гепатите"]},{"n":"Эпинефрина гидрохлорид","l":["Rp.: Sol. Epinephrini hydrochloride 0,1 % - 1 ml","D.t.d. № 5 in amp.","S. при анафилактическом шоке"]},{"n":"Азидотимидин (Зидовудин)","l":["Rp.: Zidovudini 100 mg","D.t.d.: № 100 in Caps.","S. Для лечения ВИЧ-инфекции"]},{"n":"Азитромицин","l":["Rp.: Azithromycini 500 mg","D.t.d.: №3 in Tab.","S. При фарингите/тонзиллите/остром бронхите/ пневмонии"]},{"n":"Акарбоза","l":["Rp.: Acarbosae 100 mg","D.t.d.: №30 in Tab.","S. При сахарном диабете 2 типа"]},{"n":"Хлорпромазин (ампулы)","l":["Rp.: Sol. Chlorpromazini 2,5% - 2 ml","D.t.d. №10 in amp.","S. При психомоторном возбуждении"]},{"n":"Амиодарон","l":["Rp.: Amiodaroni 200 mg","D.t.d.: №10 in Tab.","S. При желудочковых аритмиях"]},{"n":"Амитриптилин","l":["Rp.: Amitriptylini 25 mg","D.t.d.: №10 in Tab.","S. При депрессивных расстройствах"]},{"n":"Амоксициллин/клавуланат","l":["Rp.: Amoxicillini 500 mg","Acidi Clavulanaci 125 mg","D.t.d. №20 in tab.","S. При долевой пневмонии"]},{"n":"Ампициллина тригидрат","l":["Rp.: Ampicillini trihydratis 250 mg","D.t.d.: №10 in Tab.","S. при инфекциях дыхательных путей и ЛОР-органов (синусит, тонзиллит, фарингит)"]},{"n":"Метамизол натрий (ампулы)","l":["Rp.: Sol. Metamizoli natrii 50% - 1 ml","D.t.d. №10 in amp.","S. При болях средней интенсивности"]},{"n":"Пропранолол" рующие аппетит (сущность их действия). Анорексигенные средства (классификация по химической структуре, механизмы снижения аппетита,  побочные эффекты, противопоказания к применению).","r":["2-15"],"g":null},{"n":16,"q":"Средства, влияющие на секреторные железы желудка. Характеристика препаратов, назначаемых при снижении желудочной секреции.  Характеристика антацидных средств (быстрота наступления эффекта, длительность действия, эффективность). Показания к применению.","r":["2-16"],"g":null},{"n":17,"q":"Средства, влияющие на секреторные железы желудка. Препараты разных групп, снижающие желудочную секрецию. Характеристика (быстрота наступления эффекта, длительность действия, эффективность). Показания к применению.","r":["2-16"],"g":null},{"n":18,"q":"Средства, регулирующие деятельность поджелудочной железы. Характеристика препаратов заместительной терапии, назначаемых при снижении секреторной функции панкреас, показания к применению. Препараты, назначаемые для терапии острого панкреатита, принцип действия этих средств.","r":["2-17"],"g":null},{"n":19,"q":"Рвотные и противорвотные средства. Классификация рвотных средств по механизму действия, применение их в медицинской практике. Противорвотные средства разных групп, механизмы действия и применение в зависимости от генеза рвотного акта.","r":["2-18"],"g":null},{"n":20,"q":"Желчегонные средства. Классификация средств, стимулирующих образование желчи. Показания к их применению, время назначения в зависимости от приема пищи. Препараты, стимулирующие сокращения желчного пузыря и способствующие выделению желчи (холеспазмолитики). Препараты-гепатопротекторы, применение.","r":["2-19"],"g":null},{"n":21,"q":"Слабительные средства. Классификация слабительных средств по источникам получения. Механизмы послабляющего эффекта и точки приложения действия препаратов разных групп; показания к применению. Препараты, назначаемые при спазмах гладкой мускулатуры кишечника, принцип действия. Средства, назначаемые при атонии кишечника.","r":["2-20"],"g":null},{"n":22,"q":"Маточные средства. Препараты разных групп, используемые для стимуляции родовой деятельности, механизмы действия. Токолитические препараты разных групп, применение. Препараты, назначаемые для обезболивания родов и спазме шейки матки. Кровоостанавливающие маточные средства разных групп, сущность механизма действия. Побочные эффекты препаратов спорыньи, противопоказания к применению.","r":["2-21"],"g":null},{"n":23,"q":"Средства, влияющие на фибринолиз. Классификация средств, влияющих на фибринолиз, механизмы действия, показания к применению. Противопоказания и побочные эффекты.","r":["2-24"],"g":null},{"n":24,"q":"Средства, повышающие процесс свертывания крови. Классификация по источникам получения, сущность их гемостатического действия. Коагулянты местного и резорбтивного действия, показания к применению.","r":["2-25"],"g":null},{"n":25,"q":"Средства терапии анемий. Препараты терапии гипохромной анемии, фармакологическая характеристика (механизм действия, эффективность); условия, способствующие процессу всасывания препаратов. Препараты терапии мегалобластической анемии, механизмы действия. Препараты, используемые при макроцитарной и апластической анемиях, сущность действия.","r":["2-26"],"g":null},{"n":26,"q":"Гормональные препараты. Препараты эстрогенного действия, фармакологические эффекты, показания к применению. Гестагенные гормональные препараты, механизмы действия, эффекты, применение. Комбинированные пероральные контрацептивные средства.","r":["2-33"],"g":null},{"n":27,"q":"Гормональные препараты. Препараты андрогенного типа действия, сущность действия, фармакологические эффекты, применение. Анаболические стероиды, влияние на обменные процессы, показания к применению, побочные эффекты.","r":["2-34"],"g":null},{"n":28,"q":"Витаминные препараты. Классификация по фармакотерапевтическому применению. Жирорастворимые витаминные препараты, участие каждого в биохимических процессах, фармакологические эффекты, показания к применению.","r":["2-35"],"g":null},{"n":29,"q":"Витаминные препараты. Водорастворимые витаминные препараты (В1, В2, В3, В5, В6, В12, В15, фолиевая кислота), участие каждого в биохимических процессах, фармакологические эффекты, показания к применению.","r":["2-36"],"g":null},{"n":30,"q":"Витаминные препараты. Участие в биохимических процессах организма витаминов С, U, K, P, H, фармакологические эффекты, показания к применению. Причины гиповитаминозов, поливитаминные комплексы (2-3), их значение.","r":["2-37"],"g":null},{"n":31,"q":"Антигельминтные средства. Классификация препаратов по преимущественному действию на различные классы гельминтов. Сущность механизмов антигельминтного действия, принципы и условия назначения отдельных препаратов. Побочные эффекты. Антигельминтные средства растительного происхождения.","r":["2-38"],"g":null},{"n":32,"q":"Противомикозные средства. Классификация по терапевтическому применению. Сущность механизмов действия препаратов терапии дерматомикозов.","r":["2-39"],"g":null},{"n":33,"q":"Антибластомные препараты. Классификация алкилирующих средств по химической структуре. Механизмы действия препаратов этой группы, показания к применению. Противоопухолевые антибиотики, антиметаболиты, алкалоиды и синтетические противобластомные средства, механизмы действия, показания к применению. Основные побочные эффекты антибластомных средств.","r":["2-40"],"g":null},{"n":34,"q":"Антибластомные препараты. Таргетные средства. Механизмы действия препаратов этой группы, показания к применению.","r":[],"g":"Thérapies ciblées : absentes du livret, à préparer avec le cours."},{"n":35,"q":"Ферментные препараты. Основные группы ферментных средств, препараты, входящие в эти группы, сущность их действия, показания к применению. Антиподагрические средства (классификация по механизму действия, показания к применению, побочные эффекты).","r":["2-41"],"g":null},{"n":36,"q":"Сульфаниламидные препараты. Классификация по длительности действия и области применения. Принципы терапии
