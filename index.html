ви, симпатической стимуляции периферических сосудов, снижением активности ренинангиотензиновой системы, чувствительности барорецепторов дуги аорты и влиянием на ЦНС.","Гипотензивный эффект стабилизируется к концу 2-ой недели курсового назначения. Препарат усиливает спонтанное и вызванные утеротоническими средствами сокращения матки.","Уменьшает кровотечение при родах и в послеоперационном периоде. Снижает внутриглазное давление и уменьшает секрецию водянистой влаги. Тонус бронхов в связи с блокадой бета-2 адренорецепторов повышается. Побочные явления - тошнота, рвота, понос, головокружение, ухудшение сна, общая слабость, брадикардия, гипотония, симптомы недостаточности кровообращения, бронхоспазм, импотенция. 4.В. Лабеталол, в результате взаимодействия с α- и β-адренергическими рецепторами лабеталол вызывает вазодилатацию и снижение ОПСС, приводя к снижению системного АД без существенного уменьшения сердечного выброса и развития рефлекторной тахикардии.","Препарат существенно не влияет на величину сердечного выброса и частоту сердечных сокращений. Побочные действия: головокружение, головная боль, тошнота, запор или понос, чувство усталости, кожный зуд.","Диуретические средства снижают как систолическое, так и диастолическое давление, незначительно влияют на сердечный выброс. К ним относятся: Гидрохлортиазид, Индапамид, Фуросемид, Этакриновая кислота, Спиронолактон. Седативные препараты — валерьяна, пустырник, элениум."]},"1-29":{"t":"29. АНТИГИПЕРТЕНЗИВНЫЕ СРЕДСТВА. КЛАССИФИКАЦИЯ ГИПОТЕНЗИВНЫХ СРЕДСТВ МИОТРОПНОГО ТИПА ПО МЕХАНИЗМУ ДЕЙСТВИЯ. МЕХАНИЗМЫ ГИПОТЕНЗИВНОГО ЭФФЕКТА ПРЕПАРАТОВ РАЗНЫХ ГРУПП, ФАРМАКОЛОГИЧЕСКИЕ ЭФФЕКТЫ.","p":["1.А. Фенигидин, действие основано на блоке кальциевых каналов L- типа, снижается поступление ионов кальция в гладкомышечные клетки, что приводит к снижению сосудистого тонуса и гипотензии. Усиливает коронарный кровоток, улучшает кровоснабжение ишемизированных зон миокарда, активирует функционирование коллатералей, снижает тонус миокарда, потребность миокарда в кислороде и увеличивает длительность диастолического расслабления ЛЖ. Практически не влияет на SA и AV узлы и не обладает антиаритмической активностью. Усиливает почечный кровоток, вызывает умеренный натрийурез. Время наступления эффекта: 20 мин - при пероральном приеме, 5 мин - при сублингвальном приеме содержимого капсул; длительность эффекта: 4-6 ч - для таблеток и капсул, 12-24 ч - для пролонгированных форм. 1.Б. Диазоксид, открывание калиевых каналов вызывает выход ионов калия и гиперполяризацию мембраны гладкомышечных клеток сосудов, что нарушает функцию потенциалозависимых кальциевых каналов и снижает поступление внутрь клеток ионов кальция. Вызывает задержку натрия и воды, снижает скорость клубочковой фильтрации и тормозит экскрецию мочевой кислоты почечными канальцами. Максимальный гипотензивный эффект наступает через 2-5 мин после внутривенного введения препарата и продолжается 2-12 ч, в большинстве случаев — 3 ч.","2. Натрия нитропруссид, является донатором окиси азота (NO), которая стимулирует цитозольную гуанилатциклазу, повышает содержание цГМФ. Это приводит к снижению концентрации внутриклеточного кальция и снижению тонуса гладких мышц сосудов.","Гипотензивный эффект прекращается почти сразу после прекращения введения нитропруссида натрия (через 5-15 минут). При его применении АД практически можно снизить до любого уровня, до любых величин. Препарат применяется только в условиях стационара.","3. Апрессин препарат снимает спазмы мелких артерий, стойко снижает артериальное давление; усиливает сердечный выброс, учащает сердечные сокращения, усиливает почечный и мозговой кровоток, усиливает тонус сосудов мозга; оказывает умеренное адренолитическое и симпатолитическое действие. Стойкое снижение АД, преимущественно диастолического, происходит через 3-6, максимум - 14 дней, постоянного приема препарата. Действие длится около 6-8 часов."]},"1-3":{"t":"3.М-ХОЛИНОБЛОКАТОРЫ (ПРЕПАРАТЫ) ЦЕНТРАЛЬНОГО И ПЕРИФЕРИЧЕСКОГО ДЕЙСТВИЯ.","p":["Механизм действия: блокада М-Хр. Классический пример – атропин: блокирует мускариновые рецепторы всех типов, снимает тоническое влияние ЦНС на внутренние органы, конкурентная блокада атропином снимается при увеличении концентрации АХ или мускариновых агонистов, предотвращает образование ИФ3в М1- и М3-Хр или уменьшает уровень цАМФ в М2-Хр.","Фармакологические эффекты атропина:","1) Кожа: блокада потоотделения, сухость кожи, возможно гиперпирексия, гиперемия","2) Зрение: циклоплегия (релаксация цилиарной мышцы), мидриаз (релаксация мышцы, суживающей зрачок), затруднение оттока жидкости (повышение внутриглазного давления), уменьшение лакримации (слезотечение)","3) ЖКТ: гипосаливация, снижение тонуса и моторики ЖКТ, вагусной секреции желудка, поджелудочной железы, кишечника, желчи.","4) МПС: задержка мочеиспускания, расслабление мочеточников.","5) Дыхательная система: расширение бронхов, уменьшение секреции бронхиальных желез.","6) Сердечно-сосудистая система: брадикардия в малых дозах (влияние на вагусные центры), тахикардия в высоких дозах (периферические эффекты), повышение сердечного выброса","7) ЦНС: в терапевтических дозах слабый стимулирующий эффект на ЦНС, в токсических – галлюцинации, кома.","Других М-холиноблокаторов в сравнении с ним. Если атропин сильнее влияет на сердце, бронхи, пищеварительный тракт, то скополамин - на глаза и секрецию ряда экскреторных желез. Действует скополамин менее продолжительно, чем атропин.","По влиянию на ЦНС скополамин существенно отличается от атропина. В терапевтических дозах скополамин обычно вызывает успокоение, сонливость и сон. Действует угнетающе на экстрапирамидную систему и передачу возбуждения с пирамидных путей на мотонейроны.","Синтетический препарат метацин плохо проникает через гематоэнцефалический барьер, и поэтому все его эффекты обусловлены в основном периферическим м-холиноблокирующим действием. На ЦНС не влияет. От атропина отличается более выраженным бронхолитическим эффектом. По влиянию на глаз значительно слабее атропина.","Показания к применению: язвенная болезнь желудка и 12-перстной кишки, спастические состояния ЖКТ, желчных путей, мочеточников, синдром раздражения толстой кишки, урологические расстройства: гиперкинезия МП при цистите, гиперсаливация и повышенная секреция бронхиальной слизи при наркозе, рефлекторная брадикардия и аритмия при наркозе, отравление ингибиторами АЦХЭ, мускарином (атропин) Противопоказания к применению: глаукома, заболевания сердца, непроходимость ЖКТ, неспецифический язвенный колит Симптомы отравления атропином: наблюдаются симптомы, связанные с подавлением холинергических влияний и воздействием вещества на ЦНС. Отмечается сухость слизистой оболочки полости рта, носоглотки, что сопровождается нарушением глотания, речи. Кожа становится сухой. Температура тела повышается. Зрачки широкие, типична фотофобия2.","Характерны двигательное и речевое возбуждение, нарушение памяти и ориентации, бывают галлюцинации. Протекает отравление по типу острого психоза.","Меры помощи: Лечение состоит в удалении невсосавшегося атропина из желудочнокишечного тракта (промывание желудка, танин, активированный уголь, солевые слабительные), ускорении выведения вещества из организма (форсированный диурез, гемосорбция) и применении физиологических антагонистов (например, антихолинэстеразных средств, хорошо проникающих в ЦНС). При выраженном возбуждении назначают диазепам (сибазон), иногда барбитураты кратковременного действия. В случае чрезмерной тахикардии целесообразно применение β-адреноблокаторов. Снижение температуры тела достигается наружным охлаждением. При необходимости налаживают искусственное дыхание. Вследствие фотофобии таких больных целесообразно помещать в затемненное помещение."]},"1-30":{"t":"30. АНТИГИПЕРТЕНЗИВНЫЕ СРЕДСТВА. ИНГИБИТОРЫ АГИОТЕНЗИНПРЕВРАЩАЮЩЕГО ФЕРМЕНТА (ИАПФ) И БЛОКАТОРЫ РЕЦЕПТОРОВ АНГИОТЕНЗИНАII ПЕРВОГО ТИПА (БЛОКАТОРЫ АТ1РЕЦЕПТОРОВ), ФАРМАКОЛОГИЧЕСКАЯ ХАРАКТЕРИСТИКА. ПРИНЦИПЫ КУПИРОВАНИЯ ГИПЕРТОНИЧЕСКОГО КРИЗА.","p":["Средства, влияющие на ренин-ангиотензиновую систему","1. Ингибиторы синтеза ангиотензина II (ингибиторы ангиотензинпревращающего фермента):","Каптоприл, Эналаприл","2. Блокаторы ангиотензиновых рецепторов: Лозартан","1. Каптоприл, механизм антигипертензивного действия связан с конкурентным ингибированием активности АПФ, которое приводит к снижению скорости превращения ангиотензина I в ангиотензин II, являющийся мощным сосудосуживающим веществом. В результате уменьшения концентрации ангиотензина II происходит вторичное увеличение активности ренина плазмы за счет устранения отрицательной обратной связи при высвобождении ренина и прямое снижение секреции альдостерона.На центральную и вегетативную нервную систему каптоприл не влияет. Он особенно эффективен при повышенном содержании ренина, при застойной сердечной недостаточности. Максимальное влияние на ренин-ангиотензиновую систему отмечается на протяжении 1 ч и длится 6–8","2. Лозартан, ангиотензин II связывается с АТ1-рецепторами, находящимися во многих тканях и выполняет несколько важных биологических функций, включая вазоконстрикцию и высвобождение альдостерона. Кроме этого, ангиотензин II стимулирует разрастание гладкомышечных клеток. Лозартан избирательно связывается с АТ1-рецепторами и не связывается и не блокирует рецепторы других гормонов и ионных каналов, играющих важную роль в регуляции функции сердечно-сосудистой системы. Кроме того, лозартан не ингибирует ангиотензинпревращающий фермент (АПФ, кининаза II), отвечающий за разрушение брадикинина.","Максимальная концентрация лозартана в крови достигается через 3-4 часа. Для достижения полного клинического эффекта препарат необходимо принимать в течение 1-1,5 месяцев.","Для купирования гипертонического криза используют внутривенное введение таких лекарственных средств как нифедипин, клофелин. В течение первых 2 часов уровень среднего АД должен быть снижен на 20-25 % (не более), нельзя употреблять пищу, затем, в течение последующих 6 часов - снижение АД до 160/100 мм рт. ст. Далее (при улучшении самочувствия) переводят на таблетированные препараты. Лечение начинают на догоспитальном этапе. Обязательна госпитализация в стационар, в отделение интенсивной терапии.","В зависимости от сопутствующих заболеваний терапия гипертонического криза может отличаться. Осложнения гипертонического криза: отёк легких, отёк мозга, острое нарушение мозгового кровообращения."]},"1-31":{"t":"31. АНТИБИОТИКИ. ИСТОРИЯ ПОЛУЧЕНИЯ И ПРИМЕНЕНИЯ АНТИБИОТИКОВ (ИССЛЕДОВАНИЯ А.ФЛЕМИНГА, Г.ФЛОРИ, Э.ЧЕЙНА, З.В.ЕРМОЛЬЕВОЙ И ДР.). КЛАССИФИКАЦИЯ АНТИБИОТИКОВ ПО СПЕКТРУ И МЕХАНИЗМУ ДЕЙСТВИЯ. ПРИНЦИПЫ РАЦИОНАЛЬНОЙ АНТИБИОТИКОТЕРАПИИ. ПРОБЛЕМА АНТИБИОТИКОРЕЗИСТЕНТНОСТИ.","p":["Антибиотики - это химические соединения биологического происхождения, оказывающие избирательное повреждающее или губительное действие на микроорганизмы.","Первооткрывателем антибиотиков является английский ученый Флеминг, который в 1929 году описал бактерицидное действие колоний грибка Пенициллина на колонии бактерий разраставшихся по соседству с грибком. Как и многие другие великие открытия в медицине, открытие антибиотиков было сделано случайно. В 1935 году в лаборатории Оксфорда он занимается изучением действия пенициллина, предварительно проштудировав результаты экспериментов Флеминга. После серии неудач, Чейну удается соорудить установку по получению устойчивого экстракта \"пенициллюма\". Он обращается к своему товарищу и руководителю оксфордской лаборатории Роберту Флори с просьбой испытать действие пенициллина. И 25 мая 1940 года Флори испытывает новый препарат на животных. В 1945 году Флеминг, Чейн и Флори удостаиваются Нобелевской премии за открытие антибиотиков и создание пенициллина. Среди целого ряда интереснейших результатов исследований, проведенных Ермольевой в 30-х гг., наиболее важным было получение (совместно И.С.","Буяновской) препарата фермента лизоцима и разработка методов его практического применения.","По спектру противобактериального действия среди антибиотиков выделяют:","1) средства, действующие преимущественно на грамположительные микроорганизмы (бензилпенициллины);","2) средства, действующие преимущественно на грамотрицательные микроорганизмы (полимиксины);","3) антибиотики широкого спектра действия (тетрациклины, аминогликозиды).","Классификация антибиотиков по механизму действия:","1) нарушающие синтез клеточной стенки бактерий – пенициллины (Bicillinum-1,5, Ampicillinum) и цефалоспорины (Cefalexinum, Cefotaxim). 2)нарушающие проницаемость цитоплазматической мембраны – Polymyxinum M, B, E","3) нарушающие внутриклеточный синтез белка (Tetracyclinum, Laevomycetinum, Streptomycinum)","4) нарушающие синтез РНК - Rifamcinum Принципы рациональной антибиотикотерапии","- Микробиологический принцип. До назначения препарата следует установить возбудителя инфекции и определить его индивидуальную чувствительность к антимикробным химиотерапевтическим препаратам.","- Фармакологический принцип. Учитывают особенности препарата — его фармакокинетику и фармакодинамику, распределение в организме, кратность введения, возможность сочетания препаратов и т. п.","- Клинический принцип. При назначении препарата учитывают, насколько безопасным он будет для данного пациента, что зависит от индивидуальных особенностей состояния больного.","- Эпидемиологический принцип. Выбор препарата, особенно для стационарного больного, должен учитывать состояние резистентности микробных штаммов, циркулирующих в данном отделении, стационаре и даже регионе.","- Фармацевтический принцип. Необходимо учитывать срок годности и соблюдать правила хранения препарата, так как при нарушении этих правил антибиотик может не только потерять свою активность, но и стать токсичным за счет деградации.","Антибиотикорезистентность — феномен устойчивости штамма возбудителей инфекции к действию одного или нескольких антибактериальных препаратов, снижение чувствительности (устойчивость, невосприимчивость) культуры микроорганизмов к действию антибактериального вещества.","Резистентность к антибиотикам может развиваться в результате естественного отбора посредством случайных мутаций и/или благодаря воздействию антибиотика. Микроорганизмы способны переносить генетическую информацию устойчивости к антибиотикам путём горизонтального переноса генов. Кроме того, антибиотикорезистентность микроорганизмов может быть создана искусственно методом генетической трансформации. Например, внесением искусственных генов в геном микроорганизма."]},"1-32":{"t":"32. АНТИБИОТИКИ. ФАРМАКОЛОГИЧЕСКАЯ ХАРАКТЕРИСТИКА МАКРОЛИДОВ И АЗАЛИДОВ (ПРЕПАРАТЫ, МЕХАНИЗМ, ХАРАКТЕР И СПЕКТР ПРОТИВОМИКРОБНОГО ДЕЙСТВИЯ, ПОКАЗАНИЯ К ПРИМЕНЕНИЮ, ПОБОЧНЫЕ ЭФФЕКТЫ).","p":["Антибиотики этой группы в основе своей молекулы содержат макроциклическое лактонное кольцо, связанное с различными сахарами. Представителями макролидов являются эритромицин, олеандомицин, рокситромицин, кларитромицин, а азалидов - азитромицин.","Механизм действия макролидов и азалидов заключается в угнетении синтеза белка рибосомами бактерий. Связано это с угнетением фермента пептидтранслоказы. Спектр их действия включает: Гр+ кокки (стрептококки, стафилококки), Гр+ палочки (возбудители дифтерии, листерии), Гр- кокки (гонококки, менингококки), Гр- палочки (легионеллы, хеликобактерии), хламидий, микоплазмы, спирохеты.","Показания к применению : ЛОР-инфекции, верхних и нижних дыхательных путей, гинекологические инфекции, кожи и мягких тканей; язвенная болезнь; дифтерия, коклюш; гонорея; сифилис; брюшной тиф (азитромицин); зоонозные инфекции. Препараты выбора: при микоплазменной, хламидийной, легионелезной пневмонии.","Побочные эффекты: Диспепсические расстройства, дисбактериоз, суперинфекция. Холестаз, холестатическая желтуха (эритромицин). Угнетение активности ферментов микросом печени (эритромицин, олеандомицин нельзя комбинировать с теофиллином, алкалоидами спорыньи пурпурной, карбамазепином) Эритромицин. Наиболее чувствительны к нему грамположительные кокки и патогенные спирохеты. Однако в спектр его действия входят также грамотрицательные кокки, палочки дифтерии, патогенные анаэробы, риккетсии, хламидии, микоплазмы, возбудители амебной дизентерии и др. Механизм действия эритромицина заключается в угнетении синтеза белка рибосомами бактерий. Связано это с угнетением фермента пептидтранслоказы.","Применение эритромицина ограничено, так как к нему быстро развивается устойчивость микроорганизмов. Поэтому его относят к антибиотикам резерва и используют в тех случаях, когда пенициллины и другие антибиотики оказываются неэффективными. Иногда возникают диспепсические нарушения, аллергические реакции, возможна суперинфекция.","Олеандомицин обладает более выраженным раздражающим эффектом, чем эритромицин, очень сходен с ним. Относится к антибиотикам резерва.","За последние годы в медицинскую практику внедрен ряд полусинтетических макролидов кларитромицин, рокситромицин и др. По механизму действия они аналогичны эритромицину.","Азалиды химически отличаются от макролидов, однако по основным свойствам сходны с ними.","Азитромицин менее активен по влиянию на стафилококки и стрептококки, чем эритромицин, но превосходит последний по влиянию на Haemophilus influenzae, a также на грамотрицательные кокки. Через гематоэнцефалический барьер не проходит.","Принимают последние два препарата энтерально. Из побочных эффектов иногда отмечаются тошнота, диарея, редко возникает снижение слуха."]},"1-33":{"t":"33.АНТИБИОТИКИ. КЛАССИФИКАЦИЯ ПРЕПАРАТОВ ГРУППЫ ПЕНИЦИЛЛИНА. МЕХАНИЗМ, СПЕКТР И ХАРАКТЕР ПРОТИВОМИКРОБНОГО ДЕЙСТВИЯ ПЕНИЦИЛЛИНОВ. ФАРМАКОКИНЕТИЧЕСКИЕ ОСОБЕННОСТИ ПРИРОДНЫХ И ПОЛУСИНТЕТИЧЕСКИХ ПЕНИЦИЛЛИНОВ (ДЛИТЕЛЬНОСТЬ ДЕЙСТВИЯ, СПЕКТР ПРОТИВОМИКРОБНОЙ АКТИВНОСТИ, УСТОЙЧИВОСТЬ","p":["Спектр антимикробного действия различных поколений пенициллинов:","ПЦ 1 покол облад высокой антибактер активностью, но спектр действия ограничен. Активны против Грам+кокков (стафолококки, стрепто-, пневмококки), чувствительны листерии, больщинство коринебактерий. Грам-кокков (менинго-, гонококки), палочки дифтерии, сибиреязв пал, клостридии, спирохеты, актиномицеты.","ПЦ 2 покол эффективны (помимо предыдущего спектра действия) против бактерий, продуц-х пенициллиназу (антистафилококковая активность).","ПЦ 3 покол широк спектра действия Грам+ и Грам- бактерий: сальмонеллы, шигеллы, некот штаммы протея, кишечную палочку, палочку Фридлендера, палочку инфлюэнцы.","Карбенциллин эффективен еще и в отнош всех видов протея и синегнойной палочки.","ПЦ 4 действуют на грам+ (стафилококк, стрептококк, пневмококк) и грам- (гонококк, менингококк, кишечная палочка, сальмонеллы, шигеллы) микроорганизмы. Представляют собой комбинир ср-ва 2 и 3 покол (Ampioxum= Ампициллин+оксациллин), благодаря содержанию оксациллина, активен в отношении пенициллиназообразующих стафилококков. А также комбинации ПЦ3пок. и ингиб β-лактамаз (Unasyn, Амоксиклав).","Препараты 5 покол широк спектра действия, активны в отношении Грам- и синегной палочки.","Не устойчивы к действию пенициллиназ, кроме Тазоцина.","Механизм бактерицидного действия пенициллинов:","По механизму действия пенициллины относятся к бактерицидным препаратам. В основе их действия лежит ингибирование синтеза компонентов клеточной стенки и их пространственного расположения. Пенициллины нарушают синтез пептидогликанабиополимера, являющегося основным компонентом клеточной стенки бактерий. Пенициллин ингибир. транспептидазу пептидогликана и эндогенный ингибитор (актив.муреингидролазы и расщепляет пептидогликан) Тип развития устойчивости к этим препаратам – пенициллиновый (медленный). В основе него развития лежит выработка ферментов-β-лактамаз, разрушающих β-лактамы (плазмидный механизм).","Применение пенициллина показано при сепсисе, во всех сульфаниламидорезистентных случаях соответствующих инфекций, при обширных и глубоко локализованных инфекционных процессах, после ранений с вовлечением в процесс и инфицированием больших костно-мышечных массивов, в послеоперационном периоде для профилактики гнойных осложнений, при инфицированных ожогах третьей и четвертой степени, при ранениях мягких тканей, ранениях грудной клетки, гнойном менингите, абсцессах мозга, рожистом воспалении, гонорее и её сульфаниламидоустойчивых формах, сифилисе, тяжёлом фурункулёзе, сикозе, при различных воспалениях глаза и уха.","Применение пенициллина противопоказано при наличии повышенной чувствительности к пенициллину, бронхиальной астме, крапивнице, сенной лихорадке и других аллергических заболеваниях, при повышенной чувствительности больных к антибиотикам, сульфаниламидам и другим лекарственным препаратам.","Спектр действия природных пенициллинов включает преимущественно грамположительные микроорганизмы. Их применяют при тонзиллофарингите, скарлатине, роже, бактериальном эндокардите, пневмонии, дифтерии, менингите, гнойных инфекциях, газовой гангрене и актиномикозе. Препараты этой группы являются средствами выбора при лечении сифилиса и для профилактики обострений ревматических заболеваний. Все природные пенициллины разрушаются β-лактамазами, поэтому их нельзя использовать для лечения стафилококковых инфекций, так как в большинстве случаев стафилококки вырабатывают такие ферменты.","• Препараты для парентерального введения (кислотонеустойчивые):","- Короткого действия (Бензилпенициллина натриевая и калиевая соли)","- Длительного действия (Бензилпенициллин прокаин (Бензилпенициллина новокаиновая соль), Бензатин бензилпенициллин (Бициллин-1), Бициллин-5)","• Препараты для энтерального введения (кислотоустойчивые): Феноксиметил пенициллин.","В процессе поиска более совершенных антибиотиков группы пенициллина на основе 6-АПК были получены полусинтетические препараты. Химические модификации 6-АПК проводились за счет присоединения различных радикалов к аминогруппе.","• Препараты узкого спектра действия, устойчивые к действию пенициллиназы","- Изоксазолиловые пенициллины (Оксациллин, Диклоксациллин)","• Препараты широкого спектра действия, не устойчивые к действию пенициллиназы","- Аминопенициллины (Ампициллин, Амоксициллин)","- Карбоксипенициллины (Карбенициллин, Карфециллин, Тикарциллин)","- Уреидопенициллины (Азлоциллин, Пиперациллин, Мезлоциллин) Полусинтетические пенициллины, устойчивые к действию пенициллиназы, отличаются от препаратов бензилпенициллина тем, что они эффективны при инфекциях, вызываемых пенициллиназообразующими стафилококками, поэтому препараты этой группы получили название «антистафилококковые» пенициллины."]},"1-34":{"t":"34. АНТИБИОТИКИ. КЛАССИФИКАЦИЯ ЦЕФАЛОСПОРИНОВ. МЕХАНИЗМ, СПЕКТР И ХАРАКТЕР ПРОТИВОМИКРОБНОГО ДЕЙСТВИЯ. ХАРАКТЕРИСТИКА ОТДЕЛЬНЫХ ПРЕПАРАТОВ. ПОКАЗАНИЯ И ПРОТИВОПОКАЗАНИЯ К ПРИМЕНЕНИЮ, ПОБОЧНЫЕ ЭФФЕКТЫ. ПОЛИМИКСИНЫ И ГЛИКОПЕПТИДЫ (МЕХАНИЗМ, СПЕКТР, ХАРАКТЕР ПРОТИВОМИКРОБНОГО ДЕЙСТВИЯ, ПРИМЕНЕНИЕ).","p":["I. Цефалотин обладает бактерицидным действием, которое основывается на ингибировании синтеза мукопептидов, нарушении синтеза бактериальных клеточных мембран, что приводит к лизису делящихся бактерий. активен в отношении большинства грамположительных и грамотрицательных микроорганизмов. Показания к применению: Гнойно-воспалительные заболевания, вызываемые чувствительными к его действию микроорганизмами, инфекции мочеполовой системы, гнойные инфекции кожи, мягких тканей и костей. Побочные явления: аллергические реакции, проявляющиеся в виде кожной сыпи и зуда, эозинофилии, тромбоцитопении, нейтропении, редко — гемолитической анемии. Противопоказания: повышенная индивидуальная чувствительность больного к антибиотикам группы цефалоспоринов.","II. Цефаклор высокоактивен в отношении грамотрицательных микроорганизмов (кишечная и гемофильная палочки, сальмонеллы). Активен также в отношении грамположительных микроорганизмов. Противопоказания: повышенная чувствительность к антибиотикам группы цефалоспоринов, аллергические реакции на цефалоспорины или на прочие компоненты. Побочное действие: тошнота, рвота, диарея, запор, псевдомембранозный колит, транзиторное. повышение активности печеночных трансаминаз, ЩФ, повышение билирубина, холестатическая желтуха, гепатит.","III. Цефтриаксон угнетает транспептидазу, нарушает биосинтез мукопептида клеточной стенки бактерий. Имеет широкий спектр действия, стабилен в присутствии большинства беталактамаз. Противопоказания: гиперчувствительность, в т.ч. к другим цефалоспоринам.","Побочные эффекты: расстройства пищеварения в виде тошноты, рвоты, поноса, транзиторного увеличения активности печеночных трансаминаз, гепатита, псевдомембранозного колита, возможно появление аллергических реакций в виде сыпи на коже, зуда, эозинофилии.","IV. Цефпиром угнетает транспептидазу и нарушает биосинтез мукопептида клеточной стенки бактерий. Применение: бактериальные инфекции, вызванные чувствительными микроорганизмами. Противопоказания: гиперчувствительность (в т.ч. к другим цефалоспоринам), беременность, период лактации, детский возраст. Побочные эффекты: аллергические и иммунологические реакции, диспептические расстройства, нарушение сердечного ритма, нарушение функции почек, олигурия, интерстициальный нефрит.","1. Для парентерального применения (Цефалотин, Цефуроксим, Цефотаксим, Цефепим)","2. Для энтерального применения (Цефалексин, Цефаклор, Цефиксим и др.) Полимиксины оказывают бактерицидное действие, которое связано с нарушением целостности цитоплазматической мембраны микробной клетки. Характеризуются узким спектром активности и высокой токсичностью. Спектр активности: активны в отношении грамотрицательных бактерий, таких как E.coli, сальмонеллы, шигеллы, клебсиеллы, энтеробактеры, синегнойная палочка. Умеренно чувствительны фузобактерии и бактероиды.","Противопоказания: почечная недостаточность, миастения, ботулизм. Побочные действия: поражение почек и нервной системы, суперинфекция, кандидоз, аллергические реакции.","Гликопептиды нарушают синтез клеточной стенки бактерий. Оказывают бактерицидное действие, однако в отношении энтерококков, некоторых стрептококков и КНС действуют бактериостатически. Спектр активности: активны в отношении грамположительных аэробных и анаэробных микроорганизмов: стафилококков, стрептококков, пневмококков, энтерококков, пептострептококков, листерий, коринебактерий, клостридий.","Грамотрицательные микроорганизмы устойчивы к гликопептидам. Противопоказания: аллергическая реакция на гликопептиды. беременность (ванкомицин - I триместр), кормление грудью. Наиболее распространенными побочными эффектами гликопептидов является флебит на месте введения, а также нефро- и ототоксичность."]},"1-35":{"t":"35. АНТИБИОТИКИ. КЛАССИФИКАЦИЯ АНТИБИОТИКОВАМИНОГЛИКОЗИДОВ. МЕХАНИЗМ, СПЕКТР И ХАРАКТЕР ПРОТИВОМИКРОБНОГО ДЕЙСТВИЯ. ФАРМАКОЛОГИЧЕСКАЯ ХАРАКТЕРИСТИКА ПРЕПАРАТОВ (ДЛИТЕЛЬНОСТЬ ДЕЙСТВИЯ, ЧАСТОТА ВВЕДЕНИЯ, ПОБОЧНЫЕ ЭФФЕКТЫ). ХАРАКТЕРИСТИКА ЛИНКОМИЦИНА И РИСТОМИЦИНА.","p":["Механизм действия аминогликозидов связывают с необратимым связыванием со специфическими рецепторами 30s-субъединицы бактериальных рибосом и угнетением синтеза белка из-за нарушения движения рибосомы по нити матричной РНК, а также нарушением процессов считывания кода мРНК, что приводит к синтезу функционально неактивных белков; также аминогликозиды нарушают проницаемость цитоплазматической мембраны микроорганизмов, все эти эффекты приводят к гибели бактериальных клеток. Они обладают широким спектром действия, эффективны в отношении многих аэробных грамотрицательных и части грамположительных м.о.: стафилококков, стрептококков, пневмококков, кишечной палочки, сальмонелл, шигелл, клебсиелл, протея, энтеробактерий, синегнойной палочки, но на анаэробы, спирохеты и простейшие не влияют. Аминогликозиды 1 поколения активны в отношении микобактерий туберкулеза, возбудителей туляремии и чумы.","Аминогликозиды способны оказывать токсическое действие, особенно нефро- и ототоксическое (кохлеарное и вестибулярное) и усиливать токсическое действие других нефро- и ототоксических препаратов; обладают блокирующим влиянием на нервно-мышечную проводимость и могут усугублять угнетающее действие на дыхание курареподобных препаратов.","Стрептомицин, наиболее важно его угнетающее влияние на микобактерии туберкулеза, возбудители туляремии, чумы, он губительно действует на патогенные кокки, некоторые штаммы протея, синегнойную палочку. При назначении препаратов стрептомицина отмечаются и аллергические реакции (лихорадка, кожные поражения, эозинофилия, редко анафилактический шок и др.), возможно развитие суперинфекции. Длительность действия стрептомицина при внутримышечном введении около 8-12 ч. Длительность применения – 7-10 дней.","Гентамицин обладает широким спектром действия, включающим грамположительные и грамотрицательные бактерии. Наибольший практический интерес представляет его активность в отношении синегнойной палочки, протея, кишечной палочки, а также стафилококков, устойчивых к бензилпенициллину.","Применяют гентамицин главным образом для лечения заболеваний, вызванных грамотрицательными бактериями. Одним из побочных эффектов является ототоксическое действие. В основном гентамицин поражает вестибулярную ветвь VIII пары черепных нервов.","Слух страдает реже. Обладает курареподобными свойствами. Гентамицин при внутримышечном введении быстро и полностью всасывается. Максимальная концентрация в сыворотке крови развивается через 30 - 90 мин. Длительность курса лечения составляет 7–14 дней.","Амикацин высокоактивен в отношении аэробных грамотрицательных микроорганизмов и некоторых грамположительных микроорганизмов, в т.ч. устойчивых к пенициллину, некоторым цефалоспоринам. Связываясь с 30S субъединицей рибосом, препятствует образованию комплекса транспортной и матричной РНК, блокирует синтез белка, а также разрушает цитоплазматические мембраны бактерий. Побочные действия: поражения почек, слухового аппарата. Максимальная концентрация в крови при внутримышечном введении достигается через 1 час при внутривенном введении через 0,5 часа.","Линкомицин. В терапевтических дозах действует бактериостатически, при высоких концентрациях оказывает бактерицидное действие, подавляет синтез белка в микробной клетке. Подавляет белковый синтез бактерий вследствие обратимого связывания с 50S субъединицей рибосом, нарушает образование пептидных связей.","Активен преимущественно в отношении аэробных грамположительных бактерий; анаэробных бактерий. Показания: Стафилококковые инфекции, сепсис, остеомиелит.","Противопоказания:","Гиперчувствительность, печеночно-почечная недостаточность, беременность. Побочные действия: Головокружение, слабость, расслабление скелетной мускулатуры, гипотония, лейкопения, тромбоцитопения.","Ристомицин. Важной особенностью антимикробного действия ристомицина является его способность подавлять развитие микроорганизмов, устойчивых ко всем другим антибиотикам.","Образование резистентных к ристомицину штаммов происходит значительно медленнее, чем к другим антибиотикам. Показания: септические заболевания, обусловленные грамположительными микроорганизмами, гематогенный остеомиелит, гнойный менингит.","Противопоказания: гиперчувствительность, тромбоцитопения. Побочные действия: озноб, тошнота; лейкопения, нейтропения; аллергические реакции."]},"1-36":{"t":"36. АНТИБИОТИКИ. ТЕТРАЦИКЛИНЫ. МЕХАНИЗМ, СПЕКТР И ХАРАКТЕР ПРОТИВОМИКРОБНОГО ДЕЙСТВИЯ, ФАРМАКОКИНЕТИКА ТЕТРАЦИКЛИНОВ. ПОКАЗАНИЯ К ПРИМЕНЕНИЮ, ПОБОЧНЫЕ ЭФФЕКТЫ И ПРОТИВОПОКАЗАНИЯ К ПРИМЕНЕНИЮ. ГРУППА ЛЕВОМИЦЕТИНА (ПРЕПАРАТЫ). МЕХАНИЗМ, СПЕКТР И ХАРАКТЕР АНТИМИКРОБНОГО ДЕЙСТВИЯ. ФАРМАКОЛОГИЧЕСКИЕ ОСОБЕННОСТИ ОТДЕЛЬНЫХ ПРЕПАРАТОВ (ДЛИТЕЛЬНОСТЬ ДЕЙСТВИЯ, СПОСОБЫ И ЧАСТОТА НАЗНАЧЕНИЯ). ПОКАЗАНИЯ И ПРОТИВОПОКАЗАНИЯ К ПРИМЕНЕНИЮ, ПОБОЧНЫЕ ЭФФЕКТЫ ПРЕПАРАТОВ.","p":["Действие антибиотиков из группы тетрациклинов бактериостатическое. Тетрациклины способны блокировать синтез белков в клетках бактерий, однако, в отличие от макролидов, тетрациклины обладают меньшей избирательностью и потому в больших дозах или при длительном лечении могут тормозить синтез белков в клетках организма человека. В то же время тетрациклины остаются незаменимыми «помощниками» в лечении многих инфекций.","Основные направления использования тетрациклинов это лечение инфекций дыхательных и мочевыводящих путей, лечения тяжелых инфекций типа сибирской язвы, туляремии, бруцеллеза и пр.","Основные побочные эффекты: аллергические реакции; нарушения функций желудочнокишечного тракта (диспепсии, поносы, тошнота, рвота, дисбактериоз); гепатотоксичность при условии уже имеющейся патологии печени; головокружение; фотосенсибилизация (при приеме демеклоциклина, встречается редко); грибковые инфекции на фоне кишечного дисбактериоза; нарушение оссификации костей в случае приема тетрациклинов детьми младше 8 лет.","Противопоказания. Выраженные нарушения функции печени, лейкопения, микозы, третий триместр беременности, детский возраст (до 8 лет), повышенная чувствительность к препарату.","Спектр и механизм противомикробного действия левомицетинов (левомицетин, левомицетина стеарат, левомицетина сукцинат растворимый, левовинизоль, синтомицин) Механизм противомикробного действия левомицетина (Levomycetinum) связан с его влиянием на рибосомы и угнетением синтеза белка. Он также ингибирует пептидилтрансферазу.","Проявляются эти влияния в основном бактериостатическим эффектом. Левомицетин (хлорамфеникол) обладает широким спектром действия, в который входят Гр+ и Гр- бактерии, в том числе семейство кишечных бактерий, палочки инфлюэнцы, а также риккетсии, хламидии, возбудители бруцеллеза, туляремии.","Показания: Инфекционные заболевания дыхательных путей: пневмония, абсцесс легкого.","Инфекционные заболевания органов брюшной полости: брюшной тиф, паратиф, шигелез, сальмонельоз, перитонит. Менингит, хламидиоз, трахома и туляремия, конъюнктивит, блефарит.","Побочные эффекты: тошнота, рвота, диарея, стоматит, глоссит, энтероколит. При применении высоких доз -развитие гепатотоксического действия, гранулоцитопения, эритроцитопения, анемия, агранулоцитоз, тромбоцитопения, лейкопения, изменение артериального давления, коллапс, галлюцинации, нарушения зрения, слуха и вкусовых ощущений.","Противопоказания: Пациентам, страдающим нарушением функции кроветворения, тяжелыми заболеваниями печени и/или почек,пациентам с грибковыми заболеваниями кожи, псориазом, экземой, порфирией, а также острыми респираторными заболеваниями, в том числе ангиной, период беременности и грудного вскармливания, лечение детей до 3 лет.","Левомицетин и его производные очень хорошо всасываются (на 90 %) из желудочнокишечного тракта при пероральном и ректальном введениях. При ректальном введении уже через 30 мин антибиотик выявляется в крови, а через 2—3 ч создается максимальная концентрация в организме. Оптимальная противомикробная концентрация в тканях организма поддерживается 8—12 ч."]},"1-37":{"t":"37. СУЛЬФАНИЛАМИДНЫЕ ПРЕПАРАТЫ. КЛАССИФИКАЦИЯ ПО ДЛИТЕЛЬНОСТИ ДЕЙСТВИЯ И ОБЛАСТИ ПРИМЕНЕНИЯ. ПРИНЦИПЫ ТЕРАПИИ СУЛЬФАНИЛАМИДАМИ. МЕХАНИЗМ, СПЕКТР И ХАРАКТЕР ПРОТИВОМИКРОБНОГО ДЕЙСТВИЯ. ПОКАЗАНИЯ И ПРОТИВОПОКАЗАНИЯ К ПРИМЕНЕНИЮ, ПОБОЧНЫЕ ЭФФЕКТЫ.","p":["Спектр действия:","1) бактерии – патогенные кокки (гр -, гр+), кишечная палочка, шигеллы, холерный вибрион, клостридии, возбудитель сибирской язвы, дифтерии, катаральной пневмонии.","2) хламидии – возбудители трахомы, орнитоза, паховой лимфогранулёмы.","3) актиномицеты.","4) простейшие – возбудители токсоплазмоза, малярийный плазмодий.","Механизм сульфаниламидов: Связан с их конкурентным антагонизмом с парааминобензойной кислотой. Благодаря хим. сходству с ПАБК сульфаниламиды препятствуют её включению в дигидрофолиевую кислоту. Угнетается синтез нуклеиновых кислот, а следовательно рост и размножение подавляется.","Показания: инфекционно-воспалительные заболевания, вызванные чувствительными к препарату микроорганизмами: инфекции дыхательных путей, инфекции ЛОР-органов, скарлатина, инфекции мочеполовых органов, инфекции ЖКТ, инфекции кожи и мягких тканей, остеомиелит, бруцеллез, сепсис, перитонит, менингит, абсцесс головного мозга, остеоартикулярные инфекции, южноамериканский бластомикоз, малярия.","Противопоказания: повышенная чувствительность к сульфаниламидным препаратам.","Побочные явления: аллергические реакции различной тяжести, гематологические нарушения, в том числе агранулоцитоз и гемолитическую анемию.","Принципы сульфаниламидной терапии:","I. Раннее лечение, т.к. чем раньше будет антогонизм с с/а и ПАБК, тем быстрее выздоровление.","II. Определение чувствительности микроорганизмов к препаратам.","III. Выбор препарата широко спектра действия по локализации патологического процесса. IV.","Курсовое лечение. V. Профилактика осложнений. VI. Комбинированная терапия: 1). С вит. В 1,6 (надо ещё повысить и собственные защитные силы организма); с/а - это антивитамины гр.В. 2). С антисептиками 3). С а/б (бактерицидными): тетрациклин, левомицетин, макролиды. И нельзя с бактерицидными: Ь-лактамы, аминогликозиды, нитрофураны. 4). С салициловой кислотой. 5). С триметопримом"]},"1-38":{"t":"38. СИНТЕТИЧЕСКИЕ АНТИБАКТЕРИАЛЬНЫЕ СРЕДСТВА. ПРОИЗВОДНЫЕ 8-ОКСИХИНОЛИНА, СПЕКТР ПРОТИВОМИКРОБНОГО ДЕЙСТВИЯ, ПОКАЗАНИЯ К ПРИМЕНЕНИЮ. КЛАССИФИКАЦИЯ ХИНОЛОНОВ, СПЕКТР, МЕХАНИЗМ И ХАРАКТЕР ПРОТИВОМИКРОБНОГО ДЕЙСТВИЯ, ПОКАЗАНИЯ К ПРИМЕНЕНИЮ. ПРЕПАРАТЫ НИТРОФУРАНОВОГО РЯДА, СПЕКТР ПРОТИВОМИКРОБНОЙ АКТИВНОСТИ, ХАРАКТЕРИСТИКА ОТДЕЛЬНЫХ ПРЕПАРАТОВ, ПРИМЕНЕНИЕ, ПОБОЧНЫЕ ЭФФЕКТЫ.","p":["ПРОИЗВОДНОЕ 8-ОКСИХИНОЛИНА - 5-нитро-8-окси- хинолин - Нитроксолин. Механизм действия связан с селективным ингибированием синтеза бактериальной ДНК. Препарат обладает широким спектром антибактериального действия. Основное значение имеет активность в отношении грамотрицательных бактерий семейства Enterobacteriaceae и грибов рода Candida. Нитроксолин быстро всасывается из кишечника. Выделяется в неизмененном виде с мочой, где накапливается в бактериостатических концентрациях. Показания: инфекционно-воспалительные заболевания мочевыводящих путей, вызванные чувствительными микроорганизмами профилактика инфекционных осложнений при диагностических и лечебных вмешательствах. Из побочных эффектов возможны диспепсические явления. Противопоказания: нарушения функции почек, сопровождающиеся олиго- или анурией, тяжелые заболевания печени, дефицит глюкозо-6-фосфатдегидрогеназы, катаракта, неврит, беременность, лактация, повышенная чувствительность к препаратам хинолинового ряда.","Механизм действия хинолонов заключается в ингибировании бактериальных ферментов ДНК-гиразы, топоизомераз II и IV, что приводит к нарушению репликации ДНК.","Ингибирование ДНК-гидразы вызывает гибель бактерий.","Нефторированные хинолоны активны в отношении грамотрицательных бактерий семейства Enterobacteriaceae. Фторированные хинолоны имеют значительно более широкий спектр. Они активны в отношении многих грамположительных аэробных бактерий, большинства грамотрицательных бактерий.","Показания:","1. Хинолоны I поколения: инфекции МВП: острый цистит, кишечные инфекции: шигеллез.","2. Фторхинолоны: инфекции верхних и нижних дыхательных путей, кишечные инфекции, сибирская язва, интраабдоминальные инфекции, инфекции органов малого таза, простатит, гонорея, инфекции кожи, мягких тканей, костей и суставов, инфекции глаз, менингит, сепсис, туберкулез.","Препараты нитрофуранового ряда Механизм действия: являясь акцепторами кислорода, нитрофураны нарушают процесс клеточного дыхания бактерий, ингибируют биосинтез нуклеиновых кислот. В зависимости от концентрации оказывают бактериостатический или бактерицидный эффект. Спектр активности: нитрофураны характеризуются достаточно широким спектром действия и в высоких концентрациях in vitro активны в отношении многих грамотрицательных и грамположительных бактерий, некоторых анаэробов, грибов рода Candida.","Малочувствительны энтерококки. Показания к применению: для приёма внутрь: заболевания мочевыводящих путей — острые и хронические пиелонефриты, циститы, воспалительные заболевания мочевыводящих путей (уретриты и др.), вторичные инфекционные осложнения после оперативных вмешательств на органах мочеполовой системы; для местного применения: циститы, уретриты, вульвовагиниты, гнойные раны, ожоги, свищи Побочные эфеекты: диспептические явления, аллергические реакиции. Для уменьшения побочных эффектов рекомендуются обильное питье, блокаторы гистаминовых Н1-рецепторов, витамины группы В. Противопоказаниями к применению являются повышенная индивидуальная чувствительность к препаратам данной группы, тяжелые заболевания сердца, печени и почек.","МНН Особенности ЛС Низкие концентрации в крови и тканях. Высокие Нитрофурантоин концентрации в моче.","Препарат второго ряда для лечения острого цистита Показан при трихомонадном вульвовагините, вагинальном кандидозе; возможно применение при кишечном амебиазе.","Нифурател При совместном применении повышает активность нистатина Нифуроксазид Показан для лечения острой инфекционной диареи Более активен в отношении энтеробактерий и некоторых простейших. Низкие концентрации в моче. В последние Фуразолидон годы применяется при лямблиозе.","Вызывает дисульфирамоподобную реакцию Фармакокинетика малоизучена. Препарат второго ряда для Фуразидин лечения острого цистита.","Местно - для промывания ран и полостей"]},"1-39":{"t":"39.СИНТЕТИЧЕСКИЕ АНТИБАКТЕРИАЛЬНЫЕ СРЕДСТВА. ФТОРХИНОЛОНЫ. ФАРМАКОЛОГИЧЕСКАЯ ХАРАКТЕРИСТИКА (ХАРАКТЕР, МЕХАНИЗМ, СПЕКТР ПРОТИВОМИКРОБНОГО ДЕЙСТВИЯ, ПОКАЗАНИЯ И ПРОТИВОПОКАЗАНИЯ К ПРИМЕНЕНИЮ, ПОБОЧНЫЕ ЭФФЕКТЫ).","p":["Фторхинолоны - производные хинолона, содержащие в структуре атомы фтора.","Механизм действия: ингибируя два жизненно важных фермента микробной клетки - ДНКгиразу и топоизомеразу-4, фторхинолоны нарушают синтез ДНК, что приводит к гибели бактерий. Кроме того, антибактериальная активность обусловлена влиянием на РНК бактерий, на стабильность их мембран, и влиянием на другие жизненно важные процессы бактериальных клеток.","Спектр действия: они активны в отношении ряда грамположительных аэробных бактерий, большинства штаммов грамотрицательных, активны в отношении бактерий, устойчивых к хинолонам I поколения. Фторхинолоны III и, особенно, IV поколения высокоактивны в отношении пневмококков, более активны, чем препараты II поколения, в отношении внутриклеточных возбудителей, быстрорастущих атипичных микобактерий, анаэробных бактерий (моксифлоксацин). В различной степени к фторхинолонам чувствительны энтерококки.","Показания: инфекции верхних и нижних дыхательных путей, кишечные инфекции, сибирская язва, интраабдоминальные инфекции, инфекции органов малого таза, простатит, гонорея, инфекции кожи, мягких тканей, костей и суставов, инфекции глаз, менингит, сепсис, туберкулез.","Нежелательные реакции для всех хинолонов нежелательные реакции общие.","Аллергические реакции, судороги, тремор, парестезии, нарушение зрения, головокружение, головная боль, диспептические расстройства,","Противопоказания: тяжелый церебральный атеросклероз, дефицит глюкозо-6фосфатдегидрогеназы, аллергическая реакция на препараты группы фторхинолонов.","Беременность, кормление грудью, детский возраст."]},"1-4":{"t":"4.Н-ХОЛИНОМИМЕТИКИ.","p":["Локализация Н-холинорецепторов: нейрональные ганглии АНС, мозговое вещество надпочечников, нейроны ЦНС Препараты их возбуждающие: Никотин, цитизин, анабазина гидрохлорид Механизм действия: оказывают двухфазное действие на н-холинорецепторы (стадия возбуждения сменяется угнетающим эффектом). Первая фаза (возбуждение) характеризуется деполяризацией мембран ганглионарных нейронов, вторая (угнетение) обусловлена конкурентным антагонизмом с ацетилхолином.","Фармакологические эффекты:","1) стимуляция автономных ганглиев (симпатических сильнее, чем парасимпатических)","2) сердечно-сосудистая система: тахикардия, периферический и коронарный вазоспазм, гипертензия","3) ЖКТ, мочевыделительная система: угнетение активности","4) хемокаротидная зона: стимуляция дыхания","5) ЦНС: низкие дозы: психостимуляция, высокие дозы – рвота, тремор, судороги, кома.","Показания к применению: облегчение отвыкания от курения, рефлекторная остановка дыхания (при операциях, травмах и т.д.), шоковые и коллаптоидные состояния (прессорный эффект), угнетение дыхания и кровообращения у больных с инфекционными заболеваниями.","Противопоказания к применению: атеросклероз, выраженном повышение артериального давления, эрозивно-язвенные поражения ЖКТ в фазе обострения, кровотечения из крупных сосудов, отек легких, беременность.","Токсикология никотина и продуктов табачного дыма.","При остром отравлении никотином отмечаются гиперсаливация, тошнота, рвота, диарея.","Брадикардия сменяется тахикардией. Артериальное давление повышено, одышка переходит в угнетение дыхания. Зрачки сначала сужены, затем расширены. Помощь в основном направлена на поддержание дыхания, так как смерть наступает от паралича центра дыхания. Хроническое отравление никотином, как правило, связано с курением табака. Однако следует учитывать, что табачный дым содержит и другие токсичные вещества. Симптоматика хронического отравления довольно разнообразна. Типичны воспалительные процессы слизистых оболочек дыхательных путей. Наблюдается гиперсаливация. Кислотность желудочного сока может снижаться. Моторика толстой кишки повышается. Среди изменений со стороны кровообращения, помимо повышения артериального давления и учащения ритма сердечных сокращений, могут быть экстрасистолы, пароксизмальная тахикардия. Нередко никотин способствует развитию приступов стенокардии, иногда ослабляет зрение. Серьезные изменения наблюдаются со стороны высшей нервной деятельности. Курение табака наносит большой вред здоровью. Оно способствует развитию ишемической болезни сердца, рака легкого, хронического бронхита, эмфиземы легких и др. Повышаются преждевременная смертность и инвалидизация лиц, злоупотребляющих курением табака."]},"1-40":{"t":"40. ПРОТИВОТУБЕРКУЛЕЗНЫЕ СРЕДСТВА. ПРИНЦИПЫ ТЕРАПИИ ТУБЕРКУЛЕЗА. КЛАССИФИКАЦИЯ ПРЕПАРАТОВ. ФАРМАКОЛОГИЧЕСКАЯ ХАРАКТЕРИСТИКА ОСНОВНЫХ ПРЕПАРАТОВ РАЗНЫХ ГРУПП (МЕХАНИЗМЫ ПРОТИВОМИКРОБНОГО ДЕЙСТВИЯ, ДЛИТЕЛЬНОСТЬ ДЕЙСТВИЯ). ПОБОЧНЫЕ ЭФФЕКТЫ ОТДЕЛЬНЫХ ПРЕПАРАТОВ.","p":["Принципы терапии туберкулеза:","1. Раннее и своевременное начало лечения туберкулезными препаратами.","2. Определение чувствительности микобактерий туберкулеза (МБТ) к лекарствам.","3. Курсовая терапия (первые 4 месяца в стационаре, а так и до 6 месяцев и даже более). Отсюда","- проблема формирования лекарственной устойчивости. К одним препаратам она развивается быстро (рифампицин, стрептомицин, этамбутол), к другим - медленно (ПАСК). Для уменьшения скорости развития резистентности должна быть периодическая смена препаратов, их комбинация. 4. Комбинированное использование средств. Целесообразным считается сочетание препаратов с разными механизмами действия, например 2-3 лекарственных средств.","Согласно химической классификации, это комбинация 1,3 и 4 групп или 2,3, и 4 групп. 5.","Терапия должна быть индивидуальной. 6. Профилактика побочных действий. 7. Терапия должна строго контролироваться.","К противотуберкулезным препаратам относятся лекарственные препараты разных химических классов. Всех их объединяет способность подавлять разные МТБ и используются они исключительно при этом заболевании (исключение - антибиотики).","РИФАМПИЦИН - полусинтетический бактерицидный антибиотик широкого спектра действия. Спектр: на кокки (гр.+ и гр.-); на гр.- палочки (в том числе легионеллез, туляремию); на микобактерии МВТ, лепра). Механизм действия: блокада РНК-полимеразы -> прекращение синтеза РНК. Но тип действия: бактерицидный. Показания: главное - туберкулез (в сочетании с изониазидом и др. средствами); профилактика и лечение атипичных микобактериозов у ВИЧ-инфицированных больных (в сочетании с азитромицином); лепра; легионеллез. Побочные реакции могут быть в виде диспепсии, окрашивании мочи, слюны, слезы в оранжевый цвет (из-за метаболита), гепато- и гемототоксичность. Скорость развития эффекта – 1-3 часа.","ЭТАМБУТОЛ. Спектр действия: только МБТ. Механизм действия: нарушение синтеза РНК. Тип действия: туберкулостатический. Но этамбутол подавляет рост МБТ, устойчивых к изониазиду, ПАСК, стрептомицину и канамицину. Особенно показан при деструктивном туберкулезе. Скорость развития эффекта – 3-4 часа. Длительность действия при однократном приеме составляет 12 ч и более.","Побочные действия: расстройство цветового восприятия (на красный и зеленый цвет), снижение остроты зрения из-за неврита зрительного нерва. Может спровоцировать подагру из-за гиперурикемии. К препарату быстро развивается устойчивость МБТ, поэтому он используется в сочетании с изониазидом и/или рифампицином.","ПАСК - противотуберкулезное средство. оказывает бактериостатическое действие, механизм действия связан с угнетением синтеза фолиевой кислоты и с подавлением образования микобактина, компонента микобактериальной стенки, что приводит к уменьшению захвата железа М. tuberculosis. Показания: туберкулез различных форм и локализаций, в т.ч. при множественной лекарственной устойчивости к др. противотуберкулезным ЛС.","Противопоказания: Гиперчувствительность, в т.ч. к др. салицилатам; тяжелые заболевания почек и печени; декомпенсированная ХСН; микседема в стадии декомпенсации; эпилепсия; период лактации."]},"1-41":{"t":"41. ПРОТИВОСИФИЛИТИЧЕСКИЕ ПРЕПАРАТЫ. ОСНОВНЫЕ ПРИНЦИПЫ ТЕРАПИИ СИФИЛИСА. ФАРМАКОЛОГИЧЕСКАЯ ХАРАКТЕРИСТИКА ПРЕПАРАТОВ РАЗНЫХ ГРУПП (МЕХАНИЗМЫ ДЕЙСТВИЯ, ДОЗИРОВАНИЕ, ФАРМАКОЛОГИЧЕСКИЕ ОСОБЕННОСТИ, ПОБОЧНЫЕ ЭФФЕКТЫ).","p":["Ранние формы сифилиса полностью излечимы, если больному проводится терапия, адекватная стадии и клинической форме болезни. При лечении поздних форм заболевания в большинстве случаев наблюдается клиническое выздоровление или стабилизация процесса.","Основные принципы лечения сифилиса:","1) Лечение необходимо начинать рано, немедленно по установлении диагноза, что обеспечивает наилучшие результаты специфической терапии.","2) Лечение должно быть полноценным и энергичным и укладываться в определенные сроки.","Лекарственные препараты следует применять в достаточной дозировке с соблюдением разовых и курсовых доз.","3) Специфическую терапию надо сочетать с методами неспецифической терапии, т.к. результаты лечения зависят в значительной степени от общего состояния организма, характера его реактивности.","4) Терапия должна быть максимально индивидуализированной с учетом возраста больного, массы тела, наличия интеркуррентных заболеваний, переносимости того или иного препарата.","Препараты бензилпенициллина.","Используют как короткодействующие (бензилпенициллина натриевую или калиевую соль), так и длительно действующие (новокаиновую соль бензилпенициллина, бициллины) препараты. Механизм действия препаратов бензилпенициллина сводится к подавлению у чувствительных микроорганизмов процессов образования цитолеммы путем прекращения синтеза входящего в ее состав мукопротеина — муреина. Это приводит к нарушению процессов жизнедеятельности бактерий, прекращает их деление, затем вызывает их растворение и гибель. Препараты чаще вводят внутримышечно на изотоническом растворе натрия хлорида или воде для инъекций.","Побочные явления: аллергические реакции: анафилактические и анафилактоидные реакции, крапивница, лихорадка, боли в суставах, ангионевротический отек, мультиформная эритема и эксфолиативный дерматит. Стоматит, глоссит. При длительной терапии возможно развитие суперинфекции. При непереносимости бензилпенициллина можно использовать другие антибиотики - тетрациклины, а также эритромицин, азитромицин, цефтриаксон.","Препараты висмута. К ним относятся бийохинол и бисмоверол. В отличие от антибиотиков спектр действия препаратов висмута ограничивается возбудителем сифилиса. По активности они уступают бензилпенициллину. Трепонемостатическое действие их связывают с угнетением ферментов, содержащих сульфгидрильные группы. Первую инъекцию биохинола делают в дозе 2 мл, последующие— по 4 мл каждые 3 дня, на курс 50 мл. Побочные явления: возможны запоры или учащение стула, обратимое нарушение функции почек или почечная недостаточность, парестезии, бессонница, снижение памяти, энцефалопатия."]},"1-42":{"t":"42. ПРОТИВОВИРУСНЫЕ СРЕДСТВА. КЛАССИФИКАЦИЯ ПРЕПАРАТОВ ПО МЕХАНИЗМУ ДЕЙСТВИЯ И ФАРМАКОТЕРАПЕВТИЧЕСКОМУ ПРИМЕНЕНИЮ. ХАРАКТЕРИСТИКА ОТДЕЛЬНЫХ ПРЕПАРАТОВ, ПОБОЧНЫЕ ЭФФЕКТЫ.","p":["ДНК-содержащие вирусы:","1. Герпесвирус Ацикловир, противовирусный препарат, особенно эффективный в отношении вирусов простого герпеса, опоясывающего герпеса и ветряной оспы. Механизм действия – в инфицированных вирусом клетках, содержащих вирусную тимидинкиназу, происходит фосфорилирование и превращение ацикловира в ацикловира монофосфат, затем он преобразуется в дифосфат и потом - в трифосфат. Ацикловира трифосфат, встраиваясь в синтезируемую вирусом дезоксирибонуклеиновую кислоту (ДНК), блокирует размножение вируса. Противопоказания: гиперчувствительность к ацикловиру или какому-либо другому компоненту препарата. Побочные действия: аллергические реакции, точечная поверхностная кератопатия (не требует прекращения лечения и исчезает без последствий); конъюнктивит; блефарит.","2. Поксвирус Метисазон оказывает антигерпетическую активность и применяется для лечения генитального герпеса и Herpes zoster, обладает профилактической активностью в отношении вируса натуральной оспы, подавляя репродукцию вирусов оспенной группы.","Противопоказания: выраженные поражения печени и почек, хронические заболевания желудочно-кишечного тракта, злокачественные новообразования. Побочные действия: в некоторых случаях тошнота, рвота, головокружение, уменьшают дозу.","РНК-содержащие вирусы","1. Ретровирус Зидовудин действует на вирусную ДНК-полимеразу (обратную транскриптазу), нарушая синтез вирусной ДНК и снижая репликацию вирусов. Применение: ранние и поздние стадии ВИЧ-инфекции, профилактика трансплацентарного ВИЧ-инфицирования плода.","Противопоказания: гиперчувствительность, выраженная нейтропения, гипохромная анемия.","Миопатия, гепатомегалия с жировой дистрофией. Побочные действия: миелосупрессия (анемия, нейтропения, лейкопения), анорексия, рвота, боль в животе, диспепсия, повышение температуры тела, головная боль, бессонница, слабость, парестезия, миалгия, сыпь.","2. Ортомиксовирус Ремантадин блокирует проникновение вируса гриппа в клетку (профилактическое действие), кроме того угнетает выход вирусных частиц из клетки, что проявляется снижением общего количества вирусных частиц в организме, антитоксическое действие, которое также помогает в борьбе организма с вирусом, эффективен в отношение различных штаммов вируса гриппа типа А, вируса Herpes simplex и вируса клещевого энцефалита. Противопоказания: гиперчувствительность, беременность и лактация, детский возраст до 7 лет. Из побочных эффектов может отмечаться сонливость, бессонница, головокружение, тошнота, вплоть до рвоты, сухость во рту, боли в животе.","3. Парамиксовирусы Рибавирин ингибирует репликацию новых вирионов, что обеспечивает снижение вирусной нагрузки, селективно ингибирует синтез вирусной РНК, не подавляя синтез РНК в нормально функционирующих клетках. Показания к применению: лечение хронического вирусного гепатита С (в составе комбинированной терапии с препаратами интерферона). Препарат рекомендован к применению как у ранее не лечившихся пациентов, так и у больных при обострении после курса интерферона альфа 2b (пегинтерферона альфа 2b), а также у пациентов не восприимчивых к монотерапии препаратами интерферона. Противопоказания: гиперчувствительность, беременность, период лактации, инфаркт миокарда, почечная недостаточность, тяжелая анемия, печеночная недостаточность, декомпенсированный цирроз печени, аутоиммунные заболевания, детский и юношеский возраст. Побочные действия вещества: головная боль, головокружение, общая слабость, недомогание, инсомния, астения, депрессия, снижение или повышение АД, тахикардия, сердцебиение, остановка сердца, гемолитическая анемия, одышка, кашель, фарингит, бронхит, средний отит, сухость слизистой оболочки полости рта, снижение аппетита, тошнота, рвота, диарея, артралгия, миалгия, простатит, аллергические реакции."]},"1-43":{"t":"43. ПРОТИВОПРОТОЗОЙНЫЕ СРЕДСТВА. КЛАССИФИКАЦИЯ ПРОТИВОМАЛЯРИЙНЫХ СРЕДСТВ ПО СПЕКТРУ ДЕЙСТВИЯ. МЕХАНИЗМЫ ДЕЙСТВИЯ И ФАРМАКОЛОГИЧЕСКИЕ ЭФФЕКТЫ ОТДЕЛЬНЫХ ПРЕПАРАТОВ, ПОКАЗАНИЯ К ПРИМЕНЕНИЮ, ПОБОЧНЫЕ ЭФФЕКТЫ. ПРЕПАРАТЫ ДЛЯ ИНДИВИДУАЛЬНОЙ ПРОФИЛАКТИКИ МАЛЯРИИ. ПРЕПАРАТЫ ДРУГИХ ГРУПП, ИСПОЛЬЗУЕМЫЕ В ТЕРАПИИ МАЛЯРИИ.","p":["1. Хингамин быстро вызывает гибель бесполых эритроцитарных форм всех видов плазмодиев.","Действует также гамонтоцидно (уничтожает половые формы возбудителя малярии).","Применяют для лечения острых проявлений всех видов малярии и химиопрофилактики.","Длительное применение может приводить к возникновению побочных явлений: дерматитов, головокружения, головных болей, тошноты, шума в ушах, болей в области желудка и диспептических явлений, умеренной лейкопении и тромбопении, нарушения аккомодации, ретинопатии и помутнению роговицы, расстройствам аккомодации, психическим расстройствам, миопатиям. Противопоказания: Дистрофия миокарда, тяжёлые поражения сердца сопровождающиеся аритмиями, диффузное поражение почек, функциональная недостаточность печени. 2.А.","Хлоридин - противопротозойное средство; оказывает противомалярийное и антитоксоплазмоидное действие. Блокирует фолатредуктазу, переводящую фолиевую кислоту в фолиновую. Показания к применению: профилактика и лечение трёхдневной и тропической малярии (в сочетании с Хингамином и сульфаниламидами), токсоплазмоз. Побочные явления: лечение у некоторых больных вызывает малокровие, потерю аппетита, головные боли, боли в области сердца, головокружение, тошноту, реже рвоту. Противопоказания: заболевания органов кроветворения, заболевания почек, беременность. 2.Б.-3. Примахин — синтетический противомалярийный препарат, оказывающий антипротозойное действие на половые формы, шизонты и параэритроцитарные формы всех видов малярийных плазмодиев. Для него характерна интеркаляция с ДНК плазмодиев, приводящая к нарушению синтеза нуклеиновых кислот. Показания к применению: лечение трёхдневной, четырёхдневной и тропической малярии. Побочные явления: боли в животе, диспептические явления, общая слабость, боль в области сердца, цианоз, метгемоглобинемия, анемия, лейкопения, гемолиз эритроцитов. Противопоказания: заболевания крови и кроветворных органов, болезни почек, стенокардия, ревматизм, системная красная волчанка.","С целью индивидуальной профилактики используют гематошизотропные средства (хингамин, фансидар, хинин и др.), которые начинают принимать за 3–5 дней до въезда в эндемичную зону, продолжают прием в течение всего периода пребывания в малярийном районе (2–3 года) и 4–8 нед после выезда из эндемичной зоны. В зависимости от типа эндемической малярии препараты принимают 1 –2 раза в неделю или ежедневно.","Лицам, живущим в очагах vivax малярии, проводят предсезонную химиопрофилактику рецидивов болезни примахином по 15 мг основания в сутки в течение 14 дней.","Наряду с химиопрофилактикой целесообразно предупреждать нападение комаров с помощью сеток или пологов в ночное время, нанесение на кожу или одежду репеллентов (диметилфталат), применение защитной одежды.","С целью профилактики трансфузионной малярии необходим тщательный отбор доноров с использованием как паразитологических, так и серологических методов.","В эндемичных районах в настоящее время осуществляется программа ВОЗ по борьбе с малярией, рассчитанная на длительное время, с акцентом на широкое использование химиопрепаратов, в сочетании с противокомариными мероприятиями."]},"1-44":{"t":"44.ПРОТИВОПРОТОЗОЙНЫЕ СРЕДСТВА.","p":["2)Механизмы действия и фармакологическая характеристика отдельных препаратов.","Хиниофон- эффективен в отношении вегетативных и цистных форм. Нарушает системы окислительного фосфорилирования амеб за счет галогенизации ферментов и образования хелатообразных комплексов с ними. Всасывается из ЖКТ плохо,малотоксичен.Побочные эфдиарея, неврит зрительного нерва.","Эметина гидрохлорид-ингибитор синтеза белка, обладает антихолинэстеразной активностью.","Вводят внутримышечно,выделяется почками более 1 месяца. Кумулирует,вызывая передозировки и токсические эффекты. Побочные эф-тахикардия, боли в сердце, мышечная слабость, тошнота,рвота. 3)Характеристика препаратов, используемых в терапии трихомонадоза, лямблиоза, балантидиаза, лейшманиоза, токсоплазмоза.","Метронидазол —антипротозойный и бактерицидный эффекты.Нарушает репликацию ДНК и синтез белка в клетке возбудителя, ингибирует тканевое дыхание. Показания: трихомониаз, лямблиоз, балантидиаз, амебная дизентерия и внекишечный амебиаз, анаэробная инфекции ЦНС, дыхательных путей,ЖКТ, язвенная болезнь (активны в отношении хеликобактерий). При приеме внутрь хорошо всасывается, хорошо проходит через тканевые барьеры, метаболизируется в печени, выводится с мочой (80%).Тинидазол-, применяется только внутрь, назначается в 2 раза реже Побочные явления: диспептические расстройства, стоматит, головная боль, депрессия, бессонница, нарушение координации движений, судорожные приступы и периферическая нейропатия, цистит, кандидоз и аллергические реакции.","Противопоказания: М. и Т. :при гиперчувствительности, беременности (I триместр), лактации и органических заболеваниях ЦНС.","Трихомонацид - трихомонацидное действие, взаимодействует с молекулой ДНК, нарушая ее репликациию и транскрипцию. Принимают внутрь,биодоступность -100%. Mах в крови - через 1— 3 ч, после введения — через 4 ч. До 20% связывается с белками. Хорошо проникает в органы и ткани, в спинномозговую жидкость. t1/2 6—8 ч. Метаболизируется в печени.","Экскретируется почками.","Показан при трихомониазе у мужчин и женщин.","Побочные эффекты: головная боль, головокружение, тошнота, рвота; при местном применении — раздражение слизистых оболочек.","Лейшманиоз. Солюсурьмин , препараты сурьмы. Вводят внутривенно 2 раза в день 3 нед,При рецидиве -повторный курс после перерыва в 2 мес. Солюсурьмин противопоказан при сопутствующих острых инфекционных заболеваниях.","При амебиазе и лямбдиозе применяются метронидазол и тинидазол, аминохинол и эметина гидрохлорид.","Аминохинол ингибирует синтез белка у простейших, применяется для лечения лямблиоза, кожного лейшманиоза, токсоплазмоза."]},"1-45":{"t":"45.ПРОТИВОВОСПАЛИТЕЛЬНЫЕ СРЕДСТВА.","p":["2)Противовоспалительные средства стероидной структуры.","К ним относятся:1) Естественные глюкокортикоиды: кортизон, гидрокортизон. 2)Негалогенизированные: метилпреднизолон, преднизолон. 3)Галогенизированные (фторированные): бетаметазон , дексаметазон, триамцинолон Механизм.Активные ингибиторы всех фаз воспалительной реакции. Действуя на экспрессию генов, они индуцируют биосинтез в лейкоцитах липокортинов белковых ингибиторов фосфолипазы А2и уменьшают образование в очаге воспаления ЦОГ-2, что ограничивает продукцию арахидоновой кислоты из фосфолипидов клеточных мембран и синтез ее метаболитов медиаторов воспаления 3)Механизмы антифлогистического действия препаратов обоих групп.","Основной механизм действия стероидных препаратов (глюкокортикоидов) заключается в ингибировании фосфолипазы А 2 , и, следовательно, прерывании каскада арахидоновой кислоты на начальных этапах, предотвращая тем самым образование эйкозаноидов (основных тканевых регуляторов и медиаторов воспаления).Механизм действия НПВП направлен на угнетение активности фермента циклооксигеназы, результатом чего является снижение образования простагландинов и тромбоксанов. 4)Основные фармакологические эффекты важнейших препаратов.","Ибупрофен- противовоспалительное, анальгезирующее и жаропонижающее действиеугнетение синтеза простагландинов за счет блокирования фермента циклооксигеназы.","Подавляет агрегацию тромбоцитов.","Кислота ацетилсалициловая- болеутоляющее действие, повышает порог возбудимости болевых центров таламуса, снижает повышенную температуру тела, но не влияет на нормальную температуру тела, нарушает агрегациию тромбоцитов и приводит к удлинению времени кровотечения.","Целекоксиб- противовоспалительное, жаропонижающее и анальгезирующее действие, тормозит агрегацию тромбоцитов. Угнетая циклооксигеназу-2, уменьшает количество простагландинов (преимущественно в очаге воспаления), подавляет экссудативную и пролиферативную фазы воспаления. 5)Побочные эффекты и профилактика, показания и противопоказания к применению.","Ибупрофен- Побочные: тошнота, анорексия, метеоризм, запор, изжога, диарея, головокружение, головная боль, возбуждение, бессонница, аллергические реакции в виде кожной сыпи, нарушение зрения,эрозивно-язвенных поражений ЖКТ, кровотечения из ЖКТ, бронхоспазм.","Показания: ревматоидный артрит; остеоартроз; анкилозирующий спондилит; подагра; невралгии; миалгии; проктит ; заболевания ЛОР-органов; головная боль; зубная боль .","Противопоказания: эрозивно-язвенные поражения ЖКТ; нарушения кроветворения; язвенный колит; заболевания зрительного нерва; нарушения функции почек и печени; детский возраст до 6 лет;","Кислота ацетилсалициловая- Показания: ревматическая лихорадка, ревматоидный артрит, перикардит, головная боль, мигрень, зубная боль, невралгия, миалгия; профилактика развития инфаркта миокарда при ИБС, профилактика ишемического инсульта ,профилактика.","Побочные: тромбоцитопения, анемия, лейкопения, диспепсия,изжога, тошнота и рвота, тяжелые кровотечения в ЖКТ, снижение аппетита, бронхоспазм, отек гортани и крапивница,нарушение функции печени и/или почек,головокружение, головная боль, шум в ушах, снижение остроты слуха, нарушение зрения.","Противопоказания: Гиперчувствительность, сердечная недостаточность, заболевания ЖКТ, желудочно-кишечное кровотечение, острая почечная или печеночная недостаточность, дефицит витамина К, тромбоцитопения, беременность , грудное вскармливание, детский и подростковый возраст до 15 лет ЦелекоксибПоказания: Ревматоидный артрит, остеоартроз, анкилозирующий спондилоартрит, псориатический артрит.","Побочные: обострение аллергических заболеваний, периферические отеки; диарея, метеоризм, диспепсия; головокружение, бессонница; кашель, бронхит, кожная сыпь, зуд.","Противопоказания:","Гиперчувствительность, «аспириновая» триада (сочетание бронхиальной астмы, рецидивирующего полипоза носа и околоносовых пазух и непереносимости ацетилсалициловой кислоты и других НПВС), пептическая язва, колит, хроническая сердечная недостаточность, ИБС тяжелая печеночная/почечная недостаточность, период лактации,беременность"]},"1-46":{"t":"46.ПРОТИВОАЛЛЕРГИЧЕСКИЕ СРЕДСТВА.","p":["2.Фармакологические эффекты основных препаратов, сравнительная характеристика блокаторов Н1гистаминорецепторов.","Преднизлон- выраженное противовоспалительное, антиаллергическое, антиэкссудативное, противошоковое, антитоксическое действие, уменьшает количество Т-лимфоцитов и связывание иммуноглобулинов с рецепторами на поверхности клеток Тавегил- противоаллергическим действием, снижает проницаемость сосудов, оказывает седативный и м-холиноблокирующий эффект, не обладает снотворной активностью.","Предупреждает развитие вазодилатации и сокращения гладких мышц, экссудацию и формирование отека, уменьшает зуд, Кларитин- Обладает быстрым и длительным противоаллергическим действием.","Кетотифен- Тормозит высвобождение гистамина из тучных клеток и базофилов.","Предотвращает развитие симптомов гиперреактивности дыхательных путей, Предупреждает развитие бронхоспазма.","Препараты I поколения являются обратимыми конкурентными антагонистами Н1гистаминовых рецепторов. Они действуют быстро и коротко (назначаются до 4 раз в сутки).","Их длительное использование часто приводит к ослаблению терапевтической эффективности.","Блокаторы гистаминовых H1-рецепторов II и III, отличающиеся высокой избирательностью действия на Н1-рецепторы (хифенадин, терфенадин, астемизол). Незначительно влияют на другие медиаторные системы, не проходят через ГЭБ (не влияют на ЦНС) и не теряют активность при длительном применении. Препараты II поколения неконкурентно связываются с Н1-рецепторами, а образовавшийся комплекс медленно диссоциирует-назначаются 1 раз в сутки.","3. Препара терапии аллергических реакций немедленного и замедленного типов.","Замедленного типа - подавляющие иммуногенез и воспаление (глюкокортикоиды, цитостатики, НПВС).","Димедрол, супрастин, дипразин, пипольфен,диазолин, тавегил, хифенадин фенкарол. Они конкурируют с гистамином за рецепторы на клеточных мембранах, существенно не влияя на его освобождение.Возбуждение гистамином H1- рецепторов приводит к расширению сосудов, спазму гладких мышц и другим проявлениям аллергии.","Немедленного типа:","1. Средства, препятствующие высвобождению из сенсибилизированных тучных клеток и базофилов гистамина и других биологически активных веществ. Кромолин-натрия и кетотифена, Эуфиллин","2. Средства, препятствующие взаимодействию свободного гистамина с чувствительными к нему тканевыми рецепторами - противогистаминные средства. Димедрол,тавегил","3. Средства, устраняющие общие проявления аллергических реакций типа анафилактического шока: 4.Побочные эффекты отдельных препаратов.","Тошнота, Диспепсия, Язва желудка и двенадцатиперстной кишки, Желудочно-кишечное кровотечение,Диарея, инфаркт миокарда, инсульт и тромбоз периферических артерий, снижение почечного кровотока, развитие острой почечной недостаточности, задержка натрия и воды в организме, приводящие к артериальной гипертензии и сердечной недостаточности, развитие анальгетической нефропатии, Нефротический синдром, Фотосенсибилизация, Фотодерматиты, повышение печёночных ферментов, головная боль, головокружение, спутанность сознания, бронхоспазм, сыпь."]},"1-47":{"t":"47.ПРЕПАРАТЫ, ВЛИЯЮЩИЕ НА ИММУНОГЕНЕЗ.","p":["2.Механизмы иммуностимулирующего эффекта и показания к применению отдельных препаратов.","Тактивин -нормализует количество и функцию Т-лимфоцитов, стимулирует продукцию цитокинов, восстанавливает подавленную функцию Т-киллеров и повышает напряженность клеточного иммунитета. Применяют при иммунодефицитных состояниях (после лучевой и химиотерапии, при хронических гнойных и воспалительных процессах), лимфогранулематозе, лимфолейкозе, Тималин- регулирует количество и соотношение Т- и В-лимфоцитов, стимулирует клеточный иммунитет,усиливает фагоцитоз. Применяют при: Бронхиальная астма, вирусные и бактериальные инфекции, иммунодефицит.","Интерфероны- активация макрофагов, Т-лимфоцитов и естественных клеток-киллеров.","Применяют их при лечении вирусных инфекций (гриппа, гепатита), при опухолевых заболеваниях (при миеломе, лимфоме из В-клеток).","Левамизол- оказывает стимулирующее влияние на макрофаги и Т-лимфоциты- нормализация клеточного иммунитета. Применяют при иммунодефицитах, хронических инфекциях, ревматоидном артрите, опухолях. 3.Иммунодепрессанты разных групп, механизмы этого эффекта, показания к применению отдельных препаратов.","Цитостатики -угнетаюь деление лимфоцитов, не обладают избирательным действием, угнетают кроветворение и вызывают лейкопению, тромбоцитопению, анемию: Азатиоприн.","Применяется: для предупреждения тканевой несовместимости при пересадке органов; для лечения аутоиммунных заболеваний - ревматоидного артрита, неспецифического язвенного колита, системной красной волчанки Глюкокортикоиды- угнетают продукцию интерлейкинов и пролиферацию Т-лимфоцитов, оказывают избирательное действие (не влияют на эритро-, тромбо- и лейкопоэз). :Преднизолон, дексаметазон","Преднизолон:недостаточность надпочечников, астматический статус, бронхиальная астма, тиреотоксический криз, ревматоидный полиартрит, острый гепатит В качестве иммуносупрессоров применяются синтетические препараты глюкокортикоидов: преднизолон, метилпреднизолон, триамцинолон, дексаметазон, бетаметазон.В комплесной терапии-для предупреждения реакции отторжения трансплантата и злокачествен¬ных новообразований.","Антибиотики с иммуносупрессантной активностью:","Циклоспорин -подавляет продукцию интерлейкина-2, что приводит к угнетению дифференцировки и пролиферации Т-лимфоцитов.","Показан для предупреждения аллогенной трансплантации сердца, легких, печени, поджелудочной железы и других органов, при пересадке костного мозга; при аутоиммунных заболеваниях.","Препараты антител:","Тимоглобулин - препарат антител кролика к тимоцитам человека.элиминирует из кровотоа Тдимфоциты птем комплементзависимого лизиса.","Показан для профилактики и лечения реакций отторжения транс-плантата при пересадке почек, сердца, печени, поджелудочной железы; для лече¬ния апластической анемии. 4.Характеристика иммуномодуляторов.","Иммуномодуляторы стимулируют иммунные процессы и активируют иммунокомпетентные клетки (Т- и В-лимфоциты) и дополнительные факторы иммунитета (макрофаги и др.). Усилять общую сопротивляемость организма могут тонизирующихе средства (кофеин, элеутерококк), витамины, дибазол, метилурацила, пентоксила (ускоряют регенерацию, интенсифицируют лейкопоэз), адаптогены. Эти препарат повышают резистентность организма, ускоряют процессы регенерации, применяют в комплексной терапии вялотекущих регенерационных процессов, инфекционных, инфекционно-воспалительных заболеваний. Тималин, Тактивин, Тимоптин, Вилозен-применяют как иммуностимуляторы содержат гормоны вилочковой железы. Из— костного мозга — получен В-активин."]},"1-6":{"t":"6.АДРЕНОМИМЕТИКИ.","p":["Локализация адренорецепторов разных видов: α1-Адренорецепторы локализуются постсинаптически, α2-адренорецепторы - пресинаптически и вне синапсов (предполагают, что в сосудах они локализуются в неиннервируемом (внутреннем) слое). β1-адренорецепторы (например, в сердце), β2-адренорецепторы (в бронхах, сосудах, матке) и β3-адренорецепторы (в жировой ткани) Классификация препаратов по влиянию на разные виды адренорецепторов.","I. Прямые адреномиметики:","1) Неселективные- Адреналина гидрохлорид, Норадреналина гидрохлорид","2) α-адреномиметики:","а) α 1-адреномиметики Мезатон, Гутрон","б) α 2-адреномиметики центральные: Клофелин, Гуанфацин, Метилдофа периферические: Ксилометазолин, Нафазолин 3)β- адреномиметики:","а) β 1- адреномиметики: Добутамин, Допексамин","б) β 1,2- адреномиметики: Изадрин, Орципреналина сульфат","в) β 2- адреномиметики: Сальбутамол, Фенотерол, Гексопреналин","II. Симпатомиметики: Эфедрина гидрохлорид Фармакологические эффекты адреналина: 1) увеличение частоты и силы сердечных сокращений, МОК, облегчение AV проводимости, повышение автоматизма, 2) увеличение потребности миокарда в кислороде, 3) сужение сосудов органов брюшной полости, кожи, слизистых оболочек, в меньшей степени - скелетных мышц, 4) повышение АД (главным образом систолического), 5) расслабление ГМК бронхов, 6) понижение тонуса и моторики ЖКТ, 7) расширение зрачков, понижение внутриглазного давления, 8) гипергликемия, повышение содержания в плазме СЖК Показания к применению: при анафилактическом шоке и некоторых других аллергических реакциях немедленного типа; как бронхолитик для купирования приступов бронхиальной астмы; при гипогликемической коме, вызванной противодиабетическими средствами (инсулином и др.); для устранения атриовентрикулярного блока, а также в случае остановки сердца (вводят интракардиально); для расширения зрачка и при открытоугольной форме глаукомы. Адреналин добавляют в растворы анестетиков. Сужение сосудов в области введения адреналина усиливает местную анестезию и уменьшает резорбтивное и возможное токсическое действие анестетиков.","Противопоказания к применению: 1) При в/в введении адреналин может вызвать аритмии сердца, в виде желудочковой фибрилляции.","2) Легкое беспокойство, тремор, возбуждение. Указанные симптомы не страшны, так как проявление данных эффектов кратковременное, да и к тому же больной находится в экстремальной ситуации.","3) При введении адреналина может вызникнуть отек легких"]},"1-7":{"t":"7.АДРЕНОМИМЕТИКИ.","p":["Классификация препаратов по механизму действия. . прямого действия (эпинефрин, норэпинефрин, фенилэфрин, изадрин и др.); . непрямого действия (неофедрин).","Механизмы действия препаратов разных групп, Адреномиметики прямого действия связываются с адренорецепторами, в то время как адреномиметики непрямого действия усиливают высвобождение норадреналина или угнетают его обратный захват. Различия между эффектами препаратов прямого и непрямого действия становятся особенно выраженными, если запасы эндогенного норадреналина изменены - воздействие некоторых гипотензивных препаратов, ингибиторов МАО. В этих случаях следует использовать только адреномиметики прямого действия, поскольку реакция на препараты непрямого действия может быть изменена.","Фармакологические эффекты препаратов, влияющих на разные виды адренорецепторов (кроме адреналина). α1-адреномиметиков 1) повышение Общего периферического сопротивление сосудов и АД, 2) рефлекторная брадикардия (повышение тонуса блуждающего нерва в ответ на гипертензию),","3) вазоконстикторное действие при местном применении, 4) мидриаз, понижение внутриглазного давления при открытоугольной глаукоме β1-адреномиметиков: 1) положительное инотропное действие (увеличение ЧСС, УО и МОК, снижение ОПСС и сосудистого сопротивления МКК). 2) понижение давления наполнения желудочков кровью, 3) увеличение коронарного кровотока, улучшение снабжения миокарда кислородом, 4) повышение перфузии почек и увеличение экскреции натрия и воды (путем увеличения СВ) β2 –адреномиметиков: 1) предупреждение и купирование бронхоспазма, снижение сопротивления в дыхательных путях, увеличение жизненной емкости легких,","2) предотвращение выделения гистамина, медленно реагирующей субстанции из тучных клеток и факторов хемотаксиса нейтрофилов, 3) положительное хроно- и инотропное влияние на миокард, 4) расширение коронарных артерий, 5) понижение тонуса и сократительной активности миометрия α , β –адреномиметиков: 1) увеличение частоты и силы сердечных сокращений, УО и МОК, облегчение AV проводимости, повышение автоматизма, 2) увеличение потребности миокарда в кислороде, 3) сужение сосудов органов брюшной полости, кожи, слизистых оболочек, в меньшей степени - скелетных мышц, 4) повышение ОПСС (в высоких дозах ) и АД (главным образом систолического), 5) расслабление ГМК бронхов, 6) понижение тонуса и моторики ЖКТ, 7) расширение зрачков, понижение внутриглазного давления, 8) гипергликемия, повышение содержания в плазме СЖК Показания к применению и противопоказания к применению. α-адреномиметиков.","Показания: уменьшение отечности слизистой оболочки носоглотки, конъюнктивы при простудных и аллергических заболеваниях, повышение АД при коллапсе и артериальной гипотензии в связи с понижением сосудистого тонуса","Противопоказания: артериальная гипертензия, тяжелый атеросклероз, склонность к спазмам коронарных сосудов β1 –адреномиметиков.","Показания: ОСН и ХСН (при декомпенсации как временное вспомогательное средство на фоне традиционной терапии), низкий МОК как побочное явление ИВЛ, диагностическое средство при ИБС","Противопоказания: идиопатический гипертрофический субаортальный стеноз, повышенная чувствительность к препаратам β2 –адреномиметиков.","Показания: долговременное регулярное лечение обратимой обструкции дыхательных путей при бронхиальной астме и ХОБЛ, для предупреждения симптомов в ночное и/или дневное время, вызванных обратимой обструкцией дыхательных путей, предупреждение и купирование бронхоспазма при всех формах бронхиальной астмы, бронхообструктивный синдром у детей, угрожающие преждевременные роды с сократительной деятельностью матки; роды до 37-38 недель беременности, истмико-цервикальная недостаточность, урежение ЧСС плода в зависимости от сокращений матки в периоды раскрытия шейки матки и изгнания","Противопоказания: повышенная чувствительность к препаратам, угроза выкидыша в I и II триместрах беременности, преждевременная отслойка плаценты, кровотечение или токсикоз в III триместре беременности, детский возраст до 2 лет α и β –адреномиметиков.","Показания:","а) системное применение: анафилактический шок и некоторые другие аллергические реакции немедленного типа, купирование приступов бронхиальной астмы, передозировка инсулина","б) местное применение: остановка кровотечений, пролонгирование действия местных анестетиков, для понижения внутриглазного давления при открытоугольной глаукоме","Противопоказания: артериальная гипертензия, выраженный атеросклероз, ИБС, аритмия, тиреотоксикоз, сахарный диабет, закрытоугольная глаукома, наркоз, вызванный фторотаном и т.д. (опасность возникновения аритмий)"]},"1-8":{"t":"8. α-АДРЕНОБЛОКАТОРЫ.","p":["Классификация препаратов:","а) α1-адреноблокаторы -доксазозин, празозин, тамсулозин (α1А – антагонист)","б) α2-адреноблокаторы -иохимбин","в) α1- иα2-адреноблокаторы -фентоламин, дигидроэрготамин.","Неселективные препараты,
